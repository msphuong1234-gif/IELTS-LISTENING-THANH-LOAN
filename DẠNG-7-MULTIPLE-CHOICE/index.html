ny errors \nwith the language.\nYes, it's fine. Oh, but there's one other thing I could probably mention at this point.\nYes?\nWell at the end of term, you'll also be giving a presentation also on Furniture Rossi.\nYes, I haven't given it much thought yet.\nUnderstandably. But, while you're writing the case study, I'd recommend you think \nabout what kind of information would be suitable to use in your presentation. \nRemember - the last time you gave a presentation on a company, you spend a \nconsiderable part of the time providing the audience with financial data, but they \nprobably needed to hear more about company strategy.\nYes, I did concentrate rather too much on the figures. (Q25) I’ll make sure there's a \nbalance this time.\nGood.\n\nIELTS THANH LOAN\nVocabulary:\n- draft (noun): nháp\nMeaning: a rough written version of something that is not yet in its final form\n- furniture (noun): đồ đạc (trong nhà)\nMeaning: objects that can be moved, such as tables, chairs and beds, that are put \ninto a house or an office to make it suitable for living or working in\n- expand (verb): mở rộng, trải ra\nMeaning: to become greater in size, number or importance; to make something \ngreater in size, number or importance\n- craftsman (noun): thợ thủ công\nMeaning: a skilled person, especially one who makes beautiful things by hand\n- motivation (noun): sự thúc đẩy, động cơ thúc đẩy\nMeaning: the reason why somebody does something or behaves in a particular way\n- attitude (noun): thái độ, quan điểm\nMeaning: the way that you think and feel about somebody/something; the way that \nyou behave towards somebody/something that shows how you think and feel\n- campaign (noun): chiến dịch\nMeaning: a series of planned activities that are intended to achieve a particular \nsocial, commercial or political aim\n- balance (noun): sự thăng bằng, sự cân bằng; cán cân\nMeaning: a situation in which different things exist in equal, correct or good \namounts\nIELTS Thanh Loan\n455"}, {"id": "EX16", "title": "Biofuels presentation", "page": 23, "image": "assets/images/source_p23.jpg", "audio": "assets/audio/MCQ_16.mp3", "source": "The official guide to IELTS", "questions": [{"num": 21, "text": "Mike suggests they begin by", "options": {"A": "explaining harm caused by fossil fuels", "B": "pointing out biofuels were in use before fossil fuels", "C": "ensuring students know the difference between fossil fuels and biofuels"}, "answer": "B", "why": "They plan to ask what early car engines ran on and note that early engines used plant-based fuels.", "wrong": "The proposed opening is historical, not a definition or harm explanation."}, {"num": 22, "text": "Karina doesn’t want to discuss ethanol production because", "options": {"A": "other students already know the process", "B": "there will not be time for more important information", "C": "they may not provide an accurate description"}, "answer": "C", "why": "Different biofuels use different processes, creating a risk of giving an inaccurate general description.", "wrong": "Familiarity and time are not her stated concern."}, {"num": 23, "text": "Which biofuel source is least environmentally friendly?", "options": {"A": "Sugar cane", "B": "Corn", "C": "Canola"}, "answer": "B", "why": "They agree corn ethanol may use more fossil-fuel energy than the biofuel energy produced.", "wrong": "Canola is described as least harmful; sugar cane has issues but corn is judged more harmful."}, {"num": 24, "text": "Main problem facing US biofuel development?", "options": {"A": "Inadequate infrastructure for transporting ethanol", "B": "Not enough farmers growing biofuel crops", "C": "Little government support"}, "answer": "A", "why": "Ethanol must be moved by truck or rail because pipelines have not been built.", "wrong": "Farmers are profiting and the government supports development."}, {"num": 25, "text": "Karina doubts sugar cane production in Brazil will", "options": {"A": "lead to loss of wildlife habitats", "B": "create many jobs", "C": "continue to provide enough energy for the country’s needs"}, "answer": "C", "why": "She questions whether Brazil can keep depending so heavily on sugar cane as population and energy use grow.", "wrong": "Employment is already large; habitat loss is a concern but not the specific doubt asked."}, {"num": 26, "text": "To increase biofuel use, they conclude that", "options": {"A": "the price of fossil fuels must go up", "B": "more machinery must be adapted", "C": "production methods must be more energy-efficient"}, "answer": "C", "why": "They say biofuels must be produced cheaply, quickly and with less environmental/energy cost.", "wrong": "They do not conclude fossil-fuel prices must rise or that machinery adaptation is the central requirement."}], "transcript": "Karina: \nMike: \nKarina: \nMike: \nKarina: \nMike: \nKarina: \nMike: \nKarina: \nMike: \nKarina: \nMike: \nKarina: \nIELTS Thanh Loan\n456\n24. A\n25. C\n26. C \nHi, Mike. How’s it going?\nActually, I was up last night with an assignment so - yeah, I’m tired, but I guess \nwe’d better sort this presentation out.\nWell, we’ve done enough background reading, but I think we need to .\norganise exactly what we’re going to say about biofuels during the presentation, \nand the order.\nI thought we could start by asking our audience what car engines were first \ndesigned to run on - fossil fuels or biofuels.\nNice idea\nYes, when most people think about cars and fuel, they think about all the carbon \ndioxide that’s produced, but they don’t realise that that wasn’t always the case.\nYou’re probably right. The earliest car engines ran on fuel made from corn and \npeanut oil, didn’t they?{Q21)\nYes. The manufacturers used the corn and peanut oil and turned them into a kind of \nvery pure alcohol.\nYou mean ethanol?\nYes. In fact, most biofuels are still based on ethanol. Actually, I’ve got some notes \nhere about the process of turning plant-matter into ethanol - the chemical reactions \nand the fermentation stages and…\nIt’s interesting - the other students would appreciate it, but different biofuels use \ndifferent processes and if we give a general description, there’s a risk we’ll get it \nwrong, (Q22) and then the tutor might mark us down. I’d rather we focus on the \nenvironmental issues.\nFair enough. So, um - the main plants that are used for biofuel production now are \nsugar cane, corn…\nAnd canola. Of all of them, canola is probably the least harmful because machines \nthat use it don’t produce as much carbon monoxide.\n\nIELTS THANH LOAN\nMike: \nKarina: \nMike: \nKarina: \nMike:\nKarina: \nMike: \nKarina: \nMike: \nKarina: \nMike:\nKarina: \nMike: \nIELTS Thanh Loan\n457\nSugar cane seems to be controversial. It doesn’t require as much fertilizer as corn \ndoes to grow, but when they burn the sugar cane fields, that releases loads of \ngreenhouse gases.\nYes, but some critics have suggested that the production of corn ethanol uses up \nmore fossil fuel energy than the biofuel energy it eventually produces. For that \nreason, I’d sat it was more harmful to the environment.(Q23)\nI see what you mean. You’re probably right. It’s interesting how everyone saw the \nbiofuel industry as the answer to our energy problems, but in some ways, biofuels \nhave created new problems.\nWell, in the USA, I wouldn’t say that farmers are having problems - the biofuel \nindustry for them has turned out to be really profitable.\nI think, though, that even in the USA, ethanol is still only used as an additive to \ngasoline, or petrol. The problem is that it still has to be transported by trucks or rail \nbecause they haven’t built any pipelines to move it. (Q24) Once they do, it’ll be \ncheaper and the industry might move forward.\nThat’ll have to happen one day. At least the government are in favour of biofuel \ndevelopment.\nYes. But Brazil’s probably in the lead as far as biofuels are concerned - they’ve got \nto the point where they don’t need to import any oil now.\nWhich is great, and the industry in Brazil employs a huge number of people, but is \nit sustainable? I mean, as the population grows, and there are more vehicles on the \nroads and there’s more machinery, surely they can’t depend so much on sugar \ncane? (Q25) At some point, there has to be a limit on how much land can be used \nfor sugar cane production - certainly if you want to preserve natural habitats and \nnative wildlife.\nI think that whatever problems Brazil’s facing now - the same will be true for any \ncountry - you have to weigh up the pros and cons.\nWell, we probably won’t see an increase in biofuel use - I mean, they won’t replace \nfossil fuels until we can find ways to produce them cheaply and quickly and with \nless cost to the environment.(Q26)\n...making sure they require minimal energy to produce less than fossil fuels - \ncertainly when you’re filling up your car.\nExactly. And in a way that means they have to cost less than fossil fuels - certainly \nwhen you’re filling up your car.\nYes, and whatever other kind of engines use fossil fuels at the moment.\n\nIELTS THANH LOAN\nVocabulary:\n-  assignment (noun): sự giao việc, sự phân công\nMeaning: a task or piece of work that somebody is given to do, usually as part of \ntheir job or studies\n-  sort (verb): lựa chọn, sắp xếp, phân loại\nMeaning:  a group or type of people or things that are similar in a particular way\n-  biofuel (noun): nhiên liệu sinh học \nMeaning: fuel made from plant or animal sources and used in engines\n-  peanut (noun): cây đậu phụng (cây lạc)\nMeaning: a nut that grows underground in a thin shell\n-  ethanol (noun): (hoá học) ethanol\nMeaning: the type of alcohol in alcoholic drinks, also used as a fuel or solvent\n-  fermentation (noun): sự lên men\nMeaning: the process of chemical change caused by the action of yeast or bacteria, \noften changing sugar to alcohol\n-  controversial (adj): có thể gây ra tranh luận, có thể bàn cãi được (vấn đề...)\nMeaning: causing a lot of angry public discussion and disagreement\n-  fertilizer (noun): phân bón\nMeaning: a substance added to soil to make plants grow more successfully\n-  profitable (adj): có lợi, có ích; thuận lợi\nMeaning: that makes or is likely to make money\n-  sustainable (adj): bền vững\nMeaning: involving the use of natural products and energy in a way that does not \nharm the environment\nIELTS Thanh Loan\n458"}, {"id": "EX17", "title": "Online social networking", "page": 24, "image": "assets/images/source_p24.jpg", "audio": "assets/audio/MCQ_17.mp3", "source": "The official guide to IELTS", "questions": [{"nums": [35, 36], "text": "Which TWO are real benefits of online social networking?", "options": {"A": "People can gain higher self-esteem", "B": "People can access useful medical information", "C": "People can form relationships more quickly", "D": "People can improve academic performance", "E": "People can be reliably informed about current affairs"}, "answers": ["C", "E"], "why": "The speaker gives clear support for faster formation of networks and reliable access to current affairs.", "wrong": "Self-esteem, medical advice reliability and academic improvement are described as uncertain or needing more research.", "multi": true}, {"nums": [37, 38], "text": "Which TWO problems will increase, according to the speaker?", "options": {"A": "Criminal activity", "B": "Poorer grades at school", "C": "A decline in physical fitness", "D": "Less work done by employees", "E": "Loss of career prospects"}, "answers": ["A", "D"], "why": "The speaker expects fraud/criminal misuse of data to continue and describes workplace time-wasting/reduced productivity as a real problem.", "wrong": "Fitness and grades are linked in articles but the speaker warns against assuming simple causation; E is not stated.", "multi": true}, {"nums": [39, 40], "text": "Which TWO claims does Robin Dunbar make?", "options": {"A": "They are not helpful for developing certain social skills", "B": "They cannot fully reveal a person’s real character", "C": "They are not a good starting point for building new relationships", "D": "They do not encourage people to widen their social circle", "E": "They will not retain popularity with young people"}, "answers": ["A", "C"], "why": "Dunbar says face-to-face interaction is essential for initially creating true friendship and worries online-only formation does not develop negotiation/diplomacy skills.", "wrong": "B, D and E are not the claims selected in the transcript/key.", "multi": true}], "transcript": "Today, our number of  weak-tie acquaintances has exploded due to the Internet - \nto the phenomenon of online social networking. This is still a relatively new way of \ncommunication - something that has a huge amount of potential – but also, as with any \ninvention, it brings with it a new set of problems. Let’s start with the benefits. Without \nquestion, online social networking allows us to pass on the latest news — to be \nup-to-date with local and global events- and for many, this information comes from \nsources more trustworthy than local media. So, this is one clear point in favour of \nonline social networking. I know that it's also being used by students - as a means of \nincreasing their chances of success – in the way that lecture notes can be shared and \nideas discussed. I think, personally speaking, that we need some further research \nbefore we can definitively say whether it helps or not. There’s also been a great \nincrease in the number of networking sites devoted to sharing advice on health issues \nbut there are as yet no studies to prove the reliability of that advice. Now, what we do \nhave clear evidence for is that people are developing friendship and professional \nnetworks in a way that wasn’t possible before — the process is faster. I'm not talking \nabout quality here, but simply that they exist. And it's debatable whether the number of \nonline friends that you have increases your level of self-confidence — that's perhaps \nan area of research some of you might be interested in following up.\nTurning to the problems, there are any number of articles connecting online activity to \nfalling levels of physical fitness – but it’s too easy to blame the Internet for our social \nproblems. The poor grades of school children are also frequently linked to the time \nspent on social networking sites, but it would be naive to believe there are no other \ncontributing factors. One real concern, however, is the increase in the amount of \nfraud. Where for example, people are using the personal data of others, which they’ve \nput online, for criminal purposes. This kind of activity seems likely to continue. And \nthen, certainly for employers, online social networking sites have provided a great \ntime-wasting opportunity – reducing productivity like never before, and I doubt \nthey can put a stop to this habit, no matter what restrictions are in place.\nIELTS Thanh Loan\n459\nQ35\nQ36\nQ37\nQ38\n\nIELTS THANH LOAN\nWe'll come back to these issues in a minute, but I'd like to say something about the \ntheories of Robin Dunbar — an anthropologist at Oxford University. Dunbar has \nfound that the human brain has evolved in a way that means we can only give real \nattention to a particular number of people. 150, apparently. So, for example, if the \nnumber of friends on your online network is greater than that, according to Dunbar, \nthis would imply the relationships are only superficial. Dunbar is not against online \nrelationships, but he maintains that face-to-face interaction is essential for the \ninitial creation of true friendship and connections. He's concerned that for young \npeople — if their only experience of forming relationships is online — this doesn't \nallow them to form the ability or acquire the strategies for maintaining relationships, \nfor example, in situations where negotiation or diplomacy is required, or where \nit's essential for ... \nIELTS Thanh Loan\n460\nQ39\nQ40\n\nIELTS THANH LOAN\nVocabulary:\n- acquaintance (noun): sự biết, sự hiểu biết\nMeaning: a person that you know but who is not a close friend\n- explode (verb): đập tan, làm tiêu tan (lý tưởng, ảo tưởng...)\nMeaning: to burst or make something burst loudly and violently, causing damage\n- phenomenon (noun): hiện tượng\nMeaning: a fact or an event in nature or society, especially one that is not fully \nunderstood\n- fraud (noun): sự gian lận, sự gian trá; sự lừa lọc, sự lừa gạt\nMeaning: the crime of cheating somebody in order to get money or goods illegally\n- criminal (adj): có tội, phạm tội, tội ác\nMeaning: connected with or involving crime\n- productivity (noun): sức sản xuất, năng suất\nMeaning: the rate at which a worker, a company or a country produces goods, and \nthe amount produced, compared with how much time, work and money is needed to \nproduce them\n- restriction (noun):  sự hạn chế, sự giới hạn; sự bị hạn chế\nMeaning: a rule or law that limits what you can do or what can happen\n- interaction (noun): sự ảnh hưởng lẫn nhau, sự tác động với nhau, sự tương tác\nMeaning: the act of communicating with somebody, especially while you work, play \nor spend time with them\n- negotiation (noun): sự điều đình, sự đàm phán, sự thương lượng, sự dàn xếp\nMeaning: formal discussion between people who are trying to reach an agreement\n- diplomacy (noun): thuật ngoại giao; ngành ngoại giao; khoa ngoại giao\nMeaning: the activity of managing relations between different countries; the skill in \ndoing this\nIELTS Thanh Loan\n461"}]};const KNOWLEDGE=[["Tổng quan", "<h2>Dạng 7: Multiple Choice</h2><p>Multiple Choice xuất hiện từ Part 1 đến Part 4. Có hai dạng chính: <b>Single Choice</b> (một đáp án A/B/C) và <b>Pick From a List</b> (chọn TWO/THREE đáp án trong danh sách).</p><div class=\"tip\"><b>Nguyên tắc cốt lõi:</b> đáp án đúng phải có <b>nghĩa tương đương</b> với audio, không phải lựa chọn lặp lại nhiều từ khóa nhất.</div>"], ["Bẫy đáp án", "<h2>Nhận diện distractors</h2><p>Thông tin liên quan tới hầu hết lựa chọn thường đều xuất hiện trong audio. Một lựa chọn sai có thể <b>trái ngược</b> với audio, <b>không được nhắc tới</b>, hoặc chỉ là thông tin xuất hiện trước khi người nói <b>sửa/đổi quyết định</b>.</p><p>Muốn chắc một lựa chọn đúng, hãy đối chiếu cả các lựa chọn còn lại.</p>"], ["3 bước", "<h2>Quy trình làm bài</h2><ol><li>Gạch chân từ khóa và xác định <b>sự khác nhau về nghĩa</b> giữa các options.</li><li>Dự đoán paraphrase/cách diễn đạt có thể nghe thấy.</li><li>Nghe, note-taking ngắn gọn, theo dõi người nói và quyết định cuối cùng; sau đó đối chiếu từng option.</li></ol>"], ["Pick From a List", "<h2>Chọn TWO / THREE</h2><p>Mỗi lựa chọn đúng được tính như một câu. Thứ tự chữ cái không quan trọng. Hệ thống giới hạn đúng số lượng lựa chọn theo đề và chấm <b>từng đáp án thành phần</b>.</p><div class=\"tip\">Ví dụ: cần 3 đáp án, đáp án chuẩn A-B-C nhưng chọn A-B-D thì đạt 2/3 điểm của nhóm.</div>"]];const KEY='IELTS_D7_MCQ_V7';let state=JSON.parse(localStorage.getItem(KEY)||'{}');state.student=state.student||{};state.exercises=state.exercises||{};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function st(id){return state.exercises[id]||(state.exercises[id]={status:'not_started',answers:{},attemptCount:0,audioPosition:0})}function show(id){$$('.page').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');scrollTo(0,0)}function slots(e){return e.questions.reduce((n,q)=>n+(q.multi?q.answers.length:1),0)}function initStudent(){['studentName','studentClass','studentId'].forEach(k=>{let el=$('#'+k);el.value=state.student[k]||'';el.oninput=()=>{state.student[k]=el.value;save()}})}function renderHome(){let g=$('#homeGrid');g.innerHTML=`<div class="card" onclick="openKnowledge()"><b>📘 KIẾN THỨC CẦN HỌC</b><p class="score">Meaning • distractors • paraphrase • Pick From a List</p></div>`;let done=0;DATA.exercises.forEach(e=>{let x=st(e.id);if(x.status==='completed')done++;g.innerHTML+=`<div class="card" onclick="openEx('${e.id}')"><b>${e.id.replace('EX','Exercise ')}: ${esc(e.title)}</b><p class="score">${slots(e)} scored answers • Audio included</p><span class="pill">${x.status}</span></div>`});$('#overallBar').style.width=(done/DATA.exercises.length*100)+'%';$('#overallText').textContent=`Completed: ${done}/${DATA.exercises.length} exercises`;}function openKnowledge(){show('knowledgePage');let tabs=$('#knowledgeTabs');tabs.innerHTML='';KNOWLEDGE.forEach((k,i)=>{let b=document.createElement('button');b.className='btn';b.textContent=k[0];b.onclick=()=>{$$('#knowledgeTabs button').forEach(x=>x.classList.remove('primary'));b.classList.add('primary');$('#knowledgePane').innerHTML=k[1]};tabs.appendChild(b);if(i===0)b.click()})}function renderQ(q,x,idx){if(q.multi){let selected=x.answers['g'+idx]||[];return `<div class="question" data-group="${idx}" data-max="${q.answers.length}"><div class="qtitle">Questions ${q.nums.join('–')} • Choose ${q.answers.length===2?'TWO':'THREE'} letters<br>${esc(q.text)}</div>${Object.entries(q.options).map(([k,v])=>`<label class="option"><input type="checkbox" data-g="${idx}" value="${k}" ${selected.includes(k)?'checked':''}><b>${k}.</b> ${esc(v)}</label>`).join('')}<div class="score">Select exactly ${q.answers.length} options.</div></div>`}let a=x.answers['q'+idx]||'';return `<div class="question"><div class="qtitle">Question ${q.num}. ${esc(q.text)}</div>${Object.entries(q.options).map(([k,v])=>`<label class="option"><input type="radio" name="q${idx}" data-q="${idx}" value="${k}" ${a===k?'checked':''}><b>${k}.</b> ${esc(v)}</label>`).join('')}</div>`}function openEx(id){let e=DATA.exercises.find(z=>z.id===id),x=st(id);if(x.status==='not_started')x.status='in_progress';save();show('exercisePage');$('#exerciseMount').innerHTML=`<div class="exercise-wrap"><article class="task"><div class="task-head"><h2>${e.id.replace('EX','Exercise ')}: ${esc(e.title)}</h2><p><b>Multiple Choice.</b> Read the original task carefully, then listen and select the best answer(s).</p><div class="score">Source: ${esc(e.source)}</div></div><div class="audio-box"><audio id="player" controls preload="metadata" src="${e.audio}"></audio></div><div class="source-figure"><div class="zoom-note">Original source page • full aspect ratio • no cropping</div><img src="${e.image}" alt="Original source task for ${esc(e.title)}"></div><div>${e.questions.map((q,i)=>renderQ(q,x,i)).join('')}</div><div class="task-actions"><button class="btn primary" id="check">✓ Kiểm tra đáp án</button><button class="btn" onclick="home()">← Lesson Home</button></div><div class="review ${x.reviewUnlocked?'open':''}" id="review"></div></article><aside class="side"><b>${e.id.replace('EX','Exercise ')}</b><div id="status" class="score"></div><button class="btn primary" id="check2">Kiểm tra đáp án</button><button class="btn danger" id="reset">Reset Exercise</button><button class="btn" onclick="home()">← Lesson Home</button></aside></div>`;let p=$('#player');p.onloadedmetadata=()=>{if(x.audioPosition&&x.audioPosition<p.duration-2)p.currentTime=x.audioPosition};p.ontimeupdate=()=>{x.audioPosition=p.currentTime;save()};$$('input[type=radio]').forEach(el=>el.onchange=()=>{x.answers['q'+el.dataset.q]=el.value;save();status(e,x)});$$('input[type=checkbox]').forEach(el=>el.onchange=()=>{let gi=el.dataset.g,max=e.questions[+gi].answers.length,all=$$(`input[data-g="${gi}"]`),sel=all.filter(a=>a.checked);if(sel.length>max){el.checked=false;alert(`Chỉ được chọn ${max} đáp án.`);return}x.answers['g'+gi]=all.filter(a=>a.checked).map(a=>a.value);save();status(e,x)});status(e,x);$('#check').onclick=$('#check2').onclick=()=>check(e,x);$('#reset').onclick=()=>{if(confirm('Xóa toàn bộ câu trả lời Exercise này?')){state.exercises[e.id]={status:'not_started',answers:{},attemptCount:0,audioPosition:0};save();home()}};if(x.reviewUnlocked)review(e,x)}function status(e,x){let got=0;e.questions.forEach((q,i)=>{if(q.multi)got+=(x.answers['g'+i]||[]).length;else if(x.answers['q'+i])got++});$('#status').textContent=`Answered: ${got}/${slots(e)} • Autosaved`}function check(e,x){let missing=slots(e),score=0,res=[];e.questions.forEach((q,i)=>{if(q.multi){let sel=x.answers['g'+i]||[];missing-=sel.length;let correct=sel.filter(a=>q.answers.includes(a)).length;score+=correct;res.push({multi:true,student:sel,correct:q.answers,score:correct,total:q.answers.length})}else{let a=x.answers['q'+i]||'';if(a)missing--;let yes=a===q.answer;if(yes)score++;res.push({multi:false,student:a,correct:[q.answer],score:yes?1:0,total:1})}});if(missing>0&&!confirm(`Còn ${missing} đáp án chưa chọn. Vẫn chấm?`))return;x.results=res;x.score=score;x.total=slots(e);x.status='completed';x.reviewUnlocked=true;x.attemptCount=(x.attemptCount||0)+1;save();review(e,x);renderHome();send(e,x)}function review(e,x){let h=`<h2>Review • ${x.score}/${x.total}</h2>`;e.questions.forEach((q,i)=>{let r=x.results[i],ok=r.score===r.total;let label=q.multi?`Questions ${q.nums.join('–')}`:`Question ${q.num}`;h+=`<div class="review-item ${ok?'good':'bad'}"><b>${label}</b><p>Your answer: <b>${esc((r.student||[]).join?r.student.join(', '):r.student||'—')}</b><br>Correct answer: <b>${esc(r.correct.join(', '))}</b>${q.multi?`<br>Points: <b>${r.score}/${r.total}</b>`:''}</p><div class="evidence"><b>Transcript logic:</b> ${esc(q.why)}</div><p><b>Vì sao distractor sai:</b> ${esc(q.wrong)}</p><div class="tip"><b>🧠 Kiến thức cần nhớ:</b> Đối chiếu <b>meaning/paraphrase</b>, không chọn chỉ vì nghe thấy từ khóa giống option. Theo dõi correction, contrast và quyết định cuối cùng của người nói.</div></div>`});h+=`<div class="accordion"><button class="acc-btn">🎧 Listen Again & Full Tapescript</button><div class="acc-body"><audio controls src="${e.audio}" style="width:100%"></audio>

${esc(e.transcript)}</div></div>`;let rv=$('#review');rv.innerHTML=h;rv.classList.add('open');let b=rv.querySelector('.acc-btn'),body=rv.querySelector('.acc-body');b.onclick=()=>body.style.display=body.style.display==='block'?'none':'block';rv.scrollIntoView({behavior:'smooth'})}async function send(e,x){if(!state.student.studentName||!state.student.studentClass||!state.student.studentId)return;let payload={skill:'LISTENING',studentName:state.student.studentName,class:state.student.studentClass,id:state.student.studentId,testId:`DANG7-${e.id}`,testName:`Multiple Choice - ${e.title}`,score:x.score,total:x.total,duration:'',correct:x.score,wrong:x.total-x.score,answers:x.results};try{await fetch(DATA.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})}catch(_){}}function home(){show('homePage');renderHome()}$('#homeBtn').onclick=home;initStudent();renderHome();</script></body></html>
