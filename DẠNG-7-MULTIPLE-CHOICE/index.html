<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dạng 7 - Multiple Choice</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.topbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #dce3ed;padding:12px 4%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.brand small{display:block;color:#64748b}.shell{max-width:1320px;margin:auto;padding:22px}.page{display:none}.page.active{display:block}.hero,.card,.task,.side,.knowledge-pane{background:#fff;border:1px solid #dce3ed;border-radius:16px;box-shadow:0 4px 18px #0000000a}.hero{padding:24px;margin-bottom:18px}.student{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{font-size:12px;font-weight:700}.field input,.answer{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px}.progressbar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:14px}.progressbar span{display:block;height:100%;background:#334155}.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:17px;cursor:pointer}.pill{display:inline-block;padding:5px 9px;background:#eef2ff;border-radius:99px;font-size:12px}.btn{border:1px solid #cbd5e1;background:#fff;padding:10px 13px;border-radius:9px;cursor:pointer;font-weight:700}.primary{background:#172033;color:#fff}.danger{border-color:#ef4444;color:#b91c1c}.exercise-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px}.task{padding:20px}.side{padding:16px;position:sticky;top:80px;height:max-content;display:grid;gap:10px}.task-head h2{margin-top:0}.audio-box{padding:12px;background:#f8fafc;border-radius:12px;margin:14px 0}.audio-box audio{width:100%}.source-figure{margin:16px 0}.source-figure img{display:block;width:auto;height:auto;max-width:100%;max-height:none;margin:0 auto;object-fit:contain;border:1px solid #e2e8f0}.zoom-note{font-size:12px;color:#64748b;margin-bottom:7px}.question{border-top:1px solid #e2e8f0;padding:16px 0}.qtitle{font-weight:700;margin-bottom:10px}.option{display:flex;gap:9px;padding:9px 10px;margin:5px 0;border:1px solid #e2e8f0;border-radius:9px;align-items:flex-start}.option input{margin-top:3px}.task-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.review{display:none;margin-top:20px}.review.open{display:block}.review-item{padding:14px;border-radius:10px;margin:10px 0;border-left:5px solid}.good{background:#f0fdf4;border-color:#22c55e}.bad{background:#fef2f2;border-color:#ef4444}.tip{background:#eff6ff;padding:12px;border-radius:10px}.acc-btn{width:100%;text-align:left;padding:12px;border:0;border-radius:9px;font-weight:700}.acc-body{display:none;padding:14px;white-space:pre-wrap;line-height:1.55;background:#f8fafc}.knowledge-tabs{display:flex;gap:8px;flex-wrap:wrap}.knowledge-pane{padding:20px}.score{color:#64748b}.evidence{background:#fff7ed;padding:10px;border-radius:8px}@media(max-width:900px){.home-grid{grid-template-columns:1fr 1fr}.exercise-wrap{grid-template-columns:1fr}.side{position:static}.student{grid-template-columns:1fr}.shell{padding:12px}}@media(max-width:560px){.home-grid{grid-template-columns:1fr}.topbar{padding:10px}.task{padding:12px}.source-figure img{width:100%;height:auto;object-fit:contain}.option{font-size:15px}}</style></head><body><header class="topbar"><div class="brand">IELTS Listening Practice<small>Dạng 7 • Multiple Choice</small></div><button class="btn" id="homeBtn">← Lesson Home</button></header><main class="shell"><section id="homePage" class="page active"><div class="hero"><h1>DẠNG 7: MULTIPLE CHOICE</h1><p>Học kiến thức trước, sau đó chọn Exercise. Tiến độ được lưu tự động trên thiết bị.</p><div class="student"><div class="field"><label>HỌ VÀ TÊN</label><input id="studentName"></div><div class="field"><label>LỚP</label><input id="studentClass"></div><div class="field"><label>MÃ HS</label><input id="studentId"></div></div><div class="progressbar"><span id="overallBar"></span></div><p id="overallText" class="score"></p></div><div class="home-grid" id="homeGrid"></div></section><section id="knowledgePage" class="page"><div class="hero"><h1>KIẾN THỨC CẦN HỌC</h1><p>Bám sát phần lý thuyết Multiple Choice trong tài liệu nguồn.</p></div><div class="knowledge-pane"><div class="knowledge-tabs" id="knowledgeTabs"></div><div id="knowledgePane" style="margin-top:15px"></div></div></section><section id="exercisePage" class="page"><div id="exerciseMount"></div></section></main><script>const DATA={"courseId": "IELTS_LISTENING_FOUNDATION", "unitId": "DANG7", "lessonId": "MULTIPLE_CHOICE", "version": "7.0", "endpoint": "https://script.google.com/macros/s/AKfycbzCX-jRyn28wS8lEQ-wtdM8qspFr-Ptj1c2r3ctxpi3hseVZ1UMBE8N4jXAx1-03pLn/exec", "exercises": [{"id": "EX01", "title": "John and Sam’s holiday", "page": 9, "image": "assets/images/source_p09.jpg", "audio": "assets/audio/MCQ_01.mp3", "source": "Listening for IELTS", "questions": [{"num": 1, "text": "Where does Sam recommend going for dinner?", "options": {"A": "Joe’s Cafe", "B": "The Captain’s Table", "C": "Mangan’s"}, "answer": "C", "why": "Sam says Mangan’s could be a good option and prefers it before discovering it is closed.", "wrong": "A becomes the fallback only after Mangan’s is found closed; B is rejected because the receptionist said service is slow."}, {"num": 2, "text": "Who is going to reserve the table?", "options": {"A": "John", "B": "Sam", "C": "The hotel receptionist"}, "answer": "C", "why": "Sam suggests asking the hotel receptionist to make the booking because John left his phone at the hotel.", "wrong": "A and B discuss the booking, but the final plan is for the receptionist to do it."}], "transcript": "John:   \nWhere shall we eat tonight?\nSam:   \nWell, there are plenty of options. The guide says this city has   \n \n \nhundreds of restaurants. What kind of food would you like to have,  \n \n \nJohn?\nJohn:   \nWell, I quite like seafood. There’s The Captain’s Table on Firth  \n \n \nStreet. The guide gives it four stars.\nSam:   \nI don’t know… The hotel receptionist told me the service is  \n \n \nslow. But if you like seafood, there are a couple more places in the  \n \n \nguide.\nJohn:   \nAh, yes...Mangan’s or Joe’s Cafe. What about those, Sam?\nSam:   \nMangan’s could be a good option. It’s nicer than Joe’s Cafe, and  \n \n \nthere are fantastic views as well. We’d probably pay a bit extra…  \n \n \nJoe’s Cafe is much cheaper. But we’re on holiday; I think we   \n \n \nshould splash out!\nJohn:   \nThat sounds great! Oh, no. Hold on. It’s closed tonight. What a  \n \n \nshame! Shall we go to Joe’s Cafe, then?\nSam:   \nYes, I suppose we’ll have to. I’ll give them a call and book a table.  \n \n \nCan I use your phone?\nJohn:   \nAh, er...no. Sorry. I’ve left my phone in the hotel. We can ask the  \n \n \nreceptionist to do it. Let’s go back now and sort it out. We can get  \n \n \nchanged and have a drink before dinner if you like.\nSam:   \nOK, good idea.\nQ1\nQ2\n\nIELTS THANH LOAN\nVocabulary:\n- seafood (noun): hải sản\nMeaning: fish and sea creatures that can be eaten, especially shellfish\n- receptionist (noun): nhân viên tiếp tân\nMeaning: a person whose job is to deal with people arriving at or telephoning a \nhotel, an office building, a doctor’s surgery, etc.\n- splash out (phrasal verb): Dành tiền vào cái gì đó\nMeaning: to spend a lot of money on something \nIELTS Thanh Loan\n424"}, {"id": "EX02", "title": "Museum and restaurant advice", "page": 9, "image": "assets/images/source_p09.jpg", "audio": "assets/audio/MCQ_02.mp3", "source": "Listening for IELTS", "questions": [{"num": 5, "text": "Why does a ticket for the museum cost £10?", "options": {"A": "The money is needed to fix parts of the building", "B": "The collection of Latin American art is unique", "C": "It is the only art museum in Europe"}, "answer": "A", "why": "The assistant explains that the old building needs repairs and the ticket money goes toward the roof and walls.", "wrong": "B is attractive because the collection is important, but the speaker explicitly says that is not the reason for the price; C is not stated."}, {"num": 6, "text": "Why does the tourist office assistant suggest the next town for a good restaurant?", "options": {"A": "They overlook the sea", "B": "The restaurants are bigger", "C": "There are more restaurants to choose from"}, "answer": "C", "why": "The next town is bigger and has a wider restaurant selection.", "wrong": "A and B are not given as the reason for the recommendation."}], "transcript": "Tourist: Can I also ask you about the museum in the main square? I was reading \nabout it in my guide book and was shocked to see that the entrance price is \n£10. Why does it cost so much?\nTourist oﬃce assistant: Well, the museum has the largest collection of Latin \nAmerican art in Europe. People come from all over the world to see it. But that’s \nnot the reason why it’s so expensive to get in. You see, the building is very old \nand it needs repairs. The £10 ticket cost will go towards repairing the roof and \nwalls.\nTourist: I see. Well, I suppose it’s worth paying £10 to see the collection.\nTOA: Yes, I think so too. Is there anything else I can help you with?\nTourist: Actually, there is. I was wondering if you knew of any good restaurants \nin the area.\nTOA: Well, there are a few restaurants near the harbour, and a couple on the \nbeach which are nice. The problem is that the smell of the fish market is quite \nstrong down there.\nTourist: Mm, I don’t think my girlfriend would be very pleased.\nTOA: I I know what you mean - it’s not very romantic, is it? My advice would \nbe to go to the next town.  It’s bigger, and the restaurant selection is wider. You \ncan get there by taxi and it only takes about ten minutes. The town is quite \npicturesque...Is it for a special occasion?\nTourist: Yes, it’s my girlfriend’s birthday so I’d like to go somewhere special. \nUm, do you know any of these restaurants well enough to tell me about them?\nQ5\nQ6\n\nIELTS THANH LOAN\nVocabulary:\n-  entrance (noun): sự đi vào\nMeaning: a door, gate, passage, etc. used for entering a room, building or place\n-  suppose (verb): cho là; tin rằng; nghĩ rằng\nMeaning:  to think or believe that something is true or possible (based on the \nknowledge that you have)\n-  harbour (noun): bến tàu, cảng\nMeaning: an area of water on the coast, protected from the open sea by strong walls, \nwhere ships can shelter\n-  romantic (adj): lãng mạn\nMeaning: beautiful in a way that makes you think of love or feel strong emotions\n-  picturesque (adj): đẹp, gây ấn tượng mạnh (phong cảnh, người...)\nMeaning: (of a place, building, scene, etc.) pretty, especially in a way that looks \nold-fashioned\n \nIELTS Thanh Loan\n426"}, {"id": "EX03", "title": "Upper-class Victorian families", "page": 10, "image": "assets/images/source_p10.jpg", "audio": "assets/audio/MCQ_03.mp3", "source": "Listening for IELTS", "questions": [{"nums": [1, 2], "text": "Which TWO of the following are myths about upper class Victorian families?", "options": {"A": "Families lived with servants", "B": "Children were mainly home schooled", "C": "Fathers occasionally taught their children Latin", "D": "The Victorians were not generous to the poor", "E": "Parents were strict with their children"}, "answers": ["A", "B"], "why": "The key identifies A and B. The transcript confirms servants were accommodated in the home and wealthy children generally did not attend school outside the family home.", "wrong": "C is explicitly described as something fathers occasionally did; D and E are not supported as the targeted myths in this extract.", "multi": true}], "transcript": "Lecturer: In Victorian times, the upper classes made up less than three per cent of the \nentire population of Britain, yet this class held more than ninety per cent of the \ncountry’s wealth. This shows the massive gap there was between rich and poor, a \ngap which has shrunk considerably in the last century. Today we’re going to look \nat the wide differences in family life between rich and poor in Victorian times. Let’s \nbegin with the upper classes.\nThe upper classes of the Victorian period were generally the nobility or the \nclergy. Most of their servants were very poorly paid, but were always \naccommodated within the homes of upper-class Victorian families, so they didn’t \nhave to pay for accommodation, food and often clothing.\nThe money which they did earn, they normally sent home to their families.\nMany Victorian servants came from the countryside, where the effects of the \nindustrial revolution had resulted in job losses. Amongst these servants were \ncooks, housemaids, stable hands, and butlers. The family would also employ a \nnanny, who although employed by the family, was not traditionally seen as a \nservant. A nanny’s primary role was to care for the children. She was responsible for \nteaching the children how to behave, looking after them when they were ill, and \ninstilling discipline into them. Nannies did not, however, educate the children. \nGenerally, children from wealthy families did not attend school outside the family \nhome. Tutors would come to the house to do this, and although occasion mothers \ntaught their children to read and fathers gave their children some instruction in Latin, \nthis was not a common occurrence.\nQ1\nQ2\n\nIELTS THANH LOAN\nVocabulary:\n- wealth (noun): sự giàu có, sự giàu sang\nMeaning:  a large amount of money, property, etc. that a person or country owns\n- massive (adj) : to lớn, đồ sộ; chắc nặng\nMeaning: very large, heavy and solid\n- shrunk (verb): co lại, rút lại, ngắn lại\nMeaning: to become or to make something smaller in size or amount\n- nobility (noun) : tính cao quý, tính cao thượng, tính cao nhã, tính thanh cao\nMeaning: people of high social position who have titles such as that of duke or \nduchess\n- clergy (noun): giới tăng lữ; tăng lữ\nMeaning: the priests or ministers of a religion, especially of the Christian Church\n- servant (noun): người hầu, người đầy tớ, người ở\nMeaning: a person who works in another person’s house, and cooks, cleans, etc. for \nthem\n- accommodation (noun): chỗ ăn chỗ ở\nMeaning: a place to live, work or stay in\n- revolution (noun): cuộc cách mạng\nMeaning: an attempt, by a large number of people, to change the government of a \ncountry, especially by violent action\n- housemaid (noun): chị hầu phòng\nMeaning: a female servant in a large house who cleans the rooms, etc. and often \nlives there\n- butler (noun): quản gia\nMeaning: the main male servant in a large house\n- nanny (noun): người giữ trẻ, bà vú, vú em\nMeaning: a woman whose job is to take care of young children in the children’s own \nhome\n- discipline (noun): kỷ luật\nMeaning: the practice of training people to obey rules and orders and punishing \nthem if they do not; the controlled behaviour or situation that results from this \ntraining\nIELTS Thanh Loan\n428"}, {"id": "EX04", "title": "Film reviews", "page": 11, "image": "assets/images/source_p11.jpg", "audio": "assets/audio/MCQ_04.mp3", "source": "Listening for IELTS", "questions": [{"num": 1, "text": "What Happens in the Night is based on", "options": {"A": "a story the director was told", "B": "the director’s childhood", "C": "a comic book"}, "answer": "B", "why": "The director says his inspiration was his own experiences growing up in 1950s Liverpool.", "wrong": "C describes the visual feel, not the basis of the story; A is not stated."}, {"num": 2, "text": "The reviewer thinks What Happens in the Night is", "options": {"A": "the best horror film this year", "B": "visually stunning", "C": "difficult to understand"}, "answer": "B", "why": "The reviewer says it is “shot beautifully”.", "wrong": "A is directly rejected (“wouldn’t say it’s the best”); C is contradicted because it is “not hard to follow”."}, {"num": 3, "text": "In real life, the stars of Happy as Larry", "options": {"A": "didn’t get on", "B": "fell in love", "C": "are best friends"}, "answer": "A", "why": "The reviewer says the co-stars barely spoke to each other on set.", "wrong": "B and C contradict the reported off-screen relationship."}, {"num": 4, "text": "The reviewer recommends you watch Happy as Larry if", "options": {"A": "you are a woman", "B": "you like romantic films", "C": "you liked Sonya’s other films"}, "answer": "B", "why": "The reviewer says, “If you want romance, this film is fine.”", "wrong": "A is rejected because both men and women can get something from it; C is not the recommendation given."}], "transcript": "Reviewer: Welcome to the latest episode of Film Finest with me, Liz O’Donnell. The film \nI’ll be reviewing in this episode are What Happens in the Night, the new horror film by \nacclaimed director Jan de Neiburg, and  Happy as Larry, a new romance comedy starring \nHarrison Wyatt and Sonya Smith. Let’s start with What Happens in the Night, Set in a \nconvent school in the 1950s, this film tells the story of two boys who are haunted by \napparitions of monks. The film has the feel of a comic book as it’s shot in black and white \nwith occasional shots of vivid colour. De Neiburg, the director, said he wanted some \nelements to stand out and he has used colour to do it. I would say quite effectively. He claims \nhis inspiration for the film is his own experiences growing up in 1950s Liverpool. (Q1)\nA believer in ghosts himself, he thought he saw ghosts in his school years. Ghosts or not, this \nfilm is certainly haunting. What happens in the Night is a film that will scare you. I wouldn’t \nsay it’s the best horror film to come out this year, but it’s certainly shot beautifully,(Q2) and \nit’s not hard to follow. So, unlike some recent horror films, you don’t have to sit in dedicated \nconcentration for two hours trying to keep up with a complex plot! An enjoyable film, I would \ngive it four stars.\nIn Happy as Larry, Sonya Smith and Harrison Wyatt play two people who fall in love but \ncannot be together because of their families. The build-up to the film has certainly been epic, \nwith gossip about both co-star in the papers. Rumour has it htat Smith and Wyatt aren’t the \nbest of friends. In fact, on the srt they barely spoke to each other! (Q3) I have to say, though, \nthis doesn’t come across in the film and they look like a great couple.  Happy as Larry is a \nmove away from the usual films Sonya makes - she is better known for her roles in action films \n- but she has shown herself to be a capable comedy actress. However, I’m not sure this is the \nfinest film to do it in. Both men and women alike can get something from this film, but the \nromance angle is overplayed and the laughs are few and far between. If you want romance, \nthis film is fine,(Q4) but if you want comedy, I would recommend seeing something else. I \nwould give it three starts.\nNow, there are some new video releases which are going to be coming out…\nIELTS Thanh Loan\n429\nExercise 4:  \n3. A\n4. B\n\nIELTS THANH LOAN\nVocabulary:\n- episode (noun): tập phim\nMeaning:  an event, a situation, or a period of time in somebody’s life, a novel, etc. \nthat is important or interesting in some way\n- horror (noun): sự khiếp, sự ghê rợn\nMeaning:  a feeling of great shock, fear or disgust\n- convent (noun): nữ tu viện, nhà tu kín\nMeaning: a building in which nuns (= members of a female religious community) \nlive together\n- haunt (verb):  năng lui tới, hay lui tới (nơi nào, người nào)\nMeaning: to continue to cause problems for somebody for a long time\n- apparition (noun): sự hiện ra, sự xuất hiện\nMeaning: a ghost or an image of a person who is dead\n- monk (noun): thầy tu, thầy tăng\nMeaning: a member of a religious group of men who often live apart from other \npeople in a monastery and who do not marry or have personal possessions\n- vivid (adj): sống động, mạnh mẽ \nMeaning: (of memories, a description, etc.) producing very clear pictures in your \nmind \n- inspiration (noun): sự truyền cảm\nMeaning:  the process that takes place when somebody sees or hears something that \ncauses them to have exciting new ideas or makes them want to create something, \nespecially in art, music or literature\nIELTS Thanh Loan\n430"}, {"id": "EX05", "title": "Train journey information", "page": 12, "image": "assets/images/source_p12.jpg", "audio": "assets/audio/MCQ_05.mp3", "source": "Complete IELTS band 4-5", "questions": [{"num": 1, "text": "How long will it take to get to Paris?", "options": {"A": "About one hour", "B": "About three hours", "C": "About four hours"}, "answer": "C", "why": "The speaker totals the journey at about four hours.", "wrong": "One hour is only to the Tunnel; three hours is from there to Paris."}, {"num": 2, "text": "What should passengers do with their passports?", "options": {"A": "leave them with their steward", "B": "lock them away", "C": "carry them at all times"}, "answer": "B", "why": "Passengers are advised to keep passports in the safe in their cabin.", "wrong": "The steward provides a key; passengers do not leave passports with the steward or carry them constantly."}, {"num": 3, "text": "When should passengers be in the restaurant car for dinner?", "options": {"A": "7.45 pm", "B": "8.00 pm", "C": "8.15 pm"}, "answer": "A", "why": "Dinner is at 8, but passengers should be at the table fifteen minutes earlier: 7.45.", "wrong": "B is serving time, not arrival time; C is too late."}, {"num": 4, "text": "What will the passengers do when the train gets to the Italian border?", "options": {"A": "Change trains", "B": "Go on a tour", "C": "Have lunch in a local cafe"}, "answer": "B", "why": "The speaker has arranged visits to a market, museum and castle during the stop.", "wrong": "The train changes engines, not trains; coffee is in a cafe, while lunch is back on the train."}, {"num": 5, "text": "What should passengers not do?", "options": {"A": "Eat their own food on the train", "B": "Open their cabin window", "C": "Leave the train before it gets to Italy"}, "answer": "C", "why": "The speaker explicitly says not to get off until the Italian border.", "wrong": "Own food is allowed in cabins; windows must be closed when passengers are not in the cabin, not never opened."}], "transcript": "Track 09\nRight, let me give you a bit more information about the trip. The first part of our journey is \nfrom London to Paris, going through the Channel Tunnel. It will take us just over an hour to \nget to the Tunnel, including a short stop before we get there to pick up some more passengers. \nFrom there, it’ll be another three hours to Paris, so we’re looking at four hours \naltogether,(Q1)  give or take a few minutes.\nA quick bit of advice about passports. You won’t need these until we get to the Italian \nborder, so I suggest you keep them in the safe which you’ll find in your cabin. Ask your \nsteward – that’s the person in charge of your carriage – for a key. (Q2) That way, you \nwon’t need to carry them with you all the time.\nNow, meals. As I said earlier, breakfast tomorrow morning will be in your cabins, and this \nwill be served at about 7.30, 7.45, so you’ll be able to enjoy it as we travel along the \nsouthern French coast. Lunch is at 1 o’clock in the restaurant car, and dinner is at 8 o’clock, \nalthough we’d like you all to be at your table about fifteen minutes earlier, at a quarter \nto,(Q3) if you could.\nWhen we get to the Italian border tomorrow morning, our train will change engines, and \nwe’ll also be getting a new crew. We’ll be taking advantage of the stop to have a look \naround. I’ve arranged a visit to the local market, a museum and a castle. (Q4) This will take \nabout four hours, with a break for coffee in a local café, and we’ll be back on the train in time \nfor lunch.\nA few quick rules. Some of you might have bought your own food or drink on beard. That’s \nfine, but could we ask that you consume it in your cabins and not in the restaurant or \nlounge? Could we also ask you to make sure your cabin windows are closed when you’re \nnot in your cabin? And whatever you do, don’t get off the train until we reach the Italian \nborder.(Q5) Apart from the border and one or two other places, which I’ll tell you about, any \nstops we make will only be for a few minutes. I’d hate to leave anyone behind.\nAll right so, moving on from the Italian border, we’ll be heading… [fade]\nIELTS Thanh Loan\n431\nExercise 5:  \n4. B\n5. C\n\nIELTS THANH LOAN\nVocabulary:\n- border (noun): bờ, mép, biên giới\nMeaning: the line that divides two countries or areas; the land near this line\n- steward (noun): người phục vụ, chiêu đãi viên\nMeaning: a man whose job is to take care of passengers on a ship, an aircraft or a \ntrain and who brings them meals, etc.\n- carriage (noun): sự chuyên chở hàng hoá; cước chuyên chở hàng hoá\nMeaning:  a separate section of a train for carrying passengers\n- serve (verb): phục vụ, phụng sự, phụ trách, đảm nhiệm\nMeaning: to give somebody food or drink, for example at a restaurant or during a \nmeal\n- crew (noun): toàn bộ thuỷ thủ trên tàu; toàn bộ người lái và nhân viên trên máy \nbay\nMeaning:  all the people working on a ship, plane, etc.\n- lounge (noun): buồng đợi, phòng khách, phòng ngồi chơi \nMeaning: a room for waiting in at an airport, etc.\nIELTS Thanh Loan\n432"}, {"id": "EX06", "title": "Yellow Plaque scheme", "page": 13, "image": "assets/images/source_p13.jpg", "audio": "assets/audio/MCQ_06.mp3", "source": "Listening for IELTS", "questions": [{"nums": [1, 2, 3], "text": "Give THREE reasons why the Yellow Plaque scheme was started.", "options": {"A": "to boost tourism", "B": "to raise awareness of local history", "C": "to increase knowledge of famous people", "D": "for publicity", "E": "for architectural preservation", "F": "to raise national awareness"}, "answers": ["B", "C", "F"], "why": "The original aims were to raise awareness of Sydney’s history locally and nationally and make people aware of important people who had lived there.", "wrong": "Tourism and preservation are described as benefits/results, not original aims; publicity is not given as an aim.", "multi": true}, {"num": 4, "text": "The scheme has had the most success in", "options": {"A": "increasing the amount of tourism in the area", "B": "raising the profiles of the famous people featured", "C": "raising historical awareness"}, "answer": "C", "why": "The speaker says its greatest success is raising the profile of the city’s rich history.", "wrong": "Tourism helped, but was not where the speaker says the scheme achieved most success; B shifts the focus to people."}, {"num": 5, "text": "Successful Yellow Plaque nominees have to", "options": {"A": "have a nomination and 50 signatures", "B": "be approved by a central panel", "C": "have done something remarkable"}, "answer": "C", "why": "A plaque can only be given to someone famous who achieved something out of the ordinary.", "wrong": "Only three signatures are required, not 50; the panel checks data rather than being the defining eligibility condition."}, {"num": 6, "text": "The scheme is mainly funded by", "options": {"A": "the community", "B": "local councils", "C": "the tourist board"}, "answer": "A", "why": "Public/community donations now account for 65% of total funds.", "wrong": "The tourist board used to provide the majority; the current majority is public donations."}], "transcript": "Guide: Thank you for coming along to the Cultural Sydney talk. I’m going to start by telling \nyou about the Yellow Plaque scheme, which has been running in Sydney for over forty years \nand has been incredibly successful. When you are walking around the city, you'll see some \nbuildings with a small round yellow plaque on them. If you take a closer look, you'll see the \nname and details of a famous person who lived in that very place. We have, at present, 130 \nplaques up in the city. The scheme has been great for tourism, but it was really started to raise \nawareness of the rich history of Sydney, both locally and nationally, and we think we've \nmanaged to do this (Q1). We also wanted to make people aware of the impressive list of \nimportant people who have lived in this city, and we've certainly achieved that (Q2). But \nthat's not all. Although not part of our original aims, the scheme has also helped preserve \nsome of the older and more important buildings in Sydney because people now know that \nthese buildings are a link to our past; some of the buildings are actually over 180 years old, \nwhich, for Australia, is ancient! We actually think that this is where the scheme has \nachieved the most success; in raising the profile of our rich history. (Q3) Of course, it has \nhelped tourism, but not only that, locals also walk around looking at the plaques. It has been \nreally wonderful in highlighting our past. Some people are quite surprised to see who has \nlived here; take Errol Flynn for example. He was married in Sydney. We are planning on \nputting more plaques up and a common question is how can people nominate a figure to be \nput on a plaque. It's quite a simple process. Applications can be downloaded from our \nwebsite. If you want to nominate someone for a plaque you just need the person's name, \nwhere they lived and you need three signatures to approve your application.(Q4) Our \npanel then checks that all the data you've submitted is correct and hopefully, within a year a \nnew plaque will be erected. But you can't nominate just anyone! A plaque can only be given \nto a person who is famous and has achieved something out of the ordinary, like an important \npolitician or world-record breaking sportsman, for example. (Q5) We aim to have fifty new \nplaques up within the next three years, and we have plenty of funding to do so. Our funding \ncomes from three sources: the local council, community donations and the tourist board. \nWhereas in the past the tourist board put in the majority of funding, now public donations \ncount for sixty-five per cent of all total funds!(Q6) In fact, our funding is so healthy now; there \nare plans to expand the scheme.\nIELTS Thanh Loan\n433\nExercise 6:  \n5. C\n6. A\n\nIELTS THANH LOAN\nVocabulary:\n- plaque (noun): tấm, bản \nMeaning: a flat piece of stone, metal, etc., usually with a name and dates on, \nattached to a wall in memory of a person or an event\n- impressive (adj): gây ấn tượng sâu sắc, gây xúc động, gợi cảm\nMeaning: making you feel admiration, because they are very large, good, skilful, \netc.\n- preserve (verb): bảo quản, giữ gìn\nMeaning:  to keep a particular quality, feature, etc.; to make sure that something is \nkept\n- ancient  (adj): xưa, cổ\nMeaning: belonging to a period of history that is thousands of years in the past\n- nominate (verb): chỉ định, chọn, bổ nhiệm\nMeaning: to formally suggest that somebody should be chosen for an important role, \nprize, position, etc.\n- signature (noun): chữ ký\nMeaning: your name as you usually write it, for example at the end of a letter\n- erect (verb): dựng đứng thẳng, đặt đứng thẳng\nMeaning:  in a vertical position\n- sportsman (noun): người thích thể thao, người ham mê thể thao; nhà thể thao, \nngười tham gia thể thao\nMeaning: a man who plays a lot of sport, especially as a professional\n- donation (noun):  sự tặng, sự cho, sự biếu; sự quyên cúng\nMeaning: something that is given to a person or an organization such as a charity, \nin order to help them; the act of giving something in this way\nIELTS Thanh Loan\n434"}, {"id": "EX07", "title": "Fame", "page": 14, "image": "assets/images/source_p14.jpg", "audio": "assets/audio/MCQ_07.mp3", "source": "Listening for IELTS", "questions": [{"nums": [1, 2, 3], "text": "How has fame changed? Choose THREE.", "options": {"A": "The public now know almost everything about famous people", "B": "Famous people have lost their mystery", "C": "More people are famous nowadays", "D": "Fame is more short-lived", "E": "Talent is irrelevant in becoming famous"}, "answers": ["B", "C", "D"], "why": "The source key gives B, C and D: more celebrities, fame is short-lived, and the discussion frames mystery as a changing feature.", "wrong": "A is a tempting detail but not keyed as one of the three changes; E overstates the point—the speaker says talent is no longer necessary, not that it is irrelevant in every case.", "multi": true}, {"nums": [4, 5, 6], "text": "Who are the losers in fame? Choose THREE.", "options": {"A": "Celebrities", "B": "Photographers", "C": "Executives", "D": "The public", "E": "Writers"}, "answers": ["B", "D", "E"], "why": "The speaker identifies paparazzi as disliked, the public as paying higher prices, and creative writers as missing out on rewards.", "wrong": "Celebrities and executives are described as financially benefiting overall.", "multi": true}], "transcript": "Interviewer: So, we have Phyllis Bailey here to talk to us about fame. Her new book, Famous \nfor Fifteen Minutes is coming out on Monday. So Phyllis, welcome. What do you think fame \nmeans to us these days?\nPhyllis: Well, famous people are everywhere and although we know nearly all there is to know \nabout these people - their lives are splashed all over magazines and television - they’ve \nretained their myster. (Q1) The public are always eager to find our more about them \nand this fuels the paparazzi to photograph them. It’s true that there are more celebrities \naround than ever before,(Q2) but the number of really important famous people probably \nhasn’t changed greatly. This is because people became famous for only a short time. (Q3) \nAndy Warhol once famously said. ‘In the future, everyone will be famous for fifteen minutes’, \nand I think there’s some truth in that. One day a person is famous and the next they are \nforgotten. Take, for example, contestants on reality television shows. After maybe six months \nwe never see them again. This also highlights another characteristic of fame: in the past \npeople became famous because of something they had done, or because of their talent. \nNowadays these things aren’t necessary. I personally think this is a great pity.\nInterviewer: Is fame particularly beneficial now?\nPhyllis: Well let’s look at the winners and losers when it comes to fame. Many people think \nthat celebrities are the losers in this new media world, but that isn’t necessarily the case. \nTake, for example, actors and actresses. They often complain about a lack of privacy, but \nprivacy is possible. There are many celebrities who aren’t constantly in the papers. Much as \nthey complain, they chase the publicity and then blame it on the media. In fact, the \npaparazzi, who photograph the rich and famous, are often seen as figures of hate for this. \nThey come off much worse in the end. because they are so disliked by the public and \ncelebrities. (Q4) But in reality, they are making the celebrities and their managers even \nricher. In fact, because of the cult of fame nowadays, we can see media executives making \neven more monev and celebrities \nIELTS Thanh Loan\n435\nExercise 7:  \n\nIELTS THANH LOAN\nsigning multi-million pound deals. And who pays for this? Well, all of us. Cinema and concert \nticket prices have risen and DVDs cost more than ever. (Q5) Merchandising makes a \nfortune for the famous these days. And although we are paying for it, the rewards go to only \na small elite – the big players, the stars and the executives, but they miss a lot of the creative \ntalent in the industry, like the people who write the screenplays. They are still on the same \nsalary they were on ten years ago. (Q6) Executives certainly have a  difficult job managing \ntheir clients, but they get rewarded well for doing so. I for one think these rewards should be \nmore fairly spread.\nInterviewer: How could this be done? Are you …?\nVocabulary:\n- fame (noun): tiếng tăm, danh tiếng, tên tuổi\nMeaning: the state of being known and talked about by many people\n- retain (verb): ngăn, giữ lại\nMeaning: to keep something; to continue to have something\n- mystery (noun): điều huyền bí, điều thần bí\nMeaning: something that is difficult to understand or to explain\n- eager (adj): ham, háo hức, hăm hở, thiết tha, hau háu\nMeaning: very interested and excited by something that is going to happen or about \nsomething that you want to do\n- complain (verb): kêu ca, kêu, phàn nàn, than phiền; oán trách\nMeaning: to say that you are annoyed, unhappy or not satisfied about \nsomebody/something\n- publicity (noun): sự công khai; sự làm cho thiên hạ biết đến\nMeaning: the attention that is given to somebody/something by newspapers, \ntelevision, etc.\n- blame (noun): sự khiển trách; lời trách mắng\nMeaning: to think or say that somebody/something is responsible for something bad\n- merchandising (noun): nghề buôn, sự buôn bán\nMeaning: the activity of selling goods, or of trying to sell them, by advertising or \ndisplaying them\nIELTS Thanh Loan\n436"}, {"id": "EX08", "title": "Anglia Sculpture Park", "page": 15, "image": "assets/images/source_p15.jpg", "audio": "assets/audio/MCQ_08.mp3", "source": "The official guide to IELTS", "questions": [{"num": 11, "text": "The land where the Sculpture Park is located was previously", "options": {"A": "completely covered by forest", "B": "the site of a private house", "C": "occupied by a factory"}, "answer": "B", "why": "The De Quincies built a house in the centre of the park.", "wrong": "Forest land was to the north; manufacturing was the family’s business, not a factory stated on the park site."}, {"num": 12, "text": "What is unusual about the Anglia Sculpture Park?", "options": {"A": "Artists have made sculptures especially for it", "B": "Some sculptures were donated by the artists", "C": "It only shows contemporary sculptures"}, "answer": "A", "why": "Some sculptures were created specifically for the sites they occupy in the park.", "wrong": "Donation is not stated; the park is not described as showing only contemporary work."}, {"num": 13, "text": "What is the theme of Joe Tremain’s burnt sculptures?", "options": {"A": "The contrast between nature and urban life", "B": "The effect of man on the environment", "C": "The violence of nature"}, "answer": "C", "why": "The sculptures illustrate the ferocity and intensity of forces that shaped the planet.", "wrong": "The emphasis is natural forces, not urban contrast or human environmental impact."}, {"num": 14, "text": "The path by the Lower Lake", "options": {"A": "is rather wet in some places", "B": "has recently been repaired", "C": "is difficult to walk on"}, "answer": "B", "why": "The path was renovated after flooding.", "wrong": "The speaker says the water is back to normal and the path is very level underfoot."}, {"num": 15, "text": "What does the speaker say about the Visitor Centre?", "options": {"A": "It is being enlarged at present", "B": "It has received an international award", "C": "It was designed by a Canadian architect"}, "answer": "A", "why": "Builders are adding another floor.", "wrong": "The architect designed an award-winning museum in Canada; he was born in England."}, {"num": 16, "text": "Today, visitors can buy snacks and sandwiches", "options": {"A": "at the kiosk", "B": "in the Terrace Room", "C": "at the Lower Lake Café"}, "answer": "A", "why": "The Terrace Room is closed, so visitors can buy food at the kiosk.", "wrong": "B is explicitly unavailable; C is not the location given."}], "transcript": "Hello everyone and welcome to the Anglia Sculpture Park. Right, well, the idea behind the \nsculpture park is that it’s a place where works of art such as large sculptures and \ncarvings can be displayed out of doors in a natural setting.\nAs you’ll have noticed when you drove here, most of the land around the park is farmland. \nThe park itself belonged to a family called the De Quincies, who had made a lot of money \nfrom manufacturing farm machinery, and who also owned substantial stretches of forest \nland to the north of the park. They built  a house in the centre of the park, not far from where \nwe’re standing now, (Q11) but this burnt down in 1980 and the De Quincies then sold the \nland.\nThe Anglia Sculpture Park isn’t the only one in the country; several of the London parks \nsometimes display contemporary sculptures, and there are a couple of other \npermanent sculptures parks in England. But we’ve unique in that some of our sculptures \nwere actually created for the sites they occupy here, (Q12) and we also show sculptures by a \nwider range of artists than anywhere else in the country.\nFor example, at present we have an exhibition  by Joe Tremain, of what he calls ‘burnt’ \nsculptures. These are wood and stone sculptures that he’s carved and marked with fire to \nillustrate the ferocity and intensity of the forces that have shaped our planet over millions \nof years.(Q13) They look really dramatic in this rural setting.\nTo see some of the sculptures, you’ll need to follow the path alongside the Lower Lake. We \nhad to renovate this (Q14) after the lake overflowed it banks a couple of months ago and \nflooded the area. The water level’s back to normal now and you shouldn’t  have any trouble, \nthe path’s very level underfoot.\nYou should be back at the Visitor Centre at about four o’clock. If you have time it’s worth \ntaking a look at the Centre itself. It’s not possible to go upstairs at present as builders are \nworking there adding another floor,(Q15) but the rest’s well worth seeing. The architect \nwas Guy King. He was actually born in this part of England but he recently designed a \nmuseum in Canada that won a prize for innovation in public buildings.\nIf you want to get something to eat when you get back, like a snack or a sandwich, the Terrace \nRoom is currently closed, but  you can go to the kiosk and buy something, (Q16) then sit on \none of the chairs overlooking the Lower Lake and enjoy the view as you’re eating.\nIELTS Thanh Loan\n437\nExercise 8:  \n13. C\n14. B\n15. A\n16. A\n\nIELTS THANH LOAN\nVocabulary:\n- sculpture (noun): nghệ thuật điêu khắc, nghệ thuật chạm trổ; bức tượng\nMeaning: a work of art that is a solid figure or object made by carving or shaping \nwood, stone, clay, metal, etc.\n- carving (noun): nghệ thuật khắc, nghệ thuật tạc, nghệ thuật chạm\nMeaning: an object or a pattern made by cutting away material from wood or stone\n- farmland (noun): đất chăn nuôi, trồng trọt\nMeaning: land that is used for farming\n- machinery (noun): máy móc, máy; thiết bị\nMeaning: machines as a group, especially large ones\n- contemporary (adj): đương thời\nMeaning: belonging to the same time\n- permanent (adj): lâu dài, vĩnh cửu; thường xuyên, thường trực; cố định\n Meaning: lasting for a long time or for all time in the future; existing all the time\n- exhibition  (noun): cuộc triển lãm, cuộc trưng bày\nMeaning: a collection of things, for example works of art, that are shown to the \npublic\n- ferocity (adj): tính dữ tợn, tính hung ác\nMeaning: violence; aggressive behaviour\n- architect (noun): kiến trúc sư\nMeaning: a person whose job is designing buildings\nIELTS Thanh Loan\n438"}, {"id": "EX09", "title": "Hotel event", "page": 16, "image": "assets/images/source_p16.jpg", "audio": "assets/audio/MCQ_09.mp3", "source": "The official guide to IELTS", "questions": [{"num": 11, "text": "The next event at the hotel will be a", "options": {"A": "trade fair", "B": "wedding", "C": "party"}, "answer": "C", "why": "The speaker says they have three days to prepare for the birthday party.", "wrong": "The wedding and trade fair were recent past events."}, {"num": 12, "text": "The number of guests will be", "options": {"A": "less than 50", "B": "from 50 to 100", "C": "more than 100"}, "answer": "B", "why": "There will be more than the usual under-50 groups but no more than the maximum of 100.", "wrong": "A is below the expected number; C exceeds the stated maximum."}, {"num": 13, "text": "Guests will start arriving at", "options": {"A": "7.15", "B": "7.30", "C": "7.45"}, "answer": "A", "why": "Although invitations say 7.30–7.45, the hotel expects early guests at 7.15.", "wrong": "B and C are invitation times, not the expected first arrival."}, {"num": 14, "text": "The entertainment will be a", "options": {"A": "live band", "B": "comedian", "C": "magician"}, "answer": "B", "why": "The live band was cancelled and a comedian will replace it.", "wrong": "The magician was considered but the hosts were not keen."}], "transcript": "Good morning everyone. I hope you’re all feeling OK after the activities of the \nlast week or so. I know you’ve all been working very hard recently and we’ve \nbeen exceptionally busy, especially with the wedding last weekend and the \ntrade fair straight after that. And now we have only three days to prepare for \nthe birthday party this weekend. The events recently have gone extremely well \nand the hotel is beginning to get a very good reputation, so we need to keep \nit up. At the moment, we don’t have exact numbers of guests and though we \nusually only cater for groups of less than fifty, we will have quite a few more \nthan that. So - as I said - not sure of numbers but of course we won’t go over the \nmaximum of 100. But it’s likely that we will need all of you to work this weekend \nso if any of you can’t, please let me know as soon as possible.\nRight - so what time will the event start? Well the invitation says guests should \narrive between 7.30 and 7.45 but our experience is that there are always a few \nwho like to arrive early so we’ll expect the first people at 7.15. As the numbers \nare quite large, this will certainly be the case. Food will be served at around \n8.30 and then, depending on how long the meal takes, the entertainment will \nstart about two hours later. Now, for this, we were expecting a live band for the \noccasion which is always fun, but apparently this has been cancelled due to \nillness. So - the hosts know someone who is a comedian who will be replacing \nthe band. We had hoped that the resident magician who worked here through \nthe summer would be able to help out but they weren’t keen on that idea.\nQ11\nQ12\nQ13\nQ14\n13. A\n14. B\n\nIELTS THANH LOAN\nVocabulary:\n- trade (noun): thương mại, sự buôn bán, mậu dịch\nMeaning: the activity of buying and selling or of exchanging goods or services \nbetween people or countries\n- reputation (noun): sự nổi danh; danh tiếng\nMeaning: the opinion that people have about what somebody/something is like, \nbased on what has happened in the past\n- cater (verb): phục vụ cho, mua vui cho, giải trí cho\nMeaning: to provide food and drinks for a social event\n- expect (verb): chờ đợi, trông đợi, mong ngóng, trông chờ, trông ngóng (ai đó, việc \ngì đó)\nMeaning: to think or believe that something will happen or that somebody will do \nsomething\n- comedian (noun): diễn viên kịch vui; người đóng kịch vui\nMeaning: an entertainer who makes people laugh by telling jokes or funny stories\n- magician (noun): thuật sĩ,đạo sĩ, pháp sư; thầy phù thuỷ, ảo thuật gia\nMeaning: a person who can do magic tricks\nIELTS Thanh Loan\n440"}, {"id": "EX10", "title": "Hadley Park volunteers", "page": 17, "image": "assets/images/source_p17.jpg", "audio": "assets/audio/MCQ_10.mp3", "source": "The official guide to IELTS", "questions": [{"nums": [11, 12], "text": "Which TWO tasks will volunteers in Group A be responsible for?", "options": {"A": "Widening pathways", "B": "Planting trees", "C": "Picking up rubbish", "D": "Putting up signs", "E": "Building fences"}, "answers": ["B", "E"], "why": "Group A will help with new wooden fencing and put native plants and trees into the ground.", "wrong": "A and D are council tasks; C is being handled by a local school.", "multi": true}, {"nums": [13, 14], "text": "Which TWO items should volunteers in Group A bring?", "options": {"A": "Food and water", "B": "Boots", "C": "Gloves", "D": "Raincoats", "E": "Their own tools"}, "answers": ["B", "C"], "why": "The speaker recommends strong waterproof boots and volunteers’ own gloves.", "wrong": "Raincoats are no longer needed; tools and food/drink will be supplied.", "multi": true}], "transcript": "Good morning - it’s great to see so many people here. Thank you all very much for \ncoming. Well, as you know, the community gardens at Hadley Park are really not \nlooking as good as they should, quite bad really, and although the local council has a \nbudget to deal with some of the problems, we do need volunteers for other tasks. If \nyou don’t mind, I’m going to divide you into two groups. So, everyone on this side of \nthe room is Group A and the rest of you are Group B. So, Group A, there are a couple \nof things we'd like you to help with. Um, first of all, don't worry about any litter or \nempty bottles you see lying about - one of the local schools has offered to help out with \nthat as part of their own environmental project. The priority for you will be to give \nus a hand with the new wooden fencing (Q11) it needs constructing a long parts of \nthe bicycle track, as there are parts which have now fallen down or broken - as I'm \nsure you've seen. You've probably also noticed that some of the pathways that come \nfrom the bicycle track a quite narrow - and there are plans to make them wider - but \nthe council will be dealing with that later in the year and they've also promised to \nproduce some informational signs about the plants in the gardens. Hopefully they'll be \nup in a few weeks time. The other thing we're doing is getting rid of some of the foreign \nspecies that are growing in the gardens and putting back some native plants and trees. \nSo you'll be doing some digging for us and getting those into the ground (Q12) So \nGroup A there's some items you'll need to bring along with you. I was going to say \n‘raincoats’ but the forecast has changed so you can leave those at home. I’d \ndefinitely recommend a strong pair of boots, (Q13) waterproof would be best; it's \nquite somebody at the moment, and your own gloves would also be advisable. (Q14) \nTools will be available - spades and hammers, that kind of thing. You just need to \nmake sure they go back in the trucks. And, there’s no need to worry about food and \ndrink as we’ll be supplying sandwiches and coffee possibly some biscuits, even!\n\nIELTS THANH LOAN\nVocabulary:\n-  budget (noun): ngân sách, ngân quỹ\nMeaning: the money that is available to a person or an organization and a plan of \nhow it will be spent over a period of time\n-  priority  (noun): sự ưu thế (về cấp bậc); quyền ưu tiên, quyền được trước; sự ưu \ntiên hàng đầu\nMeaning: something that you think is more important than other things and should \nbe dealt with first\n-  fencing (noun): sự rào dậu\nMeaning: fences; wood, wire, or other material used for making fences\n-  forecast (noun): sự dự đoán trước; sự dự báo trước\nMeaning: a statement about what will happen in the future, based on information \nthat is available now \n-  waterproof (adj): không thấm nước\nMeaning: that does not let water through or that cannot be damaged by water\n-  advisable (adj): nên, thích hợp, đáng theo\nMeaning: sensible and a good idea in order to achieve something\n-  spade (noun): cái mai, cái thuổng\nMeaning: a garden tool with a broad metal blade and a long handle, used for digging\n-  hammer (noun): búa\nMeaning:  a tool with a handle and a heavy metal head, used for breaking things or \nhitting nails \nIELTS Thanh Loan\n442"}, {"id": "EX11", "title": "Marketing report", "page": 18, "image": "assets/images/source_p18.jpg", "audio": "assets/audio/MCQ_11.mp3", "source": "The official guide to IELTS", "questions": [{"num": 21, "text": "Why did Leo choose instant coffee as the topic for his marketing report?", "options": {"A": "He found plenty of material on the topic", "B": "He had some practical experience in the area", "C": "He had an idea of a brand he wanted to target"}, "answer": "A", "why": "Leo found very few articles on clothing but “tons” on coffee.", "wrong": "His practical experience was in clothing, not coffee; no target brand motivated the choice."}, {"num": 22, "text": "In Australia, recent technological developments", "options": {"A": "are producing less healthy types of instant coffee", "B": "are reducing the demand for instant coffee", "C": "are improving the quality of instant coffee"}, "answer": "B", "why": "Cheap coffee percolators let people make real coffee at home, so fewer buy instant coffee.", "wrong": "The transcript does not say technology makes instant coffee less healthy or improves its quality."}, {"num": 23, "text": "What do the speakers agree about Leo’s table of coffee products?", "options": {"A": "It needs more explanation in the text", "B": "It is factually inaccurate in some places", "C": "It would be best to put this in the appendix"}, "answer": "A", "why": "Anna says the table is too factual on its own and needs comment about the implications.", "wrong": "She says the table looks good and does not move it to the appendix."}, {"num": 24, "text": "What do they decide about describing Shaffers as a market follower?", "options": {"A": "Leo needs to define his terms", "B": "Leo needs to provide some more evidence", "C": "Leo needs to put it in a different section"}, "answer": "B", "why": "Anna says Leo must back the opinion up with data.", "wrong": "The section is fine and he already explains market share."}, {"num": 25, "text": "What does Anna say about originality in a first marketing report?", "options": {"A": "Clear analysis of data can be considered original", "B": "Graphs and diagrams should be original, not copied", "C": "Reports should contain original data collected by the student"}, "answer": "A", "why": "Originality can come from the student’s interpretation and perspective on published data.", "wrong": "Students are not expected to collect their own data, and copied graphs can still be used if interpreted."}, {"num": 26, "text": "What difference from school assignments has surprised Leo?", "options": {"A": "Not knowing the criteria for getting a good mark", "B": "Being required to produce work without assistance", "C": "Having to do a great deal of research"}, "answer": "A", "why": "Leo says he knew exactly how to get a good grade at school but lacks information on how the lecturer will grade this work.", "wrong": "He expected more research; lack of assistance is not the surprise stated."}], "transcript": "Leo: \nAnna: \nLeo: \nAnna: \nLeo: \nAnna: \nLeo: \nAnna: \nLeo:\nAnna: \nLeo:\nAnna:\nLeo:\nAnna: \nIELTS Thanh Loan\n443\nExercise 11:  \n24. B\n25. A\n26. A\nAnna, I wanted to ask you about my marketing report. I’m not sure about it…\nThat’s OK, Leo. So what do you have to do?\nChoose a product or service then compare two organisations that produce it. I’m \ndoing instant coffee.\nBut haven’t you got a weekend job in a clothing store? Why didn’t you choose \nclothing?\nThat was my first thought it’d give me some practical examples, but when I searched \nfor men’s clothing on the Internet there were hardly any articles. So then I looked for \ncoffee and I found there were tons.(Q21)\nYeah, there are so many brands on the market now. OK, so how much have you \nactually written?\nI’ve done part one, on economic and technological factors. I found some good data \non technological changes, how in Australia fewer people are buying instant coffee \nbecause of cheap coffee percolators that they can use to make real coffee  at \nhome.(Q22)\nBut there’s also a movement away from drinking coffee…\n...switching to things like herbal teas instead because they think it’s healthier? But \nthat’s not really to do with technology, it’s more cultural. Anyway, for part two I’m \ncomparing two instant coffee companies, CoffeeNow and Shaffers, and I’ve made this \ntable of products.\nRight. Let’s see...so you’ve got the brand names, and prices and selling size, and \ndescriptions. OK, the table looks good, you’ll get marks for research there. Where \nwill it go?\nIn the section on the marketing mix, under ‘Product’\nNot in the appendix?\nNo.\nOK, but it’s too factual on its own, you need to add some comment in that section \nabout the implications of the figures.(Q23)\n\nIELTS THANH LOAN\nLeo:\nAnna: \nLeo: \nAnna: \nLeo: \nAnna: \nLeo: \nAnna: \nLeo: \nRight, I’ll do that. Now I want to say that I think that Shaffers is more of a followers \nthan a leader in the coffee industry. Now, I’m putting that in the section on market \nshare. Does that seem OK?\nLet’s see...so you’ve begun by explaining what market share is, that’s important, but \nyou’re got to be careful how you give that opinion.\nDo you think it should go in another section?\nWell, it’s fine where it is but you’ve got to back it up with some data (Q24) or they’ll \nsay your report lacks weight.\nOK. One thing I’m worried about it finding anything original to say.\nWell, since this is your first marketing report, you’re not expected to go out and do \ninterviews and things to collect your own data, you’re just using published data. So \nthe analysis you do might not throw up anything that people didn’t throw before. But \nthe focus is more on how you handle the data - I mean, you might take some like a \ngraph of sales directly from a website, but what makes your work original is the \nperspective you provide by your interpretation of it.(Q25)\nOh. You know, it’s all so different from business studies assignments at school. It’s \nreally surprised me.\nWhat, how much research you have to do?\nI expected that. It’s more...I knew exactly what I had to do to get a good grade at \nschool - and I knew I’d be expected to go more deeply into things here, but I haven’t \ngot information on how the lecturer is going to grade my work (Q26) - what he’s \nlooking for.\nIELTS Thanh Loan\n444\n\nIELTS THANH LOAN\nVocabulary:\n- economic (adj): (thuộc) kinh tế\nMeaning: connected with the trade, industry and development of wealth of a \ncountry, an area or a society\n- technological (adj):  thuộc công nghệ, thuộc công nghệ học\nMeaning: connected with technology\n- percolator (noun): bình lọc; bình pha cà phê; máy chiết ngâm\nMeaning: a pot for making coffee, in which boiling water is forced up a central tube \nand then comes down again through the coffee\n- movement (noun): sự chuyển động, sự vận động, sự cử động, sự hoạt động\nMeaning:  an act of moving the body or part of the body\n- herbal (adj): (thuộc) cỏ, (thuộc) thảo mộc\nMeaning: connected with or made from herbs\n- implication (noun): sự lôi kéo vào; sự liên can, sự dính líu; ẩn ý, điều ngụ ý; điều \ngợi ý\nMeaning:  a possible effect or result of an action or a decision\n- publish (verb): công bố; ban bố\nMeaning:  to produce a book, magazine, CD-ROM, etc. and sell it to the public\n- interpretation (noun): sự giải thích, sự làm sáng tỏ\nMeaning: the particular way in which something is understood or explained\nIELTS Thanh Loan\n445"}, {"id": "EX12", "title": "Living alone", "page": 19, "image": "assets/images/source_p19.jpg", "audio": "assets/audio/MCQ_12.mp3", "source": "Listening for IELTS", "questions": [{"nums": [9, 10], "text": "Which TWO points does the lecturer give as disadvantages of living alone?", "options": {"A": "People living alone will need help from the community", "B": "It is more likely to foster a fragmented population", "C": "It creates an accommodation shortage", "D": "It is more expensive for an individual to live alone", "E": "People may have children too late"}, "answers": ["B", "D"], "why": "The lecturer mentions a more isolationist, less community-based society and the disproportionate expense borne by one wage.", "wrong": "Housing availability is set aside rather than presented as the selected disadvantage; A and E are not stated.", "multi": true}], "transcript": "Lastly, an increasing number of people are choosing to live alone. The number \nof people living alone in Britain has more than doubled in the last twenty years. \nIn 1990 just over four million people lived alone. Now this figure has reached 8.5 \nmillion, an incredibly rapid growth which has had enormous effects on the \ntraditional nuclear family. This number represents a great chunk of the \npopulation who either by choice or necessity, are outside the traditional family \nunit. Some think that these changes may not help the community. In fact, there \nare many arguments that this rise in alternative household structures will create \na more isolationist and less community-based society, where close bonds \nwhich are usually formed within the family have no place. Leaving aside whether \nor not the housing even exists for this boom, an important factor which must be \nlooked at is the disproportionate expense for those living on their own, By \nthis I mean, the burden of all costs is shouldered by one wage instead of two, \nand of course one person is using the energy which could be shared between a \ngroup, having a greater impact on the environment too.\nHowever, on a more positive note, people, especially women, are proving…\nQ9\nQ10\n\nIELTS THANH LOAN\nVocabulary:\n- isolationist (adj): (chính trị) người theo chủ nghĩa biệt lập\nMeaning: connected with the policy of not becoming involved in the affairs of other \ncountries or groups\n- disproportionate (adj): không cân đối\nMeaning:  too large or too small when compared with something else\n- expense (noun): sự tiêu; phí tổn\nMeaning: the money that you spend on something\n- burden (noun): gánh nặng\nMeaning: a duty, responsibility, etc. that causes worry, difficulty or hard work\nIELTS Thanh Loan\n447"}, {"id": "EX13", "title": "Food Waste", "page": 20, "image": "assets/images/source_p20.jpg", "audio": "assets/audio/MCQ_13.mp3", "source": "The official guide to IELTS", "questions": [{"num": 21, "text": "What point does Robert make about the 2013 study in Britain?", "options": {"A": "It focused more on packaging than wasted food", "B": "It proved households produced more waste than restaurants", "C": "It included liquid waste as well as solid waste"}, "answer": "C", "why": "Robert notes the study investigated wasted milk and soft drinks as well as food.", "wrong": "Packaging was excluded, and restaurants were not included, so no household-versus-restaurant proof was made."}, {"num": 22, "text": "Food waste reports should emphasise the connection between carbon dioxide emissions and", "options": {"A": "food production", "B": "transport of food to landfill sites", "C": "distribution of food products"}, "answer": "A", "why": "They say reports often omit the fuel used by farms and factories to produce food.", "wrong": "Transport is already commonly discussed; the missing key cause is production."}, {"num": 23, "text": "Television programmes now tend to focus on", "options": {"A": "the nutritional value of food products", "B": "the origin of food products", "C": "the chemicals found in food products"}, "answer": "B", "why": "They discuss programmes focusing on where meat, fruit and vegetables are sourced from.", "wrong": "Nutrition/additives are associated with magazine articles, not the TV focus described."}, {"num": 24, "text": "For Anna, the most significant point about food waste is", "options": {"A": "the moral aspect", "B": "the environmental impact", "C": "the economic effect"}, "answer": "C", "why": "Anna’s main concern is that in a recession governments should encourage businesses to cut costs.", "wrong": "They deliberately avoid repeating environmental/farming material; the moral issue is not her stated priority."}, {"num": 25, "text": "Anna and Robert decide to begin their presentation by", "options": {"A": "handing out a questionnaire", "B": "providing statistical evidence", "C": "showing images of wasted food"}, "answer": "A", "why": "They choose a set of questions for students to answer.", "wrong": "They explicitly avoid starting with statistics and prefer the questions to landfill images."}], "transcript": "Anna:\nRobert:\nAnna: \nR: \nA:\nR: \nA: \nR: \nA: \nR: \nA: \nR: \nA: \nR: \nIELTS Thanh Loan\n448\nExercise 13:  \n24. C\n25. A\nHi, Robert.\nHi. Sorry I’m late. I was just printing off some pages about food waste in Britain.\nDo you want to include Britain in the presentation? I thought we were \nconcentrating on the USA?\nWell, it is a global problem, so I thought we ought to provide some statistics that \nshow that.\nFair enough. What did you find out?\nWell, I was looking at a British study from 2013. It basically concluded that 12 \nbillion pounds’ worth of food and drink was thrown away each year - all of it ending \nup in landfill sites. Over eight million tons - and that wasn’t including packaging.\nAn incredible amount.\nYes, and they were only looking at what households threw away, so there’s no \ninformation about restaurants and the catering industry. But one thing the study did \ninvestigate was the amount of milk and soft drinks that were wasted, (Q21) and I \nthink it was probably quite unique in that respect.\nInteresting. You know. in the other European reports I’ve read - there’s one thing \nthey have in common when they talk about carbon dioxide emissions.\nI know what you are going to say. They never refer to the fuel that farms and \nfactories require to produce the food, and the carbon dioxide that releases?\nExactly. We could really cut down on carbon emissions if less food was supplied in \nthe first place. (Q22) To my mind, the reports talk too much about the carbon \ndioxide produced by the trucks that deliver the fresh goods to the shops and take the \nwaste away. They forget about one of the key causes of carbon dioxide.\nAbsolutely. If the reports are actually going to be useful to people, they need to be \nmore comprehensive.\nWho do you mean by ‘people’?\nWell, the government, industries...people making television programmes. Have you \nseen any documentaries about food waste?\n\nIELTS THANH LOAN\nA: \nR: \nA: \nR: \nA: \nR: \nA:\nR:\nA: \nR:\nA: \nNot that I remember.\nMy point exactly. These days they all seem to be focusing on where your meat, fruit and \nvegetables are sourced from. (Q23) We’re being encouraged to buy locally, not from \noverseas. That’s probably a good thing but I’d still like to see something about waste.\nYes, it’s the same with magazine articles - it’s all about fat and sugar content and the \nkind of additives and colouring in food -  but nothing about how it reaches your table and \nwhat happens after it ends up in the bin.\nWell, we’ve only got 15 minutes for this presentation, so I think we’ll have to limit what \nwe say about the consequences of food waste. What do we want to concentrate on?\nWell, I know some of the other presentations are looking at food and farming methods \nand what they do to the environment, so I think we’ll avoid that. And the fact that in some \ncountries, people can’t afford the food grown on their own farms - that was covered last \nterm.\nOK. We don’t want to repeat stuff.\nWhat concerns me above all else is that in a recession governments should be \nencouraging business to find ways to cut costs. (Q24) Apparently supermarkets in the \nUSA lose about 11% of their fruit to waste. That’s throwing money away.\nAll right - we’ll focus on that problem. It should get the other’s attention, anyway. Now, \nhow do you want to begin the presentation? Let’s not start with statistics though because \nthat’s what everybody does.\nI agree. How about we give the other students a set of questions to answer (Q25) - about \nwhat they suspect they waste every day?\nI’m fine with that. Probably a better option than showing pictures of landfill sites. It’ll be \nmore personalised, that way.\nAll right, now let’s start…\nIELTS Thanh Loan\n449\n\nIELTS THANH LOAN\nVocabulary:\n- statistic (noun): thống kê\nMeaning:  a collection of information shown in numbers\n- landfill (noun): bãi rác\nMeaning:  an area of land where large amounts of waste material are buried under \nthe earth\n- investigate (verb): điều tra nghiên cứu\nMeaning:  to carefully examine the facts of a situation, an event, a crime, etc. to find \nout the truth about it or how it happened\n- comprehensive (adj): bao hàm toàn diện\nMeaning: including all, or almost all, the items, details, facts, information, etc., that \nmay be concerned\n- consequence (noun): hậu quả, kết quả\nMeaning:  a result of something that has happened\n- concentrate (verb): tập trung\nMeaning:  to give all your attention to something and not think about anything else\n- recession (noun): sự lùi lại, sự thụt lại\nMeaning:  a difficult time for the economy of a country, when there is less trade and \nindustrial activity than usual and more people are unemployed\n- suspect (verb): nghi, ngờ, nửa tin nửa ngờ\nMeaning: to have an idea that something is probably true or likely to happen, \nespecially something bad, but without having definite proof\nIELTS Thanh Loan\n450"}, {"id": "EX14", "title": "College computer system", "page": 21, "image": "assets/images/source_p21.jpg", "audio": "assets/audio/MCQ_14.mp3", "source": "The official guide to IELTS", "questions": [{"num": 21, "text": "Dave Hadley says that the computer system has", "options": {"A": "too many users", "B": "never worked well", "C": "become outdated"}, "answer": "C", "why": "The system is over ten years old and no longer suits current work.", "wrong": "It worked fine when introduced; user numbers are context, not the selected diagnosis."}, {"num": 22, "text": "The main problem with the computer system is that it", "options": {"A": "is too slow", "B": "stops working", "C": "displays incorrect data"}, "answer": "A", "why": "It takes ages to move from one screen to the next.", "wrong": "It can look crashed, but is actually slow; incorrect data is not stated."}, {"num": 23, "text": "Timetabling has become an issue because", "options": {"A": "there is not enough time for anyone to do it", "B": "the system does not handle course options", "C": "the courses are constantly changing"}, "answer": "B", "why": "Many courses now have options, which the system does not properly support.", "wrong": "Time pressure exists but is not the structural reason; constant course changes are not stated."}, {"num": 24, "text": "To solve timetabling issues, Randhir suggests that", "options": {"A": "students should create their own timetables", "B": "Dave should have someone assist him", "C": "the number of courses should be reduced"}, "answer": "A", "why": "Randhir proposes an online system where students work out schedules themselves.", "wrong": "An assistant is mentioned as impossible; reducing courses is not proposed."}, {"num": 25, "text": "Randhir says that a new system may", "options": {"A": "need to be trialled", "B": "still have problems", "C": "be more economical"}, "answer": "C", "why": "He says a new system may save money in the long run.", "wrong": "Trialling and persistent problems are not the point he makes."}, {"num": 26, "text": "Improving the existing system will take", "options": {"A": "a few weeks", "B": "four to five months", "C": "nine months"}, "answer": "B", "why": "From January, the estimate for improving it is April or May—roughly four to five months.", "wrong": "A is too short; nine months is for a completely new system."}], "transcript": "Randhir: \nDave: \nR: \nR: \nD: \nR: \nD: \nR: \nD: \nR: \nD: \nR: \nD: \nR: \nD: \nIELTS Thanh Loan\n451\nExercise 14:  \n24. A\n25. C\n26. B\nHello - I’m Randhir Ghotra from the technologies department\nAh yes. Good. I’m Dave Hadley. Thanks for coming to see me.\nThat’s right. Um, I’m responsible for student admissions to the college and I use \na computer system to help process student enrolments and to do the time \ntabling. Bit it really doesn’t suit the way we work these days. It’s over ten years old \n(Q21) and although it was fine when it was first introduced, it is just not good \nenough now.\nOK - what problems are you experiencing?\nWell, 20 years ago, the college was quite small and we didn’t have the numbers of \nstudents or tutors that we have now.\nSo the system can’t handle the increasing volumes…\nWell, there’s a lot more data now and it sometimes seems the system has crashed \nbut, in fact, it just takes ages to go from one screen to the next.(Q22)\nRight. Is that the only problem?\nWell that’s the main one, but there are others. In the past, doing the timetabling \nwas quite simple but now we have a lot more courses and what’s made it \ncomplicated is that many of them have options.(Q23)\nRight - but the system should allow you to include those.\nWell no, it doesn’t. It was supposed to - and a few years ago we did ask someone \nfrom the technologies department to fix it, but they never seemed to have the time.\nHmm...are there any other issues with the system?\nWell - I’ve been given extra responsibilities and so I have even less time to do \nthe timetabling. If there was anything you could do, Randhir, to make the process \nmore efficient, that would be really helpful.\nWell it sounds like you could do with an assistant but that’s obviously not possible, \nso what about having an online system that students can use to do their \nscheduling?\nHow would that work?\n\nIELTS THANH LOAN\nR: \nD:\nR: \nD: \nR:\nD: \nR: \nVocabulary:\n- admission (noun): sự nhận vào, sự thu nạp vào; sự kết nạp\nMeaning: the act of accepting somebody into an institution, organization, etc.; the \nright to enter a place or to join an institution or organization\n- enrolment (noun): sự kết nạp hoặc được kết nạp\nMeaning: the act of officially joining a course, school, etc.; the number of people who \ndo this\n- responsibility (noun): trách nhiệm; sự chịu trách nhiệm; bổn phận; nghĩa vụ\nMeaning: a duty to deal with or take care of somebody/something, so that you may \nbe blamed if something goes wrong\n- schedule (noun): kế hoạch làm việc, tiến độ thi công;\nMeaning: a plan that lists all the work that you have to do and when you must do \neach thing\n- estimate (verb): đánh giá; ước lượng\nMeaning: a judgement that you make without having the exact details or figures \nabout the size, amount, cost, etc. of something\nIELTS Thanh Loan\n452\nWell - it may mean less choice for students but we could create a fixed schedule of all the \ncourses and options and they could then view what was available…\n….and work it out for themselves  (Q24) - that sounds great.\nOK, so ...um… we’ll need to decide whether or not to improve the existing system or to \nbuild a completely new system.\nWell I’d much prefer to have a new system. Quite frankly, I’ve had enough of the old one.\nOK - that’ll probably take  longer although it may save you money in the long run. (Q25) \nWhen were you hoping to have this in place?\nWell it’s January now and the new intake of students will be in September. We need to \nstart processing admissions - in the next few weeks really\nWell it will take more than a few weeks. I’m afraid. As an initial estimate I think we’ll \nbe looking at April or May (Q26) to improve the existing system but for a new system it \nwould take at least nine months. That would be October at the earliest."}, {"id": "EX15", "title": "Furniture Rossi case study", "page": 22, "image": "assets/images/source_p22.jpg", "audio": "assets/audio/MCQ_15.mp3", "source": "The official guide to IELTS", "questions": [{"num": 21, "text": "Why has James chosen Furniture Rossi?", "options": {"A": "It has enjoyed global success", "B": "It is still in a developmental phase", "C": "It is a foreign company being rebranded for Australia"}, "answer": "B", "why": "James chose it because it is going through a transition and plans to expand globally.", "wrong": "It has not yet achieved global success and is an Australian company."}, {"num": 22, "text": "Why did Luca Rossi start a furniture company?", "options": {"A": "Furniture-making was already a family occupation", "B": "Rossi saw a need for hand-crafted furniture", "C": "His previous work was unrewarding"}, "answer": "A", "why": "His grandfather and father were furniture craftsmen and Luca wanted to continue the tradition.", "wrong": "The other motives are not given as the key reason."}, {"num": 23, "text": "What gave Furniture Rossi a competitive advantage?", "options": {"A": "its staff", "B": "its lower prices", "C": "its locally sourced products"}, "answer": "A", "why": "Employees were strongly focused on good customer service.", "wrong": "Prices were high; rivals also used Australian wood."}, {"num": 24, "text": "What does the tutor recommend for the second draft?", "options": {"A": "Provide more detailed references", "B": "Check written accuracy", "C": "Add his own views"}, "answer": "C", "why": "The tutor wants more of James’s opinion and critical thinking.", "wrong": "Referencing and language accuracy are already described positively."}, {"num": 25, "text": "What was wrong with James’s last presentation?", "options": {"A": "It was too short", "B": "It focused too much on statistics", "C": "There was not enough interaction"}, "answer": "B", "why": "James agrees he concentrated too much on figures/financial data.", "wrong": "Length and interaction are not identified as the problem."}], "transcript": "Tutor: \nJames: \nTutor: \nJames: \nTutor: \nJames: \nTutor: \nJames: \nTutor: \nIELTS Thanh Loan\n453\n24. C\n25. B\nWell James, I’ve had a look over your case study and for a first draft, it looks \npromising.\nI have to be honest, when you told us we had to write about a furniture company, \nit didn’t  sound like the kind of thing that would interest me, but since then, I’ve \nchanged my mind.\nWhy’s that?\nWell, as you know, Furniture Rossi is an Australian company, still comparatively \nsmall compared to some of the high street stores but it's got plans to expand into \nforeign markets. So I chose it for that reason. It's going through a transition (Q21) \n- it's a family-run business aiming to build a global brand.\nAll right, and you've made that clear in your writing. One thing though that I think \nyou've overlooked is why Luca rossi started a furniture company here in Australia \nin the first place.\nWell he just got an arts degree, haven't he? And people were trying to talk him into \nan academic profession but he wanted a practical job - something he thought would \nbe more satisfying in the long run. His grandfather had been a craftsman. He'd \nmade furniture in Italy and he'd passed this skill on to Luca’s father, and well, \nLucas thought he'd like to continue the tradition.(Q22)\nYes, that was the motivation behind his decision. And what was it, do you think, \nthat gave Furniture Rossi a competitive edge over other furniture companies?\nI wouldn't think it was price. It's always been at the higher end of the market, but \naccording to my research, it was to do with the attitude of the employees (Q23) they \nwere really focused on giving good customer service.\nYes, Luca Rossi insisted on that. Their promotional campaigns also emphasised the \nfact that the would only came from Australian forests, but that was the case with \ntheir rivals, too so it wouldn't have made them stand out. OK, we'll have a careful \nlook at the content of  your case study in a minute, but i just want to make a general \ncomment first, before you start writing your second draft.\n\nIELTS THANH LOAN\nJames:\nTutor: \nJames: \nTutor: \nJames: \nTutor:\nJames: \nTutor: \nJames:\nTutor: \nIELTS Thanh Loan\n454\nOK\nYes, what I’d like to see more of is your opinion, (Q24) a bit more critical thinking \nrather than the bare facts. But it's good to see you've been careful with your \nreferencing this time \nThanks. And I read and re-read my work so I'm pretty sure there aren't a
