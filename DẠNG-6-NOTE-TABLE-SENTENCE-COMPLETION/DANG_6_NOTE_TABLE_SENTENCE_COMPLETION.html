ne{display:grid;grid-template-columns:40px 1fr;gap:10px}.qbadge{width:31px;height:31px;border:1px solid #aaa;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800}.answer-input{max-width:440px}.side{position:sticky;top:70px;align-self:start;padding:14px}.side .btn{width:100%;margin:5px 0}.review{display:none;padding:18px 20px}.review.open{display:block}.review-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin:9px 0}.review-item.good{border-left:5px solid var(--good)}.review-item.bad{border-left:5px solid var(--bad)}.evidence,.tip{background:#eef5f1;border-left:4px solid var(--accent);padding:10px;border-radius:7px}.accordion{border:1px solid var(--line);border-radius:9px;margin-top:12px;overflow:hidden}.acc-btn{width:100%;border:0;padding:12px;text-align:left;font-weight:800}.acc-body{display:none;padding:14px;white-space:pre-wrap}.acc-body.open{display:block}.knowledge-pane{padding:20px;margin-top:18px}.knowledge-tabs{display:flex;gap:8px;flex-wrap:wrap}.knowledge-tabs button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff}.knowledge-tabs .active{background:var(--accent);color:#fff}.progressbar{height:9px;background:#e8ece9;border-radius:99px;margin-top:15px;overflow:hidden}.progressbar span{display:block;height:100%;background:var(--accent)}.pill{font-size:12px;background:#eef1ef;padding:4px 8px;border-radius:99px}.score,.source-note,.mini-status{font-size:13px;color:var(--muted)}.task-actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,1fr)}.exercise-wrap{grid-template-columns:1fr}.side{position:static}.student{grid-template-columns:1fr 1fr}}@media(max-width:620px){.shell{padding:10px}.home-grid,.student{grid-template-columns:1fr}.source-figure{padding:10px}.task-head,.audio-box,.questions,.task-actions,.review{padding-left:12px;padding-right:12px}.source-figure img{width:100%;height:auto;max-width:100%;object-fit:c </style></head><body><header class="topbar"><div class="brand">IELTS Listening Practice<small>Dạng 6 • Note / Table / Sentence Completion</small></div><button class="btn" id="homeBtn">← Lesson Home</button></header><main class="shell"><section id="homePage" class="page active"><div class="hero"><h1>DẠNG 6: NOTE / TABLE / SENTENCE COMPLETION</h1><p>Học kiến thức trước, sau đó chọn Exercise. Tiến độ được lưu tự động trên thiết bị.</p><div class="student"><div class="field"><label>HỌ VÀ TÊN</label><input id="studentName"></div><div class="field"><label>LỚP</label><input id="studentClass"></div><div class="field"><label>MÃ HS</label><input id="studentId"></div></div><div class="progressbar"><span id="overallBar"></span></div><p id="overallText" class="score"></p></div><div class="home-grid" id="homeGrid"></div></section><section id="knowledgePage" class="page"><div class="hero"><h1>KIẾN THỨC CẦN HỌC</h1><p>Bám sát phần lý thuyết Dạng 6 trong tài liệu nguồn.</p></div><div class="knowledge-pane"><div class="knowledge-tabs" id="knowledgeTabs"></div><div id="knowledgePane" style="margin-top:15px"></div></div></section><section id="exercisePage" class="page"><div id="exerciseMount"></div></section></main><script>const DATA={"courseId": "IELTS_LISTENING_FOUNDATION", "unitId": "DANG6", "lessonId": "NOTE_TABLE_SENTENCE_COMPLETION", "version": "6.0", "endpoint": "https://script.google.com/macros/s/AKfycbzCX-jRyn28wS8lEQ-wtdM8qspFr-Ptj1c2r3ctxpi3hseVZ1UMBE8N4jXAx1-03pLn/exec", "exercises": [{"id": "EX01", "title": "Preston Park Run", "type": "Note / Table / Sentence Completion", "instruction": "Questions 1-6 Complete the notes below Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer • Questions 7-10 Complete the notes below Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer", "audio": "assets/audio/NTS_01.mp3", "source": "The official guide to IELTS", "images": ["assets/images/ex01_p1.jpg", "assets/images/ex01_p2.jpg"], "questions": [{"id": "q1", "displayNum": 1, "label": "Blank 1 - complete the corresponding blank in the source task shown above.", "answer": "cafe", "accepted": ["cafe"], "explanation": "The answer key gives “cafe”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "cafe", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q2", "displayNum": 2, "label": "Blank 2 - complete the corresponding blank in the source task shown above.", "answer": "9 am", "accepted": ["9 am", "9", "nine am", "9 o’clock"], "explanation": "The answer key gives “9 am”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "9 am", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q3", "displayNum": 3, "label": "Blank 3 - complete the corresponding blank in the source task shown above.", "answer": "5 km", "accepted": ["5 km", "5", "five km", "5 kilometres", "5 kilometers"], "explanation": "The answer key gives “5 km”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "5 km", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q4", "displayNum": 4, "label": "Blank 4 - complete the corresponding blank in the source task shown above.", "answer": "bar code", "accepted": ["bar code", "barcode"], "explanation": "The answer key gives “bar code”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "bar code", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q5", "displayNum": 5, "label": "Blank 5 - complete the corresponding blank in the source task shown above.", "answer": "website", "accepted": ["website"], "explanation": "The answer key gives “website”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "website", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q6", "displayNum": 6, "label": "Blank 6 - complete the corresponding blank in the source task shown above.", "answer": "1.50", "accepted": ["1.50"], "explanation": "The answer key gives “1.50”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "1.50", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q7", "displayNum": 7, "label": "Blank 7 - complete the corresponding blank in the source task shown above.", "answer": "M-A-U-G-H-A-N", "accepted": ["M-A-U-G-H-A-N"], "explanation": "The answer key gives “M-A-U-G-H-A-N”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "M-A-U-G-H-A-N", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q8", "displayNum": 8, "label": "Blank 8 - complete the corresponding blank in the source task shown above.", "answer": "01444 732 900", "accepted": ["01444 732 900"], "explanation": "The answer key gives “01444 732 900”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "01444 732 900", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q9", "displayNum": 9, "label": "Blank 9 - complete the corresponding blank in the source task shown above.", "answer": "guiding", "accepted": ["guiding"], "explanation": "The answer key gives “guiding”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "guiding", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q10", "displayNum": 10, "label": "Blank 10 - complete the corresponding blank in the source task shown above.", "answer": "taking photos", "accepted": ["taking photos", "taking photographs"], "explanation": "The answer key gives “taking photos”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "taking photos", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "A: Good morning – Dave Speaking\nB: Hi – could I speak to the organizer of the Preston Park Run?\nA: Yes that’s me.\nB: Great – um – I was taking to some friends of mine about the run and they \nsuggested I contact you to get some more details.\nA: Sure – what would you like to know?\nB: Well – they said it takes place every Saturday, is that right?\nA: Yes, it does.\nB: OK – great.\nA: Do you know where the park is?\nB: Oh yes – I’ve been there before. But it’s quite big and I’m not sure where to go\nA: Well there’s a circular track that goes right around the park. The run starts at \nthe café, goes past the tennis court then twice around the lake and finishes back \nwhere it started.\nB: OK, and what time is the run?\nA: Well, the actual run begins at 9 am but the runners start arriving at about 8.45\nB: OK – so I need to get up early Saturday morning then. And how long is the run?\nA: Well it used to be three kilometres but most people wanted to do a bit more than \nthat so we lengthened it to five kilometres  – we now go round the lake twice and \nthat adds an extra two kilometres.\nB: Right – not sure I’ve ever run that far so I’d better start doing a bit of training.\nA: That’s a good idea. But it’s not a race, it’s really just for fun and the best thing \nwould be to take it easy the first few times you do it and then see if you can gradually \nimprove your time.\n6. 1.50 \n7. M-A-U-G-H-A-N\n8. 01444 732 900\n9. guiding \n10. taking photos/ photographs \n\nIELTS THANH LOAN\n \n \n \n \n\nB: Is the run timed then? How do I know how well I’ve done?\nA: When you cross the finish line you’ll be given a bar code and you take this to one \nof the run volunteers, who will scan it. Then you can get your time online when you \ngo home.\nB: Oh – I see. You collect all the results.\nA: Exactly.\nB: I see – that’s great. So how do I register?\nA. Well there are several ways. I could take your details over the phone but it’s \nmuch easier if you do it using the website \nB: OK – good. Um, I think that’s probably all I need to know for now. Oh yes, does \nit cost anything to register or do you collect money each week?\nA: Well it doesn’t cost anything to register but we do charge for the run. In fact we \nhave just increased the charge to 1.50 pounds. It used to be a pound but because \nwe were making a bit of a loss we have had to increase it by 50P.\nB: OK thanks. I think I have enough information on taking part in the run.\n(pause)\nB: Um – you mentioned volunteers. I have a friend who is interested in helping out. \nCan you give me some details so I can pass them on to her?\nA: Sure – well you need to ask your friend to contact Pete Maughan. He manages \nall the volunteers.\nB: OK – I didn’t quite catch his surname – was it Morn – M-O-R-N?\nA: No – just a bit more complicated – it’s M-A-U-G-H-A-N \nB: Right – thanks. and could you give me his phone number?\nA: Yes – just a moment. It’s here somewhere – let me just find it. Ah I’ve two \nnumbers for him. I think the one that begins 0-1-2-7-3 is an old one so use this one: \nit’s 0-1-4 double 4-7-3-2-9- double zero.\nB: OK – got that. Can you tell me anything about the volunteering? Like what kind \nof activities it involves?\nA: Sure – well we need volunteers for basic stuff like setting up the course. We \nhave to do that before all the runners arrive.\nB: OK – so that’s a really start!\nA: Yes that’s right. But if your friend would prefer to arrive a bit later she can also \nhelp with guiding the runners so they don’t go the wrong way.\nB: I see. I believe you do a report on some of the races\nA: Yes that’s right. In fact we do a weekly report on each race and we always try \nto illustrate it.\nQ4\nQ5\nQ6\nQ7\nQ8\nQ9\n\nIELTS THANH LOAN", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX02", "title": "Short Story Competition", "type": "Note / Table / Sentence Completion", "instruction": "Questions 1-6 Complete the notes below Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer • Questions 7-10 Complete the sentences below Write NO MORE THAN TWO WORDS for each answer", "audio": "assets/audio/NTS_02.mp3", "source": "The official guide to IELTS", "images": ["assets/images/ex02_p1.jpg"], "questions": [{"id": "q1", "displayNum": 1, "label": "Blank 1 - complete the corresponding blank in the source task shown above.", "answer": "3000 words", "accepted": ["3000 words", "3 thousand words"], "explanation": "The answer key gives “3000 words”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "3000 words", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q2", "displayNum": 2, "label": "Blank 2 - complete the corresponding blank in the source task shown above.", "answer": "surprise ending", "accepted": ["surprise", "surprise ending", "surprising ending"], "explanation": "The answer key gives “surprise ending”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "surprise ending", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q3", "displayNum": 3, "label": "Blank 3 - complete the corresponding blank in the source task shown above.", "answer": "16", "accepted": ["16", "sixteen"], "explanation": "The answer key gives “16”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "16", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q4", "displayNum": 4, "label": "Blank 4 - complete the corresponding blank in the source task shown above.", "answer": "August", "accepted": ["August"], "explanation": "The answer key gives “August”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "August", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q5", "displayNum": 5, "label": "Blank 5 - complete the corresponding blank in the source task shown above.", "answer": "COMP4SS", "accepted": ["COMP4SS"], "explanation": "The answer key gives “COMP4SS”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "COMP4SS", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q6", "displayNum": 6, "label": "Blank 6 - complete the corresponding blank in the source task shown above.", "answer": "post", "accepted": ["post", "post the story"], "explanation": "The answer key gives “post”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "post", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q7", "displayNum": 7, "label": "Blank 7 - complete the corresponding blank in the source task shown above.", "answer": "famous authors", "accepted": ["famous authors"], "explanation": "The answer key gives “famous authors”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "famous authors", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q8", "displayNum": 8, "label": "Blank 8 - complete the corresponding blank in the source task shown above.", "answer": "online", "accepted": ["online"], "explanation": "The answer key gives “online”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "online", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q9", "displayNum": 9, "label": "Blank 9 - complete the corresponding blank in the source task shown above.", "answer": "public", "accepted": ["public"], "explanation": "The answer key gives “public”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "public", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q10", "displayNum": 10, "label": "Blank 10 - complete the corresponding blank in the source task shown above.", "answer": "Spain", "accepted": ["Spain"], "explanation": "The answer key gives “Spain”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "Spain", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "A: Good morning. Dave speaking.\nB: Oh hi. I’m phoning about a short story completion. Um, I saw an advert in a magazine \nand I was just calling to get some details.\nA: Yes – certainly. I’m the competition organizer so I should be able to help. What kind of \ndetails are you looking for?\nB: Well – erm. – does it cost anything to enter?\nA: Yes – there’s an entry fee of five pounds. \nB: OK – that should be fine.\n(pause)\nB: It’s a short story completion – so how many words is that?\nA: Well – we want to give people a reasonable amount of freedom but the guidelines are \naround 3.000 words (Q1). \nB: Oh – that sounds quite a lot\nA: Well – it’s not as much as it used to be. We did have a limit of 5000 words but some people \nthought that was too many so this year we’ve reduced it.\nB: Right – and does the story need to be about anything in particular?\nA: No – you can write about any topic you like. But the main point of the competition is that \nit has to have surprise ending (Q2).\nB: Oh I see. That sounds interesting. I don’t think I’ve ever written a story like that before.\nA: Yes – it’s something we’ve introduced for this year’s competition. \nB: Right. Um – I’m eighteen. Is there any age limit?\nA: Yes – you need to be sixteen (Q3) or over, so if you’re eighteen that’s fine.\nB: Great. So you have the competition once a year. Is that right?\n\nExercise 2:  \n6. Post \n7. Famous authors \n8. Online \n9. Public \n10. Spain \n\nIELTS THANH LOAN\nA: Yes – we start advertising in January and the competition takes up a lot of the year. We \ngive people a few months to write their story and then it takes quite a long time to judge all \nthe entries and to announce the winners.\nB: I see. So when is the closing date for the competition? It’s already April – I hope I’m not \ntoo late.\nA: No you’ve still got plenty of time. You need to submit your entry by the 1st of August (Q4). \nAfter then it will be too late, although you can always enter next year’s competition!\nB: OK good. So how do I enter?\nA: Well we have a website and the best way to enter is to complete the entry form online. We \nalso have more details of the competition on the site. Shall I give you the web address?\nB: Yes please.\nA: OK – it’s www dot C-O-M-P-4-S-S (Q5) dot com. And that’s the number four not the world \nfour.\nB: OK – thanks. I’ve got that. So – I can complete the entry form online but how do I send the \nstory? Do I print it out and send it to you?\nA: Well you may want to print the story out so you can review it but don’t post (Q6) it to us. \nWhen you’ve finished your story you will need to email it to us. The email address is on the \nwebsite I gave you.\nB: OK – that’s fine. (pause) Um can you tell me a bit about how the competition is judged and \nwhat the prizes are?\nA: Yes of course. Well, once we have all the entries I send them to all the judges. Our \ncompetition is quite popular so we are lucky to be able to use famous authors (Q7) who are \nvery interested in the competition.\nB: That’s fantastic. It’s great to know that someone famous will be reading my story!\nA: Yes that’s right. It takes them quite a while to read through the entries but eventually they \ndecide on the top five stories.\nB: I see – and what happens then?\nA: Well, they will be published online (Q8) so everyone can read them. They will not be in \nany order at this point. They will just be the five stories that the judges think are the best.\nB: And do all the top five stories get prizes?\nA: No – it’s just the top story and the runner-up\nB: So how is the top story decided?\nA: Well once the top five stories are available, it will be the public (Q9) who will vote for their \nfavorite story.\nB: Right – I see. So I need to get all my friends to vote for me then!\n\nIELTS THANH LOAN\nA: Er, yes – that’s a good idea.\nB: And, what is the prize?\nA: Well, the runner-up gets a prize of 300 pounds, but the winner gets a trip to Spain (Q10) \nto attend a workshop for writers.\nB: Wow – that’s brilliant. I’d better get writing straight away\nA: Yes – good luck!\nB: Thanks.", "k abel": "Blank 4 - complete the corresponding blank in the source task shown above.", "answer": "August", "accepted": ["August"], "explanation": "The answer key gives “August”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "August", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q5", "displayNum": 5, "label": "Blank 5 - complete the corresponding blank in the source task shown above.", "answer": "instructions", "accepted": ["instructions"], "explanation": "The answer key gives “instructions”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "instructions", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q6", "displayNum": 6, "label": "Blank 6 - complete the corresponding blank in the source task shown above.", "answer": "55", "accepted": ["55"], "explanation": "The answer key gives “55”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "55", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q7", "displayNum": 7, "label": "Blank 7 - complete the corresponding blank in the source task shown above.", "answer": "beginners", "accepted": ["beginners"], "explanation": "The answer key gives “beginners”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "beginners", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q8", "displayNum": 8, "label": "Blank 8 - complete the corresponding blank in the source task shown above.", "answer": "Kahui", "accepted": ["Kahui"], "explanation": "The answer key gives “Kahui”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "Kahui", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q9", "displayNum": 9, "label": "Blank 9 - complete the corresponding blank in the source task shown above.", "answer": "battery", "accepted": ["battery"], "explanation": "The answer key gives “battery”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "battery", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q10", "displayNum": 10, "label": "Blank 10 - complete the corresponding blank in the source task shown above.", "answer": "show", "accepted": ["show"], "explanation": "The answer key gives “show”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "show", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "Woman:\nMan: \nWoman:\nMan: \nWoman:\nMan: \nWoman:\nMan: \nWoman:\nMan: \nWoman:\nMan: \nWoman:\nMan: \n\nExercise 3:  \n6. 55 \n7. beginners \n8. Kahui \n9. Battery \n10. Show \nHello. Eastwood Community Centre\nOh hello. My name’s Andrew Dyson. I’m calling about the evening classes you \noffer.\nOK, Mr. Dyson, are they any classes in particular that you’re interested in?\nYes, you’ve got a class called “Painting with watercolours”, I believe.\nThat’s right. It’s a popular class so this term it’ll be moving to the hall, so they’ve \ngot more room.\nRight. I know it’s on Tuesday but what time exactly?\nIt was 6.30 last term, but let me just have a look at the details. OK it’ll be 7.30 \n(Q1) this time, probably it suits more people.\nWell, it’s my wife who’s really interested and that’ll be good for her because \nshe’s home from work by 7.15 – that’ll give her just enough time to get there. Um, \nwhat does she need to bring?\nOK, well paints are provided by the tutor, I know that. Uh, the information says \nshe’ll need just a jar for water – and some pencils (Q2) for drawing. There are \nalso lots of aprons here, so she needn’t worry what she’s wearing. And the cost \nfor four classes is 45 pounds, including paints, as I said.\nOK, now we’re both quite keen on the Maori language class.\nThere are spaces on the next course, so you could join that.\nOh good. Which room will that be in?\nWhen you come in through the entrance of the community centre building, you’ll \nneed to go straight up the stairs in front of you, all the way to the top (Q3). And \nit’s the small room you’ll find there.\nI see. All right, and let me just check when it’s starting. I heard from someone \nthat the July course has been delayed until August (Q4)\n\nIELTS THANH LOAN\nWoman:\nMan: \nWoman:\nMan: \nWoman:\nMan: \nWoman:\nMan: \nWoman:\nMan: \nMan: \nWoman:\nMan:\nWoman:\nMan: \nWoman:\n \n\nI’m afraid so. And we’re halfway through the June course at the moment so \nthere’s not much point you taking that.\nI guess we’ll have to wait, then...\nWell, when you do come, the tutor recommends bringing a small recorder with \nyou just so you can listen again later, and er, the cost for five classes is currently \n40 pounds.\nOk, useful information to know. Um, there’s one more class I’m interested in – \nthat’s the digital photography class.\nOh I’ve taken that class myself. The tutor’s very good. That’ll be in room  9 and \nthat’s starting in two weeks’ time – in the evening – every Wednesday at 6 \no’clock.\nUm, obviously I need to bring the camera with me, I suppose it’d be useful to \nhave the instructions (Q5) that go with the camera, too.\nI’d say so. Um, some people bring along a lot of accessories like extra lenses, but \nthere’s really no need for this class. It’s mainly focus on composition really, and \ngetting the most out of the basic camera.\nThat’s exactly what I need. And how much does it cost?\nLet’s see. For four classes, it’s 35 pounds, but if you take eight, it works out as \n55 (Q6) pounds, so you’re making a bit of a saving – 15 pounds that is\nI see\n(pause)\nOK, now just another question for the watercolours class: I’ve just remembered \nthat my wife asked me to find out about the level – who’s it for?\nOK, well you don’t have to be very skilled or anything like that. It’s designed for \nbeginners (Q7), actually. People who might see art as a hobby rather than as a \nprofessional opportunity.\nThat sounds like my wife. And er, who do I talk to if I want to find out some more \nabout the Maori language classes?\nProbably best to talk to the tutor directly. He’ll be in the office in about half an \nhour. His name’s Jacson Kahui. That’s K-A-H-U-I (Q8) \nGood – I’ll give him a call\nOh, if you do decide to come to the photography class, don’t forget to look at \nyour camera battery (Q9) and make sure it’s charged. I know it sounds obvious \nbut I’ve seen a few people suddenly find the camera’s stopped working right in \nthe middle of class.\n\nIELTS THANH LOAN\nMan: \nWoman:", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX04", "title": "Accommodation Form: Rental Properties", "type": "Note / Table / Sentence Completion", "instruction": "Questions 1-10 Complete the notes below Write ONE WORD AND/OR A NUMBER for each answer", "audio": "assets/audio/NTS_04.mp3", "source": "The official guide to IELTS", "images": ["assets/images/ex04_p1.jpg"], "questions": [{"id": "q1", "displayNum": 1, "label": "Blank 1 - complete the corresponding blank in the source task shown above.", "answer": "208 613 2978", "accepted": ["208 613 2978"], "explanation": "The answer key gives “2 : "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q6", "displayNum": 6, "label": "Blank 6 - complete the corresponding blank in the source task shown above.", "answer": "fridge", "accepted": ["fridge"], "explanation": "The answer key gives “fridge”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "fridge", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q7", "displayNum": 7, "label": "Blank 7 - complete the corresponding blank in the source task shown above.", "answer": "school", "accepted": ["school"], "explanation": "The answer key gives “school”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "school", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q8", "displayNum": 8, "label": "Blank 8 - complete the corresponding blank in the source task shown above.", "answer": "950", "accepted": ["950"], "explanation": "The answer key gives “950”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "950", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q9", "displayNum": 9, "label": "Blank 9 - complete the corresponding blank in the source task shown above.", "answer": "quiet", "accepted": ["quiet"], "explanation": "The answer key gives “quiet”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "quiet", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q10", "displayNum": 10, "label": "Blank 10 - complete the corresponding blank in the source task shown above.", "answer": "friend", "accepted": ["friend"], "explanation": "The answer key gives “friend”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "friend", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "Agent: \nWoman:\nAgent: \nWoman:\nAgent: \nWoman:\nAgent: \nWoman:\nAgent: \nWoman:\nAgent: \nWoman:\nAgent: \nWoman:\nAgent: \nWoman:\n\nExercise 4:  \n6. fridge \n7. school \n8. 950\n9. quiet \n10. friend\nFairfield Rentals. Andrew Williams. How can I help you?\nOh hello. I’m calling from the UK – um, my family are moving to Canada early \nnext year, and we’re hoping to find somewhere to rent in Fairfield for the first six \nmonths while we settle in.\nRight, I see. Well let’s get your details.\nYes, my name’s Jane Ryder\nOk Jane, and can I have a phone number – the best number to get you on?\nWell, that’d probably be our home number – so 0044 for the UK, and then it’s \n2086132978 (Q1)\nAlright. And an email address, please, so we can send you out all the information \nand forms\nI think it’s best if I give you my husband’s email – he’s sitting in front of a \ncomputer all day so he can print stuff off and get it back to you sooner than I \ncould. It’s reichard@visiontech.co.uk . I’ll just spell the company name for you. \nThat’s V-I-S-I-O-N-T-E-C-H (Q2)\nGreat. And we have a question here about occupation\nRichard’s an IT specialist for an advertising company. They’re transferring him \nto their Fairfield branch.\nActually, just your job for now, thanks\nMe? I’m a doctor (Q3) at the hospital in our town\nOK, I’ll put that down. Now, what kind of accommodation are you looking for? \nHouse, apartment?\nan apartment, probably, as long as it has two bedrooms. There’ll be me, my \nhusband and our ten-year-old son\nAnd so with an apartment, you’re less likely to get a garden\nThat’s OK\n\nIELTS THANH LOAN\nAgent: \nWoman:\nAgent: \nWoman:\nAgent: \nWoman:\nAgent: \nWoman:\nAgent: \nWoman:\nAgent: \nWoman:\nAgent: \nWoman:\nAgent: \nWoman:\nAgent: \nWoman:\nAgent: \nWoman:\nAgent: \n\nBut what about a garage (Q4) – is that something you’ll want the apartment to \nhave?\nYes, that’s definitely important\nOK, just a moment. I’ll make a note of that\nBut – er before we go on – I should probably say now that what we don’t need is \nany furniture (Q5) – because we’ll be shipping all that over, and I don’t really \nwant to pay for storage while we’re waiting to buy a house\nNot a problem. I’ll make a note of that\nActually, though, just thinking about the kitchen, what can I expect form a rental \nproperty? I mean, what kind of equipment is provided?\nWell the normal thing is that you get a stove – I think that’s a cooker in British \nEnglish\nOK, good to know, but how about a fridge (Q6). We’ll be selling ours before we \ncome, so if possible, we’d like the apartment to have one for when we arrive\nI can certainly add that to the form. If there’s any other whiteware that you need \n– like a dishwasher for example, there are plenty of stores here that’ll arrange \ndelivery on the same day as purchase.\nThanks. Hopefully we won’t need to buy too many things. \nNow, how about location? Have you done any research into the Fairfield area?\nNot that much so far\nWell, you mentioned you have a boy – I imagine you’d like to be fairly close to a \nschool (Q7)\nGood idea. That would help. What’s public transport like in Fairfield? Is it easy \nto get around?\nThe bus service is pretty comprehensive – there are plenty of local routes, \nservices into the city and out of town\nOK, and for a two-bedroom apartment – what sort of rent should we except to \npay?\nWell, looking at properties we have at the moment, prices start from around 750 \npounds per months and – depending on the area – can go up to 1200 pounds\nThat’s too much. Something halfway would be better\nSo, would your limit be, say, 950 (Q8) pounds?\nI’d say so, yes\nCan I ask if you smoke or if you have any pets?\n\nIELTS THANH LOAN\nWoman:\nAgent: \nWoman:\nAgent:\nWoman:\n\nNo to both questions. But I do have one more request, please\nYes\nWell, I’ve also been offered a job – at Victoria General Hospital – and I suspect \nI’ll be working nights occasionally  - so what I really need from any apartment is \nfor it to be quiet (Q9) – so I can catch up on sleep if necessary during the day.\nCongratulations on the job offer. I’ll add your request to the form. Well, what I’ll \ndo is compile a list of suitable properties for you and send them via email. Um, \ncan I just ask  -how did you hear about us? Obviously not from our commercials \nif you’re living in the UK.\nActually, it was a friend (Q10) of ours. He spent a few months in Fairfield a \ncouple of years ago and he pointed us in the direction of your website\nWell, it’s good to be recommended. So what I’ll do is…\n\nIELTS THANH LOAN", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX05", "title": "Hostel accommodation in Darwin", "type": "Note / Table / Sentence Completion", "instruction": "Questions 1-6 Complete the table below Write NO MORE THAN ONE WORD AND/OR A NUMBER for each answer • Questions 7-10 Complete the notes below Write ONE WORD ONLY for each answer", "audio": "assets/audio/NTS_05.mp3", "source": "The official guide to IELTS", "images": ["assets/images/ex05_p1.jpg", "assets/images/ex05_p2.jpg"], "questions": [{"id": "q1", "displayNum": 1, "label": "Blank 1 - complete the corresponding blank in the source task shown above.", "answer": "unfriendly", "accepted": ["unfriendly"], "explanation": "The answer key gives “unfriendly”. Check the full transcript below to review the exact listening context and spelling.", "
