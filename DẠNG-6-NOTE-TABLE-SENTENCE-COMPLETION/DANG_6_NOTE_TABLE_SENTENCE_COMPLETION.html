accepted": ["shark"], "explanation": "The answer key gives “shark”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "shark", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q37", "displayNum": 37, "label": "Blank 37 - complete the corresponding blank in the source task shown above.", "answer": "teeth", "accepted": ["teeth"], "explanation": "The answer key gives “teeth”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "teeth", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q38", "displayNum": 38, "label": "Blank 38 - complete the corresponding blank in the source task shown above.", "answer": "messages", "accepted": ["messages"], "explanation": "The answer key gives “messages”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "messages", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q39", "displayNum": 39, "label": "Blank 39 - complete the corresponding blank in the source task shown above.", "answer": "meeting", "accepted": ["meeting"], "explanation": "The answer key gives “meeting”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "meeting", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q40", "displayNum": 40, "label": "Blank 40 - complete the corresponding blank in the source task shown above.", "answer": "escape", "accepted": ["escape"], "explanation": "The answer key gives “escape”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "escape", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "Well, good morning everyone. As you know, we’ve been looking at different kinds of \nart and craft that were practised by the Maori people of New Zealand - at least before \nthe Europeans began to arrive in the 18th century. So, the focus of this lecture is kite \nmaking; how the kites were made, their appearance and the purposes they served.\nWell, let's start with the way they were made. As with other Maori artistic traditions, \nkite-making involved certain rituals. So, firstly, only priests were allowed to fly and \nhandle the largest, most sacred kites. There were rules, too, for the size and scale of \nthe kites that the priests had to follow, and during the preparation of both small and \nlarge kites, food was strictly forbidden.\nIn terms of appearance, kites were frequently designed in the image of a native bird, \nor a Maori god, and sometimes, perhaps less often, a well-known hero. You can \nimagine that when Maori first arrived in the new country, in New Zealand, it may \nhave taken some time to find suitable materials for their kites — but through trial and \nerror no doubt, they found plants and trees that provided bark and even roots that \nthey could use to make the frames and wings of their kites. And after the frame had \nbeen constructed, the kite then had to be decorated. For this the priests used long \ngrasses, and these — when the kite was in the air would stream along behind it. They \nalso used a variety of feathers to add, um, colour to their creations. Well, all this \nmeant it was easy to see a kite in the sky but you could also ear Maori kites. They \ncould be quite noisy indeed, and this was because some priests liked to hang a long \nrow of shells from the kite. You can imagine how they’d rattle and clatter in the wind \n- how they might completely capture your attention. As I said before, the most \ncommon image was probably a bird, and that’s the same for other kite-making \ncultures, but the kites were designed in particular shapes — so there were kites that \nwere triangular, rectangular and also shaped like a diamond. And some of  them\nQ31\nQ32\nQ33\nQ34\nQ35\n36. shark \n37. teeth \n38. messages \n39. meeting \n40. escape \n\nIELTS THANH LOAN\n\nwere so large, it would actually require several men to operate them. Um, some of \nthe kites were also covered in patterns, and to make these patterns, the Maori used \ndifferent pigments of red and black, and these were either made from a charcoal \nbase or from red-brown clay which had been combined with oil obtained from a \nlocal species of shark.\nNow, before I forget, if you have a chance, do visit the Auckland Museum because \nthey have the last surviving “birdman” kite on display. This is the kind of kite that \nhas a wooden mask at the top of the frame — it’s a mask of a human head - and you \ncan clearly see it has a tattoo and also a set of teeth. Quite impressive - and a good \nexample of Maori craftsmanship and symbolism.\nRight, turning to the purpose and function of the kites, they certainly had multiple \nuses. Primarily, the flying of kites was a way of communicating with the gods and \nwhen the kites rose into the air, the Maori used them to deliver messages — perhaps \nrequesting a good harvest, good fortune in war, a successful hunting expedition. \nSo, these kites were incredibly valuable to a community - treasured objects that one \ngeneration would pass to the next. People would also fly kites for other reasons, for \nexample, to attract the attention of a neighbouring village. This_ was done when a \nmeeting was required between Maori elders — a convenient method, indeed. And \nfinally, when it comes to war, there are traditional stories that describe how when a \nMaori warrior found himself surrounded by his enemies, a kite could actually \nprovide the possibility of escape— the kites were powerful enough to take a man up \ninto the air; and for this reason, they could also be used to lower him into enemy \nfortiﬁcations so that an attack could begin from the inside.\nWell, I’m happy to say there seems to be a revival and growing interest in \nkite-making, and...\nQ36\nQ37\nQ38\nQ39\nQ40\n\nIELTS THANH LOAN", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX19", "title": "History of Fireworks in Europe", "type": "Note / Table / Sentence Completion", "instruction": "Questions 31-40 Complete the notes below Write ONE WORD ONLY for each answer", "audio": "assets/audio/NTS_19.mp3", "source": "The official guide to IELTS", "images": ["assets/images/ex19_p1.jpg"], "questions": [{"id": "q31", "displayNum": 31, "label": "Blank 31 - complete the corresponding blank in the source task shown above.", "answer": "religion", "accepted": ["religion", "religions"], "explanation": "The answer key gives “religion”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "religion", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q32", "displayNum": 32, "label": "Blank 32 - complete the corresponding blank in the source task shown above.", "answer": "nature", "accepted": ["nature"], "explanation": "The answer key gives “nature”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "nature", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q33", "displayNum": 33, "label": "Blank 33 - complete the corresponding blank in the source task shown above.", "answer": "flight", "accepted": ["flight"], "explanation": "The answer key gives “flight”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "flight", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q34", "displayNum": 34, "label": "Blank 34 - complete the corresponding blank in the source task shown above.", "answer": "stars", "accepted": ["stars"], "explanation": "The answer key gives “stars”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "stars", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q35", "displayNum": 35, "label": "Blank 35 - complete the corresponding blank in the source task shown above.", "answer": "practical", "accepted": ["practical"], "explanation": "The answer key gives “practical”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "practical", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q36", "displayNum": 36, "label": "Blank 36 - complete the corresponding blank in the source task shown above.", "answer": "education", "accepted": ["education"], "explanation": "The answer key gives “education”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "education", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q37", "displayNum": 37, "label": "Blank 37 - complete the corresponding blank in the source task shown above.", "answer": "king", "accepted": ["king"], "explanation": "The answer key gives “king”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "king", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q38", "displayNum": 38, "label": "Blank 38 - complete the corresponding blank in the source task shown above.", "answer": "entertainment", "accepted": ["entertainment"], "explanation": "The answer key gives “entertainment”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "entertainment", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q39", "displayNum": 39, "label": "Blank 39 - complete the corresponding blank in the source task shown above.", "answer": "opera", "accepted": ["opera"], "explanation": "The answer key gives “opera”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "opera", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q40", "displayNum": 40, "label": "Blank 40 - complete the corresponding blank in the source task shown above.", "answer": "electricity", "accepted": ["electricity"], "explanation": "The answer key gives “electricity”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "electricity", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "An interesting aspect of ﬁreworks is that their history tells us a lot about the changing \nroles of scientists and technicians in Europe. Fireworks were introduced from China \nin the 13th century. Up to the 16th century they were generally used for military \npurposes, with rockets and fire tubes being thrown at the enemy, but they were also \nsometimes a feature of plays and festivals where their chief purpose was related to \nreligion.\nBy the 17th century, the rulers of Europe had started using fireworks as a way of \nmarking royal occasions. Technicians were employed to stage spectacular shows \nwhich displayed aspects of nature, with representations of the sun, snow and rain. \nThese shows were designed for the enjoyment of the nobility and to impress ordinary \npeople. But fireworks also aroused the interest of scientists, who started to think of \nnew uses for them. After seeing one firework display where a model of a dragon was \npropelled along a rope by rockets, scientists thought that in a similar way, humans \nmight be able to achieve flight - a dream of many scientists at the time. Other \nscientists, such as the chemist Robert Boyle, noticed how in displays one firework \nmight actually light another, and it occurred to him that fireworks might provide an \neffective way of demonstrating how stars were formed.\nScientists at the time often depended on the royal courts for patronage, but there was \nconsiderable variation in the relationships between the courts and scientists in \ndifferent countries. This was reflected in attitudes towards fireworks and the purposes \nfor which they were used. In London in the middle of the 17th century there was \ngeneral distrust of fireworks among scientists. However, later in the century \nscientists and technicians started to look at the practical purposes for which \nfireworks might be employed, such as using rockets to help sailors establish their \nposition at sea.\nIt was a different story in Russia, where the St Petersburg Academy of Science played\nQ31\nQ32\nQ33\nQ34\nQ35\n36. education\n37. king \n38. entertainment \n39. opera \n40. electricity \n\nIELTS THANH LOAN\n\na key role in creating fireworks displays for the court. Here, those in power \nregarded fireworks as being an important element in the education of the masses, \nand the displays often included a scientific message. Members of the Academy \nhoped that this might encourage the Royal Family to keep the Academy open at a \ntime when many in the government were considering closing it.\nIn Paris, the situation was different again. The Paris Academy of Sciences played no \nrole in staging fireworks displays. Instead the task fell to members of the Royal \nAcademy of Painting and Sculpture. As in Russia, the work of the technicians who \ncreated the fireworks was given little attention. Instead, the fireworks and the \nspectacle they created were all designed to encourage the public to believe in the \nsupreme authority of the king. However, science was also enormously popular \namong the French nobility, and fashionable society flocked to demonstrations such \nas Nicolas Lemery's display representing an erupting volcano. The purpose of \nscientists was basically to offer entertainment to fashionable society, and \nacademicians delighted in amazing audiences with demonstrations of the universal \nlaws of nature.\n(pause)\nIn the course of the 18th century, the circulation of skills and technical exchange led \nto further developments. Fireworks specialists from Italy began to travel around \nEurope staging displays for many of the European courts. The architect and stage \ndesigner Giovanni Servandoni composed grand displays in Paris, featuring \ncolourfully painted temples and triumphal arches. A fireworks display staged by \nServandoni would be Structured in the same way as an opera, and was even divided \ninto separate acts. Iralian fireworks specialists were also invited to perform in \nLondon, St Petersburg and Moscow.\nAs these specialists circulated around Europe, they sought to exploit the appeal of \nfireworks for a wider audience, including the growing middle classes. As in the \nprevious century, fireworks provided resources for demonstrating scientific laws \nand theories, as well as new discoveries, and displays now showed a fascinated \npublic the curious phenomenon of electricity. By the mid-18th century, fireworks \nwere being sold for private consumption.\nSo the history of fireworks shows us the diverse relationships which existed between \nscientists, technicians and the rest of society…\nQ36\nQ37\nQ38\nQ39\nQ40\n\nIELTS THANH LOAN", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX20", "title": "New Caledonian crows and the use of tools", "type": "Note / Table / Sentence Completion", "instruction": "Questions 31-40 Complete the notes below Write ONE WORD ONLY for each answer", "audio": "assets/audio/NTS_20.mp3", "source": "The official guide to IELTS", "images": ["assets/images/ex20_p1.jpg"], "questions": [{"id": "q31", "displayNum": 31, "label": "Blank 31 - complete the corresponding blank in the source task shown above.", "answer": "hook", "accepted": ["hook"], "explanation": "The answer key gives “hook”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "hook", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q32", "displayNum": 32, "label": "Blank 32 - complete the corresponding blank in the source task shown above.", "answer": "string", "accepted": ["string"], "explanation": "The answer key gives “string”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "string", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q33", "displayNum": 33, "label": "Blank 33 - complete the corresponding blank in the source task shown above.", "answer": "danger", "accepted": ["danger"], "explanation": "The answer key gives “danger”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "danger", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q34", "displayNum": 34, "label": "Blank 34 - complete the corresponding blank in the source task shown above.", "answer": "rubber", "accepted": ["rubber"], "explanation": "The answer key gives “rubber”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "rubber", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q35", "displayNum": 35, "label": "Blank 35 - complete the corresponding blank in the source task shown above.", "answer": "light", "accepted": ["light"], "explanation": "The answer key gives “light”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "light", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q36", "displayNum": 36, "label": "Blank 36 - complete the corresponding blank in the source task shown above.", "answer": "intelligence", "accepted": ["intelligence"], "explanation": "The answer key gives “intelligence”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "intelligence", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q37", "displayNum": 37, "label": "Blank 37 - complete the corresponding blank in the source task shown above.", "answer": "tails", "accepted": ["tail", "tails"], "explanation": "The answer key gives “tails”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "tails", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q38", "displayNum": 38, "label": "Blank 38 - complete the corresponding blank in the source task shown above.", "answer": "energy", "accepted": ["energy"], "explanation": "The answer key gives “energy”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "energy", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q39", "displayNum": 39, "label": "Blank 39 - complete the corresponding blank in the source task shown above.", "answer": "chemical", "accepted": ["chemical"], "explanation": "The answer key gives “chemical”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "chemical", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q40", "displayNum": 40, "label": "Blank 40 - complete the corresponding blank in the source task shown above.", "answer": "diet", "accepted": ["diet"], "explanation": "The answer key gives “diet”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "diet", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "I’m going to talk today about research into a particular species of bird, the New \nCaledonian crow, whose natural habitat is small islands in the Pacific Ocean. And it \nseems that these Crows are exceptionally resourceful.\nUsing sticks or other tools to find food isn’t unknown among birds and animals. Some \nchimpanzees, for example, are known to bang nuts on stones, in order to break the \nshell and get at the edible kernel inside. One New Caledonian crow, called Betty, bent \nsome straight wire into a hook and used it to lift a small bucket of her favourite food \nfrom a vertical pipe. This experiment was the first time she'd been presented with \nwire, which makes it very impressive. Another crow, called Barney, has demonstrated \nhis skill at using sticks to forage for food.\nIn one research project, scientists from New Zealand and Oxford set captive New \nCaledonian crows a three-stage problem: if they wanted to extract food from a hole, \nthe crows first had to pull up a string to get a short stick, then use that short stick to \nremove a long stick from a toolbox, and finally use the long stick to reach the food. \nAmazingly, they worked out how to do this successfully.\nFurther experiments carried out at Oxford suggest that crows can also use sticks as \ntools to inspect all sorts of objects, possibly to assess whether or not they present a \ndanger. The idea for the experiment came from observing the birds using tools to pick \nat random objects, such as a picture of a spider that was printed on some cloth. In this \nresearch, five pairs of crows — including Barney — underwent tests to see how they \nwould react to a variety of objects, which were carefully chosen so the birds wouldn't \nbe tempted to view them as a possible source of food. As a further precaution, all the \ncrows had been fed beforehand.\nOn eight occasions, a birds first contact was by using a tool. In all three trials, Barney \nbegan by using a stick for inspection. One involved a rubber snake. First he \napproached it, but didn't touch it, then retreated to pick up a stick. He then prodded \nQ31\nQ32\nQ33\nQ34\n36. intelligence \n37. tail(s)\n38. energy \n39. chemical \n40. diet \n\nIELTS THANH LOAN\n\nit with the suck. After some more investigation, he discarded the stick and carried on \npecking at the snake more confidently — apparently convinced that it wouldn’t move.\nIn other experiments, two different birds, called Pierre and Corbeau, also made a first \napproach with tools on three Separate occasions. Pierre used a short piece of \nwoodchip to touch a light which was flashing, and Corbeau was seen prodding a metal \ntoad with a stick.\nSignificantly, the crows tended to use the sticks only to make their first contact with the \nobject. Subsequently, they either ignored the object or dropped the tool and pecked at \nthe object — which is very different from using the tool to get access to food.\n(pause)\nSo what conclusions can be drawn from the research? Evidence is building up from \nexperiments such as these that the birds are able to plan their actions in advance, \nwhich is very interesting for understanding their cognition. They don’t seem to be \nresponding in a pre-programmed sort of way: it may even be possible that they’re able \nto view a problem and work out what the answer is. However, a major difficulty \nintelligence. To some extent, this is related to the ecological circumstances in which \nthe animal is found.\nSo scientists want to find out much more about how the crows behave in their native \nhabitat, and a team from Exeter and Oxford universities is carrying out research in \nNew Caledonia. They're looking into whether the birds” way of searching for food \ngives them any possible evolutionary advantage. The birds are hard to observe, as \nthey live in a region of mountainous forest, so the researchers have attached tiny \ncameras to the tails of some birds, as one method of investigating their behaviour.\nThe birds are masters at using sticks to find their food, in particular beetle larvae from \nthe trees. It’s possible that the birds can derive so much energy  from these grubs that \nthey only need to cat a few each day. This would mean that they wouldn’t have to \nspend most of their waking time searching for food, as most animals do.\nThe beetle larvae have a distinct chemical make-up, which can be traced through the \nfeathers and blood of birds that eat them. Scientists have collected samples from crows \nin order to estimate the proportion of larvae in their diet. They should then be able to \ngauge the extent to which individual birds depend on using sticks to feed themselves.\nWe've learnt a great deal about the ability of New Caledonian Crows to use tools, and \nsome very interesting research is being carried out into them.\nQ35\nQ36\nQ37\nQ38\nQ39\nQ40\n\nIELTS THANH LOAN", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}]};
const KNOWLEDGE=[["Tổng quan", "<h2>Dạng 6: Note / Table / Sentence Completion</h2><p>Dạng này xuất hiện ở tất cả các Parts, đặc biệt thường gặp ở Part 1 và Part 4. Nhiệm vụ là điền từ/số vào chỗ trống để nội dung ghi chú, bảng hoặc câu khớp với bài nghe.</p><div class=\"tip\"><b>Hard rule:</b> đọc WORD LIMIT trước khi nghe. Sai số lượng từ có thể mất điểm dù nghe đúng thông tin.</div>"], ["Word limit", "<h2>Giới hạn từ</h2><p><b>ONE WORD ONLY:</b> chọn từ mang nghĩa chính phù hợp ngữ pháp. <b>ONE WORD AND/OR A NUMBER:</b> có thể dùng một từ, một số, hoặc một từ + một số. <b>NO MORE THAN TWO/THREE WORDS:</b> không vượt quá giới hạn ghi trong đề.</p><p>Luôn kiểm tra cách viết số, chính tả và số ít/số nhiều.</p>"], ["Dự đoán đáp án", "<h2>Predict before listening</h2><p>Dựa vào từ trước/sau blank để dự đoán noun / verb / adjective / adverb và loại thông tin. Ví dụ <i>different ___</i> thường gợi ý danh từ số nhiều. Việc dự đoán giúp phản ứng nhanh khi thông tin xuất hiện trong audio.</p>"], ["3 bước làm bài", "<h2>Quy trình 3 bước</h2><ol><li>Xác định word limit và chủ đề/ý chính.</li><li>Dự đoán dạng từ và nhóm nghĩa cho từng blank.</li><li>Nghe theo thứ tự câu hỏi, điền đáp án, rồi kiểm tra spelling, singular/plural và grammatical fit.</li></ol>"]];const KEY='IELTS_D6_NTS_V6';let state=JSON.parse(localStorage.getItem(KEY)||'{}');state.student=state.student||{};state.exercises=state.exercises||{};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function st(id){return state.exercises[id]||(state.exercises[id]={status:'not_started',answers:{},attemptCount:0,audioPosition:0})}function show(id){$$('.page').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');scrollTo(0,0)}function norm(x){return String(x||'').toLowerCase().trim().replace(/[.,;:!?]/g,'').replace(/[-–—]/g,' ').replace(/\s+/g,' ')}function ok(q,a){return (q.accepted||[q.answer]).some(x=>norm(x)===norm(a))}function initStudent(){['studentName','studentClass','studentId'].forEach(k=>{let el=$('#'+k);el.value=state.student[k]||'';el.oninput=()=>{state.student[k]=el.value;save()}})}function renderHome(){let g=$('#homeGrid');g.innerHTML=`<div class="knowledge-card" onclick="openKnowledge()"><b>📘 KIẾN THỨC CẦN HỌC</b><p class="score">Word limits • prediction • 3-step method</p></div>`;let done=0;DATA.exercises.forEach(e=>{let x=st(e.id);if(x.status==='completed')done++;g.innerHTML+=`<div class="exercise-card" onclick="openEx('${e.id}')"><b>${e.id.replace('EX','Exercise ')}: ${esc(e.title)}</b><p class="score">${e.questions.length} blanks • Audio included</p><span class="pill">${x.status}</span></div>`});$('#overallBar').style.width=(done/20*100)+'%';$('#overallText').textContent=`Completed: ${done}/20 exercises`;}function openKnowledge(){show('knowledgePage');let tabs=$('#knowledgeTabs');tabs.innerHTML='';KNOWLEDGE.forEach((k,i)=>{let b=document.createElement('button');b.textContent=k[0];b.onclick=()=>{$$('#knowledgeTabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#knowledgePane').innerHTML=k[1]};tabs.appendChild(b);if(i===0)b.click()})}function openEx(id){let e=DATA.exercises.find(x=>x.id===id),x=st(id);if(x.status==='not_started')x.status='in_progress';save();show('exercisePage');let imgs=e.images.map((im,i)=>`<img src="${im}" alt="${esc(e.title)} source page ${i+1}" loading="lazy">`).join('');let qs=e.questions.map(q=>`<div class="question"><div class="qline"><div class="qbadge">${q.displayNum}</div><div><label>${esc(q.label)}</label><input class="answer-input" data-q="${q.id}" value="${esc(x.answers[q.id]||'')}" autocomplete="off"></div></div></div>`).join('');$('#exerciseMount').innerHTML=`<div class="exercise-wrap"><article class="task"><div class="task-head"><h2>${e.id.replace('EX','Exercise ')}: ${esc(e.title)}</h2><p>${esc(e.instruction)}</p><div class="source-note">Source: ${esc(e.source)}</div></div><div class="audio-box"><audio id="player" controls preload="metadata" src="${e.audio}"></audio></div><div class="source-figure"><div class="zoom-note">Original source layout - full page, preserved aspect ratio, no cropping. Use browser zoom if needed.</div>${imgs}</div><div class="questions">${qs}</div><div class="task-actions"><button class="btn primary" id="check">✓ Kiểm tra đáp án</button><button class="btn" onclick="home()">← Lesson Home</button></div><div class="review ${x.reviewUnlocked?'open':''}" id="review"></div></article><aside class="side"><b>${e.id.replace('EX','Exercise ')}</b><div class="mini-status" id="status"></div><button class="btn primary" id="check2">Kiểm tra đáp án</button><button class="btn danger" id="reset">Reset Exercise</button><button class="btn" onclick="home()">← Lesson Home</button></aside></div>`;let p=$('#player');p.onloadedmetadata=()=>{if(x.audioPosition&&x.audioPosition<p.duration-2)p.currentTime=x.audioPosition};p.ontimeupdate=()=>{x.audioPosition=p.currentTime;save()};$$('.answer-input').forEach(inp=>inp.oninput=()=>{x.answers[inp.dataset.q]=inp.value;save();status(e,x)});status(e,x);$('#check').onclick=$('#check2').onclick=()=>check(e,x);$('#reset').onclick=()=>{if(confirm('Xóa toàn bộ câu trả lời Exercise này?')){state.exercises[e.id]={status:'not_started',answers:{},attemptCount:0,audioPosition:0};save();home()}};if(x.reviewUnlocked)review(e,x)}function status(e,x){let n=e.questions.filter(q=>String(x.answers[q.id]||'').trim()).length;let z=$('#status');if(z)z.textContent=`Answered: ${n}/${e.questions.length} • Autosaved`}function check(e,x){e.questions.forEach(q=>{let el=document.querySelector(`[data-q="${q.id}"]`);if(el)x.answers[q.id]=el.value});let blanks=e.questions.filter(q=>!String(x.answers[q.id]||'').trim()).length;if(blanks&&!confirm(`Còn ${blanks} câu trống. Vẫn chấm?`))return;let score=0;x.results={};e.questions.forEach(q=>{let yes=ok(q,x.answers[q.id]);if(yes)score++;x.results[q.id]={student:x.answers[q.id]||'',isCorrect:yes}});x.score=score;x.total=e.questions.length;x.status='completed';x.reviewUnlocked=true;x.attemptCount=(x.attemptCount||0)+1;save();review(e,x);renderHome();send(e,x)}async function send(e,x){if(!state.student.studentName||!state.student.studentClass||!state.student.studentId)return;let payload={skill:'LISTENING',studentName:state.student.studentName,class:state.student.studentClass,id:state.student.studentId,testId:`DANG6-${e.id}`,testName:`Note Table Sentence Completion - ${e.title}`,score:x.score,total:x.total,correct:x.score,wrong:x.total-x.score,answers:x.results};try{await fetch(DATA.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})}catch(_e){}}function review(e,x){let h=`<h2>Review • ${x.score}/${x.total}</h2>`;e.questions.forEach(q=>{let r=x.results[q.id];h+=`<div class="review-item ${r.isCorrect?'good':'bad'}"><b>Question ${q.displayNum}</b><p>Your answer: <b>${esc(r.student||'—')}</b><br>Correct answer: <b>${esc(q.answer)}</b></p><p>${esc(q.explanation)}</p><div class="tip"><b>🧠 Kiến thức cần nhớ:</b> ${esc(q.memory[0].vi)} ${esc(q.memory[0].note)}</div></div>`});h+=`<div class="accordion"><button class="acc-btn">🎧 Listen Again & Full Tapescript</button><div class="acc-body"><audio controls src="${e.audio}"></audio>

${esc(e.transcript_text)}</div></div>`;let b=$('#review');b.innerHTML=h;b.classList.add('open');$$('.acc-btn').forEach(z=>z.onclick=()=>z.nextElementSibling.classList.toggle('open'))}function home(){let p=$('#player');if(p)p.pause();renderHome();show('homePage')}$('#homeBtn').onclick=home;initStudent();renderHome();</script></body></html>
