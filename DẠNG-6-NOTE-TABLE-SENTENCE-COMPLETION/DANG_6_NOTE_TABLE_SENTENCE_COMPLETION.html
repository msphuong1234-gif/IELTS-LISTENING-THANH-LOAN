."}]}, {"id": "q6", "displayNum": 6, "label": "Blank 6 - complete the corresponding blank in the source task shown above.", "answer": "party", "accepted": ["party"], "explanation": "The answer key gives “party”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "party", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q7", "displayNum": 7, "label": "Blank 7 - complete the corresponding blank in the source task shown above.", "answer": "SHADFORTH", "accepted": ["SHADFORTH", "shadford"], "explanation": "The answer key gives “SHADFORTH”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "SHADFORTH", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q8", "displayNum": 8, "label": "Blank 8 - complete the corresponding blank in the source task shown above.", "answer": "towel", "accepted": ["towel"], "explanation": "The answer key gives “towel”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "towel", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q9", "displayNum": 9, "label": "Blank 9 - complete the corresponding blank in the source task shown above.", "answer": "breakfast", "accepted": ["breakfast"], "explanation": "The answer key gives “breakfast”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "breakfast", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q10", "displayNum": 10, "label": "Blank 10 - complete the corresponding blank in the source task shown above.", "answer": "kitchen", "accepted": ["kitchen"], "explanation": "The answer key gives “kitchen”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "kitchen", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "Julie:\nNick:\nJulie:\nNick:\nJulie:\nNick:\nJulie:\nNick:\nJulie:\nNick:\nJulie:\nNick:\nJulie:\nNick:\nJulie:\nNick:\n\nExercise 5:  \n6. party \n7. SHADFORD\n8. Towel \n9. Breakfast \n10. Kitchen \nHi Nick. It’s Julie. Have you managed to find any information about \naccommodation in Darwin?\nHi. I was just going to call you. I’ve found some on the Internet. There are quite \na few hostels for backpackers there. The first possibility I found was a hostel \ncalled Top End Backpackers.\nOK\nIt’s pretty cheap, you can get a bed in a dormitory for nineteen dollars per \nperson. Private rooms cost a bit more, but we’ll be OK in dormitories, won’t we?\nSure\nSo that hostel has parking, though that doesn’t really matter to us as we’ll be \nusing public transport.\nYeah. are there any reviews on the website from people who’ve been there?\nWell, yes. They aren’t all that good though. Some people said they didn’t like to \nstaff, they had an unfriendly (Q1) attitude.\nMmm. That’s quite unusual in a hostel, usually all the staff are really welcoming.\nThat’s what I thought. People said they like to pool, and the fact that the rooms \nhad air-conditioning, but the problem with that was that it was very noisy (Q2), \nso they were kept awake. But it was too hot if they turned it off, so they had to put \nup with it.\nSomeone told me there’s another hostel called Gum Tree something\nGum Tree Lodge. It costs a bit more, 45 dollars a person\nWhat?\nOh no, that’s for private rooms, it’s 23.50 (Q3) for the dorms.\nThat’s more like it.\nIt looks to be in quite a good location, a bit out of town and quiet but with good \ntransport, and quite near a beach.\n\nIELTS THANH LOAN\nJulie:\nNick:\nJulie:\nNick:\nJulie:\nNick:\nJulie:\nNick:\nJulie:\nNick:\nJulie:\nJulie:\nNick:\nJulie:\nNick:\nJulie:\nNick:\nJulie:\n\nHas it got a pool?\nYes, and its own gardens. The reviews for that one are mostly OK except for one \nperson who said they couldn’t sleep because there were insects (Q4) flying \naround in the dormitories.\nNot for me then. And I’d rather be somewhere central really.\nRight. There’s a place called Kangaroo Lodge. They’ve got dorms at 22 dollars. \nAnd it’s downtown, near all the restaurants and clubs and everything, so that \nshould suit you. and it doesn’t close at night.\nso there’s always someone on reception. That sounds good.\nThe only criticism I saw as that the rooms were a bit messy and untidy because \npeople just left their clothes and stuff all over the beds and the floor.\nDon’t hostels usually have lockers in the bedrooms where you can leave your \nstuff?\nYeah, they do usually, but apparently they don’t here. Still, hostels are never \nparticularly tidy places, so that doesn’t bother me. And the same person said \nthat the standard of cleanliness was pretty good, and especially the bathrooms \n(Q5), they were excellent as far as that went.\nRight. Yeah, I reckon Kangaroo Lodge sounds the best.\nMe too. Quite a lot of people reviewing it said it was really fun there, like every \nnight everyone staying there got together and ended up having a party (Q6). So \nit sounds like it’s got a really good atmosphere.\nOK, let’s go for that one.\n(pause)\nDid you get the address of Kangaroo Lodge?\nYes… it’s on Shadforth Lane.\nCan you spell that?\nS-H-A-D-F-O-R-T-H (Q7). It’s near the transit centre where the intercity buses \nand the airport buses drop you oﬀ.\nCool. I’m really looking forward to this. I’ve never stayed in a hostel before. Do \nyou provide bed linen-sheets and things?\nYeah, And you can usually either bring your own towel (Q8), or hire one there, \nbut they don’t usually provide those for free.\nOK, and what happens about meals?\n\nIELTS THANH LOAN\nNick: \nJulie:", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX06", "title": "Hilary Lodge Retirement Home", "type": "Note / Table / Sentence Completion", "instruction": "Questions 1-10 Complete the notes below Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer", "audio": "assets/audio/NTS_06.mp3", "source": "The official guide to IELTS", "images": ["assets/images/ex06_p1.jpg"], "questions": [{"id": "q1", "displayNum": 1, "label": "Blank 1 - complete the corresponding blank in the source task shown above.", "answer": "documents", "accepted": ["simple documents", "documents"], "explanation": "The answer key gives “documents”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "documents", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q2", "displayNum": 2, "label": "Blank 2 - complete the corresponding blank in the source task shown above.", "answer": "keyboard", "accepted": ["keyboard"], "explanation": "The answer key gives “keyboard”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "keyboard", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q3", "displayNum": 3, "label": "Blank 3 - complete the corresponding blank in the source task shown above.", "answer": "flowers", "accepted": ["flowers"], "explanation": "The answer key gives “flowers”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "flowers", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q4", "displayNum": 4, "label": "Blank 4 - complete the corresponding blank in the source task shown above.", "answer": "tools", "accepted": ["tools"], "explanation": "The answer key gives “tools”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "tools", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q5", "displayNum": 5, "label": "Blank 5 - complete the corresponding blank in the source task shown above.", "answer": "Saturday", "accepted": ["Saturday"], "explanation": "The answer key gives “Saturday”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "Saturday", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q6", "displayNum": 6, "label": "Blank 6 - complete the corresponding blank in the source task shown above.", "answer": "Mairead", "accepted": ["Mairead"], "explanation": "The answer key gives “Mairead”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "Mairead", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q7", "displayNum": 7, "label": "Blank 7 - complete the corresponding blank in the source task shown above.", "answer": "Bridge", "accepted": ["Bridge"], "explanation": "The answer key gives “Bridge”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "Bridge", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q8", "displayNum": 8, "label": "Blank 8 - complete the corresponding blank in the source task shown above.", "answer": "14th May", "accepted": ["14th May"], "explanation": "The answer key gives “14th May”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "14th May", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q9", "displayNum": 9, "label": "Blank 9 - complete the corresponding blank in the source task shown above.", "answer": "park", "accepted": ["park"], "explanation": "The answer key gives “park”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "park", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q10", "displayNum": 10, "label": "Blank 10 - complete the corresponding blank in the source task shown above.", "answer": "newspaper", "accepted": ["newspaper"], "explanation": "The answer key gives “newspaper”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "newspaper", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "Cathy:\nJohn:\nCathy:\nJohn:\nCathy:\nJohn:\nCathy:\nJohn:\nCathy:\nJohn:\nCathy:\nJohn:\n\nExercise 6:  \n6. Mairead\n7. Bridge \n8. 14th May \n9. park \n10. newspaper \nHello, Hilary Lodge retirement home. Cathy speaking. \nHello, my name’s John Shepherd. Could I ask if you’re the manager of the home?\nThat’s right.\nOh good. Hello Cathy. A friend of mine is a volunteer at Hilary Lodge, and I’d \nlike to help out, too, if you need more people. I would work part-time, so I have \nquite a lot of free time.\nWe’ve always glad of more help. Shall I tell you about some of the activities that \nvolunteers get involved in?\nPlease.\nWell on Monday evenings we organize computer training. We’ve got six laptops, \nand five or six residents come to the sessions regularly. They’re all now fine at \nwriting and sending emails, but our trainer has just moved away, and we need \ntwo or three volunteers who can help the residents create documents (Q1). Just \nsimple things, really.\nI’d certainly be interested in doing that.\nGreat. Then on Tuesday afternoons we have an informal singing class, which \nmost of the residents attend. We’ve got a keyboard (Q2), and someone who plays, \nbut if you’d like to join the singing, you’d be very welcome.\nI work on Tuesday at the moment, though that might change. I’ll have to give it a \nmiss for now, I’m afraid.\nOK. Then on Thursday mornings we generally have a session in our garden. \nSeveral of our residents enjoy learning about flowers (Q3), where they grow best, \nhow to look after them, and so on. Is that something you’re keen on?\nI’m no expert, but I enjoy gardening, so yes, I’d like to get involved. Do you have \nyour own tools (Q4) at the home?\n\nIELTS THANH LOAN\nCathy:\nJohn:\nCathy:\nJohn:\nCathy:\nJohn:\nCathy:\nJohn:\nCathy:\nJohn:\nCathy:\nJohn:\nCathy:\nJohn:\nCathy:\nJohn:\nCathy:\nJohn:\nCathy:\nJohn:\nCathy:\n\nWe’ve got a few, but not very many.\nI could bring some in with me when I come.\nThank you very much. One very important thing for volunteers is that we hold a \nmonthly meeting where they all get together with the staff. It’s a change to make \nsure we’re working well together, and that everyone knows how the residents \nare, and what’s going on in the home.\nUhmm.\n(pause)\nNow obviously we’d need to get to know you before you become one of our \nvolunteers.\nOf course.\nCould you come in for an informal interview – later this week, maybe?\nI’m busy the next couple of days, but would Saturday (Q5) be possible?\nCertainly, just drop in any time during the day. I won’t be working then, so you’ll \nsee my assistant, Mairead.\nSorry, how do you spell that?\nIt’s M-A-I-R-E-A-D, Mairead (Q6)\nOK, got that It’s not a name I’m familiar with.\nIt’s an Irish name. She comes from Dublin.\nRight. And the road that Hilary Lodge is in is called Bridge (Q7) Road, isn’t it?\nThat’s right. Number 73.\nFine.\nOh, one other thing you might be interested in – we’re holding a couple of “open \nhouse” days, and still need a few volunteers, if you’re available.\nWhat are the dates?\nThere’s one on April 9th, and another on 14th May. They’re both Saturday, and \nall-day events.\nI can certainly manage May 14th (Q8). I’ve got another commitment on April \n9th, though.\nThat would be a great help. We’re having several guest entertainers – singers, a \nbrass band, and so on – and we’re expecting a lot of visitors. So one possibility \nis to help look after the entertainers, or you could spend an hour or so organizing \npeople as they arrive, and then just be part of the team making sure everything’s \ngoing smoothly.\n\nIELTS THANH LOAN\nJohn:\nCathy:\nJohn:\nCathy:\nJohn:\nCathy: \n\nWell, shall I show people where they can park (Q9)?\nLovely. Thank you. One reason for holding the open house days is to get \npublicity for Hilary Lodge locally. So you may find you have someone from a \nnewspaper (Q10) wanting to interview you. They’ll want to find out from two or \nthree people why they volunteer to help at the home. We’re trying to get a TV \nstation to come, too, but they don’t seem very interested.\nI don’t mind being interviewed.\nGood. Well, if you come in for a chart, as we arranged, we’ll take it from there. \nThank you very much for calling.\nMy pleasure. Goodbye.\nGoodbye.\n\nIELTS THANH LOAN", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX07", "title": "Student Job Details", "type": "Note / Table / Sentence Completion", "instruction": "Questions 1 and 2: Complete the notes below Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer • Questions 3-5: Complete the table below Write NO MORE THAN TWO WORDS for each answer • Questions 6-10 Complete the form below Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer", "audio": "assets/audio/NTS_07.mp3", "source": "Cambridge IELTS 7", "images": ["assets/images/ex07_p1.jpg", "assets/images/ex07_p2.jpg"], "questions": [{"id": "q1", "displayNum": 1, "label": "Blank 1 - complete the corresponding blank in the source task shown above.", "answer": "business", "accepted": ["business"], "explanation": "The answer key gives “business”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "business", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q2", "displayNum": 2, "label": "Blank 2 - complete the corresponding blank in the source task shown above.", "answer": "third", "accepted": ["third"], "explanation": "The answer key gives “third”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "third", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q3", "displayNum": 3, "label": "Blank 3 - complete the corresponding blank in the source task shown above.", "answer": "sports centre", "accepted": ["sport centre", "sports centre"], "explanation": "The answer key gives “sports centre”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "sports centre", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q4", "displayNum": 4, "label": "Blank 4 - complete the corresponding blank in the source task shown above.", "answer": "cleaner", "accepted": ["cleaner", "a cleaner"], "explanation": "The answer key gives “cleaner”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "cleaner", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q5", "displayNum": 5, "label": "Blank 5 - complete the corresponding blank in the source task shown above.", "answer": "library", "accepted": ["library"], "explanation": "The answer key gives “library”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "library", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q6", "displayNum": 6, "label": "Blank 6 - complete the corresponding blank in the source task shown above.", "answer": "international house", "accepted": ["international house"], "explanation": "The answer key gives “international house”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "international house", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q7", "displayNum": 7, "label": "Blank 7 - complete the corresponding blank in the source task shown above.", "answer": "B659", "accepted": ["B659"], "explanation": "The answer key gives “B659”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "B659", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q8", "displayNum": 8, "label": "Blank 8 - complete the corresponding blank in the source task shown above.", "answer": "office assistant", "accepted": ["office assistant", "an office assistant"], "explanation": "The answer key gives “office assistant”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "office assistant", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q9", "displayNum": 9, "label": "Blank 9 - complete the corresponding blank in the source task shown above.", "answer": "answer the phone", "accepted": ["answer the phone", "answer phone"], "explanation": "The answer key gives “answer the phone”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "answer the phone", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q10", "displayNum": 10, "label": "Blank 10 - complete the corresponding blank in the source task shown above.", "answer": "11.30", "accepted": ["11.30"], "explanation": "The answer key gives “11.30”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "11.30", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "AGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\n\nExercise 7:  \n6. international house \n7. B659 \n8. (an) office assistant \n9. answer (the) phone \n10. 11.30 \nGood morning.\nOh, good morning. Is this… er… room number 26?\nYes, that’s right.\nSo is this the Student Job Centre?\nIt certainly is. How can I help you?\nWell, actually I’m looking for a job—a part-time job. Do you have  anything \navailable at the moment?\nAh, yes… Are you a registered student? I’m afraid this service is only \navailable to full-time students.\nYes… I am. I’m doing a degree in Business Studies (Q1). Here’s my student \ncard.\nWhich year are you in?\nWell… I’ve been at university for four years but I’m in the Third Year (Q2) \nbecause I took last year off.\nRight… well, let’s just have a look at what positions are available at the \nmoment. There’s a job working at the reception desk at the Sports Centre \n(Q3), for three evenings a week—that’s Wednesdays, Thursdays and Fridays.\nThat sounds like fun but unfortunately I have evening lectures—so that’s not \npossible, I’m afraid. Is there anything during the day?\nOK, that’s no good then. Um. What about cleaning? There’s a position for a \ncleaner (Q4) at the Child Care Centre.\nRight…\nBut you’d need to be there at 6 am. Does that appeal?\nSix o’clock in the morning! Oh, that’s far too early for me, I’m afraid. I’d \nnever make it that early in the morning.\n\nIELTS THANH LOAN\nAGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\nAGENT:\nSTUDENT:\n\nMmm… Well—there was a position going in the Computer Lab. for three days \na week that might be OK. Ah, here it is! No, it’s in the Library (Q5), not the \nLab, Clerical Assistant required—I think it mostly involves putting the books \nback on the shelves. Oh no—hang on. It’s for Wednesday and Friday evenings \nagain.\nNO—I can’t manage that because of the lectures.\nOK, I’m getting the idea. Look, I’ll just get a few details from you anyway, and \nthen we can check through the list and see what comes up.\nWe’ll fill in the personal details on this application form first, if that’s OK?\nYes, that’s fine.\nNow, what’s your name again?\nAnita Newman—that’s N-E-W-M-A-N.\nAnd your address, Anita?\nI’m in one of the Halls of Residence for post-graduate students, you know, \nInternational House (Q6).\nOK—that’s easy. What’s your room number there?\nRoom B569 – no sorry B659 (Q7). I always get that wrong. I haven’t been \nliving there very long.\nDo you have any other skills? Typing, languages, that sort of thing?\nWell, I speak some Japanese.\nRight, I’ll make a note of that. Now—let’s see what else is available. What do \nyou think of administrative work? There is a position for an Office Assistant \n(Q8) at the English Language Centre.\n That sounds interesting.\nIt’s for 3 days a week—Monday, Friday and Saturday mornings. Interested?\nMmm. I was hoping to have Saturdays free. But I need the work so … can you \ntell me what the job involves?\nYes, sure. It says here that you’ll be required to deal with student enquiries and \nanswer the phone (Q9).\nI’m sure I can handle all that without a problem.\nGreat. Well, would you like me to arrange an interview for you? Say, Friday \nmorning, around ten?\nCould we make it a bit later? Unfortunately, I’ve got something to do at ten. \nWould that be OK?\n\nIELTS THANH LOAN\nAGENT:  \nSTUDENT:", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX08", "title": "PACTON-ON-SEA BUS TOUR", "type": "Note / Table / Sentence Completion", "instruction": "Questions 11-14 Complete the table below Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer • Questions 15-20 Complete the sentences below Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer", "audio": "assets/audio/NTS_08.mp3", "source": "The official guide to IELTS", "images": ["assets/images/ex08_p1.jpg"], "questions": [{"id": "q11", "displayNum": 11, "label": "Blank 11 - complete the corresponding blank in the source task shown above.", "answer": "sharks", "accepted": ["sharks"], "explanation": "The answer key gives “sharks”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "sharks", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q12", "displayNum": 12, "label": "Blank 12 - complete the corresponding blank in the source task shown above.", "answer": "old fishing village", "accepted": ["old fishing village"], "explanation": "The answer key gives “old fishing village”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "old fishing village", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q13", "displayNum": 13, "label": "Blank 13 - complete the corresponding blank in the source task shown above.", "answer": "shopping", "accepted": ["shopping"], "explanation": "The answer key gives “shopping”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "shopping", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q14", "displayNum": 14, "label": "Blank 14 - complete the corresponding blank in the source task shown above.", "answer": "water fountain", "accepted": ["water fountain"], "explanation": "The answer key gives “water fountain”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "water fountain", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q15", "displayNum": 15, "label": "Blank 15 - complete the corresponding blank in the source task shown above.", "answer": "student card", "accepted": ["student card"], "explanation": "The answer key gives “student card”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "student card", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q16", "displayNum": 16, "label": "Blank 16 - complete the corresponding blank in the source task shown above.", "answer": "50 minutes", "accepted": ["50 minutes", "fifty minutes"], "explanation": "The answer key gives “50 minutes”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "50 minutes", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q17", "displayNum": 17, "label": "Blank 17 - complete the corresponding blank in the source task shown above.", "answer": "museum", "accepted": ["museum"], "explanation": "The answer key gives “museum”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "museum", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q18", "displayNum": 18, "label": "Blank 18 - complete the corresponding blank in the source task shown above.", "answer": "tourist office", "accepted": ["tourist office"], "explanation": "The answer key gives “tourist office”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "tourist office", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q19", "displayNum": 19, "label": "Blank 19 - complete the corresponding blank in the source task shown above.", "answer": "rainwear", "accepted": ["rainwear"], "explanation": "The answer key gives “rainwear”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "rainwear", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q20", "displayNum": 20, "label": "Blank 20 - complete the corresponding blank in the source task shown above.", "answer": "e-ticket", "accepted": ["eticket", "e-ticket"], "explanation": "The answer key gives “e-ticket”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "e-ticket", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "Thank you for calling the phoneline for the Pacton-on-Sea bus tour. This is a recorded \nmessage lasting approximately four minutes and it provides general information on the \ntown bus tour.\nPacton-on-Sea is a beautiful west coast town and has attracted tourists for many years. \nOne of the best ways of getting to know the town is to take the bus tour, which provides \na wonderful viewing experience from one of our open-top buses. The tour is a \nround-trip of the town and there are a total of 4 stops where passengers can get on and \noff the bus. A lot of people start at the first stop which is at the train station as this is \nwhere many tourists arrive in the town. The next stop after the station is the aquarium \nwhich is famous for its dolphin show and which has recently expanded to include \nsharks (Q11). This is well worth as visit and is very reasonably priced.\nLeaving the aquarium, the bus tour goes along the coast road and after a few \nkilometres comes to the Old Fishing Village (Q12) where you can get off to stroll along \nthe waterfront. There are some original buildings here but most of the area has been \nmodernized and is now used as a harbor for all kinds of sea craft including yachts and \nsome amazing power boats. The tour then heads off to the last stop and this is where \nmost of the shops are. So for those of you keen to do a bit of shopping (Q13), this is the \nplace for you. Our advice is to go to this part of the town in the morning when it is \nrelatively quiet. It does get very busy in the afternoons, especially at the height of the \nseason. This area of the town includes an ancient water fountain (Q14) where many \npeople like to have their photograph taken – so do look out for this.\n(pause) \n16. fifty / 50 minutes \n17. museum \n18. tourist office \n19. rainwear \n20. eticket / e-ticket \n\nIELTS THANH LOAN\n \n \n \n\nNow some details of the costs and timings. A family ticket, which includes two adults \nand up to three children, costs 30 pounds. An adult ticket costs 15 pounds, children \nunder the age of fifteen are 5 pounds and student tickets are 10 pounds as long as you \nhave a student card (Q15). All tickets are valid for 24 hours, which means that you can \nget on and off the bus as many times as you like withen a 24-hour period. So you could, \nfor example, start the tour in the afternoon and complete it the following morning. The \nfirst bus of the day leaves the station at 10 a.m and the last one of the day leaves at 6 \np.m. Buses leave every thirty minutes and each tour takes a total of 50 minutes (Q16). \nThere are many attractions at each of the stops, so wherever you get off the bus there \nwill be plenty to do. The bus tour tickets do not include entrance to any of these \nattractions apart from the museum (Q17) which is located near the aquarium. Some \nbuses have local giudes, who will point out places of interest and will provide \ninformation on the town. However, we cannot guarantee that every bus will have guide \nand so we also have an audio commentary that has been specially recorded on the bus\ntour by the tourist office (Q18) headphones are available on the bus and these are wasy \nto operate. There is no extra charge for these – just plug in, select the required \nlanguage and adjust the volume.\nDue to the winter months being rather cold and wet in Pacton-on-Sea, the bus tours \nonly onperate from March to Septenber. The weather is usually warm and sunny \nduring these months so remember to bring some sun protection, especially on holidays. \nAnd of course, it does occasionally rain here in the summer so if the weather looks bad, \nremember to bring some rainwear (Q19). The bus tours are avalable no matter what \nthe weather.\nAt the height of the summer the tours can get very busy so you are advised to book. You \ncan book tickets online, over the phone and also at the station and at any of the other \ntour stops. When booking over the phone you can collect your tickets at any of the stops \nat the start of your tour. When you do it online you can print your e-ticket (Q20) which \nyou must remember to bring with you.\nThank you for calling the Pacton-on-Sea phoneline and we look forward to seeing you \nsoon on one of our tour buses.\n\nIELTS THANH LOAN", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX09", "title": "City Boat Tour", "type": "Note / Table / Sentence Completion", "instruction": "Questions 13-18 Complete the table below Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer", "audio": "assets/audio/NTS_09.mp3", "source": "Cambridge IELTS 7", "images": ["assets/images/ex09_p1.jpg"], "questions": [{"id": "q13", "displayNum": 13, "label": "Blank 13 - complete the corresponding blank in the source task shown above.", "answer": "12.30", "accepted": ["12.30"], "explanation": "The answer key gives “12.30”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "12.30", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q14", "displayNum": 14, "label": "Blank 14 - complete the corresponding blank in the source task shown above.", "answer": "formal garden", "accepted": ["formal garden", "garden"], "explanation": "The answer key gives “formal garden”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "formal garden", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q15", "displayNum": 15, "label": "Blank 15 - complete the corresponding blank in the source task shown above.", "answer": "Tower Restaurant", "accepted": ["Tower Restaurant", "tower restaurant", "restaurant"], "explanation": "The answer key gives “Tower Restaurant”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "Tower Restaurant", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q16", "displayNum": 16, "label": "Blank 16 - complete the corresponding blank in the source task shown above.", "answer": "views", "accepted": ["views"], "explanation": "The answer key gives “views”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "views", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q17", "displayNum": 17, "label": "Blank 17 - complete the corresponding blank in the source task shown above.", "answer": "history", "accepted": ["history"], "explanation": "The answer key gives “history”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "history", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q18", "displayNum": 18, "label": "Blank 18 - complete the corresponding blank in the source task shown above.", "answer": "seven-screen", "accepted": ["seven-screen", "seven screen"], "explanation": "The answer key gives “seven-screen”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "seven-screen", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "Thank you for calling the Tourist Line. There are many different ways of getting round the \ncity and we'd like to suggest some you may not have thought of.\nHow about a city trip by boat? There are four main stopping points - from west to east \nstop A Green Banks, stop B City Bridge, stop C Roman Landing and stop D Newtown.\nYou can find the main booking office at stop A.\nThe first boat leaves at 8 a.m. and the last one at 6.30 p.m. There are also many \nattractions you can visit along the river. At Stop A, if you have time, you can visit the fine \n16th century palace here built for the king with its beautiful formal gardens (Q14). It's \nvery near the booking office. Now you can enjoy every corner of this superb residence.\nStop B Why don't you visit Tower Restaurant  (Q15) with its wide range of refreshments? \nThis is a place where you can sit and enjoy the wonderful views (Q16) over the old \ncommercial and banking centre of the city.\nStop C is the area where, in the first century AD, invading soldiers crossed the river, this \nwas much shallower than it is now. That's why this area is called Roman Landing. \nThere's an interactive Museum to visit here with a large shop which has a good range of \nlocal history (Q17) books.\nAt the furthest point of the trip, stop D, the most exciting place to visit is the new \nEntertainment Complex with seven-screen (Q18) cinema, bowling alley and video games \narcade.\nBesides the boat tours, there are city buses. Two companies offer special services:\nThe Top Bus Company runs all its tours with a live commentary in English. Tours leave \nfrom 8.30 a.m every 20 minutes (Q19). There are departures from Central Station, Castle \nHill and Long Walk. This is a hop-on hop-off service and tickets are valid for 24 hours. \nFor further details call Top Bus on 02089447810.\nThe Number One Sightseeing Tour is available with a commentary in eight languages. \nBuses depart from Central Station (Q20) every five to six minutes from about 9 a.m with \nthe last bus at around 7 p.m. There are also Number One services with an \nEnglish-speaking…\n18. seven-srceen \n19. every 20 minutes \n20. Central station \n16. views \n17. history \n\nIELTS THANH LOAN", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX10", "title": "The Dinosaur Museum", "type": "Note / Table / Sentence Completion", "instruction": "Questions 11-15 Complete the sentences below Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer", "audio": "assets/audio/NTS_10.mp3", "source": "Cambridge IELTS 8", "images": ["assets/images/ex10_p1.jpg"], "questions": [{"id": "q11", "displayNum": 11, "label": "Blank 11 - complete the corresponding blank in the source task shown above.", "answer": "1.30", "accepted": ["1.30"], "explanation": "The answer key gives “1.30”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "1.30", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q12", "displayNum": 12, "label": "Blank 12 - complete the corresponding blank in the source task shown above.", "answer": "25 December", "accepted": ["25 December", "25 december", "christmas day"], "explanation": "The answer key gives “25 December”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "25 December", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q13", "displayNum": 13, "label": "Blank 13 - complete the corresponding blank in the source task shown above.", "answer": "car park", "accepted": ["car park", "car-park", "parking lot"], "explanation": "The answer key gives “car park”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "car park", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q14", "displayNum": 14, "label": "Blank 14 - complete the corresponding blank in the source task shown above.", "answer": "45", "accepted": ["45"], "explanation": "The answer key gives “45”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "45", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q15", "displayNum": 15, "label": "Blank 15 - complete the corresponding blank in the source task shown above.", "answer": "tables", "accepted": ["tables", "some tables"], "explanation": "The answer key gives “tables”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "tables", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "Hello, and thank you for asking me to your teachers’ meeting to talk about the \nDinosaur Museum and to tell you a bit about what you can do with your students \nthere.\nWell, let me give you some of the basic information first. In regards to opening \nhours, we’re open every day of the week from 9.00 am to 8.00 pm except on \nMondays when we close at 1.30 pm (Q11). And, in fact the only day in the year \nwhen we’re closed is on the 25th of December (Q12). You can book a guided tour \nfor your school group any time that we’re open.\nIf you bring a school group to the museum, when you arrive we ask you to remain \nwith your group in the car park (Q13). One or more of the tour guides will \nwelcome you there and brief you about what the tour will be about. We do this \nthere because our entrance is quite small and we really haven’t got much room for \nbriefing groups in the exhibition area.\nAs far as the amount of time you’ll need goes, if you bring a school group you \nshould plan on allowing a minimum of 90 minutes for the visit. This allows 15 \nminutes to get on and off the coach, 45 minutes (Q14) for the guided tour and 30 \nminutes for after-tour activities.\nIf you’re going to have lunch at the museum you will, of course, have to allow more \ntime. There are two cafes in the museum, with seating for 80 people. If you want to \neat there you’ll need to reserve some seating, as they can get quite crowded at \nlunch time. Then outside the museum at the back there are tables (Q15), and \nstudents can bring their own lunch and eat it there in the open air.\n14. 45 \n15. (some) tables \n\nIELTS THANH LOAN", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX11", "title": "THE NATIONAL ARTS CENTRE", "type": "Note / Table / Sentence Completion", "instruction": "Questions 11-16 Complete the notes below Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer • Questions 17-20 Complete the table below Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer", "audio": "assets/audio/NTS_11.mp3", "source": "Cambridge IELTS 8", "images": ["assets/images/ex11_p1.jpg", "assets/images/ex11_p2.jpg"], "questions": [{"id": "q11", "displayNum": 11, "label": "Blank 11 - complete the corresponding blank in the source task shown above.", "answer": "classical music", "accepted": ["classical music", "concerts"], "explanation": "The answer key gives “classical music”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "classical music", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q12", "disp answer": "363", "accepted": ["363"], "explanation": "The answer key gives “363”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "363", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q17", "displayNum": 17, "label": "Blank 17 - complete the corresponding blank in the source task shown above.", "answer": "Garden Hall", "accepted": ["Garden Hall", "garden hall", "the garden hall"], "explanation": "The answer key gives “Garden Hall”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "Garden Hall", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q18", "displayNum": 18, "label": "Blank 18 - complete the corresponding blank in the source task shown above.", "answer": "Three Lives", "accepted": ["Three Lives"], "explanation": "The answer key gives “Three Lives”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "Three Lives", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q19", "displayNum": 19, "label": "Blank 19 - complete the corresponding blank in the source task shown above.", "answer": "4.50", "accepted": ["4.50"], "explanation": "The answer key gives “4.50”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "4.50", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q20", "displayNum": 20, "label": "Blank 20 - complete the corresponding blank in the source task shown above.", "answer": "Faces of China", "accepted": ["Faces of China"], "explanation": "The answer key gives “Faces of China”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "Faces of China", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "Hello, and welcome to Focus on the Arts. I’m your host – Dave Green- and this is your \nvery own local radio programme. Every Friday evening we put the spotlight  on \ndifferent arts and culture facilities, and look at the shows and events that are on offer \nin the coming weeks.\nAnd today the focus is on The National Arts Centre. Now, if you don’t already know it \nyourself I’m sure you’re all heard of it. It’s famous throughout the word as one of the \nmajor venues for classical music.\nBut did you know that it is actually much more than just a place to hear concerts? The \nCentre itself is a huge complex that caters for great range of arts. Under a single roof  \nit houses concert rooms, theatres, cinemas, art galleries and a wonderful public \nlibrary, as well as service facilities including three restaurants and a bookshop. So at \nany one time, the choice of entertainment there is simply enormous.\nSo, how did they manager to build such a big arts complex right in the heart of the \ncity? Well, the area was completely destroyed by bombs during the war in 1940. So the \nopportunity was taken to create a cultural centre that would be, what they called: ‘THE \nCity’s gift to the Nation’. Of course it took a while for such a big project to get started, \nbut it was planned in the 60s, built in the 70s and eventually opened to the public in \n1983. Ever since then it has proved to be a great to be a great success. It is not privately \nowned, like many arts centres, but is still in public hands – it’s run by the City Council \nBoth our National Symphony Orchestra and National Theater Company were involved \nin the planning of the project, and they are now based there – giving regular \nperformances every week  – and as the Centre is open 363 days of the year, there are \nplenty of  performances to choose from.\nSo, to give you some idea of what’s on, and to help you choose from the many \npossibilities, we’re b made a selection of the star attractions.\n\nExercise 11:  \n16. 363 \n17. (the) Garden Hall \n18. Three lives \n19. 4.50 \n20. Faces of China\nQ11\nQ12\nQ13\nQ14\nQ15\nQ16\n\nIELTS THANH LOAN", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX12", "title": "Self-Access Centre Improvements", "type": "Note / Table / Sentence Completion", "instruction": "Questions 25-30 Complete the notes below Write NO MORE THAN TWO WORDS for each answer", "audio": "assets/audio/NTS_12.mp3", "source": "Cambridge IELTS 9", "images": ["assets/images/ex12_p1.jpg"], "questions": [{"id": "q25", "displayNum": 25, "label": "Blank 25 - complete the corresponding blank in the source task shown above.", "answer": "reading", "accepted": ["reading"], "explanation": "The answer key gives “reading”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "reading", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q26", "displayNum": 26, "label": "Blank 26 - complete the corresponding blank in the source task shown above.", "answer": "CD", "accepted": ["CD"], "explanation": "The answer key gives “CD”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "CD", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q27", "displayNum": 27, "label": "Blank 27 - complete the corresponding blank in the source task shown above.", "answer": "workb els. They would take up a lot less room and so that would \nincrease the work space for text books and so on.\nThat would be great. It is a bit cramped in there at times.\nWhat about other resources? Do you have a list of things that the students \nwould like to see improved?\nYes, one of the comments that students frequently make is that they find if \ndifficult to find materials that are appropriate for their level, especially \nreading resources. So I think we need to label them more clearly.\nWe that’s easy enough, we can get that organised very quickly. In fact I \nthink we should review all of the study resources as some of them are \nlooking a bit out-of-date.\nDefinitely. The CD section especially needs to be more current. I think we \nshould get some of the ones that go with our latest course books and also \nmake multiple copies.\nGood, now I was also thinking about some different materials that we \nhaven’t got in there at all. What do you think of the idea of introducing \nsome workbooks? If we break them up into separate pages and laminate \nthem, they’d be a great resource. The students could study the main course \nbook in class and then do follow-up practice in the Self-Access Centre.\nThat sounds good.\nOkay, now finally we need to think about how the room is used. I’ll have \nto talk to the teachers and make sure we can all reach some agreement on \na timetable to supervise the centre after class. But we also need to think \nabout security, too. Especially if we’re going to invest in some new \nequipment.\nWhat about putting in an alarm?\nQ25\nQ26\nQ27\nQ28\nQ29\n\nIELTS THANH LOAN\nPAM: \nJUN: \nPAM:", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX13", "title": "Presentation Visual Aids", "type": "Note / Table / Sentence Completion", "instruction": "Questions 27-30 Complete the table below Write in other parts of \nthe world. For example it is found in commercially made Italian pizzas, in \nAmerican fast food and in Britain MSG is used in things like potato crisps.\nSo, how exactly does MSG work? Well, in the Western world, we commonly \ntalk of four ‘tastes’, and I’m sure you’re all familiar with the concepts of \nsweet, sour, bitter and salt. Well, in 1908, Kikunae Ikeda identified a fifth \n‘taste’. And it is thought that MSG intensiﬁes this naturally occurring \n‘taste’ in some food. It does make perfect evolutionary sense that we \nshould have the ability to detect or taste glutamate because it is the amino \nacid which is most common in natural foods.\nJohn Prescott, an associate professor at the University of Chicago, \nsuggests that this fifth taste serves a purpose just as the other tastes do. He \nsuggests that it signals to us the presence of protein in food, in the same \nway that sweetness indicates that a food contains energy-giving \ncarbohydrates. Bitterness, he says, alerts us of toxins in the food, while \nsourness warns us of spoilage and saltiness signals the presence of \nminerals.\nSo, what else do we know about this fifth taste…\nQ34\nQ35+Q36\nQ37\nQ38\nQ39\nQ40\n38. common \n39. bitterness \n40. minerals \n\nIELTS THANH LOAN", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX15", "title": "Differences between individuals in the workplace", "type": "Note / Table / Sentence Completion", "instruction": "Questions 21-23 Complete the notes below Write ONE WORD ONLY for each answer", "audio": "assets/audio/NTS_15.mp3", "source": "Cambridge IELTS 7", "images": ["assets/images/ex15_p1.jpg"], "questions": [{"id": "q21", "displayNum": 21, "label": "Blank 21 - complete the corresponding blank in the source task shown above.", "answer": "attitudes", "accepted": ["attitude", "attitudes"], "explanation": "The answer key gives “attitudes”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "attitudes", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q22", "displayNum": 22, "label": "Blank 22 - complete the corresponding blank in the source task shown above.", "answer": "gender", "accepted": ["gender", "sex"], "explanation": "The answer key gives “gender”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "gender", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q23", "displayNum": 23, "label": "Blank 23 - complete the corresponding blank in the source task shown above.", "answer": "creativity", "accepted": ["creativity", "creativeness"], "explanation": "The answer key gives “creativity”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "creativity", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "TUTOR: \nPHILIP: \nTUTOR: \nPHILIP:\nTUTOR: \nPHILIP:\nWell, you’ve both been looking at different styles of managing \nindividuals in companies and the workplace. How's the research \ngoing, Philip?\nWell, I’ve been looking at why individualism, I mean individual \ndifferences, are such an important area of management studies. \nWhen you think about any organization, be it a family business or \na multinational company, they are all fundamentally a group of \npeople working together. But it's what these individuals \ncontribute to their places of work that makes you realize how \nimportant they are. Of course they bring different ideas, but it’s \nalso their attitudes and their experiences of learning. Diversity is \nimportant in these areas too.\nSo why do people behave so differently from one another at work?\nThere are lots of reasons but research has shown a lot of it comes \ndown to personality. And the other factor is gender. It's a well - \nknown fact that men and women do lots of things in different \nways, and the workplace is no different.\nDid you look at the effects of this variation on companies?\nYes, I did.\nOn the positive side, exposure to such diversity helps encourage \ncreativity which is generally an asset to a company.\nBut unfortunately individual differences are also the root of \nconﬂict between staff and they can lead to difficulties for \nmanagement, which can sometimes be serious.\nQ21\nQ22\nQ23\n\nIELTS THANH LOAN", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX16", "title": "Ceramics, Glass and Concrete", "type": "Note / Table / Sentence Completion", "instruction": "Questions 31-40 Complete the sentences below Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer", "audio": "assets/audio/NTS_16.mp3", "source": "The official guide to IELTS", "images": ["assets/images/ex16_p1.jpg"], "questions": [{"id": "q31", "displayNum": 31, "label": "Blank 31 - complete the corresponding blank in the source task shown above.", "answer": "29,000 years", "accepted": ["29,000 years"], "explanation": "The answer key gives “29,000 years”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "29,000 years", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q32", "displayNum": 32, "label": "Blank 32 - complete the corresponding blank in the source task shown above.", "answer": "southern Europe", "accepted": ["southern Europe", "southern europe", "south europe"], "exp đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "Hi everyone – today I’m going to be talking about the origins of ceramics. So, first of \nall, let’s start off with – what is a ceramic? Well, generally speaking, ceramics are \nwhat you get when you apply heat to certain inorganic, non-metallic solids and then \nallow them to cool. And examples of ceramics are everyday things like earthenware \npots, crockery, glassware and even concrete.\nSo how did it begin? Well it all started around 29,000 years ago when humans \ndiscovered that if you dig up some soft day from the ground, mould it into a shape \nand then heat it up to a very high temperature, when it cools the clay has been \ntransformed into something hard and rigid. And so – what did those first humans do \nwith their discovery? Well – they created ﬁgurines which were small statues and \nwhich depicted animals or gods or any shape that the clay could be moulded into. \nAnd all this activity was centred around southern Europe where there is also evidence \nof ceramics that were created much later.\nThe early humans also found a practical use for their discovery, such as storing \nthings like grains – although there were drawbacks. The pots were porous so that, \nalthough they could carry water in them, it wasn’t possible to store it over a long \nperiod. And also, they were quite brittle and shattered very easily if they were \ndropped.\nBut despite these problems, it was many thousands of years before there were any \nimprovements. In China at around 200 BC, they discovered that by adding minerals \nto the clay they could improve both the appearance and the strength of the ceramics. \nBut it took nearly a thousand years before they perfected the process to produce \nhigh-quality ceramics known as porcelain. And once they had perfected the process, \nthey kept it a secret – for another thousand years! \nQ31\nQ32\nQ33\nQ34\n36. china stone \n37. cooling (down)\n38. windows \n39. volcanic ash \n40. harbours \n\nIELTS THANH LOAN\n\nIt wasn’t until the 18th century that the secret began to unravel. A German alchemist \ncalled Johann Friedrich Bottger was asked by the king to make gold out of lead. \nUnfortunately, Bottger failed to achieve this and soon gave up, but in order to please \nthe king he attempted to make high-quality porcelain. And after many years of \nexperimentation, he discovered that by adding quartz and a material called China \nstone to very high-quality clay he managed to get the same results that the Chinese \nhad been achieving for the last 1000 years.\nWe’ll now look at another ceramic which is made from mixing sand with minerals \nand heating to over 600 degrees Celsius. When this mixture cools the result is of \ncourse glass. The main difference between ceramics made from clay and glass is \nthat clay is made up of crystalline plates which become locked together in the \ncooling process whereas glass cools too quickly for crystals to form. Apart from \nthat, the process of heating up naturally occurring materials to transform them is \nthe same. \nThe origins of glass date back to 3500 BC but it wasn’t until the Roman Empire, \n2000 years ago, that the art of glass-blowing and the practical users of glass became \nmore widespread. One of the more innovative uses was to use it in windows as, up \nuntil then, they had just been holes in walls. It must have been very draughty in \nthose days!\nThe Romans were also responsible for inventing concrete. And although the origins \nare uncertain, experts think that this is largely due to the high level of volcanic \nactivity in the area. The Romans observed that, when volcanic ash mixes with water \nand then cools, it gets extremely hard and almost impossible to break up. The \nchemical reaction that follows is very complex and continues for many years, and \nthe concrete just keeps getting harder. Evidence of this is the numerous Roman \nremains that are still standing, many of which are almost completely intact.\nOne of the most important facts about concrete for the romans was that it can be \ncreated underwater. As the Roman Empire grew, the Romans needed to take control \nof the seas and for this they needed to build harbours capable of holding a fleet of \nships. Pouring concrete mixture into the sea immediately started the hardening \nprocess and rather than just dissolving in the mass of water, the substance was \ntough and long-lasting. This strange characteristic of concrete made a significant \ncontribution to the success of the Roman Empire.\nQ36\nQ37\nQ38\nQ39\nQ40\n\nIELTS THANH LOAN", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX17", "title": "Preparing and Giving a Presentation", "type": "Note / Table / Sentence Completion", "instruction": "Questions 31-40 Complete the notes below Write NO MORE THAN TWO WORDS for each answer", "audio": "assets/audio/NTS_17.mp3", "source": "The official guide to IELTS", "images": ["assets/images/ex17_p1.jpg"], "questions": [{"id": "q31", "displayNum": 31, "label": "Blank 31 - complete the corresponding blank in the source task shown above.", "answer": "supportive", "accepted": ["supportive"], "explanation": "The answer key gives “supportive”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "supportive", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q32", "displayNum": 32, "label": "Blank 32 - complete the corresponding blank in the source task shown above.", "answer": "pay attention", "accepted": ["pay attention"], "explanation": "The answer key gives “pay attention”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "pay attention", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q33", "displayNum": 33, "label": "Blank 33 - complete the corresponding blank in the source task shown above.", "answer": "next steps", "accepted": ["next steps"], "explanation": "The answer key gives “next steps”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "next steps", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q34", "displayNum": 34, "label": "Blank 34 - complete the corresponding blank in the source task shown above.", "answer": "consistent", "accepted": ["consistent"], "explanation": "The answer key gives “consistent”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "consistent", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q35", "displayNum": 35, "label": "Blank 35 - complete the corresponding blank in the source task shown above.", "answer": "graphics", "accepted": ["graphics"], "explanation": "The answer key gives “graphics”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "graphics", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q36", "displayNum": 36, "label": "Blank 36 - complete the corresponding blank in the source task shown above.", "answer": "tone", "accepted": ["tone"], "explanation": "The answer key gives “tone”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "tone", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q37", "displayNum": 37, "label": "Blank 37 - complete the corresponding blank in the source task shown above.", "answer": "silence", "accepted": ["silence", "a silence", "silences"], "explanation": "The answer key gives “silence”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "silence", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q38", "displayNum": 38, "label": "Blank 38 - complete the corresponding blank in the source task shown above.", "answer": "weak verbs", "accepted": ["weak verbs"], "explanation": "The answer key gives “weak verbs”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "weak verbs", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q39", "displayNum": 39, "label": "Blank 39 - complete the corresponding blank in the source task shown above.", "answer": "repeat it", "accepted": ["repeat it"], "explanation": "The answer key gives “repeat it”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "repeat it", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}, {"id": "q40", "displayNum": 40, "label": "Blank 40 - complete the corresponding blank in the source task shown above.", "answer": "predicting", "accepted": ["predicting"], "explanation": "The answer key gives “predicting”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "predicting", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word limit."}]}], "transcript_text": "Hello everyone. You've all been given an assignment for your Sociology course which \nwill involve giving a presentation to the rest of the group. And so, today, I’m going to \nbe giving you a few tips on how to prepare your presentations. This should help you \nwith your current assignment — but a lot of the principles I’ll be putting across will \nbe general principles which will, of course, help you with all your future \npresentations.\nSo first of all, the most important thing to consider is your audience and in this \ninstance, your audience are the other students in your group. There are three points \nto bear in mind. Firstly, you need to ask yourself what they need to know; secondly, \nit’s useful to consider whether they'll be supportive or not; and thirdly — will it be a \nsmall group, say three or four, a moderate gathering of twenty or so people (as for \nyour current assignment) or will there be hundreds of people? \n[pause] Having said all that, what I’m about to tell you will apply equally to any \naudience.\nSo — how do you structure your presentation? Right at the beginning, you should tell \nthem something that forces them to pay attention. This could be something surprising \nor even shocking but it needs to be relevant! After that, you need a list of items or \ntopics showing them what you'll be covering rather like an agenda — and then the \nmain part of the presentation will follow. This main part will be the detailed \ninformation you'll be presenting and could include facts, statistics, personal \nexperiences, etc. After this you should summarise what you've presented and close \nwith what I call ‘next steps’. For this assignment, you could simply point the group to \nother Sociology reference material. In other cases, you may want to suggest some \nactions that people can take.\nNow - what about the design of the slides for your laptop? Well the important thing \nhere is to be consistent. You need to have the same type of font and use the same\nQ31\nQ32\nQ33\nQ34\n36. tone \n37. (a) silence/ silences \n38. weak verbs \n39. repeat it \n40. predicting \n\nIELTS THANH LOAN\n\ncolour and size for the same elements. For example, all headers need to look the \nsame, all bullet points need to be presented in the same way. And don’t just stick to \nwords. Bring the presentation to life by adding graphics. These could be in several \nforms such as pictures, flow-charts, diagrams, histograms and so on.\nAnd so — let’s move on now to presenting. You have your presentation prepared \nand you’re ready to start. Well — it’s important to give a good impression from the \nstart. So take three deep breaths, look at the audience, no matter how frightening \nthey may be, and be enthusiastic and energetic. As you go through the presentation \nremember to provide some variety in the way you speak. So, for example, you can \ntalk fairly rapidly for information that may be familiar, but then slow down for more \nunfamiliar sections. And change your tone as you speak — don’t keep it at the same \nlevel all the way through. As I mentioned, look at your audience. Er, a good tip is to \npick people out and look at them for around five seconds. Not looking at the \naudience gives the impression that you're either not interested in them or terriﬁed \nof them. Looking too long at one particular person may make them feel rather \nuncomfortable. There may be points in your presentation that you want your \naudience to really absorb and in order to make important points stand out you may \nconsider adding silence right after these. It will give people time to reflect on what \nyou've just said. Also — you may be presenting complicated ideas or technical \ndetails but try to keep everything as simple as possible. Use simple words and as few \nas possible. And be clear. If you say something like ‘this appears to be’, it implies \nuncertainty. So using weak verbs such as ‘appears, ‘seems’, ‘could be’, etc. needs to \nbe avoided.\nI'll just finish off with a few thoughts on questions and interruptions from the \naudience. You may choose to invite questions should be encouraged. It provides you \nwith some feedback on how interested the audience is and how well they’re \nunderstanding you. When a question is asked you need to provide an answer that is \nas accurate as possible. So initially, my tip is to repeat it. This will ensure you have \nheard it correctly and will give you a few seconds to gather your thoughts. \nInterruptions, on the other hand, can be unwelcome and you may get them for a \nvariety of reasons. It is likely, however, that there’s something in your presentation \nthat's unclear confusing. So my advice is to reduce problems by reading through \nyour presentation beforehand and predicting potential points which could cause \ninterruptions. You may then want to change that part of your presentation or, at \nleast, you will be prepared if someone does interrupt you.\nNow, do you have any questions....\nQ35\nQ36\nQ37\nQ38\nQ39\nQ40\n\nIELTS THANH LOAN", "knowledge": ["Read the word limit before listening.", "Predict the required part of speech and information type.", "Check spelling, singular/plural and grammatical fit after listening."]}, {"id": "EX18", "title": "Kite-making by the Maori people of New Zealand", "type": "Note / Table / Sentence Completion", "instruction": "Questions 31-40 Complete the notes below Write ONE WORD for each answer", "audio": "assets/audio/NTS_18.mp3", "source": "Cambridge IELTS 8", "images": ["assets/images/ex18_p1.jpg"], "questions": [{"id": "q31", "displayNum": 31, "label": "Blank 31 - complete the corresponding blank in the source task shown above.", "answer": "food", "accepted": ["food"], "explanation": "The answer key gives “food”. Check the full transcript below to review the exact listening context and spelling.", "memory": [{"item": "food", "vi": "Đáp án cần ghi đúng chính tả và đúng giới hạn từ của đề.", "note": "Đối chiếu ngữ pháp trước/sau chỗ trống và word
