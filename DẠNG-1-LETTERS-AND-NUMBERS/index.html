59783", "accepted": ["3659783", "365 9783", "365-9783"], "skill": "Telephone number", "evidence": "Operator: “The number is 3659783.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Operator: The number is 3659783.\nEnquirer: 3659783. Thank you very much.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Telephone number. Đáp án đúng là “3659783”.", "memory": [{"item": "the number", "vi": "số điện thoại", "note": "Trong ngữ cảnh Directory Enquiries = telephone number."}]}], "transcript_text": "Operator: Directory Enquiries. What city please?\nEnquirer: Manchester. I’d like to have the telephone number of Mr. John Abel, please.\nOperator: Yes, ma’am. How do you spell his last name?\nEnquirer: It’s A-B-E-L, Abel.\nOperator: Thank you. And could you tell me his address?\nEnquirer: It’s 2418 Grestone Road.\nOperator: The number is 3659783.\nEnquirer: 3659783. Thank you very much.\nOperator: You’re welcome. Have a good day.", "knowledge": ["Địa chỉ thường gồm house number + street name. Nếu street name đã in sẵn, chỉ điền phần còn thiếu."]}, {"id": "EX05", "title": "Self-introductions", "type": "Table completion", "instruction": "Listen to the self-introductions and complete the information about each person.", "audio": "assets/audio/lan5.mp3", "source": "Basic IELTS Listening", "questions": [{"id": "q1", "label": "Liz - Where from", "answer": "Finland", "accepted": ["Finland"], "skill": "Country", "evidence": "“I’m Elizabeth Sheen from Finland.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "I’m Elizabeth Sheen from Finland. You can call me Liz. It is spelled L-I-Z, easy to remember. I’m studying computer science.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Country. Đáp án đúng là “Finland”.", "memory": [{"item": "from / come from", "vi": "đến từ", "note": "Paraphrase tín hiệu cho cột “Where from”."}]}, {"id": "q2", "label": "Liz - Subject", "answer": "Computer science", "accepted": ["Computer science"], "skill": "Subject", "evidence": "“I’m studying computer science.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "I’m Elizabeth Sheen from Finland. You can call me Liz. It is spelled L-I-Z, easy to remember. I’m studying computer science.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Subject. Đáp án đúng là “Computer science”.", "memory": [{"item": "study / be studying + subject", "vi": "học + môn/ngành", "note": "Tín hiệu cho cột “Subject”."}]}, {"id": "q3", "label": "Chris - Where from", "answer": "The United States", "accepted": ["The United States", "United States", "the United States", "USA", "U.S.A.", "US"], "skill": "Country", "evidence": "“I’m Chris ... from the United States.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "I’m Chris, C-H-R-I-S, from the United States. I’m studying engineering.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Country. Đáp án đúng là “The United States”.", "memory": [{"item": "from / come from", "vi": "đến từ", "note": "Paraphrase tín hiệu cho cột “Where from”."}]}, {"id": "q4", "label": "Chris - Subject", "answer": "Engineering", "accepted": ["Engineering"], "skill": "Subject", "evidence": "“I’m studying engineering.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "I’m Chris, C-H-R-I-S, from the United States. I’m studying engineering.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Subject. Đáp án đúng là “Engineering”.", "memory": [{"item": "study / be studying + subject", "vi": "học + môn/ngành", "note": "Tín hiệu cho cột “Subject”."}]}, {"id": "q5", "label": "Paulo - Where from", "answer": "Japan", "accepted": ["Japan"], "skill": "Country", "evidence": "“I come from Japan.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "My name is Paulo White and I come from Japan, and I’m studying English.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Country. Đáp án đúng là “Japan”.", "memory": [{"item": "from / come from", "vi": "đến từ", "note": "Paraphrase tín hiệu cho cột “Where from”."}]}, {"id": "q6", "label": "Paulo - Subject", "answer": "English", "accepted": ["English"], "skill": "Subject", "evidence": "“I’m studying English.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "My name is Paulo White and I come from Japan, and I’m studying English.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Subject. Đáp án đúng là “English”.", "memory": [{"item": "study / be studying + subject", "vi": "học + môn/ngành", "note": "Tín hiệu cho cột “Subject”."}]}], "transcript_text": "Example: My name is Charles Chang from Leeds. I’m studying music here.\n\n1. I’m Elizabeth Sheen from Finland. You can call me Liz. It is spelled L-I-Z, easy to remember. I’m studying computer science.\n2. I’m Chris, C-H-R-I-S, from the United States. I’m studying engineering.\n3. My name is Paulo White and I come from Japan, and I’m studying English.", "knowledge": ["Khi hoàn thành bảng, xác định trước loại thông tin của từng cột (country / subject) để dự đoán dạng từ cần nghe."]}, {"id": "EX06", "title": "Numbers in Context", "type": "Number dictation", "instruction": "Listen and fill in the missing numbers.", "audio": "assets/audio/lan6.mp3", "source": "Basic IELTS Listening", "questions": [{"id": "q1", "label": "The sweater costs ___ pounds.", "answer": "46", "accepted": ["46", "forty-six"], "skill": "Cardinal number", "evidence": "1. The sweater costs 46 pounds.", "suffix": "", "placeholder": "Type your answer", "evidence_full": "The sweater costs 46 pounds.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Cardinal number. Đáp án đúng là “46”.", "memory": [{"item": "cardinal number", "vi": "số đếm", "note": "Chú ý phân biệt -tee úng là “29”.", "memory": [{"item": "cardinal number", "vi": "số đếm", "note": "Chú ý phân biệt -teen và -ty bằng trọng âm và âm cuối."}]}, {"id": "q6", "label": "My grandfather has ___ grandchildren.", "answer": "18", "accepted": ["18", "eighteen"], "skill": "Cardinal number", "evidence": "6. My grandfather has 18 grandchildren.", "suffix": "", "placeholder": "Type your answer", "evidence_full": "My grandfather has 18 grandchildren.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Cardinal number. Đáp án đúng là “18”.", "memory": [{"item": "cardinal number", "vi": "số đếm", "note": "Chú ý phân biệt -teen và -ty bằng trọng âm và âm cuối."}]}, {"id": "q7", "label": "Bill wears size ___.", "answer": "43", "accepted": ["43", "forty-three"], "skill": "Cardinal number", "evidence": "7. Bill was size 43.", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Bill was size 43.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Cardinal number. Đáp án đúng là “43”.", "memory": [{"item": "cardinal number", "vi": "số đếm", "note": "Chú ý phân biệt -teen và -ty bằng trọng âm và âm cuối."}]}, {"id": "q8", "label": "The temperature was ___°C yesterday.", "answer": "38", "accepted": ["38", "thirty-eight"], "skill": "Cardinal number", "evidence": "8. The temperature was 38°C yesterday.", "suffix": "", "placeholder": "Type your answer", "evidence_full": "The temperature was 38°C yesterday.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Cardinal number. Đáp án đúng là “38”.", "memory": [{"item": "cardinal number", "vi": "số đếm", "note": "Chú ý phân biệt -teen và -ty bằng trọng âm và âm cuối."}]}, {"id": "q9", "label": "The train arrived at ___ o’clock.", "answer": "12", "accepted": ["12", "twelve"], "skill": "Cardinal number", "evidence": "9. The train arrived at 12 o’clock.", "suffix": "", "placeholder": "Type your answer", "evidence_full": "The train arrived at 12 o’clock.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Cardinal number. Đáp án đúng là “12”.", "memory": [{"item": "cardinal number", "vi": "số đếm", "note": "Chú ý phân biệt -teen và -ty bằng trọng âm và âm cuối."}]}, {"id": "q10", "label": "I got ___ on my English test.", "answer": "87", "accepted": ["87", "eighty-seven"], "skill": "Cardinal number", "evidence": "10. I got 87 on my English test.", "suffix": "", "placeholder": "Type your answer", "evidence_full": "I got 87 on my English test.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Cardinal number. Đáp án đúng là “87”.", "memory": [{"item": "cardinal number", "vi": "số đếm", "note": "Chú ý phân biệt -teen và -ty bằng trọng âm và âm cuối."}]}], "transcript_text": "1. The sweater costs 46 pounds.\n2. Tom bought 13 books yesterday.\n3. Mary is 26 years old.\n4. Janet was 40 minutes late.\n5. There are 29 students in my class.\n6. My grandfather has 18 grandchildren.\n7. Bill was size 43.\n8. The temperature was 38°C yesterday.\n9. The train arrived at 12 o’clock.\n10. I got 87 on my English test.", "knowledge": ["Đặc biệt chú ý cặp -teen và -ty: thirteen/thirty, eighteen/eighty...; trọng âm giúp phân biệt."]}, {"id": "EX07", "title": "Directory Enquiries - Edinburgh", "type": "Form completion", "instruction": "Listen to the following dialogue between an operator and an enquirer. As you listen, write down the name, address and phone number in the space below.", "audio": "assets/audio/lan7.mp3", "source": "IELTS Listening strategies", "questions": [{"id": "q1", "label": "City", "answer": "Edinburgh", "accepted": ["Edinburgh"], "skill": "City name", "evidence": "Enquirer: “Edinburgh.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Operator: Directory Enquiries. What city please?\nEnquirer: Edinburgh. I want to have the telephone number of Mrs. Diana Paxton, please.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng City name. Đáp án đúng là “Edinburgh”.", "memory": [{"item": "What city?", "vi": "Thành phố nào?", "note": "Định vị city name."}]}, {"id": "q2", "label": "Name", "answer": "Diana Paxton", "accepted": ["Diana Paxton"], "skill": "Name + spelling", "evidence": "“Mrs. Diana Paxton” and P-A-X-T-O-N.", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Enquirer: Edinburgh. I want to have the telephone number of Mrs. Diana Paxton, please.\nOperator: Yes, ma’am. Could you spell her last name, please?\nEnquirer: Yes. It’s P-A-X-T-O-N, Paxton.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Name + spelling. Đáp án đúng là “Diana Paxton”.", "memory": [{"item": "last name", "vi": "họ", "note": "= surname."}, {"item": "spell", "vi": "đánh vần", "note": "Nghe từng chữ cái P-A-X-T-O-N."}]}, {"id": "q3", "label": "Address", "answer": "932 Beach Road", "accepted": ["932 Beach Road", "932 Beach Rd", "932 Beach Rd."], "skill": "Address", "evidence": "“932 Beach Road.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Operator: Thank you, and her address?\nEnquirer: 932 Beach Road.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Address. Đáp án đúng là “932 Beach Road”.", "memory": [{"item": "address", "vi": "địa chỉ", "note": "House number + street name."}]}, {"id": "q4", "label": "Telephone number", "answer": "4023685", "accepted": ["4023685", "402 3685", "402-3685"], "skill": "Telephone number", "evidence": "“The number is 4023685.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Operator: The number is 4023685.\nEnquirer: 4023685. Thank you very much.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Telephone number. Đáp án đúng là “4023685”.", "memory": [{"item": "telephone number", "vi": "số điện thoại", "note": "Chép đúng toàn bộ chuỗi số."}]}], "transcript_text": "Operator: Directory Enquiries. What city please?\nEnquirer: Edinburgh. I want to have the telephone number of Mrs. Diana Paxton, please.\nOperator: Yes, ma’am. Could you spell her last name, please?\nEnquirer: Yes. It’s P-A-X-T-O-N, Paxton.\nOperator: Thank you, and her address?\nEnquirer: 932 Beach Road.\nOperator: The number is 4023685.\nEnquirer: 4023685. Thank you very much.\nOperator: You’re welcome.", "knowledge": ["Street name có thể đi kèm dạng viết tắt hợp lệ như Road/Rd nếu giáo viên cho phép; mặc định hiển thị đáp án chuẩn theo KEY."]}, {"id": "EX08", "title": "Course Enrolment - Peter Williams", "type": "Form completion", "instruction": "You will hear a conversation between a secretary and a student. As you listen, fill in the appropriate information on the form below.", "audio": "assets/audio/lan8.mp3", "source": "IELTS Listening strategies", "questions": [{"id": "q1", "label": "Surname (IN CAPITAL LETTERS)", "answer": "WILLIAMS", "accepted": ["WILLIAMS", "Williams", "williams"], "skill": "Surname spelling", "evidence": "“Williams ... W-I-L-L-I-A-M-S.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Secretary: What’s your surname please?\nStudent: Williams.\nSecretary: Could you spell that for me?\nStudent: Yes. It’s W-I-L-L-I-A-M-S.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Surname spelling. Đáp án đúng là “WILLIAMS”.", "memory": [{"item": "surname", "vi": "họ", "note": "Thường được đánh vần trong form completion."}]}, {"id": "q2", "label": "First name", "answer": "Peter", "accepted": ["Peter"], "skill": "First name", "evidence": "“Peter. That’s spelled P-E-T-E-R.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Secretary: What’s your first name?\nStudent: Peter. That’s spelled P-E-T-E-R.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng First name. Đáp án đúng là “Peter”.", "memory": [{"item": "first name", "vi": "tên", "note": "Phân biệt với surname."}]}, {"id": "q3", "label": "Country", "answer": "Canada", "accepted": ["Canada"], "skill": "Country", "evidence": "Student: “Canada.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Secretary: Thanks. Where are you from, Mr. Williams?\nStudent: Canada.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Country. Đáp án đúng là “Canada”.", "memory": [{"item": "Where are you from? / come from", "vi": "Bạn đến từ đâu? / đến từ", "note": "Tín hiệu nghe country."}]}, {"id": "q4", "label": "Address", "answer": "9 Crew Street RC4", "accepted": ["9 Crew Street RC4", "9 Crew St RC4", "9 Crew St. RC4"], "skill": "Address + postcode-like code", "evidence": "“I live at 9 Crew Street RC4.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Secretary: I see. Where do you live now?\nStudent: I live at 9 Crew Street RC4 and my telephone number is 2342965.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Address + postcode-like code. Đáp án đúng là “9 Crew Street RC4”.", "memory": [{"item": "address / live at / live in", "vi": "địa chỉ / sống tại", "note": "Tín hiệu nghe địa chỉ hoặc age tùy form; xem đúng label."}]}, {"id": "q5", "label": "Telephone No.", "answer": "2342965", "accepted": ["2342965", "234 2965", "234-2965"], "skill": "Telephone number", "evidence": "“my telephone number is 2342965.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Student: I live at 9 Crew Street RC4 and my telephone number is 2342965.\nSecretary: Your number is 2342965.\nStudent: Yes, that’s right.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Telephone number. Đáp án đúng là “2342965”.", "memory": [{"item": "telephone number / number", "vi": "số điện thoại", "note": "Nếu label là address/code, bám theo trường thông tin của form."}]}, {"id": "q6", "label": "Age", "answer": "25", "accepted": ["25", "twenty-five", "twenty five"], "skill": "Age", "evidence": "Student: “25.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Secretary: Thank you. How old are you?\nStudent: 25.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Age. Đáp án đúng là “25”.", "memory": [{"item": "How old are you?", "vi": "Bạn bao nhiêu tuổi?", "note": "Tín hiệu trực tiếp cho Age."}]}], "transcript_text": "Secretary: Good morning. Can I help you?\nStudent: Yes. I’d like to enroll for the course.\nSecretary: Certainly. What’s your surname please?\nStudent: Williams.\nSecretary: Could you spell that for me?\nStudent: Yes. It’s W-I-L-L-I-A-M-S.\nSecretary: Thank you. What’s your first name?\nStudent: Peter. That’s spelled P-E-T-E-R.\nSecretary: Thanks. Where are you from, Mr. Williams?\nStudent: Canada.\nSecretary: I see. Where do you live now?\nStudent: I live at 9 Crew Street RC4 and my telephone number is 2342965.\nSecretary: Your number is 2342965.\nStudent: Yes, that’s right.\nSecretary: Thank you. How old are you?\nStudent: 25.\nSecretary: Thanks.", "knowledge": ["Form completion thường kiểm tra surname, first name, country, address, telephone number và age."]}, {"id": "EX09", "title": "Course Enrolment - Gill Turnball", "type": "Form completion", "instruction": "You will hear a conversation between a secretary and a student. As you listen, fill in the appropriate information on the form below.", "audio": "assets/audio/lan9.mp3", "source": "IELTS Listening strategies", "questions": [{"id": "q1", "label": "Surname (IN CAPITAL LETTERS)", "answer": "TURNBALL", "accepted": ["TURNBALL", "Turnball", "turnball"], "skill": "Surname spelling", "evidence": "“Turnball ... T-U-R-N-B-A-L-L.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Secretary: What’s your surname please?\nStudent: Turnball.\nSecretary: Could you spell that for me?\nStudent: Yes. It’s T-U-R-N-B-A-L-L.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Surname spelling. Đáp án đúng là “TURNBALL”.", "memory": [{"item": "surname", "vi": "họ", "note": "Thường được đánh vần trong form completion."}]}, {"id": "q2", "label": "First name", "answer": "Gill", "accepted": ["Gill"], "skill": "First name", "evidence": "“Gill. That’s spelled G-I-L-L.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Secretary: What’s your first name?\nStudent: Gill. That’s spelled G-I-L-L.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng First name. Đáp án đúng là “Gill”.", "memory": [{"item": "first name", "vi": "tên", "note": "Phân biệt với surname."}]}, {"id": "q3", "label": "Country", "answer": "Australia", "accepted": ["Australia"], "skill": "Country", "evidence": "“I come from Australia.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Secretary: Thanks. Where are you from, Ms. Turnball?\nStudent: I come from Australia.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Country. Đáp án đúng là “Australia”.", "memory": [{"item": "Where are you from? / come from", "vi": "Bạn đến từ đâu? / đến từ", "note": "Tín hiệu nghe country."}]}, {"id": "q4", "label": "Address", "answer": "32 Broadway SE23", "accepted": ["32 Broadway SE23", "32 Broadway, SE23"], "skill": "Address", "evidence": "KEY gives “32 Broadway SE23”.", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Secretary: I see. Where do you live now?\nStudent: Now I live with my sister. Her address is 32 RoadWay SE23. Her telephone number is 2073346.", "explanation": "Nguồn KEY và tapescript không thống nhất: KEY ghi “32 Broadway SE23”, trong khi tapescript ghi “32 RoadWay SE23”. Theo quy tắc đã chốt, hệ thống chấm theo KEY và đồng thời hiển thị nguyên văn tapescript để giáo viên/học sinh thấy rõ điểm khác biệt.", "memory": [{"item": "address / live at / live in", "vi": "địa chỉ / sống tại", "note": "Tín hiệu nghe địa chỉ ho ment - Mike Potters", "type": "Form completion", "instruction": "You will hear a conversation between a secretary and a student. As you listen, fill in the appropriate information on the form below.", "audio": "assets/audio/lan10.mp3", "source": "IELTS Listening strategies", "questions": [{"id": "q1", "label": "Surname (IN CAPITAL LETTERS)", "answer": "POTTERS", "accepted": ["POTTERS", "Potters", "potters"], "skill": "Surname spelling", "evidence": "“Potters ... P-O-T-T-E-R-S.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Secretary: What’s your surname please?\nStudent: Potters.\nSecretary: Could you spell that for me?\nStudent: Yes. It’s P-O-T-T-E-R-S.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Surname spelling. Đáp án đúng là “POTTERS”.", "memory": [{"item": "surname", "vi": "họ", "note": "Thường được đánh vần trong form completion."}]}, {"id": "q2", "label": "First name", "answer": "Mike", "accepted": ["Mike"], "skill": "First name", "evidence": "“Mike. That’s spelled M-I-K-E.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Secretary: What’s your first name?\nStudent: Mike. That’s spelled M-I-K-E.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng First name. Đáp án đúng là “Mike”.", "memory": [{"item": "first name", "vi": "tên", "note": "Phân biệt với surname."}]}, {"id": "q3", "label": "Country", "answer": "The United States", "accepted": ["The United States", "United States", "the United States", "USA", "U.S.A.", "US"], "skill": "Country", "evidence": "Student: “The United States.”", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Secretary: Thanks. Where are you from?\nStudent: The United States.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Country. Đáp án đúng là “The United States”.", "memory": [{"item": "Where are you from? / come from", "vi": "Bạn đến từ đâu? / đến từ", " của phụ nữ", "note": "Audio paraphrase: “nursing is a woman’s job” / “a good job for women”."}]}, {"id": "q23", "label": "Thailand - Mining is men’s work", "answer": "95%", "accepted": ["95%", "95"], "skill": "Percentage / table listening", "evidence": "Transcript gives Thailand: 95% for this statement.", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Turning to Thailand, we find a country that’s not over enthusiastic about equality: 45% of young people believe that a woman should stay at home. However, there’s an interesting 20% gap between whether cooking and washing are solely women’s jobs. 67% vote for women doing the washing, while only 47% feel the same way about cooking and 86% of Thais believe that housework should be shared between men and women. 87% of young people believe that men and women should be paid the same for the same job. 92% think nursing is women’s work and 95% of them believe mining should be done by men.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Percentage / table listening. Đáp án đúng là “95%”.", "memory": [{"item": "Mining is men’s work", "vi": "Khai mỏ là công việc của nam giới", "note": "Audio paraphrase: “mining is only/solely men’s work”, “a man’s job”, “done by men”."}]}, {"id": "q24", "label": "Thailand - Cooking should still be done by women", "answer": "47%", "accepted": ["47%", "47"], "skill": "Percentage / table listening", "evidence": "Transcript gives Thailand: 47% for this statement.", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Turning to Thailand, we find a country that’s not over enthusiastic about equality: 45% of young people believe that a woman should stay at home. However, there’s an interesting 20% gap between whether cooking and washing are solely women’s jobs. 67% vote for women doing the washing, while only 47% feel the same way about cooking and 86% of Thais believe that housework should be shared between men and women. 87% of young people believe that men and women should be paid the same for the same job. 92% think nursing is women’s work and 95% of them believe mining should be done by men.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Percentage / table listening. Đáp án đúng là “47%”.", "memory": [{"item": "Cooking should still be done by women", "vi": "Việc nấu ăn vẫn nên do phụ nữ làm", "note": "Audio paraphrase: “cooking is solely a woman’s job” / “a woman should do the cooking”."}]}, {"id": "q25", "label": "Thailand - Washing clothes should still be done by women", "answer": "67%", "accepted": ["67%", "67"], "skill": "Percentage / table listening", "evidence": "Transcript gives Thailand: 67% for this statement.", "suffix": "", "placeholder": "Type your answer", "evidence_full": "Turning to Thailand, we find a country that’s not over enthusiastic about equality: 45% of young people believe that a woman should stay at home. However, there’s an interesting 20% gap between whether cooking and washing are solely women’s jobs. 67% vote for women doing the washing, while only 47% feel the same way about cooking and 86% of Thais believe that housework should be shared between men and women. 87% of young people believe that men and women should be paid the same for the same job. 92% think nursing is women’s work and 95% of them believe mining should be done by men.", "explanation": "Đối chiếu mục cần điền với tapescript: thông tin mục tiêu thuộc dạng Percentage / table listening. Đáp án đúng là “67%”.", "memory": [{"item": "Washing clothes should still be done by women", "vi": "Việc giặt quần áo vẫn nên do phụ nữ làm", "note": "Audio paraphrase: “only she should do the washing” / “a woman should do the washing” / “women doing the washing”."}]}], "transcript_text": "Researchers have done some investigation into what young people believe is a woman’s place in society. Here is a report on some of their findings.\n\nThe Chinese are consistent supporters of sex equality with only 12% of young people believing that a woman’s place is in the home. 93% are enthusiastic about sharing the housework and 85% of them believe that women should be paid the same for doing the same job. 80% think that nursing is a woman’s job and 90% of them believe that mining is only men’s work. 13% of Chinese, an extremely low percentage, believe cooking is solely a woman’s job and 7%, even fewer, think that only she should do the washing.\n\nFor a more traditional view of a woman’s place, turn to the Japanese. 52% think women belong in the home. 89% of young people believe that a couple should share the housework and get equal pay for doing the same job. 65% of them believe nursing is a good job for women and 90% believe that mining is solely men’s work. 75% of them believe a woman should do the washing and 82% of them think she should do the cooking at home.\n\n80% of Koreans believe men and women should get the same pay for the same job. 39% believe a woman’s place is in the home. 75% of them believe that housework should be shared between men and women if both work, but there’s almost a complete reversal when it comes to doing the washing and cooking. Here, very few believe in sharing the work. 62% and 65% respectively believe that women should do both. 85% of Koreans believe nursing is a woman’s job and 87% think mining is a man’s job.\n\nTurning to Thailand, we find a country that’s not over enthusiastic about equality: 45% of young people believe that a woman should stay at home. However, there’s an interesting 20% gap between whether cooking and washing are solely women’s jobs. 67% vote for women doing the washing, while only 47% feel the same way about cooking and 86% of Thais believe that housework should be shared between men and women. 87% of young people believe that men and women should be paid the same for the same job. 92% think nursing is women’s work and 95% of them believe mining should be done by men.", "vocabulary": [["investigation", "noun", "sự điều tra", "an official examination of the facts about a situation, crime, etc."], ["sex equality", "noun", "sự bình đẳng giới", "the fact of being equal in gender"], ["enthusiastic", "adjective", "nhiệt tình", "feeling or showing a lot of excitement and interest about somebody/something"], ["solely", "adverb", "một mình / chỉ", "only; not involving somebody/something else"], ["when it comes to", "idiom", "khi nhắc đến", "when it is a question of something"], ["respectively", "adverb", "lần lượt theo thứ tự", "in the same order as the people or things already mentioned"]], "knowledge": ["Bài này ghi rõ đáp án không đi theo thứ tự vị trí câu hỏi; phải theo dõi country + statement, không chỉ chạy theo số thứ tự.", "“respectively” = các giá trị tương ứng theo đúng thứ tự các đối tượng vừa nêu."]}], "knowledge": [{"id": "overview", "title": "1. Overview", "html": "<p><strong>Letters and Numbers<\/strong> thường xuất hiện ở IELTS Listening Part 1 và kiểm tra các thông tin dễ mất điểm nếu nghe/chép không chính xác: tên người, tuổi, địa chỉ, postcode, ngày tháng, số điện thoại, tiền và thời gian.<\/p><div class=\"tip\">Mục tiêu: nghe đúng âm + xác định đúng loại thông tin + viết đúng chính tả/định dạng.<\/div>"}, {"id": "alphabet", "title": "2. Alphabet", "html": "<p>Ôn cách đọc bảng chữ cái:<\/p><div class=\"alphabet-grid\">A /eɪ/ · B /bi/ · C /si/ · D /di/ · E /i/ · F /ef/ · G /dʒi/ · H /eɪtʃ/ · I /aɪ/ · J /dʒeɪ/ · K /keɪ/ · L /el/ · M /em/ · N /en/ · O /əʊ/ · P /pi/ · Q /kjuː/ · R /ɑr/ · S /es/ · T /ti/ · U /ju/ · V /vi/ · W /ˈdʌb·əl·ju/ · X /eks/ · Y /wɑɪ/ · Z /zi/ /zed/<\/div><p><strong>Tên người:<\/strong> có thể (1) đọc rồi đánh vần, (2) mô tả tên, hoặc (3) chỉ đọc tên quen thuộc mà không đánh vần.<\/p>"}, {"id": "numbers", "title": "3. Numbers", "html": "<p><strong>Cardinal numbers trong nguồn:<\/strong><\/p><div class=\"table-wrap\"><table class=\"ielts-table\"><thead><tr><th>Number<\/th><th>Word<\/th><th>Pronunciation (source)<\/th><th>Ordinal<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>zero<\/td><td>/ˈzɪə.rəʊ/<\/td><td>—<\/td><\/tr><tr><td>1<\/td><td>one<\/td><td>/wʌn/<\/td><td>first /ˈfɜːst/<\/td><\/tr><tr><td>2<\/td><td>two<\/td><td>/tuː/<\/td><td>second /ˈsek.ənd/<\/td><\/tr><tr><td>3<\/td><td>three<\/td><td>/θriː/<\/td><td>third /θɜːd/<\/td><\/tr><tr><td>4<\/td><td>four<\/td><td>/fɔːr/<\/td><td>fourth /fɔːθ/<\/td><\/tr><tr><td>5<\/td><td>five<\/td><td>/faɪv/<\/td><td>fifth /fɪfθ/<\/td><\/tr><tr><td>6<\/td><td>six<\/td><td>/sɪks/<\/td><td>sixth /sɪksθ/<\/td><\/tr><tr><td>7<\/td><td>seven<\/td><td>/ˈsev.ən/<\/td><td>seventh /ˈsev.ənθ/<\/td><\/tr><tr><td>8<\/td><td>eight<\/td><td>/eɪt/<\/td><td>eighth /eɪtθ/<\/td><\/tr><tr><td>9<\/td><td>nine<\/td><td>/naɪn/<\/td><td>ninth /naɪnθ/<\/td><\/tr><tr><td>10<\/td><td>ten<\/td><td>/ten/<\/td><td>tenth /tenθ/<\/td><\/tr><tr><td>11<\/td><td>eleven<\/td><td>/ɪˈlev.ən/<\/td><td>eleventh /ɪˈlev.ənθ/<\/td><\/tr><tr><td>12<\/td><td>twelve<\/td><td>/twelv/<\/td><td>twelfth /twelfθ/<\/td><\/tr><tr><td>13<\/td><td>thirteen<\/td><td>/θɜːˈtiːn/<\/td><td>thirteenth /θɜːˈtiːnθ/<\/td><\/tr><tr><td>14<\/td><td>fourteen<\/td><td>/ˌfɔːˈtiːn/<\/td><td>fourteenth /ˌfɔːˈtiːnθ/<\/td><\/tr><tr><td>15–22<\/td><td>fifteen, sixteen, seventeen, eighteen, nineteen, twenty, twenty-one, twenty-two<\/td><td>See source pronunciation table<\/td><td>fifteenth → twenty-second<\/td><\/tr><tr><td>30–90<\/td><td>thirty, forty, fifty, sixty, seventy, eighty, ninety<\/td><td>/ˈθɜː.ti/ ... /ˈnaɪn.ti/<\/td><td>thirtieth → ninetieth<\/td><\/tr><tr><td>100<\/td><td>one/a hundred<\/td><td>/ˈhʌn.drəd/<\/td><td>hundredth<\/td><\/tr><tr><td>101<\/td><td>one/a hundred and one<\/td><td>/ˈhʌn.drəd ənd wʌn/<\/td><td>hundred and first<\/td><\/tr><tr><td>1,000<\/td><td>one/a thousand<\/td><td>/ˈθaʊ.zənd/<\/td><td>thousandth<\/td><\/tr><tr><td>1,000,000<\/td><td>one/a million<\/td><td>/ˈmɪl.jən/<\/td><td>millionth<\/td><\/tr><tr><td>1,000,000,000<\/td><td>one/a billion<\/td><td>/ˈbɪl.jən/<\/td><td>billionth<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tip\"><strong>-teen vs -ty:<\/strong> theo nguồn, -teen được nhấn ở âm tiết thứ hai, còn -ty được nhấn ở âm tiết thứ nhất.<\/div>"}, {"id": "info", "title": "4. Information Types", "html": "<div class=\"knowledge-cards\"><div><b>Address<\/b><br>House number + Street name + Town/City + County + Postcode.<\/div><div><b>Phone<\/b><br>0 có thể đọc <em>zero/oh<\/em>; số đôi: <em>double<\/em>; số ba: <em>triple<\/em>.<\/div><div><b>Date<\/b><br>December 3rd / 3 December; hậu tố st/nd/rd/th có thể có hoặc không.<\/div><div><b>Money<\/b><br>£12.50 có thể nghe “twelve pounds fifty”, “twelve fifty”.<\/div><div><b>Postcode<\/b><br>Kết hợp letters + numbers; chú ý âm gần nhau.<\/div><div><b>Time<\/b><br>7:30 = seven thirty / half past seven; 7:15 = quarter past; 7:45 = quarter to.<\/div><\/div>"}, {"id": "abbrev", "title": "5. Address Abbreviations", "html": "<p>Một số viết tắt trong nguồn:<\/p><p>Avenue (AVE), Boulevard (BLVD), Center (CTR), Circle (CIR), Lane (LN), Mount (MT), Road (RD), Route (RTE), Station (STA), Street (ST); Apartment (APT), Building (BLDG), Department (DEPT), Floor (FL), Room (RM).<\/p>"}, {"id": "mistakes", "title": "6. Common Listening Traps", "html": "<ul><li><strong>13 vs 30 / 19 vs 90:<\/strong> nghe trọng âm -teen / -ty.<\/li><li><strong>H vs 8:<\/strong> H /eɪtʃ/ có âm /tʃ/, 8 /eɪt/.<\/li><li><strong>X vs S:<\/strong> X /eks/ có thêm /k/.<\/li><li><strong>M vs N:<\/strong> /em/ vs /en/.<\/li><li><strong>Ảnh hưởng tiếng Việt:<\/strong> E /iː/ không phải I; R /ɑːr/ không phải A.<\/li><\/ul>"}], "totalAnswers": 160};
const NS=`${DATA.courseId}:${DATA.unitId}:${DATA.lessonId}:v${DATA.version}`;
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
function load(){try{return JSON.parse(localStorage.getItem(NS)||'{}')}catch{return {}}}
let state=load(); state.student=state.student||{}; state.exercises=state.exercises||{};
function save(){localStorage.setItem(NS,JSON.stringify(state));}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function showPage(id){$$('.page').forEach(p=>p.classList.remove('active'));$('#'+id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function exState(id){return state.exercises[id]||(state.exercises[id]={status:'not_started',answers:{},attemptCount:0,submittedAttemptIds:[],audioPosition:0,reviewUnlocked:false});}
function persistStudent(){state.student={studentName:$('#studentName').value.trim(),studentClass:$('#studentClass').value.trim(),studentId:$('#studentId').value.trim()};save();}
function initStudent(){['studentName','studentClass','studentId'].forEach(id=>{const el=$('#'+id);el.value=state.student[id]||'';el.addEventListener('input',persistStudent)});}
function renderHome(){const grid=$('#homeGrid');grid.innerHTML='';
 const kc=document.createElement('div');kc.className='knowledge-card';kc.innerHTML='<div class="card-row"><div><b>📘 KIẾN THỨC CẦN HỌC</b><div class="score">Alphabet • Numbers • Information types • Common traps</div></div><span class="pill">Theory</span></div>';kc.onclick=()=>renderKnowledge();grid.appendChild(kc);
 let completed=0;DATA.exercises.forEach((e,i)=>{const st=exState(e.id);if(st.status==='completed')completed++;const c=document.createElement('div');c.className='exercise-card';const cls=st.status==='completed'?'done':st.status==='in_progress'?'progress':'';const txt=st.status==='completed'?'Completed':st.status==='in_progress'?'In progress':'Not started';const score=st.status==='completed'?`Latest score: ${st.score}/${st.total} • Attempts: ${st.attemptCount}`:`${e.questions.length} answer fields • ${e.type}`;c.innerHTML=`<div class="card-row"><div><b>Exercise ${i+1}: ${esc(e.title)}</b><div class="score">${esc(score)}</div></div><span class="pill ${cls}">${txt}</span></div>`;c.onclick=()=>openExercise(e.id);grid.appendChild(c)});
 const pct=DATA.exercises.length?completed/DATA.exercises.length*100:0;$('#overallBar').style.width=pct+'%';$('#overallText').textContent=`Progress: ${completed}/${DATA.exercises.length} exercises completed • ${DATA.totalAnswers} total answer fields in this lesson`;save();}
function renderKnowledge(){showPage('knowledgePage');const tabs=$('#knowledgeTabs');tabs.innerHTML='';DATA.knowledge.forEach((k,i)=>{const b=document.createElement('button');b.textContent=k.title;b.className=i===0?'active':'';b.onclick=()=>{[...tabs.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#knowledgePane').innerHTML=k.html};tabs.appendChild(b)});$('#knowledgePane').innerHTML=DATA.knowledge[0].html;}
function normalize(s){return String(s??'').trim().toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ').replace(/[.,;:!?]+$/,'');}
function accepted(q,val){const n=normalize(val);return (q.accepted||[q.answer]).some(a=>normalize(a)===n)}
function inputFor(q,n,st){return `<div class="question"><div class="qline"><div class="qbadge">${n}</div><div class="qcontent"><label for="${q.id}">${esc(q.label)}</label><input class="answer-input" id="${q.id}" data-q="${q.id}" value="${esc(st.answers[q.id]||'')}" placeholder="${esc(q.placeholder||'Type your answer')}" autocomplete="off"></div></div></div>`}
function renderQuestionArea(e,st){
 if(e.layout==='train-table'){
   let h='<div class="table-wrap"><table class="ielts-table"><thead><tr><th>#</th><th>Platform No.</th><th>Time</th><th>Destination</th></tr></thead><tbody>';
   for(let r=0;r<8;r++){h+=`<tr><td>${r+1}</td>`;for(let c=0;c<3;c++){const q=e.questions[r*3+c];h+=`<td><span class="qbadge" style="display:inline-flex;margin-right:6px">${r*3+c+1}</span><input class="answer-input" id="${q.id}" data-q="${q.id}" value="${esc(st.answers[q.id]||'')}"></td>`}h+='</tr>'}return h+'</tbody></table></div>';
 }
 if(e.layout==='population-tables'){
   let i=0,h='<h3>Table 1</h3><div class="table-wrap"><table class="ielts-table"><thead><tr><th>Area</th><th>People/sq km</th></tr></thead><tbody>';const areas=['UK','European Community','England','Greater London','Scotland','Wales','Northern Ireland'];areas.forEach(a=>{const q=e.questions[i++];h+=`<tr><td>${a}</td><td><span class="qbadge" style="display:inline-flex;margin-right:6px">${i}</span><input class="answer-input" id="${q.id}" data-q="${q.id}" value="${esc(st.answers[q.id]||'')}"></td></tr>`});h+='</tbody></table></div><h3>Table 2</h3><div class="table-wrap"><table class="ielts-table"><thead><tr><th>City</th><th>Area (sq km)</th><th>Population (thousands)</th></tr></thead><tbody>';const cities=['Greater London','Birmingham','Leeds','Glasgow','Edinburgh','Manchester','Bristol','Coventry'];cities.forEach(c=>{const qa=e.questions[i++],qp=e.questions[i++];h+=`<tr><td>${c}</td><td><span class="qbadge" style="display:inline-flex;margin-right:6px">${i-1}</span><input class="answer-input" id="${qa.id}" data-q="${qa.id}" value="${esc(st.answers[qa.id]||'')}"></td><td><span class="qbadge" style="display:inline-flex;margin-right:6px">${i}</span><input class="answer-input" id="${qp.id}" data-q="${qp.id}" value="${esc(st.answers[qp.id]||'')}"></td></tr>`});return h+'</tbody></table></div>';
 }
 if(e.layout==='survey-table'){
   const labels=["A woman’s place is in the home","If a couple both earn money, both should share the housework","Men and women should be paid the same for the same job","Nursing is women’s work","Mining is men’s work","Cooking should still be done by women","Washing clothes should still be done by women"];
   const fixed={"China-0":"12%","China-4":"90%","Japan-5":"82%"};const map={};e.questions.forEach((q,idx)=>{const m=q.label.match(/^(China|Japan|Korea|Thailand) - (.*)$/);if(m){map[m[1]+'-'+labels.indexOf(m[2])]={q,n:idx+1}}});
   let h='<div class="tip"><b>Note:</b> Thông tin câu trả lời không theo thứ tự vị trí câu hỏi.</div><div class="table-wrap"><table class="ielts-table"><thead><tr><th>Young people (%) who agree</th><th>China</th><th>Japan</th><th>Korea</th><th>Thailand</th></tr></thead><tbody>';
   labels.forEach((lab,r)=>{h+=`<tr><td>${lab}</td>`;['China','Japan','Korea','Thailand'].forEach(country=>{const key=country+'-'+r;if(fixed[key])h+=`<td><b>${fixed[key]}</b></td>`;else{const o=map[key];h+=`<td><span class="qbadge" style="display:inline-flex;margin-right:5px">${o.n}</span><input class="answer-input" id="${o.q.id}" data-q="${o.q.id}" value="${esc(st.answers[o.q.id]||'')}"></td>`}});h+='</tr>'});return h+'</tbody></table></div>';
 }
 return e.questions.map((q,i)=>inputFor(q,i+1,st)).join('');
}
function openExercise(id){const e=DATA.exercises.find(x=>x.id===id),st=exState(id); if(st.status==='not_started')st.status='in_progress';save();showPage('exercisePage');
 const mount=$('#exerciseMount');mount.innerHTML=`<div class="exercise-wrap"><article class="task"><div class="task-head"><h2>${esc(e.id.replace('EX','Exercise '))}: ${esc(e.title)}</h2><p>${esc(e.instruction)}</p><div class="source-note">Source: ${esc(e.source||'')}</div></div><div class="audio-box"><audio id="player" controls preload="metadata" src="${e.audio}"></audio></div><div class="questions">${renderQuestionArea(e,st)}</div><div class="task-actions"><button class="btn primary" id="checkBtn">✓ Kiểm tra đáp án</button><button class="btn" id="backBtn">← Trở lại trang chủ</button></div><div class="review ${st.reviewUnlocked?'open':''}" id="review"></div></article><aside class="side"><h3>${esc(e.id.replace('EX','Exercise '))}</h3><div class="mini-status" id="answeredStatus"></div><button class="btn primary" id="sideCheck">Kiểm tra đáp án</button><button class="btn" id="retryBtn" ${st.reviewUnlocked?'':'disabled'}>↻ Làm lại / Retry</button><button class="btn danger" id="resetBtn">Reset Exercise</button><button class="btn" id="sideHome">← Lesson Home</button></aside></div>`;
 const player=$('#player');player.addEventListener('loadedmetadata',()=>{if(st.audioPosition&&st.audioPosition<player.duration-2)player.currentTime=st.audioPosition});player.addEventListener('timeupdate',()=>{st.audioPosition=player.currentTime;save()});
 $$('.answer-input').forEach(inp=>inp.addEventListener('input',()=>{st.answers[inp.dataset.q]=inp.value;st.status='in_progress';save();updateAnswered(e,st)}));updateAnswered(e,st);
 $('#checkBtn').onclick=$('#sideCheck').onclick=()=>checkExercise(e,st);$('#backBtn').onclick=$('#sideHome').onclick=()=>goHome();$('#retryBtn').onclick=()=>retryExercise(e,st);$('#resetBtn').onclick=()=>resetExercise(e,st);if(st.reviewUnlocked)renderReview(e,st);
}
function updateAnswered(e,st){const n=e.questions.filter(q=>String(st.answers[q.id]||'').trim()).length;const el=$('#answeredStatus');if(el)el.textContent=`Answered: ${n}/${e.questions.length} • Autosaved`}
function collectInputs(e,st){e.questions.forEach(q=>{const el=document.getElementById(q.id);if(el)st.answers[q.id]=el.value});save()}
function ensureStudent(){const missing=[];if(!state.student.studentName)missing.push('studentName');if(!state.student.studentClass)missing.push('studentClass');if(!state.student.studentId)missing.push('studentId');if(!missing.length)return true;alert('Vui lòng nhập đầy đủ Họ tên, Lớp và Mã học sinh trước khi nộp Exercise.');goHome();setTimeout(()=>{const el=document.getElementById(missing[0]);if(el)el.focus()},80);return false}
async function checkExercise(e,st){collectInputs(e,st);if(!ensureStudent())return;const blanks=e.questions.filter(q=>!String(st.answers[q.id]||'').trim()).length;if(blanks && !confirm(`Bạn còn ${blanks} câu chưa trả lời. Vẫn chấm bài?`))return;
 let score=0;const results={};e.questions.forEach(q=>{const ok=accepted(q,st.answers[q.id]||'');if(ok)score++;results[q.id]={student:st.answers[q.id]||'',correct:q.answer,isCorrect:ok}});st.attemptCount=(st.attemptCount||0)+1;const attemptId=`${DATA.unitId}-${DATA.lessonId}-${e.id}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;st.currentAttemptId=attemptId;st.score=score;st.total=e.questions.length;st.correct=score;st.wrong=e.questions.length-score;st.results=results;st.status='completed';st.reviewUnlocked=true;st.lastUpdated=new Date().toISOString();save();renderReview(e,st);renderHome();
 const payload={studentName:state.student.studentName||'',studentClass:state.student.studentClass||'',studentId:state.student.studentId||'',testId:`${DATA.unitId}-${DATA.lessonId}-${e.id}`,testName:`Letters and Numbers - ${e.id} - ${e.title}`,score,total:e.questions.length,duration:'',correct:score,wrong:e.questions.length-score,answers:{meta:{attempt:st.attemptCount,attemptId,lessonId:DATA.lessonId,exerciseId:e.id,submittedAt:new Date().toISOString(),unanswered:blanks},...results}};
 await sendResult(payload,e,st,attemptId);renderReview(e,st);
}
async function sendResult(payload,e,st,attemptId){if((st.submittedAttemptIds||[]).includes(attemptId))return;try{await fetch(DATA.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});st.submittedAttemptIds=st.submittedAttemptIds||[];st.submittedAttemptIds.push(attemptId);st.lastSubmissionState='request_sent_unverified';save();toast('Đã gửi yêu cầu lưu kết quả. Trình duyệt không thể xác minh phản hồi Google Sheet ở chế độ no-cors.')}catch(err){st.pendingSubmission={payload,attemptId};st.lastSubmissionState='pending';save();toast('Chưa gửi được Google Sheet. Kết quả đã được lưu trên thiết bị.')}}
function renderReview(e,st){const box=$('#review');if(!box||!st.results)return;const unanswered=e.questions.filter(q=>!String(st.results[q.id].student||'').trim()).length;let h=`<h2>Review</h2><div class="result-summary"><div class="metric"><b>${st.score}/${st.total}</b><br>Score</div><div class="metric"><b>${st.correct}</b><br>Correct</div><div class="metric"><b>${st.wrong}</b><br>Wrong</div><div class="metric"><b>${unanswered}</b><br>Unanswered</div><div class="metric"><b>${st.attemptCount}</b><br>Attempt</div></div>`;
 e.questions.forEach((q,i)=>{const r=st.results[q.id],cls=r.isCorrect?'good':'bad';const memory=(q.memory||[]).map(m=>`<li><b>${esc(m.item||'')}</b>${m.vi?` = ${esc(m.vi)}`:''}${m.note?`<br><span class="score">${esc(m.note)}</span>`:''}</li>`).join('');h+=`<div class="review-item ${cls}"><h3 style="margin:0 0 8px">Question ${i+1}</h3><div class="prompt-box"><div class="review-label">Đề bài / Original task</div><div><b>${esc(e.instruction)}</b></div><div style="margin-top:6px"><span class="review-label">Mục cần điền / Question target</span><br>${esc(q.label)}</div></div><div class="ans"><div><small>Your answer</small><br><b>${esc(r.student||'—')}</b></div><div><small>Đáp án đúng / Correct answer</small><br><b>${esc(q.answer)}</b></div></div><div class="explain"><div class="review-label">Tapescript evidence</div><div class="evidence">${esc(q.evidence_full||q.evidence||'Không có tapescript trong nguồn.').replace(/\n/g,'<br>')}</div><div style="margin-top:10px"><b>Giải thích:</b> ${esc(q.explanation||'')}</div><div class="q-memory"><b>🧠 KIẾN THỨC CẦN NHỚ</b>${memory?`<ul>${memory}</ul>`:'<p>Không có mục bổ sung từ nguồn cho câu này.</p>'}</div></div></div>`});
 h+=accordion('🎧 Listen Again & Full Tapescript',`<audio controls style="width:100%;margin-bottom:12px" src="${e.audio}"></audio><div>${esc(e.transcript_text||'Transcript not supplied in the source.').replace(/\n/g,'<br>')}</div>`,'transcript');
 if(e.vocabulary?.length){let v='<div class="table-wrap"><table class="ielts-table"><thead><tr><th>Item</th><th>Part of speech</th><th>Tiếng Việt</th><th>Meaning (source)</th></tr></thead><tbody>';e.vocabulary.forEach(x=>v+=`<tr><td><b>${esc(x[0])}</b></td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td>${esc(x[3])}</td></tr>`);v+='</tbody></table></div>';h+=accordion('📚 Vocabulary from the source',v,'vocab')}
 if(e.knowledge?.length)h+=accordion('🧠 Kiến thức cần nhớ',`<ul>${e.knowledge.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,'remember');
 h+=`<p class="submission-note">Google Sheet status: ${st.lastSubmissionState==='request_sent_unverified'?'Request sent (response cannot be verified in no-cors mode)':st.lastSubmissionState==='pending'?'Pending / saved locally':'Will be sent when this attempt is checked'}</p>`;box.innerHTML=h;box.classList.add('open');$$('.acc-btn').forEach(b=>b.onclick=()=>b.nextElementSibling.classList.toggle('open'));const rb=$('#retryBtn');if(rb)rb.disabled=false;}
function accordion(title,body,id){return `<div class="accordion"><button class="acc-btn" type="button">${title}</button><div class="acc-body" id="${id}">${body}</div></div>`}
function retryExercise(e,st){if(!st.reviewUnlocked)return; if(!confirm('Bắt đầu một attempt mới? Kết quả cũ vẫn được giữ trong lịch sử gửi Google Sheet, nhưng ô trả lời hiện tại sẽ được xóa cho lần làm mới.'))return;st.answers={};st.results=null;st.score=null;st.total=null;st.correct=null;st.wrong=null;st.status='in_progress';st.reviewUnlocked=false;st.audioPosition=0;save();openExercise(e.id);}
function resetExercise(e,st){if(!confirm('RESET EXERCISE sẽ xóa trạng thái và câu trả lời của Exercise này trên thiết bị. Dữ liệu đã gửi Google Sheet trước đó không thể bị thu hồi. Tiếp tục?'))return;state.exercises[e.id]={status:'not_started',answers:{},attemptCount:0,submittedAttemptIds:[],audioPosition:0,reviewUnlocked:false};save();toast('Đã reset Exercise trên thiết bị.');goHome();}
function goHome(){const p=$('#player');if(p)p.pause();renderHome();showPage('homePage')}
async function retryPending(){for(const e of DATA.exercises){const st=state.exercises?.[e.id];if(st?.pendingSubmission?.payload&&st?.pendingSubmission?.attemptId){const {payload,attemptId}=st.pendingSubmission;try{await fetch(DATA.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});st.submittedAttemptIds=st.submittedAttemptIds||[];if(!st.submittedAttemptIds.includes(attemptId))st.submittedAttemptIds.push(attemptId);delete st.pendingSubmission;st.lastSubmissionState='request_sent_unverified';save()}catch(_){}}}}
$('#homeBtn').onclick=goHome;initStudent();renderHome();retryPending();
</script>
</body>
