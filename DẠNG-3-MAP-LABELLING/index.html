x}.review.open{display:block}.result-summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}.metric{background:#f6f8f6;border:1px solid var(--line);border-radius:10px;padding:10px 14px}.review-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin:9px 0}.review-item.good{border-left:5px solid var(--good)}.review-item.bad{border-left:5px solid var(--bad)}.review-item .ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:9px 0}.explain{background:#f7f8f6;border-radius:8px;padding:10px;font-size:14px}.prompt-box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin:9px 0}.evidence{margin-top:10px;color:#263b30;background:#eef5f1;border-left:4px solid var(--accent);padding:10px 12px;border-radius:7px;white-space:pre-wrap}.q-memory{margin-top:10px;background:#fff8e8;border:1px solid #ead9ad;border-radius:8px;padding:10px}.q-memory ul{margin:6px 0 0 18px;padding:0}.q-memory li{margin:6px 0}.review-label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}.accordion{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.acc-btn{width:100%;text-align:left;border:0;background:#f4f6f4;padding:12px 14px;font-weight:800;cursor:pointer}.acc-body{display:none;padding:14px;white-space:pre-wrap;background:#fff}.acc-body.open{display:block}.knowledge-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.knowledge-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer}.knowledge-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.knowledge-pane{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}.alphabet-grid{background:#f5f7f5;border-radius:10px;padding:14px;line-height:2}.tip{background:#edf5f1;border-left:4px solid var(--accent);padding:10px 12px;margin:12px 0}.knowledge-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.knowledge-cards>div{border:1px solid var(--line);border-radius:10px;padding:12px}.table-wrap{overflow-x:auto;margin:12px 0}.ielts-table{border-collapse:collapse;width:100%;min-width:650px}.ielts-table th,.ielts-table td{border-bottom:1px solid #aeb8b2;padding:10px;text-align:left;vertical-align:middle}.ielts-table th{background:#f7f8f6}.ielts-table .answer-input{min-width:120px}.toast{position:fixed;right:18px;bottom:18px;max-width:360px;background:#17231d;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:50}.toast.show{display:block}.submission-note{font-size:12px;color:var(--muted);margin-top:8px}.source-note{font-size:12px;color:var(--muted);margin-top:8px}@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.exercise-wrap{grid-template-columns:1fr}.side{position:static;display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.side h3,.side .mini-status{grid-column:1/-1}.side .btn{margin:0}.student{grid-template-columns:1fr 1fr}.student .field:first-child{grid-column:1/-1}}@media(max-width:620px){.shell{padding:12px}.topbar{padding:10px 12px}.brand small{display:none}.home-grid{grid-template-columns:1fr}.hero{padding:18px}.hero h1{font-size:24px}.student{grid-template-columns:1fr}.student .field:first-child{grid-column:auto}.questions{padding:14px}.task-head,.audio-box{padding-left:14px;padding-right:14px}.review{margin-left:14px;margin-right:14px}.review-item .ans{grid-template-columns:1fr}.knowledge-cards{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.top-actions .btn span{display:none}}

<script>
const DATA={"courseId":"IELTS_LISTENING_FOUNDATION","unitId":"DANG3","lessonId":"MAP_LABELLING","version":"1.0","endpoint":"https://script.google.com/macros/s/AKfycbzCX-jRyn28wS8lEQ-wtdM8qspFr-Ptj1c2r3ctxpi3hseVZ1UMBE8N4jXAx1-03pLn/exec","exercises":[{"id":"EX01","title":"Map Labelling Practice 1","type":"Map Labelling","instruction":"Listen and label the plan. Write the correct letter A-K next to questions 1-5.","image":"assets/images/ex01.jpg","audio":"assets/audio/ml1.mp3","source":"Complete IELTS band 4-5","questions":[{"id":"q1","displayNum":1,"label":"Administration office","answer":"D","accepted":["D"],"evidence_full":"The administration office is on your right.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 1 là “D”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q2","displayNum":2,"label":"Cafe","answer":"E","accepted":["E"],"evidence_full":"The café is through the first door on your left.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 2 là “E”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q3","displayNum":3,"label":"Student common room","answer":"K","accepted":["K"],"evidence_full":"Directly opposite the café, on the same corridor, is this student common room.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 3 là “K”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q4","displayNum":4,"label":"Lockers","answer":"C","accepted":["C"],"evidence_full":"These are next to the sports hall, opposite the administration office.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 4 là “C”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q5","displayNum":5,"label":"Library","answer":"B","accepted":["B"],"evidence_full":"The library is through the door straight ahead of you.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 5 là “B”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]}],"transcript_text":"OK, now, we’ve got some students here from Bardwell College who have joined us for today’s events. Hello to you all, and welcome.\nNow, before our day begins, you’ll need to get a guest badge which you’ll have to wear while you’re on the college premises. You can get these from the administration office. To get there from the main hall, leave the hall by the door opposite reception, turn left, and just follow the corridor to the end. The administration office is on your right. Don’t go any further, or you’ll be in the sports hall. If you show your guest badge in the café, by the way, you’ll get a 20% discount on drinks and sandwiches. To get there from the main hall, walk along the corridor between the main hall and reception and turn right. The café is through the first door on your left. Directly opposite the café, on the same corridor, is this student common room, where you can go to relax and perhaps meet some of our own students.\nIf you have any valuables that you don’t want to carry around with you, I suggest you put these in a locker. These are next to the sports hall, opposite the administration office. You can get a key for a locker when you get your guest badge from the administration office. And if you want to use our library, leave the main hall by the door opposite the one you came in – that’s the door by the bicycle parking area – and walk to the end of the corridor. The library is through the door straight ahead of you."},{"id":"EX02","title":"Map Labelling Practice 2","type":"Map Labelling","instruction":"Label the map below. Write the correct letter A-H next to questions 6-10.","image":"assets/images/ex02.jpg","audio":"assets/audio/ml2.mp3","source":"Complete IELTS band 5-6.5","questions":[{"id":"q6","displayNum":6,"label":"recreation centre","answer":"C","accepted":["C"],"evidence_full":"along the main road to the east you'll find the staff recreation centre.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 6 là “C”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q7","displayNum":7,"label":"health centre","answer":"B","accepted":["B"],"evidence_full":"this is directly behind the main hospital building. So, if you go out of the back exit, it’s just in front of you.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 7 là “B”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q8","displayNum":8,"label":"swimming pool and sauna","answer":"H","accepted":["H"],"evidence_full":"turn left into Tye Road - you'll see the pool entrance at the end of that road, just beyond the line of trees.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 8 là “H”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q9","displayNum":9,"label":"health-food store","answer":"E","accepted":["E"],"evidence_full":"go beyond the turning for Tye Road and you'll see it on the right-hand corner, directly opposite another building.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 9 là “E”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q10","displayNum":10,"label":"Jenny’s Restaurant","answer":"A","accepted":["A"],"evidence_full":"head for the roundabout. When you're there, take the second turning on the left ... it's just along that road before the trees.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 10 là “A”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]}],"transcript_text":"Debbie: Now, as you're all new, I'm just going to show you a map of the hospital and point out a few key places. Let's start with the recreation centre. At the moment, we're in the main building, that's here and if you go out of the main entrance and just along the main road to the east you'll find the staff recreation centre. It's this T-shaped building and there's a range of things that you can do here to help you relax. If you get ill, we do have a health centre for all registered employees. And this is directly behind the main hospital building. So, if you go out of the back exit, it's just in front of you. And there's a small pharmacy next to it. I'm based here and I have a few leaflets on things if you want to come and see me. Many of you will be doing shift work, so you might like to go to the 24-hour swimming pool and sauna. They're very close by, and it doesn't cost much money to get in. If you walk out of the front of the main building, there's a road straight ahead of you, go down that and turn left into Tye Road - you'll see the pool entrance at the end of that road, just beyond the line of trees. We've talked about eating healthily, and there's a very useful store nearby that sells a large range of organic products and health-food supplements. This is also in front of the main building, but this time you need to go beyond the turning for Tye Road and you'll see it on the right-hand corner, directly opposite another building. Finally, if you want a healthy meal and you have very little time to get it, of course there's always the canteen inside the main building. But I would recommend a place called Jenny's Restaurant. Leave the front of the main building and head for the roundabout. When you're there, take the second turning on the left. It's just along that road before the trees. You can get a number of excellent dishes here at a reasonable price."},{"id":"EX03","title":"Map Labelling Practice 3","type":"Map Labelling","instruction":"Label the plan below. Write the correct letter A-I next to questions 15-20.","image":"assets/images/ex03.jpg","audio":"assets/audio/ml3.mp3","source":"The official guide to IELTS","questions":[{"id":"q15","displayNum":15,"label":"Vegetable beds","answer":"G","accepted":["G"],"evidence_full":"on the left-hand side of that circular footpath, there’s a short track which takes you directly to the vegetable beds.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 15 là “G”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q16","displayNum":16,"label":"Bee hives","answer":"I","accepted":["I"],"evidence_full":"the bee hives are on the right of the fence – the smaller section","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 16 là “I”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q17","displayNum":17,"label":"Seating","answer":"B","accepted":["B"],"evidence_full":"at the top of it, there’s a path that goes from there and takes you up to the seating area, alongside the bicycle track","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 17 là “B”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q18","displayNum":18,"label":"Adventure playground","answer":"E","accepted":["E"],"evidence_full":"take the first left turn ... a short path that goes off to the right ... that’s the adventure playground area","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 18 là “E”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q19","displayNum":19,"label":"Sand area","answer":"C","accepted":["C"],"evidence_full":"where that track divides, you need the little path that goes up towards the bicycle track. The sand area is just above the bamboo fence there.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 19 là “C”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q20","displayNum":20,"label":"Pond","answer":"A","accepted":["A"],"evidence_full":"on the left-hand side of your plan – towards the top – just above the fruit bushes and to the left of the little path.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 20 là “A”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]}],"transcript_text":"OK, group B, your turn. Does everyone have a copy of the plan? Great. OK, we’ll all be meeting in the car park – that’s on the bottom of the plan, see? Now, if you’ve been assigned to the vegetable beds, to get there, you go out of the car park and go up the footpath until you reach the circle of trees – there they are – in the middle of the plan, and you see that the footpath goes all the way around them. Well, on the left-hand side of that circular footpath, there’s a short track which takes you directly to the vegetable beds. You can see a bamboo fence marked just above them. All right? OK, if you’re helping out with the bee hives, pay attention. Look again at the circle of trees in the middle of the plan, and the footpath that goes around them. On the right side of that circle – you can see that the footpath goes off in an easterly direction – heading towards the right-hand side of the plan. And then, the path splits into two and you can either go up and down. You want the path that heads down and at the end of this, you see two areas divided by a bamboo fence – and as we’re looking at the plan, the bee hives are on the right of the fence – the smaller section, I mean. Now don’t worry – all the bees have been removed! You just need to transport the hives back to the car park. OK, for the seating, look at the circular footpath, at the top of it, there’s a path that goes from there and takes you up to the seating area, alongside the bicycle track and with a good view of the island, I suppose. OK, if you’re volunteering for the adventure playground area, let’s start from the car park again and go up the footpath, but then you want the first left turn. Go up there and then you see there’s a short path that goes off to the right – go down there and that’s the adventure playground area – above the bamboo fence. That fence does need repairing, I’m afraid. Right, what else? Oh yes, the sand area. We’ve got that circular footpath in the middle – find the track that goes east, towards the right-hand side of the plan, and where that track divides, you need the little path that goes up towards the bicycle track. The sand area is just above the bamboo fence there. And finally, the pond area. So it’s on the left-hand side of your plan – towards the top – just above the fruit bushes and to the left of the little path."},{"id":"EX04","title":"Map Labelling Practice 4","type":"Map Labelling","instruction":"Label the map below. Write the correct letter A-H next to questions 11-15.","image":"assets/images/ex04.jpg","audio":"assets/audio/ml4.mp3","source":"The official Guide to IELTS","questions":[{"id":"q11","displayNum":11,"label":"Supermarket","answer":"G","accepted":["G"],"evidence_full":"turn right at the top of Willow Lane, and it’s the second building you come to, opposite the old railway station.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 11 là “G”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q12","displayNum":12,"label":"Climbing supplies store","answer":"D","accepted":["D"],"evidence_full":"go past Mountain Road on your right, until you come to the next turning on the left - head down there, and you’ll come to the climbing supplies store.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 12 là “D”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q13","displayNum":13,"label":"Museum","answer":"A","accepted":["A"],"evidence_full":"You also need to head to Pine Street for the museum","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 13 là “A”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q14","displayNum":14,"label":"Bike hire","answer":"E","accepted":["E"],"evidence_full":"go down the little road that you come to just before it, and you’ll find the bike hire shop just behind the hall.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 14 là “E”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q15","displayNum":15,"label":"Cafe","answer":"C","accepted":["C"],"evidence_full":"follow Willow Lane until it joins Pine Street - and right opposite - on the far side of the railway tracks - is the cafe.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 15 là “C”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]}],"transcript_text":"Welcome to everyone here. I hope you enjoy your stay in our village and enjoy the local scenery. I’ll tell you a bit about the forest and mountain tracks in a minute, but first, I’ll just give you an idea of where everything is in the village. So we’re here in the tourist information centre, and when you come out of the centre, you’re on Willow Lane, just opposite the pond. If you want to get to the supermarket for your supplies of food and water, go right, that’s the quickest way, and then turn right at the top of Willow Lane, and it’s the second building you come to, opposite the old railway station. If you’re planning on doing some serious climbing and you need some equipment, we do have an excellent climbing supplies store just five minute’s walk away. Turn left once you’re outside the tourist information centre, take Willow Lane all the way up to Pine Street - you want to turn left along here - then keep walking and go past Mountain Road on your right, until you come to the next turning on the left - head down there, and you’ll come to the climbing supplies store. If you get to the small building that sells ski passes, you’ll know you’ve gone too far. You also need to head to Pine Street for the museum - it’s small but well worth a visit if you’re interested in the history of the village and the old gold mining industry. So, when you reach Pine Street from here, you’ll see the Town Hall, go down the little road that you come to just before it, and you’ll find the bike hire shop just behind the hall. They have a good range of bikes so I’m sure you’ll find something that suits your need. Last but not least, if you’re hungry after a long day’s trek I can recommend our local cafe. Again, when you leave the tourist information centre, turn right and follow Willow Lane until it joins Pine Street - and right opposite - on the far side of the railway tracks - is the cafe."},{"id":"EX05","title":"Map Labelling Practice 5","type":"Map Labelling","instruction":"Label the map below. Write the correct letter A-F next to questions 17-20.","image":"assets/images/ex05.jpg","audio":"assets/audio/ml5.mp3","source":"The official Guide to IELTS","questions":[{"id":"q17","displayNum":17,"label":"Joe Tremain sculptures","answer":"E","accepted":["E"],"evidence_full":"displayed on this side of the Upper Lake, just behind the Education Centre and near the bridge.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 17 là “E”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q18","displayNum":18,"label":"Giorgio Catalucci bird sculptures","answer":"C","accepted":["C"],"evidence_full":"just across the bridge on the north side of Lower Lake.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 18 là “C”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q19","displayNum":19,"label":"Garden Gallery","answer":"F","accepted":["F"],"evidence_full":"from the Visitor Centre you go to the Education Centre, then keep on along the path, and you’ll see it on your right.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 19 là “F”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q20","displayNum":20,"label":"Long House","answer":"A","accepted":["A"],"evidence_full":"go to the bridge and then turn left on the other side ... winding pathway going up towards the northern boundary ... find it at the top.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 20 là “A”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]}],"transcript_text":"Now let me just tell you a bit about what you can see in the Sculpture Park. If you look at your map, you’ll see the Visitor Centre, where we are now, at the bottom, just by the entrance. Since we only have an hour, you might not be able to get right around the park, but you can choose to visit some of the highlights. You might like to take a look at the Joe Tremain sculptures which are displayed on this side of the Upper Lake, just behind the Education Centre and near the bridge. They’re really impressive, but please remember not to let your children climb on them. One of our most popular exhibitions is the Giorgio Catalucci bird sculptures - they’re just across the bridge on the north side of Lower Lake. I love the way they’re scattered around in the long grass beside the lake, looking as if they’re just about to take to their wings. You could also go to the Garden Gallery. It’s on this side of the Upper Lake - from the Visitor Centre you go to the Education Centre, then keep on along the path, and you’ll see it on your right. There’s an exhibition of animal carvings there which is well worth a look. We also have the Long House - that’s quite a walk. From here you go to the bridge and then turn left on the other side. Soon you’ll see a winding pathway going up towards the northern boundary of the park - go up there and you’ll find it at the top. They have some abstract metal sculptures that are well worth seeing if you have time."},{"id":"EX06","title":"Map Labelling Practice 6","type":"Map Labelling","instruction":"Label the plan below. Write the correct letter A-H next to questions 11-15.","image":"assets/images/ex06.jpg","audio":"assets/audio/ml6.mp3","source":"The official Guide to IELTS","questions":[{"id":"q11","displayNum":11,"label":"Newspapers","answer":"C","accepted":["C"],"evidence_full":"the newspapers are now just the other side of the stairs, near the study area.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 11 là “C”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q12","displayNum":12,"label":"Computers","answer":"B","accepted":["B"],"evidence_full":"at the far side of the building on the right, in the corner overlooking the car park.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 12 là “B”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q13","displayNum":13,"label":"Photocopiers","answer":"A","accepted":["A"],"evidence_full":"right opposite the entrance, by the wall on the far side.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 13 là “A”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q14","displayNum":14,"label":"Cafe","answer":"H","accepted":["H"],"evidence_full":"turn right as soon as you get past the desk, you’ll see the door ahead of you.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 14 là “H”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q15","displayNum":15,"label":"Sports books","answer":"G","accepted":["G"],"evidence_full":"all together immediately to the right of the entrance.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 15 là “G”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]}],"transcript_text":"Hello. As some of you know, I’m Elaine Marriott, the head of the college’s Learning Resource Centre. We’ve invited all of you taking evening classes and leisure activities to come and see the changes we’ve made to the Centre in the last month. One major change we’ve made here on the ground floor is to the layout – as you can see from looking around you. I’m sure you’ll recognize the desk – that’s still in the same place, as it has to be just inside the door. But you’ll see that there are now periodicals on the shelves in the corner behind the desk. We’ve brought them nearer the entrance because so many people like to come in just to read magazines. We now stock a far wider range of periodicals than we used to, so we’ve decided to separate them from newspapers. This means the newspapers are now just the other side of the stairs, near the study area. Now, another thing is that we’ve brought the computers downstairs – people used to complain about having to go upstairs to use them. So they’re now at the far side of the building on the right, in the corner overlooking the car park. We’ve now got an extra photocopier, so as well as the one upstairs, there’s one down here. You can see it right opposite the entrance, by the wall on the far side. The biggest change, though, and one I’m sure many of you will welcome, is that we now have a café at last – we’ve been asking for one for years. If you turn right as soon as you get past the desk, you’ll see the door ahead of you. It became possible to have a café because the building has been extended, and we’ve now got a new office and storeroom area. What else should I tell you about before we walk round? Oh yes, we’ve had so many requests for books on sport that we’ve bought a lot more, and they’re all together immediately to the right of the entrance."},{"id":"EX07","title":"Map Labelling Practice 7","type":"Map Labelling","instruction":"Listen and label the plan below. Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.","image":"assets/images/ex07.jpg","audio":"assets/audio/ml7.mp3","source":"Listening for IELTS","questions":[{"id":"q1","displayNum":1,"label":"Map label","answer":"Cabins","accepted":["Cabins"],"evidence_full":"The cabins are by the river","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 1 là “Cabins”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q2","displayNum":2,"label":"Map label","answer":"Tents","accepted":["Tents"],"evidence_full":"the tents are on higher ground, away from the river and next to the wash rooms.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 2 là “Tents”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q3","displayNum":3,"label":"Map label","answer":"Cooking area","accepted":["Cooking area"],"evidence_full":"All cooking is done in the cooking area, which is situated in the centre of the camp.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 3 là “Cooking area”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]}],"transcript_text":"Camp manager: The Health and Action Summer Camp in the country of Cork in southern Ireland is ideal for young people who would like to learn new sports and activities. It has a beautiful location near a river and occupies five acres. The camp has two types of accommodation: tents and cabins, both of which are modern and comfortable. The cabins are by the river and the tents are on higher ground, away from the river and next to the wash rooms. There are two washroom blocks, fully equipped with showers as well as toilets. We also have facilities for cooking here. We provide all the pots, pans and utensils. All cooking is done in the cooking area, which is situated in the centre of the camp. This gives the camp a real social focal point."},{"id":"EX08","title":"Map Labelling Practice 8","type":"Map Labelling","instruction":"Label the plan below. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.","image":"assets/images/ex08.jpg","audio":"assets/audio/ml8.mp3","source":"Listening for IELTS","questions":[{"id":"q5","displayNum":5,"label":"Map label","answer":"dance studios","accepted":["dance studios"],"evidence_full":"The dance studios are to the left of the reception area ... No…sorry… I meant opposite the swimming pool.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 5 là “dance studios”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q6","displayNum":6,"label":"Map label","answer":"changing rooms","accepted":["changing rooms"],"evidence_full":"The arena is behind the changing rooms, which you can see behind us, between the gym and tennis courts.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 6 là “changing rooms”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q7","displayNum":7,"label":"Map label","answer":"tennis courts","accepted":["tennis courts"],"evidence_full":"The tennis courts are on the right of the arena.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 7 là “tennis courts”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]}],"transcript_text":"Now some of you won’t have been to Park Hill Leisure Centre before, so let me just tell you a little about the layout. As you can see, the reception area here is very spacious, and there is plenty of room to meet your friends and have a drink. We also have brand-new dance studios with floor-to-ceiling mirrors and the latest audio equipment. The dance studios are to the left of the reception area, behind the swimming pool. No… sorry… I meant opposite the swimming pool. Both the roller skating and skateboarding classes will be held in the Skate Arena. This has also been refurbished and we have a new five-metre ramp in there which is proving to be popular. The arena is behind the changing rooms, which you can see behind us, between the gym and tennis courts. The tennis courts are on the right of the arena. You’ll see both of these new spaces on the tour later."},{"id":"EX09","title":"Map Labelling Practice 9","type":"Map Labelling","instruction":"Write NO MORE THAN TWO WORDS for each answer.","image":"assets/images/ex09.jpg","audio":"assets/audio/ml9.mp3","source":"Cambridge IELTS 7","questions":[{"id":"q15","displayNum":15,"label":"Map label","answer":"car park","accepted":["car park"],"evidence_full":"There is also a car park, but it only holds a limited number of cars.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 15 là “car park”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q16","displayNum":16,"label":"Map label","answer":"rose garden","accepted":["rose garden"],"evidence_full":"around to the west, you can relax and sit on a bench to smell the flowers in the rose garden","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 16 là “rose garden”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q17","displayNum":17,"label":"Map label","answer":"cafe","accepted":["cafe","café"],"evidence_full":"if you look through the trees, you can see the cafe, which has lovely views across the water.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 17 là “cafe”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]}],"transcript_text":"Well, here we are at the top of The Tower, and we’re going to look at the view from each direction. Out to the east, the large buildings about a kilometre away are on the Olympic site. There’s an indoor arena for gymnastics, a stadium for track and field and a swimming pool for races and synchronised swimming and also diving. If you look carefully down there, you can see the train lines. The Olympic site has its own station to encourage the use of public transport. There is also a car park, but it only holds a limited number of cars. The formal park has some specially-created water features. If you look out here to the south, you can see a circular ornamental pond. And around to the west, you can relax and sit on a bench to smell the flowers in the rose garden, and finally up to the north, if you look in front of you now, there’s a lake with a small island in the centre, you can hire rowing boats at the boat shed, which you can’t see from here, but if you look through the trees, you can see the cafe, which has lovely views across the water."},{"id":"EX10","title":"Map Labelling Practice 10","type":"Map Labelling","instruction":"Label the plan below. Write NO MORE THAN TWO WORDS for each answer.","image":"assets/images/ex10.jpg","audio":"assets/audio/ml10.mp3","source":"Cambridge IELTS 8","questions":[{"id":"q12","displayNum":12,"label":"Map label","answer":"Forest","accepted":["Forest","forest area"],"evidence_full":"Then further east, in the largest section of our Park is the Forest Area.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 12 là “Forest”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q13","displayNum":13,"label":"Map label","answer":"Fish Farms","accepted":["Fish Farms","fish farm"],"evidence_full":"These two small rectangular shapes here are the Fish Farms where we rear fish for sale.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 13 là “Fish Farms”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q14","displayNum":14,"label":"Map label","answer":"Market Garden","accepted":["Market Garden","market garden area"],"evidence_full":"In the south-eastern corner, beyond the marsh, is our Market Garden area","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 14 là “Market Garden”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]}],"transcript_text":"Let’s start by seeing what there is to do. As you can see here on our giant wall plan, we are now situated in the Reception block here. As you walk out of the main door into the park there is a path you can follow. If you follow this route you will immediately come into the Rare Breeds section, where we keep a wide variety of animals which I shall be telling you a little more about later. Next to this, moving east, is the large grazing area for the rare breeds. Then further east, in the largest section of our Park is the Forest Area. South of the grazing area and in fact just next to the Reception block is our Experimental Crop Area. In the middle of the Park this circular area is our lake. These two small rectangular shapes here are the Fish Farms where we rear fish for sale. To the east of those is the marsh area which attracts a great many migrant birds. In the south-eastern corner, beyond the marsh, is our Market Garden area, growing vegetables and flowers."},{"id":"EX11","title":"Map Labelling Practice 11","type":"Map Labelling","instruction":"Label the map below. Write the correct letter A-H next to questions 14-20.","image":"assets/images/ex11.jpg","audio":"assets/audio/ml11.mp3","source":"Cambridge IELTS 8","questions":[{"id":"q14","displayNum":14,"label":"trees","answer":"C","accepted":["C"],"evidence_full":"mature pine trees ... just to the right of the supermarket in Days Road.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 14 là “C”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q15","displayNum":15,"label":"wider footpaths","answer":"D","accepted":["D"],"evidence_full":"the pavements on the corner of Carberry and Thomas Street will be widened.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 15 là “D”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q16","displayNum":16,"label":"coloured road surface","answer":"G","accepted":["G"],"evidence_full":"the roadway at the entry of Thomas Street from Days Road will be painted red.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 16 là “G”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q17","displayNum":17,"label":"new sign","answer":"B","accepted":["B"],"evidence_full":"A ‘keep clear’ sign will be erected at the junction of Evelyn Street and Hill Street","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 17 là “B”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q18","displayNum":18,"label":"traffic lights","answer":"F","accepted":["F"],"evidence_full":"install traffic lights half way down Hill Street where it crosses Days Road.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 18 là “F”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q19","displayNum":19,"label":"artwork","answer":"A","accepted":["A"],"evidence_full":"paintings on the wall of a building on the other side of Hill Street from the supermarket.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 19 là “A”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q20","displayNum":20,"label":"children’s playground","answer":"E","accepted":["E"],"evidence_full":"a new children’s playground ... at the other end of Hill Street close to the intersection with Carberry Street.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 20 là “E”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]}],"transcript_text":"Now, we’ve also put together a map which we’ve sent out to all the residents in the area. And on the map we’ve marked the proposed changes. Firstly, we’ll plant mature pine trees to provide shelter and shade just to the right of the supermarket in Days Road. In order to address the traffic problems, the pavements on the corner of Carberry and Thomas Street will be widened. This will help to reduce the speed of vehicles entering Thomas Street. We think it’s very important to separate the local residential streets from the main road. So the roadway at the entry of Thomas Street from Days Road will be painted red. This should mark it more clearly and act as a signal for traffic to slow down. One way of making sure that the pedestrians are safe is to increase signage at the intersections. A ‘keep clear’ sign will be erected at the junction of Evelyn Street and Hill Street, to enable traffic to exit at all times. Something we’re planning to do to help control the flow of traffic in the area is to install traffic lights half way down Hill Street where it crosses Days Road. Now, we haven’t only thought about the cars and traffic, of course, there’s also something for the children. We’re going to get school children in the area to research a local story, the life of a local sports hero perhaps, and an artist will incorporate that story into paintings on the wall of a building on the other side of Hill Street from the supermarket. And finally, we’ve agreed to build a new children’s playground which will be at the other end of Hill Street close to the intersection with Carberry Street."},{"id":"EX12","title":"Map Labelling Practice 12","type":"Map Labelling","instruction":"Label the map below. Write the correct letter A-I next to questions 17-20.","image":"assets/images/ex12.jpg","audio":"assets/audio/ml12.mp3","source":"Cambridge IELTS 9","questions":[{"id":"q17","displayNum":17,"label":"bird hide","answer":"A","accepted":["A"],"evidence_full":"a bird hide to the west of it, at the end of a path.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 17 là “A”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q18","displayNum":18,"label":"dog-walking area","answer":"I","accepted":["I"],"evidence_full":"Fairly close to where refreshments are available, there’s a dog-walking area in the southern part of the park","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 18 là “I”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q19","displayNum":19,"label":"flower garden","answer":"F","accepted":["F"],"evidence_full":"the flower garden; that’s the circular area on the map surrounded by paths.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 19 là “F”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]},{"id":"q20","displayNum":20,"label":"wooded area","answer":"E","accepted":["E"],"evidence_full":"a wooded area in the western section of the park, between two paths.","explanation":"Định vị theo mốc và cụm chỉ hướng/vị trí trong tapescript. Đáp án nguồn cho câu 20 là “E”.","memory":[{"item":"Map signal","vi":"Tín hiệu định vị","note":"Theo dõi điểm mốc → hướng di chuyển → quan hệ vị trí; chú ý correction như “No… sorry… I meant…”."}]}],"transcript_text":"And finally I’d like to tell you about our new wildlife area, Hinchingbrooke Park, which will be opened to the public next month. This slide doesn’t really indicate how big it is, but anyway, you can see the two gates into the park, and the main paths. As you can see, there’s a lake in the north west of the park, with a bird hide to the west of it, at the end of a path. So it’ll be a nice quiet place for watching the birds on the lake. Fairly close to where refreshments are available, there’s a dog-walking area in the southern part of the park, leading off from the path. And if you just want to sit and relax, you can go to the flower garden; that’s the circular area on the map surrounded by paths. And finally, there’s a wooded area in the western section of the park, between two paths."}],"knowledge":[{"id":"overview","title":"1. Map Labelling Overview","html":"<p><b>Map Labelling</b> thường xuất hiện ở IELTS Listening Part 2. Nguồn chia thành hai dạng: (1) nối địa điểm với vị trí A/B/C…; (2) nghe và tự điền tên địa điểm vào vị trí trống.</p><div class=\"tip\">Luôn đọc instruction để xác định dạng câu hỏi và word limit trước khi nghe.</div>"},{"id":"direction","title":"2. Phương hướng","html":"<p>North/top • South/bottom • East/right • West/left; ngoài ra có north-east, south-east, north-west, south-west và các góc tương ứng.</p><div class=\"tip\">Trước khi audio chạy, xác định ngay N/S/E/W trên bản đồ để giảm nhầm hướng.</div>"},{"id":"position","title":"3. Từ chỉ vị trí","html":"<p>on, in, away from, into, down, through, in front of, behind, along, past, across, up, out of, towards, onto, off, not far from, far from, at/beside/next to, near, across from, between, on the left/right, around the corner, under, over, among, in the middle of, around, above, below, against.</p>"},{"id":"route","title":"4. Từ/cụm tả đường","html":"<p><b>go straight / head for</b>, turn right/left, cross the road, take the first/second turning, go past, follow/walk along ... to the end, directly behind, on the far side of...</p><div class=\"tip\">“If you reach A, you’ve gone too far” là tín hiệu loại trừ vị trí.</div>"},{"id":"steps","title":"5. Quy trình 4 bước","html":"<ol><li>Xác định dạng Map và word limit.</li><li>Phân tích map: hướng, điểm mốc, footnote, điểm bắt đầu như YOU ARE HERE/Entrance/Reception.</li><li>Nghe và di chuyển theo mô tả trên map.</li><li>Đối chiếu đáp án và đọc transcript để củng cố từ vựng.</li></ol>"},{"id":"traps","title":"6. Bẫy thường gặp","html":"<ul><li>Nhầm east/west hoặc left/right.</li><li>Bỏ sót một trong 2–5 đặc điểm định vị.</li><li>Không theo kịp chuỗi hướng đi.</li><li>Không nhận ra correction: người nói có thể sửa lại vị trí vừa nói.</li></ul><div class=\"tip\">Nguồn khuyên “cho chiếc bút đi lại trong biểu đồ”: theo sát từng bước mô tả thay vì cố ghi nhớ toàn bộ đường đi.</div>"}],"totalAnswers":53}
const NS=`${DATA.courseId}:${DATA.unitId}:${DATA.lessonId}:v${DATA.version}`;
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
function load(){try{return JSON.parse(localStorage.getItem(NS)||'{}')}catch{return {}}}
let state=load(); state.student=state.student||{}; state.exercises=state.exercises||{};
function save(){localStorage.setItem(NS,JSON.stringify(state));}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function showPage(id){$$('.page').forEach(p=>p.classList.remove('active'));$('#'+id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function exState(id){return state.exercises[id]||(state.exercises[id]={status:'not_started',answers:{},attemptCount:0,submittedAttemptIds:[],audioPosition:0,reviewUnlocked:false});}
function persistStudent(){state.student={studentName:$('#studentName').value.trim(),studentClass:$('#studentClass').value.trim(),studentId:$('#studentId').value.trim()};save();}
function initStudent(){['studentName','studentClass','studentId'].forEach(id=>{const el=$('#'+id);el.value=state.student[id]||'';el.addEventListener('input',persistStudent)});}
function renderHome(){const grid=$('#homeGrid');grid.innerHTML='';
 const kc=document.createElement('div');kc.className='knowledge-card';kc.innerHTML='<div class="card-row"><div><b>📘 KIẾN THỨC CẦN HỌC</b><div class="score">Map Labelling • Directions • Position • Route-following</div></div><span class="pill">Theory</span></div>';kc.onclick=()=>renderKnowledge();grid.appendChild(kc);
 let completed=0;DATA.exercises.forEach((e,i)=>{const st=exState(e.id);if(st.status==='completed')completed++;const c=document.createElement('div');c.className='exercise-card';const cls=st.status==='completed'?'done':st.status==='in_progress'?'progress':'';const txt=st.status==='completed'?'Completed':st.status==='in_progress'?'In progress':'Not started';const score=st.status==='completed'?`Latest score: ${st.score}/${st.total} • Attempts: ${st.attemptCount}`:`${e.questions.length} answer fields • ${e.type}`;c.innerHTML=`<div class="card-row"><div><b>Exercise ${i+1}: ${esc(e.title)}</b><div class="score">${esc(score)}</div></div><span class="pill ${cls}">${txt}</span></div>`;c.onclick=()=>openExercise(e.id);grid.appendChild(c)});
 const pct=DATA.exercises.length?completed/DATA.exercises.length*100:0;$('#overallBar').style.width=pct+'%';$('#overallText').textContent=`Progress: ${completed}/${DATA.exercises.length} exercises completed • ${DATA.totalAnswers} total answer fields in this lesson`;save();}
function renderKnowledge(){showPage('knowledgePage');const tabs=$('#knowledgeTabs');tabs.innerHTML='';DATA.knowledge.forEach((k,i)=>{const b=document.createElement('button');b.textContent=k.title;b.className=i===0?'active':'';b.onclick=()=>{[...tabs.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#knowledgePane').innerHTML=k.html};tabs.appendChild(b)});$('#knowledgePane').innerHTML=DATA.knowledge[0].html;}
function normalize(s){return String(s??'').trim().toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ').replace(/[.,;:!?]+$/,'');}
function accepted(q,val){const n=normalize(val);return (q.accepted||[q.answer]).some(a=>normalize(a)===n)}
let currentExerciseInstruction="";
function inputFor(q,n,st){const letter=/correct letter/i.test(currentExerciseInstruction||'');const control=letter?`<select class="answer-input choice-select" id="${q.id}" data-q="${q.id}"><option value="">-- Chọn --</option>${Array.from({length:11},(_,i)=>String.fromCharCode(65+i)).map(x=>`<option value="${x}" ${String(st.answers[q.id]||'')===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input class="answer-input" id="${q.id}" data-q="${q.id}" value="${esc(st.answers[q.id]||'')}" placeholder="Type your answer" autocomplete="off">`;return `<div class="question"><div class="qline"><div class="qbadge">${q.displayNum||n}</div><div class="qcontent"><label for="${q.id}">${esc(q.label)}</label>${control}</div></div></div>`}
function renderQuestionArea(e,st){
 if(e.layout==='train-table'){
   let h='<div class="table-wrap"><table class="ielts-table"><thead><tr><th>#</th><th>Platform No.</th><th>Time</th><th>Destination</th></tr></thead><tbody>';
   for(let r=0;r<8;r++){h+=`<tr><td>${r+1}</td>`;for(let c=0;c<3;c++){const q=e.questions[r*3+c];h+=`<td><span class="qbadge" style="display:inline-flex;margin-right:6px">${r*3+c+1}</span><input class="answer-input" id="${q.id}" data-q="${q.id}" value="${esc(st.answers[q.id]||'')}"></td>`}h+='</tr>'}return h+'</tbody></table></div>';
 }
 if(e.layout==='population-tables'){
   let i=0,h='<h3>Table 1</h3><div class="table-wrap"><table class="ielts-table"><thead><tr><th>Area</th><th>People/sq km</th></tr></thead><tbody>';const areas=['UK','European Community','England','Greater London','Scotland','Wales','Northern Ireland'];areas.forEach(a=>{const q=e.questions[i++];h+=`<tr><td>${a}</td><td><span class="qbadge" style="display:inline-flex;margin-right:6px">${i}</span><input class="answer-input" id="${q.id}" data-q="${q.id}" value="${esc(st.answers[q.id]||'')}"></td></tr>`});h+='</tbody></table></div><h3>Table 2</h3><div class="table-wrap"><table class="ielts-table"><thead><tr><th>City</th><th>Area (sq km)</th><th>Population (thousands)</th></tr></thead><tbody>';const cities=['Greater London','Birmingham','Leeds','Glasgow','Edinburgh','Manchester','Bristol','Coventry'];cities.forEach(c=>{const qa=e.questions[i++],qp=e.questions[i++];h+=`<tr><td>${c}</td><td><span class="qbadge" style="display:inline-flex;margin-right:6px">${i-1}</span><input class="answer-input" id="${qa.id}" data-q="${qa.id}" value="${esc(st.answers[qa.id]||'')}"></td><td><span class="qbadge" style="display:inline-flex;margin-right:6px">${i}</span><input class="answer-input" id="${qp.id}" data-q="${qp.id}" value="${esc(st.answers[qp.id]||'')}"></td></tr>`});return h+'</tbody></table></div>';
 }
 if(e.layout==='survey-table'){
   const labels=["A woman’s place is in the home","If a couple both earn money, both should share the housework","Men and women should be paid the same for the same job","Nursing is women’s work","Mining is men’s work","Cooking should still be done by women","Washing clothes should still be done by women"];
   const fixed={"China-0":"12%","China-4":"90%","Japan-5":"82%"};const map={};e.questions.forEach((q,idx)=>{const m=q.label.match(/^(China|Japan|Korea|Thailand) - (.*)$/);if(m){map[m[1]+'-'+labels.indexOf(m[2])]={q,n:idx+1}}});
   let h='<div class="tip"><b>Note:</b> Thông tin câu trả lời không theo thứ tự vị trí câu hỏi.</div><div class="table-wrap"><table class="ielts-table"><thead><tr><th>Young people (%) who agree</th><th>China</th><th>Japan</th><th>Korea</th><th>Thailand</th></tr></thead><tbody>';
   labels.forEach((lab,r)=>{h+=`<tr><td>${lab}</td>`;['China','Japan','Korea','Thailand'].forEach(country=>{const key=country+'-'+r;if(fixed[key])h+=`<td><b>${fixed[key]}</b></td>`;else{const o=map[key];h+=`<td><span class="qbadge" style="display:inline-flex;margin-right:5px">${o.n}</span><input class="answer-input" id="${o.q.id}" data-q="${o.q.id}" value="${esc(st.answers[o.q.id]||'')}"></td>`}});h+='</tr>'});return h+'</tbody></table></div>';
 }
 return e.questions.map((q,i)=>inputFor(q,i+1,st)).join('');
}
function openExercise(id){const e=DATA.exercises.find(x=>x.id===id),st=exState(id);currentExerciseInstruction=e.instruction||""; if(st.status==='not_started')st.status='in_progress';save();showPage('exercisePage');
 const mount=$('#exerciseMount');mount.innerHTML=`<div class="exercise-wrap"><article class="task"><div class="task-head"><h2>${esc(e.id.replace('EX','Exercise '))}: ${esc(e.title)}</h2><p>${esc(e.instruction)}</p><div class="source-note">Source: ${esc(e.source||'')}</div></div>${e.image?`<div class="map-figure"><img src="${e.image}" alt="${esc(e.title)} map"><div class="map-note">Hình gốc được giữ nguyên tỉ lệ • không crop • có thể zoom bằng trình duyệt nếu cần.</div></div>`:''}${e.audio?`<div class="audio-box"><audio id="player" controls preload="metadata" src="${e.audio}"></audio></div>`:'<div class="audio-box"><b>Audio:</b> Chưa có file audio Map Labelling trong bộ file hiện tại. Bài tập, đáp án và tapescript vẫn được giữ đầy đủ theo nguồn.</div>'}<div class="questions">${renderQuestionArea(e,st)}</div><div class="task-actions"><button class="btn primary" id="checkBtn">✓ Kiểm tra đáp án</button><button class="btn" id="backBtn">← Trở lại trang chủ</button></div><div class="review ${st.reviewUnlocked?'open':''}" id="review"></div></article><aside class="side"><h3>${esc(e.id.replace('EX','Exercise '))}</h3><div class="mini-status" id="answeredStatus"></div><button class="btn primary" id="sideCheck">Kiểm tra đáp án</button><button class="btn" id="retryBtn" ${st.reviewUnlocked?'':'disabled'}>↻ Làm lại / Retry</button><button class="btn danger" id="resetBtn">Reset Exercise</button><button class="btn" id="sideHome">← Lesson Home</button></aside></div>`;
 const player=$('#player');if(player){player.addEventListener('loadedmetadata',()=>{if(st.audioPosition&&st.audioPosition<player.duration-2)player.currentTime=st.audioPosition});player.addEventListener('timeupdate',()=>{st.audioPosition=player.currentTime;save()});}
 $$('.answer-input').forEach(inp=>{const ev=inp.tagName==='SELECT'?'change':'input';inp.addEventListener(ev,()=>{st.answers[inp.dataset.q]=inp.value;st.status='in_progress';save();updateAnswered(e,st)})});updateAnswered(e,st);
 $('#checkBtn').onclick=$('#sideCheck').onclick=()=>checkExercise(e,st);$('#backBtn').onclick=$('#sideHome').onclick=()=>goHome();$('#retryBtn').onclick=()=>retryExercise(e,st);$('#resetBtn').onclick=()=>resetExercise(e,st);if(st.reviewUnlocked)renderReview(e,st);
}
function updateAnswered(e,st){const n=e.questions.filter(q=>String(st.answers[q.id]||'').trim()).length;const el=$('#answeredStatus');if(el)el.textContent=`Answered: ${n}/${e.questions.length} • Autosaved`}
function collectInputs(e,st){e.questions.forEach(q=>{const el=document.getElementById(q.id);if(el)st.answers[q.id]=el.value});save()}
function ensureStudent(){const missing=[];if(!state.student.studentName)missing.push('studentName');if(!state.student.studentClass)missing.push('studentClass');if(!state.student.studentId)missing.push('studentId');if(!missing.length)return true;alert('Vui lòng nhập đầy đủ Họ tên, Lớp và Mã học sinh trước khi nộp Exercise.');goHome();setTimeout(()=>{const el=document.getElementById(missing[0]);if(el)el.focus()},80);return false}
async function checkExercise(e,st){collectInputs(e,st);if(!ensureStudent())return;const blanks=e.questions.filter(q=>!String(st.answers[q.id]||'').trim()).length;if(blanks && !confirm(`Bạn còn ${blanks} câu chưa trả lời. Vẫn chấm bài?`))return;
 let score=0;const results={};e.questions.forEach(q=>{const ok=accepted(q,st.answers[q.id]||'');if(ok)score++;results[q.id]={student:st.answers[q.id]||'',correct:q.answer,isCorrect:ok}});st.attemptCount=(st.attemptCount||0)+1;const attemptId=`${DATA.unitId}-${DATA.lessonId}-${e.id}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;st.currentAttemptId=attemptId;st.score=score;st.total=e.questions.length;st.correct=score;st.wrong=e.questions.length-score;st.results=results;st.status='completed';st.reviewUnlocked=true;st.lastUpdated=new Date().toISOString();save();renderReview(e,st);renderHome();
 const payload={studentName:state.student.studentName||'',studentClass:state.student.studentClass||'',studentId:state.student.studentId||'',testId:`${DATA.unitId}-${DATA.lessonId}-${e.id}`,testName:`Map Labelling - ${e.id} - ${e.title}`,score,total:e.questions.length,duration:'',correct:score,wrong:e.questions.length-score,answers:{meta:{attempt:st.attemptCount,attemptId,lessonId:DATA.lessonId,exerciseId:e.id,submittedAt:new Date().toISOString(),unanswered:blanks},...results}};
 await sendResult(payload,e,st,attemptId);renderReview(e,st);
}
async function sendResult(payload,e,st,attemptId){if((st.submittedAttemptIds||[]).includes(attemptId))return;try{await fetch(DATA.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});st.submittedAttemptIds=st.submittedAttemptIds||[];st.submittedAttemptIds.push(attemptId);st.lastSubmissionState='request_sent_unverified';save();toast('Đã gửi yêu cầu lưu kết quả. Trình duyệt không thể xác minh phản hồi Google Sheet ở chế độ no-cors.')}catch(err){st.pendingSubmission={payload,attemptId};st.lastSubmissionState='pending';save();toast('Chưa gửi được Google Sheet. Kết quả đã được lưu trên thiết bị.')}}
function renderReview(e,st){const box=$('#review');if(!box||!st.results)return;const unanswered=e.questions.filter(q=>!String(st.results[q.id].student||'').trim()).length;let h=`<h2>Review</h2><div class="result-summary"><div class="metric"><b>${st.score}/${st.total}</b><br>Score</div><div class="metric"><b>${st.correct}</b><br>Correct</div><div class="metric"><b>${st.wrong}</b><br>Wrong</div><div class="metric"><b>${unanswered}</b><br>Unanswered</div><div class="metric"><b>${st.attemptCount}</b><br>Attempt</div></div>`;
 e.questions.forEach((q,i)=>{const r=st.results[q.id],cls=r.isCorrect?'good':'bad';const memory=(q.memory||[]).map(m=>`<li><b>${esc(m.item||'')}</b>${m.vi?` = ${esc(m.vi)}`:''}${m.note?`<br><span class="score">${esc(m.note)}</span>`:''}</li>`).join('');h+=`<div class="review-item ${cls}"><h3 style="margin:0 0 8px">Question ${q.displayNum||i+1}</h3><div class="prompt-box"><div class="review-label">Đề bài / Original task</div><div><b>${esc(e.instruction)}</b></div><div style="margin-top:6px"><span class="review-label">Mục cần điền / Question target</span><br>${esc(q.label)}</div></div><div class="ans"><div><small>Your answer</small><br><b>${esc(r.student||'—')}</b></div><div><small>Đáp án đúng / Correct answer</small><br><b>${esc(q.answer)}</b></div></div><div class="explain"><div class="review-label">Tapescript evidence</div><div class="evidence">${esc(q.evidence_full||q.evidence||'Không có tapescript trong nguồn.').replace(/\n/g,'<br>')}</div><div style="margin-top:10px"><b>Giải thích:</b> ${esc(q.explanation||'')}</div><div class="q-memory"><b>🧠 KIẾN THỨC CẦN NHỚ</b>${memory?`<ul>${memory}</ul>`:'<p>Không có mục bổ sung từ nguồn cho câu này.</p>'}</div></div></div>`});
 h+=accordion('🎧 Full Tapescript',`${e.audio?`<audio controls style="width:100%;margin-bottom:12px" src="${e.audio}"></audio>`:''}<div>${esc(e.transcript_text||'Transcript not supplied in the source.').replace(/\n/g,'<br>')}</div>`,'transcript');
 if(e.vocabulary?.length){let v='<div class="table-wrap"><table class="ielts-table"><thead><tr><th>Item</th><th>Part of speech</th><th>Tiếng Việt</th><th>Meaning (source)</th></tr></thead><tbody>';e.vocabulary.forEach(x=>v+=`<tr><td><b>${esc(x[0])}</b></td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td>${esc(x[3])}</td></tr>`);v+='</tbody></table></div>';h+=accordion('📚 Vocabulary from the source',v,'vocab')}
 if(e.knowledge?.length)h+=accordion('🧠 Kiến thức cần nhớ',`<ul>${e.knowledge.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,'remember');
 h+=`<p class="submission-note">Google Sheet status: ${st.lastSubmissionState==='request_sent_unverified'?'Request sent (response cannot be verified in no-cors mode)':st.lastSubmissionState==='pending'?'Pending / saved locally':'Will be sent when this attempt is checked'}</p>`;box.innerHTML=h;box.classList.add('open');$$('.acc-btn').forEach(b=>b.onclick=()=>b.nextElementSibling.classList.toggle('open'));const rb=$('#retryBtn');if(rb)rb.disabled=false;}
function accordion(title,body,id){return `<div class="accordion"><button class="acc-btn" type="button">${title}</button><div class="acc-body" id="${id}">${body}</div></div>`}
function retryExercise(e,st){if(!st.reviewUnlocked)return; if(!confirm('Bắt đầu một attempt mới? Kết quả cũ vẫn được giữ trong lịch sử gửi Google Sheet, nhưng ô trả lời hiện tại sẽ được xóa cho lần làm mới.'))return;st.answers={};st.results=null;st.score=null;st.total=null;st.correct=null;st.wrong=null;st.status='in_progress';st.reviewUnlocked=false;st.audioPosition=0;save();openExercise(e.id);}
function resetExercise(e,st){if(!confirm('RESET EXERCISE sẽ xóa trạng thái và câu trả lời của Exercise này trên thiết bị. Dữ liệu đã gửi Google Sheet trước đó không thể bị thu hồi. Tiếp tục?'))return;state.exercises[e.id]={status:'not_started',answers:{},attemptCount:0,submittedAttemptIds:[],audioPosition:0,reviewUnlocked:false};save();toast('Đã reset Exercise trên thiết bị.');goHome();}
function goHome(){const p=$('#player');if(p)p.pause();renderHome();showPage('homePage')}
async function retryPending(){for(const e of DATA.exercises){const st=state.exercises?.[e.id];if(st?.pendingSubmission?.payload&&st?.pendingSubmission?.attemptId){const {payload,attemptId}=st.pendingSubmission;try{await fetch(DATA.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});st.submittedAttemptIds=st.submittedAttemptIds||[];if(!st.submittedAttemptIds.includes(attemptId))st.submittedAttemptIds.push(attemptId);delete st.pendingSubmission;st.lastSubmissionState='request_sent_unverified';save()}catch(_){}}}}
$('#homeBtn').onclick=goHome;initStudent();renderHome();retryPending();
</script>
</body>
</html>
