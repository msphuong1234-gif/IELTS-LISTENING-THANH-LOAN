<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dạng 5 – Diagram / Flow-chart Labelling</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#dce3ed;--accent:#2257d6;--good:#087443;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{font-weight:800}.wrap{max-width:1180px;margin:20px auto;padding:0 16px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 6px 22px #15233b0d}.hero h1{margin:0 0 8px;font-size:28px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button,.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.tabs button,.btn.secondary{background:#eef3ff;color:#234ca8}.btn.primary{background:var(--accent);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.exbtn{padding:14px;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.exbtn:hover{border-color:#8da9ef}.hidden{display:none!important}.map-shell{width:100%;overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;padding:8px;margin:12px 0}.map-shell img{display:block;width:auto;height:auto;max-width:100%;max-height:none;object-fit:contain;object-position:center;margin:0 auto}.audio{width:100%;margin:8px 0 14px}.qrow{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}input,select{width:100%;padding:11px;border:1px solid #bcc8da;border-radius:9px;font-size:16px}.review{margin-top:14px}.review-item{border-left:4px solid var(--accent);background:#f8faff;padding:12px;margin:10px 0;border-radius:8px}.good{color:var(--good);font-weight:800}.bad{color:var(--bad);font-weight:800}.evidence{margin-top:7px;color:#344054}.vn{margin-top:6px}.notice{padding:10px 12px;border-radius:10px;background:#fff7e8;border:1px solid #f0d59b}.zoom-note{font-size:13px;color:var(--muted)}@media(max-width:640px){.hero h1{font-size:22px}.wrap{padding:0 10px}.hero,.card{padding:14px;border-radius:14px}.map-shell{padding:4px}.map-shell img{width:100%;height:auto;max-width:100%}.qrow{grid-template-columns:54px 1fr}}
</style></head><body><header><div class="brand">IELTS Listening • Dạng 5</div><button class="btn secondary" onclick="home()">Trang chủ</button></header><main class="wrap"><section id="home" class="hero"><h1>Diagram / Flow-chart Labelling</h1><p>Học chiến lược → nghe audio → làm trực tiếp → kiểm tra đáp án và bằng chứng từ tapescript.</p><div class="tabs"><button onclick="showTheory('type')">Dạng bài</button><button onclick="showTheory('process')">Từ chỉ quy trình</button><button onclick="showTheory('position')">Vị trí & hình dạng</button><button onclick="showTheory('steps')">3 bước làm bài</button></div><div id="theory" class="notice">Chọn một mục kiến thức phía trên.</div></section><section id="list" class="card"><h2>15 Exercises</h2><div class="grid" id="grid"></div></section><section id="exercise" class="card hidden"></section></main>
<script>const DATA=[{"id": 1, "title": "Cloud seeding", "instruction": "NO MORE THAN TWO WORDS", "image": "assets/images/ex01.jpg", "audio": "assets/audio/FAD_01.mp3", "items": [{"q": 6, "answer": "aircraft", "accepted": ["aircraft"], "evidence": "dropped from above by aircraft"}, {"q": 7, "answer": "freeze", "accepted": ["freeze"], "evidence": "the tiny water drops ... freeze"}, {"q": 8, "answer": "ice", "accepted": ["ice"], "evidence": "millions of tiny ice particles"}, {"q": 9, "answer": "releases heat", "accepted": ["releases heat"], "evidence": "it releases heat"}, {"q": 10, "answer": "last longer", "accepted": ["last longer"], "evidence": "They last longer"}], "choice": false, "letters": ""}, {"id": 2, "title": "How to write an article", "instruction": "ONE WORD ONLY", "image": "assets/images/ex02.jpg", "audio": "assets/audio/FAD_02.mp3", "items": [{"q": 6, "answer": "pyramid", "accepted": ["pyramid"], "evidence": "shaped like a pyramid"}, {"q": 7, "answer": "quotations", "accepted": ["quotations", "quotes"], "evidence": "put in quotations from people"}, {"q": 8, "answer": "figures", "accepted": ["figures"], "evidence": "make sure that any figures ... are correct"}, {"q": 9, "answer": "conclusion", "accepted": ["conclusion"], "evidence": "Don’t put in a conclusion"}, {"q": 10, "answer": "headline", "accepted": ["headline"], "evidence": "write a headline"}], "choice": false, "letters": ""}, {"id": 3, "title": "Fumiko’s plan", "instruction": "NO MORE THAN TWO WORDS", "image": "assets/images/ex03.jpg", "audio": "assets/audio/FAD_03.mp3", "items": [{"q": 6, "answer": "key terms", "accepted": ["key terms"], "evidence": "definition of ... key terms"}, {"q": 7, "answer": "animal world", "accepted": ["animal world"], "evidence": "background on the animal world"}, {"q": 8, "answer": "contexts", "accepted": ["contexts"], "evidence": "contexts for relationships"}, {"q": 9, "answer": "stages", "accepted": ["stages"], "evidence": "stages in a friendship"}, {"q": 10, "answer": "influences", "accepted": ["influences"], "evidence": "better still, the influences"}], "choice": false, "letters": ""}, {"id": 4, "title": "Getting the Bronze Award", "instruction": "NO MORE THAN THREE WORDS AND/OR A NUMBER", "image": "assets/images/ex04.jpg", "audio": "assets/audio/FAD_04.mp3", "items": [{"q": 1, "answer": "youth club", "accepted": ["youth club", "Youth club"], "evidence": "school, college, or youth club"}, {"q": 2, "answer": "welcome pack", "accepted": ["welcome pack"], "evidence": "get a welcome pack"}, {"q": 3, "answer": "coordinator", "accepted": ["coordinator"], "evidence": "Duke of Edinburgh Coordinator"}, {"q": 4, "answer": "record book", "accepted": ["record book"], "evidence": "signing your record book"}, {"q": 5, "answer": "badge", "accepted": ["badge"], "evidence": "certificate and badge"}], "choice": false, "letters": ""}, {"id": 5, "title": "Leisure Centre enrolment", "instruction": "NO MORE THAN TWO WORDS AND/OR A NUMBER", "image": "assets/images/ex05.jpg", "audio": "assets/audio/FAD_05.mp3", "items": [{"q": 8, "answer": "sign", "accepted": ["sign"], "evidence": "ask one of your parents to sign"}, {"q": 9, "answer": "reception", "accepted": ["reception"], "evidence": "hand the forms to reception"}, {"q": 10, "answer": "membership card", "accepted": ["membership card"], "evidence": "send your membership card"}], "choice": false, "letters": ""}, {"id": 6, "title": "Alternative energy research project", "instruction": "NO MORE THAN THREE WORDS AND/OR A NUMBER", "image": "assets/images/ex06.jpg", "audio": "assets/audio/FAD_06.mp3", "items": [{"q": 1, "answer": "general", "accepted": ["general"], "evidence": "list should be general"}, {"q": 2, "answer": "specific", "accepted": ["specific"], "evidence": "should also be specific"}, {"q": 3, "answer": "make notes", "accepted": ["make notes"], "evidence": "don’t forget to make notes"}, {"q": 4, "answer": "system", "accepted": ["system"], "evidence": "arrange it into some kind of system"}, {"q": 5, "answer": "relevance", "accepted": ["relevance"], "evidence": "analysis in terms of relevance"}], "choice": false, "letters": ""}, {"id": 7, "title": "Cyclone diagram", "instruction": "NO MORE THAN THREE WORDS AND/OR A NUMBER", "image": "assets/images/ex07.jpg", "audio": "assets/audio/FAD_07.mp3", "items": [{"q": 8, "answer": "rotate", "accepted": ["rotate"], "evidence": "clouds will start to rotate"}, {"q": 9, "answer": "gathering", "accepted": ["gathering"], "evidence": "keep gathering momentum"}, {"q": 10, "answer": "the other direction", "accepted": ["the other direction"], "evidence": "winds ... in the other direction"}], "choice": false, "letters": ""}, {"id": 8, "title": "Water heater diagram", "instruction": "Choose THREE answers A–E", "image": "assets/images/ex08.jpg", "audio": "assets/audio/FAD_08.mp3", "items": [{"q": 11, "answer": "B", "accepted": ["B"], "evidence": "round one on the far left ... main control switch"}, {"q": 12, "answer": "C", "accepted": ["C"], "evidence": "small round plastic button ... reset the heater"}, {"q": 13, "answer": "E", "accepted": ["E"], "evidence": "little square under the third knob ... alarm light"}], "choice": true, "letters": "ABCDE"}, {"id": 9, "title": "History of Furniture Rossi", "instruction": "Choose FIVE answers A–G", "image": "assets/images/ex09.jpg", "audio": "assets/audio/FAD_09.mp3", "items": [{"q": 26, "answer": "E", "accepted": ["E"], "evidence": "quality of the furniture"}, {"q": 27, "answer": "B", "accepted": ["B"], "evidence": "two new warehouses"}, {"q": 28, "answer": "G", "accepted": ["G"], "evidence": "upgrade their software programs"}, {"q": 29, "answer": "A", "accepted": ["A"], "evidence": "improve it [the website]"}, {"q": 30, "answer": "F", "accepted": ["F"], "evidence": "publicise their values"}], "choice": true, "letters": "ABCDEFG"}, {"id": 10, "title": "Next steps", "instruction": "NO MORE THAN TWO WORDS", "image": "assets/images/ex10.jpg", "audio": "assets/audio/FAD_10.mp3", "items": [{"q": 27, "answer": "senior management", "accepted": ["senior management", "senior managers", "management", "managers"], "evidence": "support from your senior management"}, {"q": 28, "answer": "project request", "accepted": ["project request"], "evidence": "project request form"}, {"q": 29, "answer": "meeting", "accepted": ["meeting"], "evidence": "set up a meeting"}, {"q": 30, "answer": "conference call", "accepted": ["conference call"], "evidence": "set up a call"}], "choice": false, "letters": ""}, {"id": 11, "title": "Paper Production and Recycling", "instruction": "NO MORE THAN TWO WORDS", "image": "assets/images/ex11.jpg", "audio": "assets/audio/FAD_11.mp3", "items": [{"q": 21, "answer": "pine forests", "accepted": ["pine forests"], "evidence": "come from pine forests"}, {"q": 22, "answer": "water", "accepted": ["water"], "evidence": "water is added"}, {"q": 23, "answer": "produce", "accepted": ["produce"], "evidence": "newspapers, magazines ... are produced"}, {"q": 24, "answer": "sort", "accepted": ["sort"], "evidence": "someone or something can sort it"}, {"q": 25, "answer": "remove ink", "accepted": ["remove ink"], "evidence": "chemicals ... remove ink"}], "choice": false, "letters": ""}, {"id": 12, "title": "The Operational Cycle", "instruction": "ONE WORD AND/OR A NUMBER", "image": "assets/images/ex12.jpg", "audio": "assets/audio/FAD_12.mp3", "items": [{"q": 23, "answer": "activated", "accepted": ["activated"], "evidence": "activated from a satellite"}, {"q": 24, "answer": "50 kilometres", "accepted": ["50 kilometres", "50 km", "fifty kilometres", "50 kilometers", "fifty kilometers"], "evidence": "average is fifty kilometres"}, {"q": 25, "answer": "temperature", "accepted": ["temperature"], "evidence": "changes in temperature"}], "choice": false, "letters": ""}, {"id": 13, "title": "Advice on exam preparation", "instruction": "NO MORE THAN TWO WORDS AND/OR A NUMBER", "image": "assets/images/ex13.jpg", "audio": "assets/audio/FAD_13.mp3", "items": [{"q": 27, "answer": "priorities", "accepted": ["priorities"], "evidence": "revision priorities"}, {"q": 28, "answer": "timetable", "accepted": ["timetable"], "evidence": "need a timetable"}, {"q": 29, "answer": "small tasks", "accepted": ["small tasks"], "evidence": "break down your revision into small tasks"}, {"q": 30, "answer": "single paragraph", "accepted": ["single paragraph"], "evidence": "write a single paragraph"}], "choice": false, "letters": ""}, {"id": 14, "title": "Solar energy production costs forecast", "instruction": "NO MORE THAN THREE WORDS AND/OR A NUMBER", "image": "assets/images/ex14.jpg", "audio": "assets/audio/FAD_14.mp3", "items": [{"q": 5, "answer": "daylight", "accepted": ["daylight"], "evidence": "hours of daylight"}, {"q": 6, "answer": "country", "accepted": ["country"], "evidence": "whole country"}, {"q": 7, "answer": "willing to", "accepted": ["willing to"], "evidence": "willing to pay"}], "choice": false, "letters": ""}, {"id": 15, "title": "Ellis Island immigration procedure", "instruction": "NO MORE THAN THREE WORDS AND/OR A NUMBER", "image": "assets/images/ex15.jpg", "audio": "assets/audio/FAD_15.mp3", "items": [{"q": 1, "answer": "to New York", "accepted": ["to New York", "New York"], "evidence": "refused entry to New York"}, {"q": 2, "answer": "legal examination", "accepted": ["legal examination"], "evidence": "a legal examination"}, {"q": 3, "answer": "ferry", "accepted": ["ferry", "a ferry"], "evidence": "boarding a ferry to take them to New York City"}], "choice": false, "letters": ""}];
const theory={type:'<b>Hai dạng chính:</b> (1) chọn chữ cái từ danh sách cho sẵn; (2) điền từ/số theo giới hạn từ. Diagram mô tả bộ phận/vị trí; Flow-chart mô tả các giai đoạn nối tiếp.',process:'<b>Trình tự:</b> first / initially / to begin with → next / then / after that → finally / at the final stage. Hãy dùng các tín hiệu này để không mất vị trí trong flow-chart.',position:'<b>Vị trí:</b> left/right, top/bottom, middle/centre, above/below, in front of/behind, near, opposite. <b>Hình dạng:</b> square, round/circular, rectangular, triangular.',steps:'<b>B1.</b> Đọc instruction, xác định dạng đáp án và word limit. <b>B2.</b> Đọc heading, gạch keyword, dự đoán loại từ/thông tin. <b>B3.</b> Nghe theo đúng thứ tự câu hỏi; chú ý paraphrase và kiểm tra word limit.'};
function showTheory(k){document.getElementById('theory').innerHTML=theory[k]}
function norm(s){return (s||'').trim().toLowerCase().replace(/[.,;:!?]/g,'').replace(/\s+/g,' ')}
function home(){document.getElementById('home').classList.remove('hidden');document.getElementById('list').classList.remove('hidden');document.getElementById('exercise').classList.add('hidden');window.scrollTo(0,0)}
function openEx(id){const e=DATA.find(x=>x.id===id);let fields=e.items.map(it=>`<div class="qrow"><b>Q${it.q}</b>${e.choice?`<select id="a${id}_${it.q}"><option value="">— Chọn —</option>${[...e.letters].map(l=>`<option>${l}</option>`).join('')}</select>`:`<input id="a${id}_${it.q}" autocomplete="off" placeholder="Nhập đáp án">`}</div>`).join('');let box=document.getElementById('exercise');box.innerHTML=`<h2>Exercise ${id}: ${e.title}</h2><div class="notice"><b>Instruction:</b> ${e.instruction}</div><audio class="audio" controls preload="metadata" src="${e.audio}"></audio><div class="map-shell"><img src="${e.image}" alt="Exercise ${id} source diagram / flow-chart" loading="eager"></div><div class="zoom-note">Hình giữ nguyên tỉ lệ và toàn bộ nội dung nguồn. Có thể phóng to trang trình duyệt nếu cần đọc chi tiết.</div><div>${fields}</div><p><button class="btn primary" onclick="submitEx(${id})">Nộp bài & xem giải thích</button> <button class="btn secondary" onclick="resetEx(${id})">Làm lại</button></p><div id="review${id}" class="review"></div>`;document.getElementById('home').classList.add('hidden');document.getElementById('list').classList.add('hidden');box.classList.remove('hidden');restore(id);window.scrollTo(0,0)}
function submitEx(id){const e=DATA.find(x=>x.id===id);let correct=0;let out='<h3>Review & Explanation</h3>';e.items.forEach(it=>{let el=document.getElementById(`a${id}_${it.q}`),v=el.value;localStorage.setItem(`D5_${id}_${it.q}`,v);let ok=it.accepted.some(a=>norm(a)===norm(v));if(ok)correct++;out+=`<div class="review-item"><b>Q${it.q}</b> — <span class="${ok?'good':'bad'}">${ok?'✓ Đúng':'✗ Chưa đúng'}</span><br><b>Your answer:</b> ${v||'—'}<br><b>Correct answer:</b> ${it.answer}<div class="evidence"><b>Tapescript evidence:</b> “${it.evidence}”</div><div class="vn"><b>Giải thích:</b> Cụm trong bài nghe xác định trực tiếp đáp án <b>${it.answer}</b>. Hãy nhận diện tín hiệu trình tự/vị trí và paraphrase thay vì chờ đúng nguyên văn câu hỏi.</div><div class="vn"><b>Kiến thức cần nhớ:</b> ${it.evidence} → <b>${it.answer}</b>.</div></div>`});out=`<div class="notice"><b>Score: ${correct}/${e.items.length}</b></div>`+out;document.getElementById(`review${id}`).innerHTML=out;localStorage.setItem(`D5_done_${id}`,correct+'/'+e.items.length)}
function restore(id){const e=DATA.find(x=>x.id===id);e.items.forEach(it=>{let v=localStorage.getItem(`D5_${id}_${it.q}`);if(v!==null)document.getElementById(`a${id}_${it.q}`).value=v})}
function resetEx(id){const e=DATA.find(x=>x.id===id);e.items.forEach(it=>{localStorage.removeItem(`D5_${id}_${it.q}`);document.getElementById(`a${id}_${it.q}`).value=''});localStorage.removeItem(`D5_done_${id}`);document.getElementById(`review${id}`).innerHTML=''}
const grid=document.getElementById('grid');DATA.forEach(e=>{let b=document.createElement('button');b.className='exbtn';b.innerHTML=`<b>Exercise ${e.id}</b><br><span>${e.title}</span><br><small>${e.items.length} câu • có audio</small>`;b.onclick=()=>openEx(e.id);grid.appendChild(b)});
</script></body></html>
