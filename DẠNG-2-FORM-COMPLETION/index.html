t."},{"item":"vacancy / available position","vi":"vị trí còn trống / đang tuyển","note":"Quan hệ paraphrase/tín hiệu nghe giữa form và lời nói."}]},{"id":"q5","displayNum":5,"label":"Number of people","answer":"2","accepted":["2","two"],"skill":"Form Completion","evidence":"W: No, me and a friend. We’re both starting work in the town next month.","suffix":"","placeholder":"Type your answer","evidence_full":"W: No, me and a friend. We’re both starting work in the town next month.\nM: Oh right, so it’s two of you. So, let’s see. Do you have any preferences in terms Q7\nof location?","explanation":"Đối chiếu trường thông tin “Number of people” với tapescript. Thông tin phù hợp với yêu cầu của form là “2”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Number of people","vi":"Số người","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."}]},{"id":"q6","displayNum":6,"label":"Preferred location: Wants to be close to","answer":"town centre","accepted":["town centre"],"skill":"Form Completion","evidence":"of location?","suffix":"","placeholder":"Type your answer","evidence_full":"of location?\nW: Both our jobs are in the town centre, so it would be good to be within walking Q6\ndistance of that, or perhaps a short bus journey away. Neither of us have a","explanation":"Đối chiếu trường thông tin “Preferred location: Wants to be close to” với tapescript. Thông tin phù hợp với yêu cầu của form là “town centre”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Preferred location","vi":"Vị trí mong muốn","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."},{"item":"town centre","vi":"trung tâm thị trấn/thành phố","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]},{"id":"q7","displayNum":7,"label":"Price: maximum £___ per person","answer":"350","accepted":["350","£350"],"skill":"Form Completion","evidence":"W: No, that would be for the both of us. We wouldn’t be able to pay more than","suffix":"","placeholder":"Type your answer","evidence_full":"W: No, that would be for the both of us. We wouldn’t be able to pay more than\n£350 each. Oh, and that would have to include bills. Not phone bills,\nobviously, but things like electricity, gas and water.","explanation":"Đối chiếu trường thông tin “Price: maximum £___ per person” với tapescript. Thông tin phù hợp với yêu cầu của form là “350”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Price","vi":"Giá","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."},{"item":"budget / limit / no more than","vi":"ngân sách / giới hạn tối đa","note":"Quan hệ paraphrase/tín hiệu nghe giữa form và lời nói."}]},{"id":"q8","displayNum":8,"label":"Price includes","answer":"bills","accepted":["bills"],"skill":"Form Completion","evidence":"W: No, that would be for the both of us. We wouldn’t be able to pay more than","suffix":"","placeholder":"Type your answer","evidence_full":"W: No, that would be for the both of us. We wouldn’t be able to pay more than\n£350 each. Oh, and that would have to include bills. Not phone bills,\nobviously, but things like electricity, gas and water.","explanation":"Đối chiếu trường thông tin “Price includes” với tapescript. Thông tin phù hợp với yêu cầu của form là “bills”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Price","vi":"Giá","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."},{"item":"bills","vi":"các hóa đơn chi phí","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]},{"id":"q9","displayNum":9,"label":"Additional notes: Flat 3 at ___ Road in Bampton","answer":"57 Thorney Leys","accepted":["57 Thorney Leys"],"skill":"Form Completion","evidence":"M: Do you have an address?","suffix":"","placeholder":"Type your answer","evidence_full":"M: Do you have an address?\nW: I do. The apartment number is 3, and it’s at 57 Thorney Leys Road … Q9\nM: Hang on, let me just make a note of that. 57 …","explanation":"Đối chiếu trường thông tin “Additional notes: Flat 3 at ___ Road in Bampton” với tapescript. Thông tin phù hợp với yêu cầu của form là “57 Thorney Leys”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"keyword → answer","vi":"từ khóa → thông tin cần điền","note":"Theo dõi từ khóa của trường thông tin và ghi chính xác dữ liệu được nói trong tapescript."}]},{"id":"q10","displayNum":10,"label":"Further details sent by","answer":"email","accepted":["email","e-mail"],"skill":"Form Completion","evidence":"W: Thorney Leys Road. Thorney is T-H-O-R-N-E-Y and Leys is L-E-Y-S. And the","suffix":"","placeholder":"Type your answer","evidence_full":"W: Thorney Leys Road. Thorney is T-H-O-R-N-E-Y and Leys is L-E-Y-S. And the\ndistrict is called Bampton. Do you have an email address? Q10\nM: Yes.","explanation":"Đối chiếu trường thông tin “Further details sent by” với tapescript. Thông tin phù hợp với yêu cầu của form là “email”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"email","vi":"thư điện tử","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]}],"transcript_text":"Man: Hello. Good Moves Accommodation Agency. Ben speaking. How can I\nhelp?\nWoman: Good morning. I’m calling about an apartment on your website, and was\nwondering if I could have some more information.\nM: Certainly. Can I take your details before we get started?\nSure.\nM: Right, what’s your name, please?\nW: OK, my name is Clarice Willard. Clarice is C-L-A-R-l-C-E. And Willard, Q1\nW-l-L-L-A-R-D.\nM: And have you got a contact number?\nW: Yes, I’ll give you my mobile, which is 0192 8734566. Q2\nM: That’s great, thanks. And can I ask how you found us?\nW: Of course. A family member used you last year and recommended you. So, Q3\nI had a look at your website and. well, that’s why I’m calling now.\nM: OK, so, which property are you interested in?\nW: The apartment on Statham Street, the one on the 3rd floor. Q4\nM: Let me see. Ah, I’m afraid that flat’s no longer available.\nW: No?\nM: No. it went this morning. It’s in a really popular part of town. We do have\na house on the same street, if you’re interested. It’s £950 a month.\nW: Er, no, I think that’s much too expensive. I think an apartment is all we\ncan afford.\nM: Oh, so it’s not just for you?\nW: No, me and a friend. We’re both starting work in the town next month.\nM: Oh right, so it’s two of you. So, let’s see. Do you have any preferences in terms Q7\nof location?\nW: Both our jobs are in the town centre, so it would be good to be within walking Q6\ndistance of that, or perhaps a short bus journey away. Neither of us have a\ncar, so we’d be relying on public transport.\nM: And what’s your budget?\nW: I’m sorry?\nM: How much can you pay a month?\nW: Let me see, er, £700 a month is probably our limit.\nM: Each?\nW: No, that would be for the both of us. We wouldn’t be able to pay more than\n£350 each. Oh, and that would have to include bills. Not phone bills,\nobviously, but things like electricity, gas and water.\nW: Hmm, OK, well, we do have a place in the Bampton district, which is about ten\nminutes by bus from town. It’s a two-bedroom apartment, and it’s less than\nyour budget, at £600 a month. Bills would be extra, unfortunately, but that\nshould still work out at less than £700. Although remember that electricity and\ngas prices are going up all the time, so I can’t guarantee that.\nM: Do you have an address?\nW: I do. The apartment number is 3, and it’s at 57 Thorney Leys Road … Q9\nM: Hang on, let me just make a note of that. 57 …\nW: Thorney Leys Road. Thorney is T-H-O-R-N-E-Y and Leys is L-E-Y-S. And the\ndistrict is called Bampton. Do you have an email address? Q10\nM: Yes.\nW: In that case, I can send you the details, and then you can think about it. And if\nyou’re interested, I could arrange for a visit so you can see the place for\nyourself. How does that sound?\nW: Oh, that would be really helpful. It’s clarice_willard@... [fade]","knowledge":["Form hỏi cả thông tin cá nhân và yêu cầu thuê nhà.","“within walking distance of” = gần đến mức có thể đi bộ; đây là paraphrase cho yêu cầu muốn ở gần town centre."],"vocabulary":[],"contextHtml":"<b>Good Moves Accommodation Agency</b>"},{"id":"EX02","title":"International Book Fair - Ticket Booking Form","type":"Form Completion","instruction":"Complete the form below. Write NO MORE THAN TWO WORDS AND/OR NUMBER for each answer.","audio":"assets/audio/fc2.mp3","source":"Complete IELTS band 5-6.5","questions":[{"id":"q1","displayNum":1,"label":"Last name","answer":"Wallace","accepted":["Wallace"],"skill":"Form Completion","evidence":"A: Let’s start with your name and address","suffix":"","placeholder":"Type your answer","evidence_full":"A: Let’s start with your name and address\nC: OK, it’s Wallace. Augus Wallace Q1\nA: Could you spell your surname for me, please?","explanation":"Đối chiếu trường thông tin “Last name” với tapescript. Thông tin phù hợp với yêu cầu của form là “Wallace”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Name","vi":"Họ tên","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."}]},{"id":"q2","displayNum":2,"label":"Address","answer":"14 Rose Hill","accepted":["14 Rose Hill"],"skill":"Form Completion","evidence":"A: Thanks, and your address?","suffix":"","placeholder":"Type your answer","evidence_full":"A: Thanks, and your address?\nC: OK, that’s 14 Rose Hill… Q2\nA: 14, Rose Hill, is that “rose”, like the flower?","explanation":"Đối chiếu trường thông tin “Address” với tapescript. Thông tin phù hợp với yêu cầu của form là “14 Rose Hill”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Address","vi":"Địa chỉ","note":"Xác rnational Book Fair ticket office. How can I help?\nCaller: Oh, hello, I’d like to book some tickets for the fair, please. And I have a\nfew questions about the event as well, if that’s Ok.\nA: Certainly. Well, let’s deal with the tickets first. Er, can I just take your\ndetails first?\nC: Sure\nA: Let’s start with your name and address\nC: OK, it’s Wallace. Augus Wallace Q1\nA: Could you spell your surname for me, please?\nC: Of course. It’s W-A-L-L-A-C-E H\nA: Sorry, was that one L or two?\nC: Two, er, double L\nA: Thanks, and your address?\nC: OK, that’s 14 Rose Hill… Q2\nA: 14, Rose Hill, is that “rose”, like the flower?\nC: That’s right, and it’s in Wallington\nA: Oh, I know Wallington, it’s just outside Oxford, isn’t it?\nC: That’s right. And the postcode is OX13 3NJ Q3\nA: OX30 3NJ\nC: No, it’s OX13, and it’s N for November, not M for Mike.\nA: Sorry, OX13 3NJ. Thank you. Do you have a contact number?\nC: I do, it’s 0872 344 9162 Q4\nA: 0872 344 9162\nC: Right. That’s my home number. If I’m not in, I can be contacted at work, Q5\non 0872 298 1191. I’m usually there from 9 in the morning until 5.30 in Q6\nthe evening.\nA: And how many tickets would you like?\nC: Two, please. For the Saturday\nA: Two for Saturday May 7th Q7\nC: C: That’s right","knowledge":["Postcode là chuỗi letters + numbers; chú ý correction OX30 → OX13 và N not M.","double L = LL trong Wallace."],"vocabulary":[],"contextHtml":"<b>International Booking Fair – Ticket Booking Form</b><br>Address continues: Wallington, Oxford<br>Work number shown in form: 0872 298 1191"},{"id":"EX03","title":"International Social Club - Application Form","type":"Form Completion","instruction":"Complete the form below. Write ONE WORD AND/OR A NUMBER for each answer.","audio":"assets/audio/fc3.mp3","source":"Complete IELTS band 5-6.5","questions":[{"id":"q1","displayNum":1,"label":"Nationality","answer":"Malaysian","accepted":["Malaysian"],"skill":"Form Completion","evidence":"J: I'm from Kuala Lumpur - that's wh you like the family you're living with?\nJ: Sure. They've got a little boy, who is quite noisy, but he's really no\ntrouble.\nD: Fine. Now, let's see, what's next? Er, yep. Can you tell me what you do -\nI mean, are you working or studying?\nJ: Well, at the moment I'm doing a temporary job with a company here in\nSydney– I'm an economist in fact Q4\nD: OK - and how long do you think you'll be here in Sydney?\nJ: At least a year. I may look for work here afterwards.\nD: Great. Now, you want to join the International Social Club, and it would\nbe good to know a bit about your free-time interests as well. What do you\nlike doing?\nJ: Well. I'm quite musical and I really enjoy singing.\nD: Mm-hm.\nBack home. I sang with a band-just you know, for fun. But for me, what I\nlike best is dancing. You know, the modern sort? I really love it Q5","knowledge":[],"vocabulary":[],"contextHtml":"<b>International Social Club – Application Form</b><br>Name: Jenny Foo<br>Age: 21"},{"id":"EX04","title":"KT Furniture Customer Order Form","type":"Form Completion","instruction":"Complete the form below. Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.","audio":"assets/audio/fc4.mp3","source":"Complete IELTS Bands 6.5-7.5","questions":[{"id":"q1","displayNum":1,"label":"Company name","answer":"Dress Your Best","accepted":["Dress Your Best"],"skill":"Form Completion","evidence":"M: Sue Brown -thanks. And what's the name of your company, Ms. Brown?","suffix":"","placeholder":"Type your answer","evidence_full":"M: Sue Brown -thanks. And what's the name of your company, Ms. Brown?\nW: It's a clothing company, er... it's called ‘Dress your best'. Q1\nM: OK. I'll just note that down ‘Dress- for- best'.","explanation":"Đối chiếu trường thông tin “Company name” với tapescript. Thông tin phù hợp với yêu cầu của form là “Dress Your Best”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Name","vi":"Họ tên","note":"Xác định đúng loại thông ti ___)” với tapescript. Thông tin phù hợp với yêu cầu của form là “charge”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Delivery option","vi":"Lựa chọn giao hàng","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."},{"item":"charge","vi":"phụ phí","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."},{"item":"free delivery / no charge","vi":"giao miễn phí / không phụ phí","note":"Quan hệ paraphrase/tín hiệu nghe giữa form và lời nói."}]},{"id":"q5","displayNum":5,"label":"Method of payment - credit card type","answer":"American Express","accepted":["American Express"],"skill":"Form Completion","evidence":"M: OK - w1ll that be Visa?","suffix":"","placeholder":"Type your answer","evidence_full":"M: OK - w1ll that be Visa?\nW: Is American Express OK? Q5\nM. Absolutely fine.","explanation":"Đối chiếu trường thông tin “Method of payment - credit card type” với tapescript. Thông tin phù hợp với yêu cầu của form là “American Express”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Method of payment","vi":"Phương thức thanh toán","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."}]}],"transcript_text":"Man: Good afternoon, KT Furniture. Can I help you?\nWoman: Oh. hello, yes. Um, I'm setting up a new office and I don't have Internet\naccess yet. But I'd like to place an order for some furniture\nM: That's fine. You can do it over the phone. And I can fill in the form for you\nthis end.\nW: Oh great, thanks\nM: I just need to take a few customer details first if that's OK?\nW: Yes, fine\nM: What name is it? H\nW: My name?\nM: Yes\nW: Oh, it's Sue Brown\nM: Sue Brown -thanks. And what's the name of your company, Ms. Brown?\nW: It's a clothing company, er... it's called ‘Dress your best'. Q1\nM: OK. I'll just note that down ‘Dress- for- best'.\nW: No - ‘your best'.\nM: Oh right, got it. So you make smart clothes?\nW: Yes, formal dress for weddings and special occasions. We also repair\nand alter clothes.\nM: I see. And where are you located - what's your postal address?\nW: Right - well. We're on Kirby Trading Estate.\nM: Kirby - how do you spell that? Q2\nW: It's K-1-R-B-Y.\nM: Oh. I know that area. It's New Hampton Road, isn't it?\nW: Yes. that's right, number 210 - in South Down.\nM: OK. And can I have a contact number for our delivery man?\nW: Sure – it's probably best if I give you my mobile number\nM: OK.\nW: The number's 09356 788 545 . Q3\nM: OK, double 7 8 .\nW: No - 7 double 8. 5-4-5.\nM: Ah ... OK. That's great. Now just a couple more questions before I take your\norder …\nW: Fine.\nM: We have two delivery dates this month, and you should be able to have either.\nW: When are they?\nM: Well, there's one on the 16th of the month, but there's a charge of 40 dollars\nfor that one.\nW: Oh. That's a lot!\nM: Mmm. Or there's option 2 which is the end of the month . . . I'll have to confirm\nthe date later. And that's a free delivery.\nW: I'll take option 2. Thanks. I don't want to pay a charge . Q4\nM: OK - I'll note down 'no charge'. H\nW: We haven't organised the office yet. So there should be plenty of time.\nM: Mm-hm. And lastly, you don't have an account with us .. so how would you like\nto pay?\nW: Oh- I'll pay by credit card.\nM: OK - w1ll that be Visa?\nW: Is American Express OK? Q5\nM. Absolutely fine.","knowledge":["Audio có correction: “Dress-for-best” được sửa thành “your best”.","7 double 8 = 788; chú ý correction của số điện thoại."],"vocabulary":[],"contextHtml":"<b>KT Furniture Customer Order Form</b><br>Address continues: 210 New Hampton Road, South Down<br>Delivery option: 1 / 2<br>Method of payment: credit card"},{"id":"EX05","title":"Lake Pane Campground, US - Bookings","type":"Form Completion","instruction":"Complete the form below. Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.","audio":"assets/audio/fc5.mp3","source":"Complete IELTS band 6.5-7.5","questions":[{"id":"q1","displayNum":1,"label":"Date of arrival","answer":"23rd July","accepted":["23rd July","23 July","23/7","23-7"],"skill":"Form Completion","evidence":"coming at the end of the month.","suffix":"","placeholder":"Type your answer","evidence_full":"coming at the end of the month.\nW: OK – the 23rd’s fine. We weren’t sure so… Q1\nM: Great. Do you just want somewhere to park and pitch a tent, or do you have an","explanation":"Đối chiếu trường thông tin “Date of arrival” với tapescript. Thông tin phù hợp với yêu cầu của form là “23rd July”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Date of arrival","vi":"Ngày đến","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."}]},{"id":"q2","displayNum":2,"label":"Family name","answer":"HEPWORTH","accepted":["HEPWORTH","Hepworth"],"skill":"Form Completion","evidence":"M: OK, that’s fine. So, um, what name is it, please?","suffix":"","placeholder":"Type your answer","evidence_full":"M: OK, that’s fine. So, um, what name is it, please?\nW: It’s Hepworth, that’s H-E-P-W-O-R-T-H Q2\nM: OK thanks. I’ve heard that name before.","explanation":"Đối chiếu trường thông tin “Family name” với tapescript. Thông tin phù hợp với yêu cầu của form là “HEPWORTH”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Name","vi":"Họ tên","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."}]},{"id":"q3","displayNum":3,"label":"Contact number","answer":"07968 355630","accepted":["07968 355630","07968355630"],"skill":"Form Completion","evidence":"M: Would this be your contact number?","suffix":"","placeholder":"Type your answer","evidence_full":"M: Would this be your contact number?\nW: Yes – it’s 07968355630 Q3\nM: Great, thanks","explanation":"Đối chiếu trường thông tin “Contact number” với tapescript. Thông tin phù hợp với yêu cầu của form là “07968 355630”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Contact number","vi":"Số liên lạc","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."}]},{"id":"q4","displayNum":4,"label":"Camp facilities","answer":"electricity","accepted":["electricity"],"skill":"Form Completion","evidence":"W: It would be good if you could explain.","suffix":"","placeholder":"Type your answer","evidence_full":"W: It would be good if you could explain.\nM: Well, you’re coming in the RV, so would you like to hook up to our electricity?\nW: Oh yes, please","explanation":"Đối chiếu trường thông tin “Camp facilities” với tapescript. Thông tin phù hợp với yêu cầu của form là “electricity”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Camp facilities","vi":"Cơ sở vật chất khu cắm trại","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."},{"item":"electricity","vi":"điện","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]},{"id":"q5","displayNum":5,"label":"Camp facilities: water and ___","answer":"drain","accepted":["drain","sewer"],"skill":"Form Completion","evidence":"W: OK – and what about waste water?","suffix":"","placeholder":"Type your answer","evidence_full":"W: OK – and what about waste water?\nM: Sure – you can have a site with a sewer – or I think you guys call it a drain –\nH Q5","explanation":"Đối chiếu trường thông tin “Camp facilities: water and ___” với tapescript. Thông tin phù hợp với yêu cầu của form là “drain”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Camp facilities","vi":"Cơ sở vật chất khu cắm trại","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."},{"item":"drain","vi":"cống thoát nước","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]}],"transcript_text":"Narrator: You will hear a woman talking in the phone to a campsite manager.\nMan: Hi, Lake Pane Campground. Can I help you?\nWoman: Oh, hi, yes, um. I wonder if we could book a site on your campground?\nM: Sure. My computer’s down at the moment, so I just need to get a form.\nOK – how many nights would you like to stay for?\nW: Um, well, ideally, we’d like to stay for five.\nM: Five nights, OK. So when are you planning to arrive?\nW: Well, we’ll be travelling around the area from mid-July and we think we’ll be at\nthe lake by about the 24th H\nM: Let’s see. July’s a busy time. We could probably fit you in, but to be honest, if you\nwant five nights, it would be better to get here a day earlier. We’ve got a big group\ncoming at the end of the month.\nW: OK – the 23rd’s fine. We weren’t sure so… Q1\nM: Great. Do you just want somewhere to park and pitch a tent, or do you have an\nRV?\nW: An RV?\nM: Yeah – you know, a recreational vehicle… a camper van\nW: Oh right, yes, we’re driving a van, so…\nM: OK, that’s fine. So, um, what name is it, please?\nW: It’s Hepworth, that’s H-E-P-W-O-R-T-H Q2\nM: OK thanks. I’ve heard that name before.\nW: Well, it’s quite common in England – particularly in Yorkshire. That’s where\nwe’re from.\nM: I was going to ask you if you were in the UK. It’s a really good line, isn’t it?\nW: Yes\nM: Would this be your contact number?\nW: Yes – it’s 07968355630 Q3\nM: Great, thanks\nW: Do you want my home number as well?\nM: No, that’s fine\nW: OK\nM: We supply a number of facilities. I don’t know if you’re familiar with the way\ncampgrounds work here.\nW: It would be good if you could explain.\nM: Well, you’re coming in the RV, so would you like to hook up to our electricity?\nW: Oh yes, please\nM: You can also attach your vehicle to the water taps here\nM: I hope it’s all easy to do\nM: Yeah – you just plug into the electricity and switch on the water. The people who Q4\nhire our the RVs will explain it all.\nW: OK – and what about waste water?\nM: Sure – you can have a site with a sewer – or I think you guys call it a drain –\nH Q5\nthat’s a bit extra. Not all campground have that facility, you see.\nW: Fine, we’ll have it. So what’s the total and….","knowledge":["Correction quan trọng: khách dự định khoảng 24th nhưng manager đề nghị đến sớm một ngày → 23rd July.","sewer = drain trong chính tapescript."],"vocabulary":[],"contextHtml":"<b>Lake Pane Campground, US – Bookings</b>"},{"id":"EX06","title":"Car Insurance","type":"Form Completion","instruction":"Complete the form below. Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.","audio":"assets/audio/fc6.mp3","source":"Cambridge IELTS 7 - Section 1","questions":[{"id":"q1","displayNum":1,"label":"Address: ___, Greendale","answer":"27 Bank Road","accepted":["27 Bank Road"],"skill":"Form Completion","evidence":"WOMAN: And your address?","suffix":"","placeholder":"Type your answer","evidence_full":"WOMAN: And your address?\nMAN: It’s 27 Bank Road. Q1\n27 Bank Road. Is that in Greendale?","explanation":"Đối chiếu trường thông tin “Address: ___, Greendale” với tapescript. Thông tin phù hợp với yêu cầu của form là “27 Bank Road”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Address","vi":"Địa chỉ","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."}]},{"id":"q2","displayNum":2,"label":"Occupation","answer":"dentist","accepted":["dentist","a dentist"],"skill":"Form Completion","evidence":"WOMAN: And could I ask what your occupation is?","suffix":"","placeholder":"Type your answer","evidence_full":"WOMAN: And could I ask what your occupation is?\nMAN: Dentist. Q2\nWOMAN: OK… now a few details about your car… What size is the engine?","explanation":"Đối chiếu trường thông tin “Occupation” với tapescript. Thông tin phù hợp với yêu cầu của form là “dentist”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Occupation","vi":"Nghề nghiệp","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến s it…\nWOMAN: And finally… when would you like to start the insurance?\nMAN: I’ll need it from the 31st of January.\nWOMAN: Right… Mr. Jones… I’m getting a couple of quotes coming up on the\ncomputer now… and the best bet looks like being with a company\ncalled Red Flag. Q9\nMAN: Yeah.\nWOMAN: And that comes out at $450 per year… Q10\nMAN: Well… that seems OK… it’s quite a bit lower than I’ve been paying up\nto now…\nWOMAN: Great… so would you like me to go ahead with that?\nMAN: Sure… why not?\nWOMAN: How would you like to pay?","knowledge":[],"vocabulary":[],"contextHtml":"<b>Car Insurance</b><br>Contact number: 730453<br>Size of car engine: 1200cc<br>Manufacturer: Hewton<br>Year: 1997<br>Use of car: social<br>Start date: 31 January"},{"id":"EX07","title":"Student Details","type":"Form Completion","instruction":"Questions 6-10. Complete the form below. Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.","audio":"assets/audio/fc7.mp3","source":"Cambridge IELTS 7 - Section 1","questions":[{"id":"q1","displayNum":6,"label":"6 Address","answer":"International House","accepted":["International House"],"skill":"Form Completion","evidence":"STUDENT: I’m in one of the Halls of Residence for post-graduate students, you","suffix":"","placeholder":"Type your answer","evidence_full":"STUDENT: I’m in one of the Halls of Residence for post-graduate students, you\nknow, International House. Q6\nAGENT: OK—that’s easy. What’s your room number there?","explanation":"Đối chiếu trường thông tin “6 Address” với tapescript. Thông tin phù hợp với yêu cầu của form là “International House”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Address","vi":"Địa chỉ","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."}]},{"id":"q2","displayNum":7,"label":"7 Room No.","answer":"B659","accepted":["B659"],"skill":"Form Completion","evidence":"AGENT: OK—that’s easy. What’s your room number there?","suffix":"","pl iving there very long.\nDo you have any other skills? Typing, languages, that sort of thing?\nWell, I speak some Japanese.\nAGENT: Right, I’ll make a note of that. Now—let’s see what else is available.\nWhat do you think of administrative work? There is a position for an\nOffice Assistant at the English Language Centre. Q8\nSTUDENT: That sounds interesting.\nAGENT: It’s for 3 days a week—Monday, Friday and Saturday mornings.\nInterested?\nSTUDENT: Mmm. I was hoping to have Saturdays free. But I need the work so …\ncan you tell me what the job involves?\nAGENT: Yes, sure. It says here that you’ll be required to deal with student\nenquiries and answer the phone. Q9\nAGENT: I’m sure I can handle all that without a problem.\nGreat. Well, would you like me to arrange an interview for you? Say,\nFriday morning, around ten?\nSTUDENT: Could we make it a bit later? Unfortunately, I’ve got something to do\nat ten. Would that be OK?\nAGENT: Not a problem. How about eleven thirty? Hope it works out for you Q10\nAnita.\nSTUDENT: Me too. And thanks for all your help.","knowledge":["Audio có self-correction B569 → B659; chỉ ghi đáp án sau cùng."],"vocabulary":[],"contextHtml":"<b>Student Details</b><br>Name: Anita Newman<br>Other skills: Speaks some Japanese"},{"id":"EX08","title":"Summer Music Festival - Booking Form","type":"Form Completion","instruction":"Questions 3-10. Complete the form below. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.","audio":"assets/audio/fc8.mp3","source":"Cambridge IELTS 8 - Section 1","questions":[{"id":"q1","displayNum":3,"label":"3 ADDRESS: ___, Westsea","answer":"48 North Avenue","accepted":["48 North Avenue"],"skill":"Form Completion","evidence":"NINA: So will you fill in the form or shall I?","suffix":"","placeholder":"Type your answer","evidence_full":"NINA: So will you fill in the form or shall I?\nGEORGE: I’ll do it. Name: George O’Neill. Address: 48 North Avenue, Westsea. Q3\nDo you remember our new postcode? Still can’t reme h xác dữ liệu được nói trong tapescript."}]}],"transcript_text":"NINA: So will you fill in the form or shall I?\nGEORGE: I’ll do it. Name: George O’Neill. Address: 48 North Avenue, Westsea. Q3\nDo you remember our new postcode? Still can’t remember it.\nNINA: Just a minute – I’ve got it written down here. WS6 2YH. Do you need the Q4\nphone too?\nGEORGE: Please. I’m really bad at numbers.\nNINA: 01674 553242. So, let’s book two tickets for Guitarrini.\nH Q5\nGEORGE: Okay. If you’re sure ￡7.50 each is all right. How do you feel about the\nsinger?\nNINA: I haven’t quite decided. But I’ve noticed something on the booking form\nthat might just persuade me!\nGEORGE: What’s that then?\nNINA: Free refreshments! Q6\nGEORGE: Really?\nNINA: Yes, look here. Sunday 17th of June. Singer, ticket ￡6.00 includes Q6\ndrinks in the garden. Sounds like a bargain to me!\nGEORGE: Yes, let’s book two tickets for that. So, what else? I’m feeling quite keen\nnow! How about the pianist on the 22nd of June? Q7\nGEORGE: Anna Ventura? I’ve just remembered that’s my evening class night.\nThat’s okay. I’ll just have to go on my own – but we can go to the\nSpanish dance and guitar concert together, can’t we?\nGEORGE: Yes – I’m sure Tom and Kieran would enjoy that too. Good heavens – ￡\n10.50 a ticket! I can see we’re going to have to go without food for the Q8\nrest of the week – we’ll need to book four ! Q9\nNINA: Wish we were students – look! Children, Students and Senior Citizens\nget a 50% discount on everything. Q10\nGEORGE: If only!","knowledge":[],"vocabulary":[],"contextHtml":"<b>Summer Music Festival – Booking Form</b><br>Name: George O’Neill<br>Dates shown: 5 June, 17 June, 22 June, 23 June<br>Fixed ticket information in the source is retained as reference around the blanks."},{"id":"EX09","title":"West Bay Hotel - Details of Job","type":"Form Completion","instruction":"Complete the notes below. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.","audio":"assets/audio/fc9.mp3" skill":"Form Completion","evidence":"WOMAN: Oh good. Well, if you can call again you need to speak to the Service","suffix":"","placeholder":"Type your answer","evidence_full":"WOMAN: Oh good. Well, if you can call again you need to speak to the Service\nManager. Her name’s Jane Urwin, that’s U-R-W-I-N, and she’ll Q8\nprobably arrange to meet you. H","explanation":"Đối chiếu trường thông tin “Call Jane ___ (Service Manager)” với tapescript. Thông tin phù hợp với yêu cầu của form là “Urwin”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"keyword → answer","vi":"từ khóa → thông tin cần điền","note":"Theo dõi từ khóa của trường thông tin và ghi chính xác dữ liệu được nói trong tapescript."}]},{"id":"q9","displayNum":9,"label":"before ___ tomorrow","answer":"12.00","accepted":["12.00","12:00","12.00 pm","12:00 pm","noon","mid-day","midday"],"skill":"Form Completion","evidence":"WOMAN: Could you call tomorrow? Um, she usually starts checking the rooms at","suffix":"","placeholder":"Type your answer","evidence_full":"WOMAN: Could you call tomorrow? Um, she usually starts checking the rooms at\nmidday, so before then if you can, so she’ll have more time to chat. I’ll Q9\njust give you her number because she’s got a direct line.","explanation":"Đối chiếu trường thông tin “before ___ tomorrow” với tapescript. Thông tin phù hợp với yêu cầu của form là “12.00”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"keyword → answer","vi":"từ khóa → thông tin cần điền","note":"Theo dõi từ khóa của trường thông tin và ghi chính xác dữ liệu được nói trong tapescript."}]},{"id":"q10","displayNum":10,"label":"She'll require a","answer":"reference","accepted":["reference"],"skill":"Form Completion","evidence":"MAN: Oh, okay. Yes, I’ll do that.","suffix":"","placeholder":"Type your answer","evidence_full":"MAN: Oh, okay. Yes, I’ll do that.\nWOMAN: And by the way, she will ask you for a reference, so you might like to be Q10\nthinking about that. You know, just someone who knows you and can","explanation":"Đối chiếu trường thông tin “She'll require a” với tapescript. Thông tin phù hợp với yêu cầu của form là “reference”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"reference","vi":"người/giấy giới thiệu xác nhận","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]}],"transcript_text":"WOMAN: Hello, West Bay Hotel. Can I help you?\nMAN: Oh, good morning. I’m ringing about your advertisement in the Evening\nGazette.\nWOMAN: Is that the one for temporary staff?\nMAN: That’s right.\nWOMAN: Yes. I’m afraid the person who’s dealing with that isn’t in today, but I can\ngive you the main details if you like.\nMAN: Yes, please. Could you tell me what kinds of staff you are looking for?\nWOMAN: We’re looking for waiters at the moment. There was one post for a cook, Q1\nbut that’s already been taken.\nMAN: Oh right. Erin, what are the hours of work?\nWOMAN: There are two different shifts – there’s a day shift from 7 to 2 and a late\nshift from 4 till 11.\nMAN: And can people choose which one they want to do?\nWOMAN: Not normally, because everyone would choose the day shift I suppose.\nYou alternate from one week to another.\nMAN: Okay. I’m just writing all this down. What about time off?\nWOMAN: You get one day off and I think you can negotiate which one you want, Q2\nit’s more or less up to you. But it has to be the same one every week.\nMAN: Do you know what the rates of pay are?\nWOMAN: Yes, I’ve got them here. You get £5.50 an hour, and that includes a break. Q3\nMAN: Do I have to go home to eat or…\nWOMAN: You don’t have to. You can get a meal in the hotel if you want to, and Q4\nthere’s no charge for it so you might as well.\nMAN: Oh good. Yes, so let’s see. I’d get er, two hundred and twenty one, no,\ntwo hundred and thirty one pounds a week?\nWOMAN: You’d also get tips-our guests tend to be quite generous.\nMAN: Ern, is there a uniform? What about clothes?\nWOMAN: Yes, I forgot to mention that. You need to wear a white shirt, just a plain\none, and dark trousers. You know, not green or anything like that. And Q5\nwe don’t supply those.\nMAN: That’s okay, I’ve got trousers, I’d just have to buy a couple of shirts.\nWhat about anything else? Do I need a waistcoat or anything?\nWOMAN: You have to wear a jacket, but the hotel lends you that. Q6\nMAN: I see. Er, one last thing – I don’t know what the starting date is.\nJust a minute, I think it’s sometime around the end of June. Yes, the 28th, Q7\nin time for the summer.\nMAN: That’s great. I’m available from the 10th.\nWOMAN: Oh good. Well, if you can call again you need to speak to the Service\nManager. Her name’s Jane Urwin, that’s U-R-W-I-N, and she’ll Q8\nprobably arrange to meet you. H\nOkay. And when’s the best time to ring?\nWOMAN: Could you call tomorrow? Um, she usually starts checking the rooms at\nmidday, so before then if you can, so she’ll have more time to chat. I’ll Q9\njust give you her number because she’s got a direct line.\nMAN: Thanks.\nWOMAN: It’s 832 double – 0 9.\nMAN: 823 double -0 9?\nWOMAN: 832\nMAN: Oh, okay. Yes, I’ll do that.\nWOMAN: And by the way, she will ask you for a reference, so you might like to be Q10\nthinking about that. You know, just someone who knows you and can\nvouch for you.\nMAN: Yes, no problem. Well, thanks very much for your help.\nWOMAN: You’re welcome. Bye.\nMAN: Bye.","knowledge":["temporary staff = nhân viên tạm thời.","vouch for = xác nhận/bảo chứng cho ai đó; liên quan đến reference."],"vocabulary":[],"contextHtml":"<b>West Bay Hotel – Details of job</b><br>Two shifts<br>Total weekly pay: £231<br>Dress includes a white shirt."},{"id":"EX10","title":"Job Enquiry","type":"Form Completion","instruction":"Complete the notes below. Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.","audio":"assets/audio/fc10.mp3","source":"Cambridge IELTS 9 - Section 1", trường thông tin “Ask for: Samira” với tapescript. Thông tin phù hợp với yêu cầu của form là “Manuja”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"keyword → answer","vi":"từ khóa → thông tin cần điền","note":"Theo dõi từ khóa của trường thông tin và ghi chính xác dữ liệu được nói trong tapescript."}]}],"transcript_text":"WOMAN: Good evening. King’s Restaurant.\nMAN: Good evening. I’m ringing about the job I understand you have vacant.\nWOMAN: Oh yes.\nMAN: I’d like to find out a few more details, if I may.\nWOMAN: Yes, of course. Can I take your name?\nMAN: It’s Peter Chin. H\nWOMAN: Okay Peter. Well, if you want to ask about the job and then if we’re both\nstill interested, we could arrange for you to come for an interview.\nMAN: Great, thanks. I’m afraid I missed the advert for the job but heard about\nit from a friend.\nWOMAN: That’s no problem at all. What would you like to know?\nMAN: Well, um, what sort of work is it — washing up?\nWOMAN: It’s answering the phone. Q1\nMAN: Oh right, fine.\nWOMAN: And not waiting at table.\nMAN: That’d be good. And how many nights a week would it be?\nWOMAN: Well, we’re really only busy at the weekend.\nMAN: So two nights?\nWOMAN: Three actually, so it would work out at twelve hours a week.\nMAN: That’d be fine. It wouldn’t interfere with my studies.\nWOMAN: Are you at the university?\nMAN: Yes. First year Physics student.\nWOMAN: Oh, right.\nMAN: Um, and because I’m not an EU national would I need a work permit?\nWOMAN: Yes you would. Just get your tutor to sign it.\nMAN: That wouldn’t be a problem, if I were to get the job. Um, where exactly is\nthe restaurant?\nWOMAN: Well, we have two branches — the one we’re recruiting for is in Q2\nHillsdunne Road\nMAN: I don’t know that. How do you spell it please?\nWOMAN: It’s H-I-double L-S-D-U-double N-E Road.\nMAN: Got that. Thanks. Is it near a bus stop?\nWOMAN: Yes. The nearest one would probably be just beside the library Q3\nMAN: Oh yes, I know it. That’d be fine for me. And could I ask about the pay?\nWOMAN: We’re offering £4.45 an hour. Q4\nMAN: That’s very good. My last job was £3.95 an hour.\nWOMAN: We feel it’s pretty good and we also offer some good fringe benefits.\nMAN: Really?\nWOMAN: Well, we give you a free dinner, so you eat well.\nRight, better than hostel food! H\nWe certainly hope so! And we also offer extra pay for working on\nnational holidays. Q5\nMAN: Oh, that’s a really good perk, isn’t it?\nWOMAN: Yes, we think so. And then because of the difficulties of getting public\ntransport, if you’re working after 11 o’clock we drive you home. Q6\nMAN: Oh, that’s good to know.\nWOMAN: Well, we’d certainly be interested in inviting you for an interview, if\nyou’re still interested?\nMAN: Oh yes, certainly. Could I just also ask what qualities you’re looking for?\nWOMAN: Well, for this particular job we want a clear voice, which you obviously Q7\ndo have!\nMAN: Thanks.\nWOMAN: And you must be able to think quickly, you know. Q8\nMAN: Well, I hope I’d…\nWOMAN: So, when could you come in for an interview? We’re actually quite quiet\ntonight?\nMAN: Sorry, I couldn’t come tonight. Or tomorrow, I’m afraid. Thursday’s\nokay — that’d be 22nd of October. Q9\nWOMAN: Fine, after 5 p.m.?\nMAN: Yes, fine. Would 6 o’clock be okay?\nWOMAN: Good. I look forward to seeing you.\nMAN: Oh, by the way, who should I ask for?\nWOMAN: Oh yes, of course, sorry. My name is Samira Manuja Q10\nMAN: Can you spell that, please?\nWOMAN: M-A-N-U-J-A.\nMAN: Okay, I’ve got that. Thanks very much.\nWOMAN: Look forward to seeing you…","knowledge":[],"vocabulary":[],"contextHtml":"<b>Job Enquiry</b><br>Number of hours per week: 12 hours<br>Would need work permit<br>Extra benefit: a free dinner<br>Interview time shown: 6 p.m.<br>Bring names of two referees."},{"id":"EX11","title":"Accommodation Form - Student Information","type":"Form Completion","instruction":"Questions 1-10. Complete the form below. Write ONE WORD AND ’d prefer a hall where there are other mature students Q8","explanation":"Đối chiếu trường thông tin “Priorities: to be with other students who are ___” với tapescript. Thông tin phù hợp với yêu cầu của form là “mature”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"mature","vi":"trưởng thành / lớn tuổi hơn","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."},{"item":"priorities / prefer / would like","vi":"ưu tiên / thích / mong muốn","note":"Quan hệ paraphrase/tín hiệu nghe giữa form và lời nói."}]},{"id":"q9","displayNum":9,"label":"Priorities: to live outside the ___","answer":"town","accepted":["town"],"skill":"Form Completion","evidence":"MAN: Yes, we do have halls which tend to cater for slightly older students.","suffix":"","placeholder":"Type your answer","evidence_full":"MAN: Yes, we do have halls which tend to cater for slightly older students.\nWOMAN: Ummm and I’d prefer to be out of town Q9\nMAN: That’s actually very good for you because we tend to have more vacancies in","explanation":"Đối chiếu trường thông tin “Priorities: to live outside the ___” với tapescript. Thông tin phù hợp với yêu cầu của form là “town”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"town","vi":"thị trấn / trung tâm đô thị","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."},{"item":"priorities / prefer / would like","vi":"ưu tiên / thích / mong muốn","note":"Quan hệ paraphrase/tín hiệu nghe giữa form và lời nói."}]},{"id":"q10","displayNum":10,"label":"Priorities: to have a ___ area for socialising","answer":"shared","accepted":["shared"],"skill":"Form Completion","evidence":"MAN: Yes. Anything else?","suffix":"","placeholder":"Type your answer","evidence_full":"MAN: Yes. Anything else?\nWOMAN: Well, I would like somewhere with a shared area. A TV room, for example, Q10\nor something like that. It’s a good way to socialise.","explanation":"Đối chiếu trường thông tin “Priorities: to have a ___ area for socialising” với tapescript. Thông tin phù hợp với yêu cầu của form là “shared”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"shared","vi":"dùng chung","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."},{"item":"priorities / prefer / would like","vi":"ưu tiên / thích / mong muốn","note":"Quan hệ paraphrase/tín hiệu nghe giữa form và lời nói."}]}],"transcript_text":"MAN: Good morning. Can I help you?\nWOMAN: Yes. I’ve just been accepted on a course at the university and I’d like to try\nand arrange accommodation in the hall of residence.\nMAN: Yes, certainly. Please sit down. What I’ll do is fill in a form with you to find\nout a little more about your preferences and so forth.\nWOMAN: Thank you. H\nMAN: So first of all, can I take your name?\nWOMAN: It’s Anu Bhatt. Q1\nMAN: Could you spell your name please?\nWOMAN: Yes. A-N-U…B-H-A double T.\nMAN: Thanks, and could I ask your date of birth?\nWOMAN: 31st March 1972. Q2\nMAN: Thank you. And where are you from?\nWOMAN: India.\nMAN: Oh right. And what will you be studying?\nWOMAN: I’m doing a course in nursing. Q3\nMAN: Right, thank you. And how long would you want to stay in hall, do you think?\nWOMAN: Well, it’ll take three years but I’d only like to stay in hall for two. I’d like to Q4\nthink about living outside for the third year.\nFine. And what did you have in mind for catering? Do you want to cook for\nyourself or have all your meals provided, that’s full board?\nWOMAN: Is there something in between?\nMAN: Yes. You can just have evening meal provided, which is half board.\nWOMAN: That’s what I’d prefer.\nMAN: Yes a lot of students opt for that. Now, with that in mind, do you have any\nspecial diet, anything we should know about?\nWOMAN: Yes, I don’t take red meat. Q5\nMAN: No red meat.\nMAN: Now, thinking about the room itself, we have a number of options. You can\nhave a single study bedroom or you can have a shared one. These are both\nwhat we call simple rooms. The other alternative is to opt for a single bedsit\nwhich actually has more space and better facilities. There’s about £20 a\nweek difference between them.\nWOMAN: Well, actually my grant is quite generous and I think the bedsit sounds the Q6\nbest option.\nMAN: Lovely. I’ll put you down for that and we’ll see what availability is like. Now\ncan I ask some other personal details which we like to have on record?\nWOMAN: Yes, of course.\nMAN: I wonder if you could let us know what your interests are. This might help us\nget a closer match for placing you in a particular hall.\nWOMAN: Ummm. Well, I love the theatre\nMAN: Right.\nH Q7\nWOMAN: And I enjoy sports, particularly badminton.\nMAN: That’s worth knowing. Now, what we finish with on the form is really a list\nfrom you of what your priorities are in choosing a hall and we’ll do our best\nto take these into account.\nWOMAN: Well, the first thing is I’d prefer a hall where there are other mature students Q8\nif possible.\nMAN: Yes, we do have halls which tend to cater for slightly older students.\nWOMAN: Ummm and I’d prefer to be out of town Q9\nMAN: That’s actually very good for you because we tend to have more vacancies in\nout-of-town halls.\nWOMAN: Lucky!\nMAN: Yes. Anything else?\nWOMAN: Well, I would like somewhere with a shared area. A TV room, for example, Q10\nor something like that. It’s a good way to socialise.\nMAN: It certainly is.\nWOMAN: That’s it.\nMAN: Now, we just need a contact telephone number for you.\nWOMAN: Sure, I’ll just find it. It’s double 67549.\nMAN: Great, so we’ll be in contact with you as soon as possible…","knowledge":[],"vocabulary":[],"contextHtml":"<b>Accommodation Form – Student Information</b><br>Type of accommodation: hall of residence<br>Country of origin: India<br>Preferred catering arrangement: hallboard (as printed in the exercise source)<br>Interest also shown: badminton<br>Contact phone number: 667549"},{"id":"EX12","title":"Self-Drive Tours in the USA","type":"Form Completion","instruction":"Questions 1-6. Complete the notes below. Write ONE WORD for each answer.","audio":"assets/audio/fc12.mp3","source":"Cambridge IELTS 10 - Section 1","questions":[{"id":"q1","displayNum":1,"label":"Address: 24 ___ Road","answer":"Ardleigh","accepted":["Ardleigh"],"skill":"Form Completion","evidence":"A: Thank you. And your address?","suffix":"","placeholder":"Type your answer","evidence_full":"A: Thank you. And your address?\nB: 24, Ardleigh Road. Q1\nA: Can you spell that? H","explanation":"Đối chiếu trường thông tin “Address: 24 ___ Road” với tapescript. Thông tin phù hợp với yêu cầu của form là “Ardleigh”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Address","vi":"Địa chỉ","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."}]},{"id":"q2","displayNum":2,"label":"Heard about company from","answer":"newspaper","accepted":["newspaper"],"skill":"Form Completion","evidence":"friend? Or did you see an advert somewhere?","suffix":"","placeholder":"Type your answer","evidence_full":"friend? Or did you see an advert somewhere?\nB: No. I read about you in the newspaper Q2\nA: OK, I'll get the brochures in the post to you but can I give you some information","explanation":"Đối chiếu trường thông tin “Heard about company from” với tapescript. Thông tin phù hợp với yêu cầu của form là “newspaper”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Heard about company from","vi":"Biết đến công ty qua","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."},{"item":"newspaper","vi":"báo","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."},{"item":"heard about / found us / read about","vi":"biết đến / biết thông tin về","note":"Quan hệ paraphrase/tín hiệu nghe giữa form và lời nói."}]},{"id":"q3","displayNum":3,"label":"Los Angeles: visit some ___ parks","answer":"theme","accepted":["theme"],"skill":"Form Completion","evidence":"in California. The first one begins in Los Angeles and there's plenty of time to visit","suffix":"","placeholder":"Type your answer","evidence_full":"in California. The first one begins in Los Angeles and there's plenty of time to visit\nsome of the theme parks there. Q3\nB: That’s something on my children’s list so I'd want to include that.","explanation":"Đối chiếu trường thông tin “Los Angeles: visit some ___ parks” với tapescript. Thông tin phù hợp với yêu cầu của form là “theme”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"theme","vi":"chủ đề","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]},{"id":"q4","displayNum":4,"label":"Yosemite Park: stay in a lodge, not a","answer":"tent","accepted":["tent"],"skill":"Form Completion","evidence":"or on the campsite.","suffix":"","placeholder":"Type your answer","evidence_full":"or on the campsite.\nB: I don't like the idea of staying in a tent. It'd be too hot. Q4\nA: Right. And the tour ends in Las Vegas.","explanation":"Đối chiếu trường thông tin “Yosemite Park: stay in a lodge, not a” với tapescript. Thông tin phù hợp với yêu cầu của form là “tent”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"tent","vi":"lều","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]},{"id":"q5","displayNum":5,"label":"Trip Two: see the ___ on the way to Cambria","answer":"castle","accepted":["castle"],"skill":"Form Completion","evidence":"Then you drive south to Cambria.","suffix":"","placeholder":"Type your answer","evidence_full":"Then you drive south to Cambria.\nB: Someone told me there’s a really nice castle near Cambria. Will we go near that? Q5\nA: Hearst Castle is on that road so you could stop there.","explanation":"Đối chiếu trường thông tin “Trip Two: see the ___ on the way to Cambria” với tapescript. Thông tin phù hợp với yêu cầu của form là “castle”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"castle","vi":"lâu đài","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]},{"id":"q6","displayNum":6,"label":"At San Diego, spend time on the","answer":"beach","accepted":["beach","beaches"],"skill":"Form Completion","evidence":"A: Well you could go straight on to San Diego. H","suffix":"","placeholder":"Type your answer","evidence_full":"A: Well you could go straight on to San Diego. H\nB: That's good for beaches isn’t it? Q6\nA: That’s right, that's a good place to relax and your children might like to visit the","explanation":"Đối chiếu trường thông tin “At San Diego, spend time on the” với tapescript. Thông tin phù hợp với yêu cầu của form là “beach”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"beach","vi":"bãi biển","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]}],"transcript_text":"A: Good morning. World Tours. My name is Jamie. How can I help you?\nB: Good morning. I want some information on self-drive tours in the USA. Could\nyou send me a brochure?\nA: Of course. Could I have your name please?\nB: Andrea Brown.\nA: Thank you. And your address?\nB: 24, Ardleigh Road. Q1\nA: Can you spell that? H\nB: A-R-D-L-E-I-G-H Road.\nA: Postcode?\nB: BH520P\nA: Thanks. And can I have your phone number?\nB: Is a mobile alright?\nA: Fine.\nB: It's 07786643091.\nA: Thank you. And can I ask you where you heard about World Tours? From a\nfriend? Or did you see an advert somewhere?\nB: No. I read about you in the newspaper Q2\nA: OK, I'll get the brochures in the post to you but can I give you some information\nover the phone. What kinds of things do you want to do on your holiday?\nB: I’m interested in going to California with my family. I’ve got two children and we\nwant to hire a car.\nA: OK. We have a couple of self-drive tours there visiting different places of interest\nin California. The first one begins in Los Angeles and there's plenty of time to visit\nsome of the theme parks there. Q3\nB: That’s something on my children’s list so I'd want to include that.\nA: Good. Then you drive to San Francisco. From San Francisco you can drive to\nYosemite Park where you spend a couple of nights. You can choose to stay in a lodge\nor on the campsite.\nB: I don't like the idea of staying in a tent. It'd be too hot. Q4\nA: Right. And the tour ends in Las Vegas.\nB: OK.\nA: The other trip we can arrange is slightly different. It starts in San Francisco.\nThen you drive south to Cambria.\nB: Someone told me there’s a really nice castle near Cambria. Will we go near that? Q5\nA: Hearst Castle is on that road so you could stop there.\nB: Good. I'd like to do that. Does this trip also go into the desert?\nA: No, it continues to Santa Monica where most people like to stop and do some\nshopping.\nB: We have enough of that at home so that doesn’t interest us.\nA: Well you could go straight on to San Diego. H\nB: That's good for beaches isn’t it? Q6\nA: That’s right, that's a good place to relax and your children might like to visit the\nzoo before flying home.\nB: I don’t think so. We want some time for sunbathing and swimming.","knowledge":[],"vocabulary":[],"contextHtml":"<b>Self-Drive Tours in the USA</b><br>Address begins: 24 … Road<br>Postcode shown: BH5 20P<br>Mobile: 077 8664 3091"},{"id":"EX13","title":"Transport Survey","type":"Form Completion","instruction":"Complete the notes below. Write ONE WORD AND/OR A NUMBER for each answer.","audio":"assets/audio/fc13.mp3","source":"Cambridge IELTS 10 - Section 1","questions":[{"id":"q1","displayNum":1,"label":"Name: Luisa ___","answer":"Hardie","accepted":["Hardie"],"skill":"Form Completion","evidence":"- Yes.","suffix":"","placeholder":"Type your answer","evidence_full":"- Yes.\n- Hardie Q1\n- Can you spell that, please?","explanation":"Đối chiếu trường thông tin “Name: Lu ork.","suffix":"","placeholder":"Type your answer","evidence_full":"do to help encourage workers to cycle to work.\n- Yep. Well, I have thought about it and where I work there are no safe places to Q8\nleave your bikes.","explanation":"Đối chiếu trường thông tin “Having ___ parking places for bicycles” với tapescript. Thông tin phù hợp với yêu cầu của form là “safe”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"safe","vi":"an toàn","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]},{"id":"q9","displayNum":9,"label":"Being able to use a ___ at work","answer":"shower","accepted":["shower"],"skill":"Form Completion","evidence":"- And also, I’d have to cycle uphill and on a hot day I’d arrive at work pretty sweaty","suffix":"","placeholder":"Type your answer","evidence_full":"- And also, I’d have to cycle uphill and on a hot day I’d arrive at work pretty sweaty\nso I think I’d need a shower somewhere at work. Q9\n- Right.","explanation":"Đối chiếu trường thông tin “Being able to use a ___ at work” với tapescript. Thông tin phù hợp với yêu cầu của form là “shower”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"shower","vi":"vòi/phòng tắm","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]},{"id":"q10","displayNum":10,"label":"Cycling ___ on busy roads","answer":"training","accepted":["training"],"skill":"Form Completion","evidence":"- And I suppose the last thing is that I wouldn’t be all that confident about cycling","suffix":"","placeholder":"Type your answer","evidence_full":"- And I suppose the last thing is that I wouldn’t be all that confident about cycling\non such busy roads. I think I'd like to see you offering training for that, you know, Q10\nI’d feel a lot better about starting if that was the case.","explanation":"Đối chiếu trường thông tin “Cycling ___ on busy roads” với tapescript. Thông tin phù hợp với yêu cầu của form là “training”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"training","vi":"đào tạo","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]}],"transcript_text":"- Excuse me.\n- Yes?\n- I wonder if you could spare a few minutes to do a survey on transport. It won't take\nlong.\n- No, that’s fine.\n- Lovely. The survey is on behalf of the local council. They’d like to know about what\ntransport you use and any suggestions for improvement. Can I start by asking you\nhow you travelled to town today?\n- Sure. I came on the bus.\n- Great. Now can I get a few details about yourself?\n- OK.\n- What’s your name?\n- It’s Luisa ....\n- Yes.\n- Hardie Q1\n- Can you spell that, please?\n- Yes, it’s H-A-R-D-l-E.\n- Great. Thanks. And can I have your address?\n- It’s 19, White Stone Road. Q2\n- Oh, right'. I know that area. It’s Bradfield, isn’t it?\n- That’s right.\n- Is the postcode GT7?\n- It’s actually G-T-8. 2-L-C Q3\n- Great. And could I ask what your job is? Are you a student?\n- I’ve actually just finished my training. I'm a hairdresser. Q4\n- Oh, right. And one more question in this section. What is the reason for you coming\ninto town today?\n- Actually it’s not for shopping today, which would be my normal reason, but to see\nthe dentist. Q5\n- Right. Thanks.\n(Pause)\n- Now in this last section I’d like you to give us some ideas about the facilities and\narrangements in the city for getting to and from work, er, any suggestions you have\nfor improvements.\n- Well, something I’ve thought about for some time is that when I do walk and I’m\ndoing a later shift, I think the lighting should be better. Q6\n- Yes, good point.\n- And of course, I think it’s a real shame they’ve been cutting down on the number\nof footpaths. They should have more of those. Then people would walk more.\n- Yes, right. H\n- And, I don’t think there are enough trains. That’s why I don’t use them - you have Q7\nto wait so long.\n- Thanks. And finally I’d like to ask your opinion on cycling. As you may know,\nthere’s a drive in the city to get more people to cycle to work.\n- Right.\n- But we realise that there are things which the council, but also employers, might\ndo to help encourage workers to cycle to work.\n- Yep. Well, I have thought about it and where I work there are no safe places to Q8\nleave your bikes.\n- OK.\n- And also, I’d have to cycle uphill and on a hot day I’d arrive at work pretty sweaty\nso I think I’d need a shower somewhere at work. Q9\n- Right.\n- And I suppose the last thing is that I wouldn’t be all that confident about cycling\non such busy roads. I think I'd like to see you offering training for that, you know, Q10\nI’d feel a lot better about starting if that was the case.\n- Well, that’s very helpful. Thank you very much for your time.\n- No problem. Bye.","knowledge":[],"vocabulary":[],"contextHtml":"<b>Transport Survey</b><br>Area: Bradfield<br>Suggestions already include: have more footpaths."},{"id":"EX14","title":"Early Learning Childcare Centre Enrolment Form","type":"Form Completion","instruction":"Complete the form below. Write ONE WORD AND/OR A NUMBER for each answer.","audio":"assets/audio/fc14.mp3","source":"Cambridge IELTS 10 - Section 1","questions":[{"id":"q1","displayNum":1,"label":"Child's age","answer":"4","accepted":["4","four"],"skill":"Form Completion","evidence":"- She’s three now but she turns four next month.","suffix":"","placeholder":"Type your answer","evidence_full":"- She’s three now but she turns four next month.\n- I’ll put four down because that's how old she'll be when she starts. Q1\n- Fine, she’s so excited about her birthday and coming to the centre.","explanation":"Đối chiếu trường thông tin “Child's age” với tapescript. Thông tin phù hợp với yêu cầu của form là “4”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"keyword → answer","vi":"từ khóa → thông tin cần điền","note":"Theo dõi từ khóa của trư
