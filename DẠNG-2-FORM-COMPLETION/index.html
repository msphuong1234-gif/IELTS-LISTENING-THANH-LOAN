re so that should give me plenty of time to get","explanation":"Đối chiếu trường thông tin “Start time: ___ am” với tapescript. Thông tin phù hợp với yêu cầu của form là “8.30”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"keyword → answer","vi":"từ khóa → thông tin cần điền","note":"Theo dõi từ khóa của trường thông tin và ghi chính xác dữ liệu được nói trong tapescript."}]},{"id":"q5","displayNum":5,"label":"Childcare group: the ___ group","answer":"red","accepted":["red"],"skill":"Form Completion","evidence":"different groups and they’re divided up according to age. There’s the green group,","suffix":"","placeholder":"Type your answer","evidence_full":"different groups and they’re divided up according to age. There’s the green group,\nwhich is for three to four-year-olds. And then there’s the red group which is for four-\nto five-year-olds.","explanation":"Đối chiếu trường thông tin “Childcare group: the ___ group” với tapescript. Thông tin phù hợp với yêu cầu của form là “red”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Childcare group","vi":"Nhóm chăm sóc trẻ","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."},{"item":"red","vi":"màu đỏ","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]},{"id":"q6","displayNum":6,"label":"Which meal/s are required each day?","answer":"lunch","accepted":["lunch"],"skill":"Form Completion","evidence":"before she comes?","suffix":"","placeholder":"Type your answer","evidence_full":"before she comes?\n- Yes, she'll only need lunch. Q6\n- Now, does she have any medical conditions we need to know about? Does she have","explanation":"Đối chiếu trường thông tin “Which meal/s are required each day?” với tapescript. Thông tin phù hợp với yêu cầu của form là “lunch”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"lunch","vi":"bữa trưa","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]},{"id":"q7","displayNum":7,"label":"Medical conditions: needs","answer":"glasses","accepted":["glasses"],"skill":"Form Completion","evidence":"asthma or any hearing problems for example?","suffix":"","placeholder":"Type your answer","evidence_full":"asthma or any hearing problems for example?\n- No. But she does need to wear glasses. Q7\n- Oh, I'll make a note of that.","explanation":"Đối chiếu trường thông tin “Medical conditions: needs” với tapescript. Thông tin phù hợp với yêu cầu của form là “glasses”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Medical conditions","vi":"Tình trạng y tế","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."},{"item":"glasses","vi":"kính mắt","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]},{"id":"q8","displayNum":8,"label":"Emergency contact: Jenny","answer":"BALL","accepted":["BALL","Ball"],"skill":"Form Completion","evidence":"can’t get hold of you at any time.","suffix":"","placeholder":"Type your answer","evidence_full":"can’t get hold of you at any time.\n- That’d better be my sister... Jenny Ball. That’s B-A-double L. Her phone number is Q8\n3346 7523.","explanation":"Đối chiếu trường thông tin “Emergency contact: Jenny” với tapescript. Thông tin phù hợp với yêu cầu của form là “BALL”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Emergency contact","vi":"Liên hệ khẩn cấp","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."}]},{"id":"q9","displayNum":9,"label":"Relationship to child","answer":"aunt","accepted":["aunt"],"skill":"Form Completion","evidence":"3346 7523.","suffix":"","placeholder":"Type your answer","evidence_full":"3346 7523.\n- Great. So she is the child's aunt? Q9\n- Yes, that’s right.","explanation":"Đối chiếu trường thông tin “Relationship to child” với tapescript. Thông tin phù hợp với yêu cầu của form là “aunt”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"aunt","vi":"dì/cô","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]},{"id":"q10","displayNum":10,"label":"Fees: Will pay each","answer":"month","accepted":["month","monthly"],"skill":"Form Completion","evidence":"No, we send out invoices once the children start at the centre. You can choose to pay at the end of each term or we do offer a slightly discounted rate if you pay every month.","suffix":"","placeholder":"Type your answer","evidence_full":"No, we send out invoices once the children start at the centre. You can choose to pay at the end of each term or we do offer a slightly discounted rate if you pay every month.","explanation":"Đối chiếu trường thông tin “Fees: Will pay each” với tapescript. Thông tin phù hợp với yêu cầu của form là “month”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"month","vi":"tháng","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]}],"transcript_text":"- Good morning. Welcome to the Early Learning Childcare Centre. How may I help\nyou?\n- Hi. I spoke to you last week about enrolling my daughter for next year.\n- Oh, yes. I’ll just get some details from you. So, you're her mother?\n- That’s right.\n- And, can I have your name? H\n- It’s Carol, Carol Smith.\n- And your daughter’s name?\n- It's Kate.\n- Now, we have several groups at the centre and we cater for children from three to\nfive years old. How old is your daughter?\n- She’s three now but she turns four next month.\n- I’ll put four down because that's how old she'll be when she starts. Q1\n- Fine, she’s so excited about her birthday and coming to the centre.\n- That’s good to hear. And what's your address?\n- It’s 46 Wombat Road, that's W-O-M-B-A-T. Woodside 4032. Q2\n- And what’s the phone number?\n- Oh ... it’s ... 3345 9865.\n- So, have you decided on the days you’d like to bring your daughter here?\n- I’d prefer Monday and Wednesday if possible.\n- Mmm. I'll check, Monday’s fine, but I think the centre is already full for\nWednesday. Erm. Yes. Sorry. It seems to be a very popular day. We can offer you a\nThursday or a Friday as well.\n- Oh dear. I suppose Thursday would be all right because she has swimming on Q3\nFriday.\n- OK, got that. Because a lot of parents work, we do offer flexible start and finish\ntimes. We are open from 7:30 in the morning until 6 o'clock at night.\n- What time would you like your daughter to start?\n- I need to get to work in the city by 9:00 so I'll drop her off at 8:30 . Q4\n- You’re pretty close to the city here so that should give me plenty of time to get\nthere.\n- That’s fine. Now, we also need to decide which group she'll be in. We have two\ndifferent groups and they’re divided up according to age. There’s the green group,\nwhich is for three to four-year-olds. And then there’s the red group which is for four-\nto five-year-olds.\n- She’s quite mature for her age and she can already write her name and read a\nlittle.\n- Well, I’ll put her in the red group and we can always change her to the green one Q5\nif there are any problems.\n- That sounds fine. H\n- Ok. Let's move on to meals. We can provide breakfast, lunch and dinner.\n- As she’s finishing pretty early, she won't need dinner, will you give her breakfast\nbefore she comes?\n- Yes, she'll only need lunch. Q6\n- Now, does she have any medical conditions we need to know about? Does she have\nasthma or any hearing problems for example?\n- No. But she does need to wear glasses. Q7\n- Oh, I'll make a note of that.\n- Yes, she's pretty good about wearing them, she can’t see much without them.\n- Right. OK. Now, I also need emergency contact details.\n- So what sort of information do you need?\n- Just the name and number of a friend or family member we can contact in case we\ncan’t get hold of you at any time.\n- That’d better be my sister... Jenny Ball. That’s B-A-double L. Her phone number is Q8\n3346 7523.\n- Great. So she is the child's aunt? Q9\n- Yes, that’s right.\n- I’ll make a note of that as well. Now, is there anything you’d like to ask? What\nabout payment? - How much are the fees each term?\n- Well, for two days and the hours you’ve chosen, that will be $450 altogether.\n- OK, and do I have to pay that now?\n- No, we send out invoices once the children start at the centre. You can choose to\npay at the end of each term or we do offer a slightly discounted rate if you pay every\nmonth. Q10\n- Oh. I’ll do that then. I find it easier to budget that way and I’m not used to the term\ndates just yet.\n- Good, it makes it a lot simpler for us as well. Well, that’s everything.\n- Would you like me to show you around ...?","knowledge":[],"vocabulary":[],"contextHtml":"<b>Early Learning Childcare Centre Enrolment Form</b><br>Child’s name: Kate<br>Phone: 3345 9865<br>Address continues: Road, Woodside, 4032"},{"id":"EX15","title":"Thorndyke's Builders","type":"Form Completion","instruction":"Questions 1-6. Complete the notes below. Write ONE WORD ONLY for each answer.","audio":"assets/audio/fc15.mp3","source":"Cambridge IELTS 10 - Section 1","questions":[{"id":"q1","displayNum":1,"label":"Name: Edith","answer":"Pargetter","accepted":["Pargetter"],"skill":"Form Completion","evidence":"- And what’s your name, please?","suffix":"","placeholder":"Type your answer","evidence_full":"- And what’s your name, please?\n- It's Edith Pargetter. Q1\n- Edith ... can you spell your surname, please?","explanation":"Đối chiếu trường thông tin “Name: Edith” với tapescript. Thông tin phù hợp với yêu cầu của form là “Pargetter”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Name","vi":"Họ tên","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."}]},{"id":"q2","displayNum":2,"label":"Address: Flat 4, ___ Park Flats","answer":"East","accepted":["East"],"skill":"Form Completion","evidence":"- Double T, right. And do you live in West Park Flats as well?","suffix":"","placeholder":"Type your answer","evidence_full":"- Double T, right. And do you live in West Park Flats as well?\n- No, actually it’s East Park, Flat 4. Q2\n- Oh, right, that’s over the road, I seem to remember - quite difficult to get to.","explanation":"Đối chiếu trường thông tin “Address: Flat 4, ___ Park Flats” với tapescript. Thông tin phù hợp với yêu cầu của form là “East”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Address","vi":"Địa chỉ","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."}]},{"id":"q3","displayNum":3,"label":"(Behind the ___)","answer":"library","accepted":["library"],"skill":"Form Completion","evidence":"- Oh, right, that’s over the road, I seem to remember - quite difficult to get to.","suffix":"","placeholder":"Type your answer","evidence_full":"- Oh, right, that’s over the road, I seem to remember - quite difficult to get to.\n- Yes, it’s at the back of the library. Q3\n- Right, I know. And what’s your phone number?","explanation":"Đối chiếu trường thông tin “(Behind the ___)” với tapescript. Thông tin phù hợp với yêu cầu của form là “library”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"keyword → answer","vi":"từ khóa → thông tin cần điền","note":"Theo dõi từ khóa của trường thông tin và ghi chính xác dữ liệu được nói trong tapescript."}]},{"id":"q4","displayNum":4,"label":"Best time to contact customer: during the","answer":"morning","accepted":["morning","mornings"],"skill":"Form Completion","evidence":"- 875934 but I’m out a great deal in the afternoons and evenings.","suffix":"","placeholder":"Type your answer","evidence_full":"- 875934 but I’m out a great deal in the afternoons and evenings.\n- So would the best time to ring you be in the morning? Q4\n- Yes.","explanation":"Đối chiếu trường thông tin “Best time to contact customer: during the” với tapescript. Thông tin phù hợp với yêu cầu của form là “morning”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Best time to contact customer","vi":"Thời gian tốt nhất để liên hệ khách hàng","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."},{"item":"morning","vi":"buổi sáng","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]},{"id":"q5","displayNum":5,"label":"Where to park: opposite entrance next to the","answer":"postbox","accepted":["postbox"],"skill":"Form Completion","evidence":"- Well, I always tell people in larger vehicles to park by the postbox on the other side Q5","suffix":"","placeholder":"Type your answer","evidence_full":"- Well, I always tell people in larger vehicles to park by the postbox on the other side Q5","explanation":"Đối chiếu trường thông tin “Where to park: opposite entrance next to the” với tapescript. Thông tin phù hợp với yêu cầu của form là “postbox”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"Where to park","vi":"Nơi đỗ xe","note":"Xác định đúng loại thông tin cần nghe trước khi audio đi đến chỗ trống."},{"item":"postbox","vi":"hộp thư","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]},{"id":"q6","displayNum":6,"label":"Needs full quote showing all the jobs and the","answer":"prices","accepted":["prices"],"skill":"Form Completion","evidence":"- And will you be able to give me a full itemised quote?","suffix":"","placeholder":"Type your answer","evidence_full":"- And will you be able to give me a full itemised quote?\n- Oh. yes. I'll list all the jobs separately with individual prices. Q6\n- That'd be a great help.","explanation":"Đối chiếu trường thông tin “Needs full quote showing all the jobs and the” với tapescript. Thông tin phù hợp với yêu cầu của form là “prices”. Cần tuân thủ giới hạn từ/số của đề và chép chính xác chính tả/định dạng.","memory":[{"item":"prices","vi":"giá cả","note":"Từ/cụm trọng tâm xuất hiện trong đáp án hoặc tapescript."}]}],"transcript_text":"- Good morning. Is that Mr Thorndyke?\n- Speaking. How can I help?\n- I’ve got quite a few things which need painting and fixing in the flat and I wonder\nwhether you'd be able to do the work.\n- I’m sure I’d be able to help but let me take down a few details.\n- Yes, of course.\n- Well, firstly, how did you hear about us?\nyears ago. Do you remember?\n- It was my friend Mav Hamoton ... you did some excellent work for her a couple of\n- Oh, yes, that was in West Park Flats, lovely lady.\n- Yes, she is.\n- And what’s your name, please?\n- It's Edith Pargetter. Q1\n- Edith ... can you spell your surname, please?\n- It's P-A-R-G-E-double T-E-R.\n- Double T, right. And do you live in West Park Flats as well?\n- No, actually it’s East Park, Flat 4. Q2\n- Oh, right, that’s over the road, I seem to remember - quite difficult to get to.\n- Yes, it’s at the back of the library. Q3\n- Right, I know. And what’s your phone number?\n- 875934 but I’m out a great deal in the afternoons and evenings.\n- So would the best time to ring you be in the morning? Q4\n- Yes.\n- Fine. I've made a note of that. Can I just ask, I'll be in a van and I know parking’s\nrather difficult round your flats. Where would you recommend?\n- Well, I always tell people in larger vehicles to park by the postbox on the other side Q5\nof the road from the entrance.\n- Good, thanks.\n- And will you be able to give me a full itemised quote?\n- Oh. yes. I'll list all the jobs separately with individual prices. Q6\n- That'd be a great help.\n- No problem.","knowledge":[],"vocabulary":[],"contextHtml":"<b>Thorndyke’s Builders</b><br>Address begins: Flat 4<br>Phone number: 875934"}],"knowledge":[{"id":"overview","title":"1. Form Completion Overview","html":"<p><strong>Form Completion</strong> là dạng nghe bám theo nội dung audio để hoàn thành thông tin trong một tờ đơn/form. Theo nguồn, dạng này rất phổ biến ở IELTS Listening Part 1.</p><div class=\"tip\"><b>Đặc điểm:</b> form cho biết trước loại thông tin cần nghe; câu trả lời thường xuất hiện theo thứ tự câu hỏi; luôn phải tuân thủ word limit.</div>"},{"id":"limits","title":"2. Word Limits","html":"<p>Đọc kỹ instruction trước khi nghe. Các giới hạn trong nguồn gồm: <b>ONE WORD ONLY</b>; <b>NO MORE THAN TWO WORDS</b>; <b>NO MORE THAN THREE WORDS</b>; <b>NO MORE THAN TWO WORDS AND/OR A NUMBER</b>.</p><ul><li>Từ nối bằng dấu gạch ngang như <b>well-being</b> được tính là một từ.</li><li>Nếu form đã cho sẵn đơn vị sau ô trống, chỉ điền số, không lặp lại đơn vị.</li><li>Vượt word limit = sai dù nội dung nghe đúng.</li></ul>"},{"id":"personal","title":"3. Personal Information","html":"<p>Nhóm thông tin cá nhân thường gặp: <b>Name, Address, Date, Time, Age, Postcode, Phone number, Price, Measurement, Country/Nationality, Job/Study, Hobby/Interest</b>.</p><div class=\"tip\"><b>Country ≠ Nationality:</b> Vietnam → Vietnamese; Australia → Australian; Canada → Canadian; Thailand → Thai, v.v.</div>"},{"id":"vocab","title":"4. Job / Study / Interests","html":"<p><b>Job/Occupation</b> trong nguồn: teacher, doctor, dentist, manager, interpreter, lawyer, journalist, designer, dancer, bartender, cook, baker, waiter, hairdresser, florist, gardener, freelancer...</p><p><b>Study:</b> politics, economics, accounting, business, finance, marketing, engineering, law, hotel management, physics, HR management, IT, science, nursing, sociology, psychology...</p><p><b>Interests:</b> reading, music, theatre/movies, shopping, sport, swimming, walking, jogging, climbing, yoga, foreign languages...</p>"},{"id":"steps","title":"5. Strategy: 4 Steps","html":"<ol><li><b>Xác định word limit.</b></li><li><b>Gạch chân keyword và dự đoán loại thông tin/dạng từ.</b></li><li><b>Nghe tập trung và điền đáp án theo thứ tự.</b></li><li><b>Kiểm tra spelling, singular/plural và grammar.</b></li></ol><div class=\"tip\">Ví dụ nguồn: “Special dietary requirements: no ___ (red)” → cần một danh từ liên quan chế độ ăn; “a ___ room” → cần tính từ như <b>shared</b>.</div>"},{"id":"notes","title":"6. Important Notes","html":"<ul><li>Đơn vị đo có thể viết tắt: centimetre → cm, metre → m, kilogram → kg nếu form chưa cho sẵn đơn vị.</li><li>Chú ý đuôi <b>-s</b>, <b>-ed</b> dựa vào grammar của form.</li><li>Không chỉ nghe từ giống hệt form; phải nhận ra paraphrase, correction và lựa chọn cuối cùng của người nói.</li><li>Dạng Form Completion thường kết hợp kỹ năng Letters & Numbers: tên, địa chỉ, postcode, số điện thoại, ngày tháng, giá tiền.</li></ul>"}],"totalAnswers":117};
const NS=`${DATA.courseId}:${DATA.unitId}:${DATA.lessonId}:v${DATA.version}`;
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
function load(){try{return JSON.parse(localStorage.getItem(NS)||'{}')}catch{return {}}}
let state=load(); state.student=state.student||{}; state.exercises=state.exercises||{};
function save(){localStorage.setItem(NS,JSON.stringify(state));}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function showPage(id){$$('.page').forEach(p=>p.classList.remove('active'));$('#'+id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function exState(id){return state.exercises[id]||(state.exercises[id]={status:'not_started',answers:{},attemptCount:0,submittedAttemptIds:[],audioPosition:0,reviewUnlocked:false});}
function persistStudent(){state.student={studentName:$('#studentName').value.trim(),studentClass:$('#studentClass').value.trim(),studentId:$('#studentId').value.trim()};save();}
function initStudent(){['studentName','studentClass','studentId'].forEach(id=>{const el=$('#'+id);el.value=state.student[id]||'';el.addEventListener('input',persistStudent)});}
function renderHome(){const grid=$('#homeGrid');grid.innerHTML='';
 const kc=document.createElement('div');kc.className='knowledge-card';kc.innerHTML='<div class="card-row"><div><b>📘 KIẾN THỨC CẦN HỌC</b><div class="score">Form Completion • Word limits • Information types • Strategies</div></div><span class="pill">Theory</span></div>';kc.onclick=()=>renderKnowledge();grid.appendChild(kc);
 let completed=0;DATA.exercises.forEach((e,i)=>{const st=exState(e.id);if(st.status==='completed')completed++;const c=document.createElement('div');c.className='exercise-card';const cls=st.status==='completed'?'done':st.status==='in_progress'?'progress':'';const txt=st.status==='completed'?'Completed':st.status==='in_progress'?'In progress':'Not started';const score=st.status==='completed'?`Latest score: ${st.score}/${st.total} • Attempts: ${st.attemptCount}`:`${e.questions.length} answer fields • ${e.type}`;c.innerHTML=`<div class="card-row"><div><b>Exercise ${i+1}: ${esc(e.title)}</b><div class="score">${esc(score)}</div></div><span class="pill ${cls}">${txt}</span></div>`;c.onclick=()=>openExercise(e.id);grid.appendChild(c)});
 const pct=DATA.exercises.length?completed/DATA.exercises.length*100:0;$('#overallBar').style.width=pct+'%';$('#overallText').textContent=`Progress: ${completed}/${DATA.exercises.length} exercises completed • ${DATA.totalAnswers} total answer fields in this lesson`;save();}
function renderKnowledge(){showPage('knowledgePage');const tabs=$('#knowledgeTabs');tabs.innerHTML='';DATA.knowledge.forEach((k,i)=>{const b=document.createElement('button');b.textContent=k.title;b.className=i===0?'active':'';b.onclick=()=>{[...tabs.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#knowledgePane').innerHTML=k.html};tabs.appendChild(b)});$('#knowledgePane').innerHTML=DATA.knowledge[0].html;}
function normalize(s){return String(s??'').trim().toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ').replace(/[.,;:!?]+$/,'');}
function accepted(q,val){const n=normalize(val);return (q.accepted||[q.answer]).some(a=>normalize(a)===n)}
function inputFor(q,n,st){return `<div class="question"><div class="qline"><div class="qbadge">${q.displayNum||n}</div><div class="qcontent"><label for="${q.id}">${esc(q.label)}</label><input class="answer-input" id="${q.id}" data-q="${q.id}" value="${esc(st.answers[q.id]||'')}" placeholder="${esc(q.placeholder||'Type your answer')}" autocomplete="off"></div></div></div>`}
function renderQuestionArea(e,st){
 if(e.layout==='train-table'){
   let h='<div class="table-wrap"><table class="ielts-table"><thead><tr><th>#</th><th>Platform No.</th><th>Time</th><th>Destination</th></tr></thead><tbody>';
   for(let r=0;r<8;r++){h+=`<tr><td>${r+1}</td>`;for(let c=0;c<3;c++){const q=e.questions[r*3+c];h+=`<td><span class="qbadge" style="display:inline-flex;margin-right:6px">${r*3+c+1}</span><input class="answer-input" id="${q.id}" data-q="${q.id}" value="${esc(st.answers[q.id]||'')}"></td>`}h+='</tr>'}return h+'</tbody></table></div>';
 }
 if(e.layout==='population-tables'){
   let i=0,h='<h3>Table 1</h3><div class="table-wrap"><table class="ielts-table"><thead><tr><th>Area</th><th>People/sq km</th></tr></thead><tbody>';const areas=['UK','European Community','England','Greater London','Scotland','Wales','Northern Ireland'];areas.forEach(a=>{const q=e.questions[i++];h+=`<tr><td>${a}</td><td><span class="qbadge" style="display:inline-flex;margin-right:6px">${i}</span><input class="answer-input" id="${q.id}" data-q="${q.id}" value="${esc(st.answers[q.id]||'')}"></td></tr>`});h+='</tbody></table></div><h3>Table 2</h3><div class="table-wrap"><table class="ielts-table"><thead><tr><th>City</th><th>Area (sq km)</th><th>Population (thousands)</th></tr></thead><tbody>';const cities=['Greater London','Birmingham','Leeds','Glasgow','Edinburgh','Manchester','Bristol','Coventry'];cities.forEach(c=>{const qa=e.questions[i++],qp=e.questions[i++];h+=`<tr><td>${c}</td><td><span class="qbadge" style="display:inline-flex;margin-right:6px">${i-1}</span><input class="answer-input" id="${qa.id}" data-q="${qa.id}" value="${esc(st.answers[qa.id]||'')}"></td><td><span class="qbadge" style="display:inline-flex;margin-right:6px">${i}</span><input class="answer-input" id="${qp.id}" data-q="${qp.id}" value="${esc(st.answers[qp.id]||'')}"></td></tr>`});return h+'</tbody></table></div>';
 }
 if(e.layout==='survey-table'){
   const labels=["A woman’s place is in the home","If a couple both earn money, both should share the housework","Men and women should be paid the same for the same job","Nursing is women’s work","Mining is men’s work","Cooking should still be done by women","Washing clothes should still be done by women"];
   const fixed={"China-0":"12%","China-4":"90%","Japan-5":"82%"};const map={};e.questions.forEach((q,idx)=>{const m=q.label.match(/^(China|Japan|Korea|Thailand) - (.*)$/);if(m){map[m[1]+'-'+labels.indexOf(m[2])]={q,n:idx+1}}});
   let h='<div class="tip"><b>Note:</b> Thông tin câu trả lời không theo thứ tự vị trí câu hỏi.</div><div class="table-wrap"><table class="ielts-table"><thead><tr><th>Young people (%) who agree</th><th>China</th><th>Japan</th><th>Korea</th><th>Thailand</th></tr></thead><tbody>';
   labels.forEach((lab,r)=>{h+=`<tr><td>${lab}</td>`;['China','Japan','Korea','Thailand'].forEach(country=>{const key=country+'-'+r;if(fixed[key])h+=`<td><b>${fixed[key]}</b></td>`;else{const o=map[key];h+=`<td><span class="qbadge" style="display:inline-flex;margin-right:5px">${o.n}</span><input class="answer-input" id="${o.q.id}" data-q="${o.q.id}" value="${esc(st.answers[o.q.id]||'')}"></td>`}});h+='</tr>'});return h+'</tbody></table></div>';
 }
 return e.questions.map((q,i)=>inputFor(q,i+1,st)).join('');
}
function openExercise(id){const e=DATA.exercises.find(x=>x.id===id),st=exState(id); if(st.status==='not_started')st.status='in_progress';save();showPage('exercisePage');
 const mount=$('#exerciseMount');mount.innerHTML=`<div class="exercise-wrap"><article class="task"><div class="task-head"><h2>${esc(e.id.replace('EX','Exercise '))}: ${esc(e.title)}</h2><p>${esc(e.instruction)}</p><div class="source-note">Source: ${esc(e.source||'')}</div></div><div class="audio-box"><audio id="player" controls preload="metadata" src="${e.audio}"></audio></div><div class="questions">${renderQuestionArea(e,st)}</div><div class="task-actions"><button class="btn primary" id="checkBtn">✓ Kiểm tra đáp án</button><button class="btn" id="backBtn">← Trở lại trang chủ</button></div><div class="review ${st.reviewUnlocked?'open':''}" id="review"></div></article><aside class="side"><h3>${esc(e.id.replace('EX','Exercise '))}</h3><div class="mini-status" id="answeredStatus"></div><button class="btn primary" id="sideCheck">Kiểm tra đáp án</button><button class="btn" id="retryBtn" ${st.reviewUnlocked?'':'disabled'}>↻ Làm lại / Retry</button><button class="btn danger" id="resetBtn">Reset Exercise</button><button class="btn" id="sideHome">← Lesson Home</button></aside></div>`;
 const player=$('#player');player.addEventListener('loadedmetadata',()=>{if(st.audioPosition&&st.audioPosition<player.duration-2)player.currentTime=st.audioPosition});player.addEventListener('timeupdate',()=>{st.audioPosition=player.currentTime;save()});
 $$('.answer-input').forEach(inp=>inp.addEventListener('input',()=>{st.answers[inp.dataset.q]=inp.value;st.status='in_progress';save();updateAnswered(e,st)}));updateAnswered(e,st);
 $('#checkBtn').onclick=$('#sideCheck').onclick=()=>checkExercise(e,st);$('#backBtn').onclick=$('#sideHome').onclick=()=>goHome();$('#retryBtn').onclick=()=>retryExercise(e,st);$('#resetBtn').onclick=()=>resetExercise(e,st);if(st.reviewUnlocked)renderReview(e,st);
}
function updateAnswered(e,st){const n=e.questions.filter(q=>String(st.answers[q.id]||'').trim()).length;const el=$('#answeredStatus');if(el)el.textContent=`Answered: ${n}/${e.questions.length} • Autosaved`}
function collectInputs(e,st){e.questions.forEach(q=>{const el=document.getElementById(q.id);if(el)st.answers[q.id]=el.value});save()}
function ensureStudent(){const missing=[];if(!state.student.studentName)missing.push('studentName');if(!state.student.studentClass)missing.push('studentClass');if(!state.student.studentId)missing.push('studentId');if(!missing.length)return true;alert('Vui lòng nhập đầy đủ Họ tên, Lớp và Mã học sinh trước khi nộp Exercise.');goHome();setTimeout(()=>{const el=document.getElementById(missing[0]);if(el)el.focus()},80);return false}
async function checkExercise(e,st){collectInputs(e,st);if(!ensureStudent())return;const blanks=e.questions.filter(q=>!String(st.answers[q.id]||'').trim()).length;if(blanks && !confirm(`Bạn còn ${blanks} câu chưa trả lời. Vẫn chấm bài?`))return;
 let score=0;const results={};e.questions.forEach(q=>{const ok=accepted(q,st.answers[q.id]||'');if(ok)score++;results[q.id]={student:st.answers[q.id]||'',correct:q.answer,isCorrect:ok}});st.attemptCount=(st.attemptCount||0)+1;const attemptId=`${DATA.unitId}-${DATA.lessonId}-${e.id}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;st.currentAttemptId=attemptId;st.score=score;st.total=e.questions.length;st.correct=score;st.wrong=e.questions.length-score;st.results=results;st.status='completed';st.reviewUnlocked=true;st.lastUpdated=new Date().toISOString();save();renderReview(e,st);renderHome();
 const payload={studentName:state.student.studentName||'',studentClass:state.student.studentClass||'',studentId:state.student.studentId||'',testId:`${DATA.unitId}-${DATA.lessonId}-${e.id}`,testName:`Form Completion - ${e.id} - ${e.title}`,score,total:e.questions.length,duration:'',correct:score,wrong:e.questions.length-score,answers:{meta:{attempt:st.attemptCount,attemptId,lessonId:DATA.lessonId,exerciseId:e.id,submittedAt:new Date().toISOString(),unanswered:blanks},...results}};
 await sendResult(payload,e,st,attemptId);renderReview(e,st);
}
async function sendResult(payload,e,st,attemptId){if((st.submittedAttemptIds||[]).includes(attemptId))return;try{await fetch(DATA.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});st.submittedAttemptIds=st.submittedAttemptIds||[];st.submittedAttemptIds.push(attemptId);st.lastSubmissionState='request_sent_unverified';save();toast('Đã gửi yêu cầu lưu kết quả. Trình duyệt không thể xác minh phản hồi Google Sheet ở chế độ no-cors.')}catch(err){st.pendingSubmission={payload,attemptId};st.lastSubmissionState='pending';save();toast('Chưa gửi được Google Sheet. Kết quả đã được lưu trên thiết bị.')}}
function renderReview(e,st){const box=$('#review');if(!box||!st.results)return;const unanswered=e.questions.filter(q=>!String(st.results[q.id].student||'').trim()).length;let h=`<h2>Review</h2><div class="result-summary"><div class="metric"><b>${st.score}/${st.total}</b><br>Score</div><div class="metric"><b>${st.correct}</b><br>Correct</div><div class="metric"><b>${st.wrong}</b><br>Wrong</div><div class="metric"><b>${unanswered}</b><br>Unanswered</div><div class="metric"><b>${st.attemptCount}</b><br>Attempt</div></div>`;
 e.questions.forEach((q,i)=>{const r=st.results[q.id],cls=r.isCorrect?'good':'bad';const memory=(q.memory||[]).map(m=>`<li><b>${esc(m.item||'')}</b>${m.vi?` = ${esc(m.vi)}`:''}${m.note?`<br><span class="score">${esc(m.note)}</span>`:''}</li>`).join('');h+=`<div class="review-item ${cls}"><h3 style="margin:0 0 8px">Question ${q.displayNum||i+1}</h3><div class="prompt-box"><div class="review-label">Đề bài / Original task</div><div><b>${esc(e.instruction)}</b></div><div style="margin-top:6px"><span class="review-label">Mục cần điền / Question target</span><br>${esc(q.label)}</div></div><div class="ans"><div><small>Your answer</small><br><b>${esc(r.student||'—')}</b></div><div><small>Đáp án đúng / Correct answer</small><br><b>${esc(q.answer)}</b></div></div><div class="explain"><div class="review-label">Tapescript evidence</div><div class="evidence">${esc(q.evidence_full||q.evidence||'Không có tapescript trong nguồn.').replace(/\n/g,'<br>')}</div><div style="margin-top:10px"><b>Giải thích:</b> ${esc(q.explanation||'')}</div><div class="q-memory"><b>🧠 KIẾN THỨC CẦN NHỚ</b>${memory?`<ul>${memory}</ul>`:'<p>Không có mục bổ sung từ nguồn cho câu này.</p>'}</div></div></div>`});
 h+=accordion('🎧 Listen Again & Full Tapescript',`<audio controls style="width:100%;margin-bottom:12px" src="${e.audio}"></audio><div>${esc(e.transcript_text||'Transcript not supplied in the source.').replace(/\n/g,'<br>')}</div>`,'transcript');
 if(e.vocabulary?.length){let v='<div class="table-wrap"><table class="ielts-table"><thead><tr><th>Item</th><th>Part of speech</th><th>Tiếng Việt</th><th>Meaning (source)</th></tr></thead><tbody>';e.vocabulary.forEach(x=>v+=`<tr><td><b>${esc(x[0])}</b></td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td>${esc(x[3])}</td></tr>`);v+='</tbody></table></div>';h+=accordion('📚 Vocabulary from the source',v,'vocab')}
 if(e.knowledge?.length)h+=accordion('🧠 Kiến thức cần nhớ',`<ul>${e.knowledge.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,'remember');
 h+=`<p class="submission-note">Google Sheet status: ${st.lastSubmissionState==='request_sent_unverified'?'Request sent (response cannot be verified in no-cors mode)':st.lastSubmissionState==='pending'?'Pending / saved locally':'Will be sent when this attempt is checked'}</p>`;box.innerHTML=h;box.classList.add('open');$$('.acc-btn').forEach(b=>b.onclick=()=>b.nextElementSibling.classList.toggle('open'));const rb=$('#retryBtn');if(rb)rb.disabled=false;}
function accordion(title,body,id){return `<div class="accordion"><button class="acc-btn" type="button">${title}</button><div class="acc-body" id="${id}">${body}</div></div>`}
function retryExercise(e,st){if(!st.reviewUnlocked)return; if(!confirm('Bắt đầu một attempt mới? Kết quả cũ vẫn được giữ trong lịch sử gửi Google Sheet, nhưng ô trả lời hiện tại sẽ được xóa cho lần làm mới.'))return;st.answers={};st.results=null;st.score=null;st.total=null;st.correct=null;st.wrong=null;st.status='in_progress';st.reviewUnlocked=false;st.audioPosition=0;save();openExercise(e.id);}
function resetExercise(e,st){if(!confirm('RESET EXERCISE sẽ xóa trạng thái và câu trả lời của Exercise này trên thiết bị. Dữ liệu đã gửi Google Sheet trước đó không thể bị thu hồi. Tiếp tục?'))return;state.exercises[e.id]={status:'not_started',answers:{},attemptCount:0,submittedAttemptIds:[],audioPosition:0,reviewUnlocked:false};save();toast('Đã reset Exercise trên thiết bị.');goHome();}
function goHome(){const p=$('#player');if(p)p.pause();renderHome();showPage('homePage')}
async function retryPending(){for(const e of DATA.exercises){const st=state.exercises?.[e.id];if(st?.pendingSubmission?.payload&&st?.pendingSubmission?.attemptId){const {payload,attemptId}=st.pendingSubmission;try{await fetch(DATA.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});st.submittedAttemptIds=st.submittedAttemptIds||[];if(!st.submittedAttemptIds.includes(attemptId))st.submittedAttemptIds.push(attemptId);delete st.pendingSubmission;st.lastSubmissionState='request_sent_unverified';save()}catch(_){}}}}
$('#homeBtn').onclick=goHome;initStudent();renderHome();retryPending();
</script>
</body>
</html>
